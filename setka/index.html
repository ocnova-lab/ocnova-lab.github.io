<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Сетка</title>
<link rel="stylesheet" href="/panel.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0c0c0e;
    color: #fff;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.2;
    overflow-y: hidden;
    overflow-x: auto;
    overscroll-behavior: none;
  }

  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 1rem;
    z-index: 6;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    pointer-events: none;
  }
  header a { color: inherit; pointer-events: auto; }
  header .back { opacity: .55; text-decoration: none; margin-right: 1em; }
  header .back:hover { opacity: 1; }

  /* сводка сетки: живые числа, включая вычисленную ширину колонки */
  #info {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    color: rgba(255,255,255,.55);
    white-space: nowrap;
  }

  /* полотно — лист, на котором живёт сетка; в свободном режиме шире экрана */
  #sheet {
    position: relative;
    height: 100vh;
    min-width: 100vw;
  }
  .marg {
    position: absolute;
    top: 0; bottom: 0;
    background: rgba(255,255,255,.03);
  }
  .marg.l { border-right: 1px solid rgba(255,69,58,.6); }
  .marg.r { border-left: 1px solid rgba(255,69,58,.6); }
  /* вертикальное деление: марджины сверху/снизу, пустые строки, линии слипания */
  .vmarg {
    position: absolute;
    left: 0;
    background: rgba(255,255,255,.03);
  }
  .vmarg.t { border-bottom: 1px solid rgba(255,69,58,.6); }
  .vmarg.b { border-top: 1px solid rgba(255,69,58,.6); }
  .rowgap {
    position: absolute;
    left: 0;
    background: #0c0c0e;
  }
  .rowband {
    position: absolute;
    left: 0;
  }
  .hsep {
    position: absolute;
    left: 0;
    height: 1px;
    background: rgba(255,69,58,.6);
  }
  .col {
    position: absolute;
    top: 0; bottom: 0;
  }
  /* межколонник 0: колонки слипаются — границу держит красная линия */
  .sep {
    position: absolute;
    top: 0; bottom: 0;
    width: 1px;
    background: rgba(255,69,58,.6);
  }

  /* слой датчиков: зонд, вспышки линий и клеток — поверх полотна */
  #sensors {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: 5;
  }
  .col span {
    position: absolute;
    top: 64px;
    left: 6px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    color: rgba(255,255,255,.5);
  }

  /* ── тестовый стиль панели по референсу experimental-steel /exp-glr-1:
     монохром на чёрном стекле, волосяные рамки, моно-цифры в рамочках,
     серый гаснущий текст с белым на ховере. Дизайн-система panel.css
     не тронута — переопределения живут только на этом стенде ── */
  .st-panel {
    --st-accent: #fff;
    --st-track: rgba(255,255,255,.16);
    width: 420px;
    padding: 10px;
    background: rgba(10,10,10,.72);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 10px;
    box-shadow: none;
    color: #b8b8b8;
    font-size: 13px;
    scrollbar-width: none;
  }
  .st-panel::-webkit-scrollbar { display: none; }
  .st-panel h4 {
    font-size: 13px; font-weight: 500;
    letter-spacing: 0; text-transform: none;
    color: #b8b8b8;
    margin: 14px 4px 8px;
  }
  .st-panel h4.st-sec:hover { color: #fff; }
  .st-panel h4:first-of-type { margin-top: 4px; }
  .st-panel .card {
    background: transparent;
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 6px;
  }
  .st-panel .card > .row + .row,
  .st-panel .card > canvas + .row { border-top: none; }
  .st-panel .row { min-height: 44px; padding: 4px 10px; gap: 10px; }
  .st-panel label { color: #b8b8b8; transition: color .15s; }
  .st-panel .row:hover label { color: #fff; }
  .st-panel .val {
    min-width: 56px; padding: 4px 7px;
    border: 1px solid rgba(255,255,255,.2); border-radius: 5px;
    color: #d0d0d0;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    cursor: text;
    transition: color .15s, border-color .15s;
  }
  .st-panel .row:hover .val { color: #fff; border-color: rgba(255,255,255,.35); }
  .st-panel .val-edit {
    border-radius: 5px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px;
  }
  .st-panel input[type=range] { width: 140px; height: 2px; border-radius: 1px; }
  .st-panel input[type=range]::-webkit-slider-thumb {
    width: 10px; height: 10px;
    background: #fff; border: none; box-shadow: none;
  }
  .st-panel input[type=range]::-moz-range-thumb {
    width: 10px; height: 10px; box-shadow: none;
  }
  .st-panel select {
    background-color: transparent;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 5px;
    color: #b8b8b8;
    font-size: 12px;
    transition: color .15s, border-color .15s;
  }
  .st-panel select:hover { color: #fff; border-color: rgba(255,255,255,.4); }
  .st-panel .st-reset {
    background: transparent;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 6px;
    color: #b8b8b8;
    font-size: 13px;
    transition: color .15s, background .15s;
  }
  .st-panel .st-reset:hover { color: #fff; background: rgba(255,255,255,.06); }
  .st-gear {
    border-radius: 8px;
    background: rgba(10,10,10,.6);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.15);
    box-shadow: none;
  }
  .st-tip {
    background: rgba(10,10,10,.92);
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 6px;
    box-shadow: none;
    color: #b8b8b8;
  }

  /* промпт: соображение + настройки → одним копированием в Клод Код */
  .st-panel .st-prompt { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .st-panel .st-prompt textarea {
    width: 100%; min-height: 72px; resize: vertical;
    background: transparent;
    border: 1px solid rgba(255,255,255,.2); border-radius: 5px;
    color: #d0d0d0;
    font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
    padding: 7px 9px; outline: none;
    transition: border-color .15s;
  }
  .st-panel .st-prompt textarea:focus { border-color: rgba(255,255,255,.45); }
  .st-panel .st-prompt textarea::placeholder { color: rgba(255,255,255,.3); font-family: inherit; }
  .st-panel .st-prompt-row { display: flex; gap: 8px; }
  .st-panel .st-prompt-row button {
    flex: 1; padding: 8px 0;
    background: transparent;
    border: 1px solid rgba(255,255,255,.2); border-radius: 5px;
    color: #b8b8b8; font: inherit; font-size: 12px;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .st-panel .st-prompt-row button:hover { color: #fff; border-color: rgba(255,255,255,.4); }
  .st-panel .st-prompt-row button.rec { color: #ff453a; border-color: rgba(255,69,58,.55); }
  .st-panel .st-prompt-row button:disabled { opacity: .4; cursor: default; }

  /* промпт-окно выделения: внизу по центру, появляется при выборе клеток */
  .grid-bar {
    position: fixed;
    left: 50%; bottom: 16px;
    transform: translateX(-50%);
    z-index: 30;
    width: min(560px, calc(100vw - 32px));
    background: rgba(10,10,10,.8);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 10px;
    padding: 10px;
    display: flex; flex-direction: column; gap: 8px;
    color: #b8b8b8;
    font-size: 13px;
  }
  .grid-bar[hidden] { display: none; }
  .grid-bar .gb-sel {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px;
    color: rgba(255,120,110,.95);
  }
  .grid-bar textarea {
    width: 100%; min-height: 44px; resize: vertical;
    background: transparent;
    border: 1px solid rgba(255,255,255,.2); border-radius: 5px;
    color: #d0d0d0;
    font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
    padding: 7px 9px; outline: none;
    transition: border-color .15s;
  }
  .grid-bar textarea:focus { border-color: rgba(255,255,255,.45); }
  .grid-bar textarea::placeholder { color: rgba(255,255,255,.3); }
  .grid-bar .gb-btns { display: flex; gap: 8px; }
  .grid-bar .gb-btns button {
    flex: 1; padding: 8px 0;
    background: transparent;
    border: 1px solid rgba(255,255,255,.2); border-radius: 5px;
    color: #b8b8b8; font: inherit; font-size: 12px;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .grid-bar .gb-btns button:hover { color: #fff; border-color: rgba(255,255,255,.4); }
  .grid-bar .gb-btns button.rec { color: #ff453a; border-color: rgba(255,69,58,.55); }
  .grid-bar .gb-btns button:disabled { opacity: .4; cursor: default; }
  .grid-bar .gb-btns .gb-close { flex: 0 0 40px; }
  .grid-bar .gb-role { display: flex; align-items: center; gap: 10px; }
  .grid-bar .gb-role label { flex: 1; color: #b8b8b8; font-size: 13px; }
  .grid-bar select {
    -webkit-appearance: none; appearance: none;
    background: transparent
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='14' viewBox='0 0 10 14'><path d='M1.5 5.2 5 1.7 8.5 5.2M1.5 8.8 5 12.3 8.5 8.8' fill='none' stroke='rgba(255,255,255,0.6)' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>")
      no-repeat right 8px center / 10px 14px;
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 5px;
    color: #b8b8b8;
    font: 12px inherit;
    padding: 5px 26px 5px 10px;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .grid-bar select:hover { color: #fff; border-color: rgba(255,255,255,.4); }

  /* зоны в панели: строка-сущность, активная светится */
  .zone-hint { font-size: 12px; color: rgba(255,255,255,.3); padding: 0 4px 8px; }
  .st-panel h4.zone-row { cursor: pointer; }
  .st-panel h4.zone-row.zone-active { color: #fff; }

  /* слоты разделений: глазок и крестик в заголовке, «+» в конце блока */
  .st-panel h4.slot-h { position: relative; padding-right: 60px; }
  .st-panel .slot-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 2px;
    margin-right: 8px;
  }
  .st-panel .slot-btns {
    position: absolute; right: 20px; top: 50%;
    transform: translateY(-50%);
    display: flex; gap: 8px;
  }
  .st-panel .slot-btns button {
    width: 18px; height: 18px; padding: 1px;
    background: transparent; border: none;
    color: #b8b8b8; cursor: pointer;
    transition: color .15s;
  }
  .st-panel .slot-btns button:hover { color: #fff; }
  .st-panel .slot-btns svg { width: 100%; height: 100%; display: block; }
  .st-panel .slot-btns .eye .slash { display: none; }
  .st-panel .slot-btns .eye.off .slash { display: block; }
  .st-panel .card.slot-hidden { opacity: .45; }
  .st-panel .st-add-row { display: flex; gap: 8px; margin-top: 12px; }
  .st-panel .st-add-row button {
    flex: 1; padding: 8px 0;
    background: transparent;
    border: 1px dashed rgba(255,255,255,.25); border-radius: 6px;
    color: #b8b8b8; font: inherit; font-size: 12px;
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .st-panel .st-add-row button:hover { color: #fff; border-color: rgba(255,255,255,.45); }
</style>
</head>
<body>

<header>
  <div><a class="back" href="/">←</a> Сетка</div>
  <div id="info"></div>
</header>

<div id="sheet"></div>

<script src="/panel.js"></script>
<script>
var DEFAULTS = {
  nums: 'on',      // номера колонок
  flashMs: 600,    // затухание вспышки, мс
  hover: 'on'      // наведение в клетку активирует её
};

var P = Object.assign({}, DEFAULTS);
try {
  var saved = JSON.parse(localStorage.getItem('setka-params'));
  if (saved) Object.keys(DEFAULTS).forEach(function (k) {
    if (k in saved) P[k] = saved[k];
  });
} catch (e) {}

// ── сетки по модели Фигмы: единый список Layout Grid ──
// каждая сетка: тип (колонки/строки/клетка), выравнивание, количество,
// размер, промежуток, отступ, цвет, прозрачность, глазок; порядок = наложение
var GRID_TYPES = { cols: 'Колонки', rows: 'Строки', cell: 'Клетка' };
var GRID_COLORS = {
  red: '255,69,58', blue: '10,132,255', yellow: '255,214,10',
  green: '48,209,88', white: '255,255,255'
};
var COLOR_NAMES = { red: 'красный', blue: 'синий', yellow: 'жёлтый', green: 'зелёный', white: 'белый' };
var COLOR_ORDER = ['red', 'blue', 'yellow', 'green', 'white'];
function defGrid(type, idx) {
  return {
    type: type, state: 'on',
    color: COLOR_ORDER[idx % COLOR_ORDER.length],
    opacity: 15,     // прозрачность заливки, %
    count: type === 'rows' ? 6 : 12,
    size: 160,       // ширина колонки / высота строки при выравнивании не «растянуть»
    gutter: 20,      // межколонник / межстрочник
    margin: 24,      // поля (растянуть) или сдвиг от края (влево/вправо)
    align: 'stretch',// stretch | start | center | end
    cell: 8          // размер клетки для типа «клетка»
  };
}
var S = [defGrid('cols', 0)];
if (/[?&]reset/.test(location.search)) {
  try { localStorage.removeItem('setka-grids'); localStorage.removeItem('setka-splits'); } catch (e) {}
}
try {
  var savedG = JSON.parse(localStorage.getItem('setka-grids'));
  if (Array.isArray(savedG) && savedG.length) S = savedG;
  else {
    // миграция со слотов-разделений
    var oldS = JSON.parse(localStorage.getItem('setka-splits'));
    if (oldS && (oldS.h || oldS.v)) {
      var list = [];
      (oldS.h || []).forEach(function (sp) {
        list.push(Object.assign(defGrid('cols', list.length), {
          state: sp.state, count: sp.cols, size: sp.colW, gutter: sp.gutter,
          margin: sp.margin, align: sp.mode === 'free' ? 'start' : 'stretch'
        }));
      });
      (oldS.v || []).forEach(function (sp) {
        list.push(Object.assign(defGrid('rows', list.length), {
          state: sp.state, count: sp.rows, gutter: sp.rowGap, margin: sp.vmargin
        }));
      });
      if (list.length) S = list;
    }
  }
} catch (e) {}
function saveS() { try { localStorage.setItem('setka-grids', JSON.stringify(S)); } catch (e) {} }

new URLSearchParams(location.search).forEach(function (v, k) {
  if (k in DEFAULTS) P[k] = (typeof DEFAULTS[k] === 'number') ? parseFloat(v) : v;
});

var sheet = document.getElementById('sheet');
var info = document.getElementById('info');

// один расчёт на кадр: разрешаем список сеток в геометрию
function computeGrid() {
  var vw = document.documentElement.clientWidth;
  var vh = innerHeight;
  var grids = [];
  S.forEach(function (g) {
    if (g.state !== 'on') return;
    var r = { type: g.type, color: GRID_COLORS[g.color] || GRID_COLORS.red, op: g.opacity / 100 };
    if (g.type === 'cell') {
      r.size = Math.max(2, g.cell);
    } else {
      var full = g.type === 'cols' ? vw : vh;
      var n = Math.max(1, Math.round(g.count));
      var w, x0;
      if (g.align === 'stretch') {
        w = Math.max(1, (full - 2 * g.margin - (n - 1) * g.gutter) / n);
        x0 = g.margin;
      } else {
        w = g.size;
        var total = n * w + (n - 1) * g.gutter;
        if (g.align === 'start') x0 = g.margin;
        else if (g.align === 'end') x0 = full - g.margin - total;
        else x0 = (full - total) / 2;
      }
      r.n = n; r.w = w; r.g = g.gutter; r.x0 = x0;
    }
    grids.push(r);
  });
  return {
    vw: vw, vh: vh, grids: grids,
    cols: grids.filter(function (g) { return g.type === 'cols'; }),
    rows: grids.filter(function (g) { return g.type === 'rows'; })
  };
}

function render() {
  var gr = computeGrid();
  var W = gr.vw;
  sheet.style.width = W + 'px';
  sheet.innerHTML = '';
  var firstCols = gr.cols[0];

  gr.grids.forEach(function (q) {
    if (q.type === 'cell') {
      // клетка: сетка линий с шагом size, как Grid в Фигме
      for (var x = q.size; x < W; x += q.size) {
        var vl = document.createElement('div');
        vl.className = 'sep';
        vl.style.left = (x - 0.5) + 'px';
        vl.style.background = 'rgba(' + q.color + ',' + q.op + ')';
        sheet.appendChild(vl);
      }
      for (var y = q.size; y < gr.vh; y += q.size) {
        var hl = document.createElement('div');
        hl.className = 'hsep';
        hl.style.top = (y - 0.5) + 'px'; hl.style.width = W + 'px';
        hl.style.background = 'rgba(' + q.color + ',' + q.op + ')';
        sheet.appendChild(hl);
      }
      return;
    }
    var horizontal = q.type === 'cols';
    for (var i = 0; i < q.n; i++) {
      var pos = q.x0 + i * (q.w + q.g);
      var band = document.createElement('div');
      band.className = horizontal ? 'col' : 'rowband';
      if (horizontal) {
        band.style.left = pos + 'px';
        band.style.width = q.w + 'px';
      } else {
        band.style.top = pos + 'px';
        band.style.height = q.w + 'px';
        band.style.width = W + 'px';
      }
      band.style.background = 'rgba(' + q.color + ',' + q.op + ')';
      if (horizontal && q === firstCols && P.nums === 'on') {
        var s = document.createElement('span');
        s.textContent = i + 1;
        band.appendChild(s);
      }
      sheet.appendChild(band);
    }
    // промежуток ноль — границу держит линия цвета сетки
    if (q.g === 0) {
      for (var j = 1; j < q.n; j++) {
        var ln = document.createElement('div');
        ln.className = horizontal ? 'sep' : 'hsep';
        if (horizontal) ln.style.left = (q.x0 + j * q.w - 0.5) + 'px';
        else { ln.style.top = (q.x0 + j * q.w - 0.5) + 'px'; ln.style.width = W + 'px'; }
        ln.style.background = 'rgba(' + q.color + ',.6)';
        sheet.appendChild(ln);
      }
    }
  });

  var parts = [];
  gr.grids.forEach(function (q) {
    if (q.type === 'cell') parts.push('клетка ' + q.size + ' px');
    else parts.push((q.type === 'cols' ? 'колонки ' : 'строки ') + q.n + ' × ' +
      (Math.round(q.w * 10) / 10) + ' px');
  });
  if (!parts.length) parts.push('сеток нет');
  parts.push('полотно ' + W + '×' + gr.vh + ' px');
  info.textContent = parts.join(' · ');
}

var ui = StendPanel.build({
  storageKey: 'setka-params',
  params: P,
  defaults: DEFAULTS,
  defs: [
    ['h', 'Датчики'],
    ['flashMs', 'Вспышка, мс', 100, 1500, 50],
    ['hover', 'Наведение', 'select', [['on', 'активирует клетку'], ['off', 'выкл']]],
    ['h', 'Показ'],
    ['nums', 'Номера колонок', 'select', [['on', 'показывать'], ['off', 'скрыть']]]
  ],
  desc: {
    nums: 'Номер в верхнем углу каждой колонки первой колоночной сетки.',
    flashMs: 'Время затухания вспышки клетки.',
    hover: 'Наведение курсора в клетку активирует её — сетка работает клавиатурой.'
  }
});

// ── слоты разделений: списки, глазок скрывает, крестик удаляет,
// «+» в конце каждого блока добавляет ещё одно разделение того же рода ──
var slotsHost = document.createElement('div');
ui.panel.insertBefore(slotsHost, ui.panel.firstChild);

var EYE_SVG = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">' +

function slotSliderRow(card, lab, obj, key, min, max, step, onChange) {
  var row = document.createElement('div'); row.className = 'row';
  var l = document.createElement('label');
  l.textContent = lab; l.style.cursor = 'default';
  var inp = document.createElement('input');
  inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step;
  inp.value = obj[key];
  var val = document.createElement('span'); val.className = 'val';
  val.textContent = obj[key];
  function paint() {
    var p = (obj[key] - min) / (max - min) * 100;
    inp.style.background =
      'linear-gradient(to right, #fff ' + p + '%, rgba(255,255,255,.16) ' + p + '%)';
  }
  inp.addEventListener('input', function () {
    obj[key] = parseFloat(inp.value);
    val.textContent = obj[key];
    paint(); saveS();
    if (onChange) onChange();
  });
  // клик по числу — точный ввод (Enter — принять, Esc — отмена)
  val.addEventListener('click', function () {
    var ed = document.createElement('input');
    ed.type = 'number'; ed.className = 'val-edit'; ed.step = 'any';
    ed.value = obj[key];
    row.replaceChild(ed, val);
    ed.focus(); ed.select();
    var done = false;
    function fin(ok) {
      if (done) return; done = true;
      if (ok) {
        var v = parseFloat(ed.value);
        if (!isNaN(v)) obj[key] = Math.max(min, Math.min(max, v));
      }
      row.replaceChild(val, ed);
      inp.value = obj[key]; val.textContent = obj[key];
      paint(); saveS();
      if (onChange) onChange();
    }
    ed.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') fin(true);
      else if (ev.key === 'Escape') fin(false);
    });
    ed.addEventListener('blur', function () { fin(true); });
  });
  row.appendChild(l); row.appendChild(inp); row.appendChild(val);
  card.appendChild(row); paint();
}

function slotSelectRow(card, lab, obj, key, opts, onChange) {
  var row = document.createElement('div'); row.className = 'row';
  var l = document.createElement('label');
  l.textContent = lab; l.style.cursor = 'default';
  var sel = document.createElement('select');
  opts.forEach(function (o) {
    var oe = document.createElement('option');
    oe.value = o[0]; oe.textContent = o[1];
    sel.appendChild(oe);
  });
  sel.value = obj[key];
  sel.addEventListener('input', function () {
    obj[key] = sel.value;
    saveS();
    if (onChange) onChange();
  });
  row.appendChild(l); row.appendChild(sel);
  card.appendChild(row);
}

function zoneName(z) {
  var s = 'колонки ' + (z.c1 + 1) + (z.c2 > z.c1 ? '–' + (z.c2 + 1) : '');
  if (z.r1 >= 0) s += ' × строки ' + (z.r1 + 1) + (z.r2 > z.r1 ? '–' + (z.r2 + 1) : '');
  return s;
}

// прямоугольник зоны в экранных координатах (клетки первых сеток)
function zoneRect(z, gr) {
  var h = gr.cols[0];
  if (!h || z.c1 >= h.n) return null;
  var c2 = Math.min(z.c2, h.n - 1);
  var r1 = z.r1, r2 = z.r2;
  var v = gr.rows[0];
  if (!v) { r1 = -2; r2 = -2; }
  else if (r1 >= 0) {
    if (r1 >= v.n) return null;
    r2 = Math.min(r2, v.n - 1);
  }
  var a = cellRect(z.c1, r1, gr);
  var b = cellRect(c2, r2, gr);
  return [a[0], a[1], b[0] + b[2] - a[0], b[1] + b[3] - a[1]];
}

// ── прямое манипулирование: тягучие линии сетки и зоны протяжкой ──
var EDGE_TOL = 6;
var drag = null;

function firstOnIdx(type) {
  for (var i = 0; i < S.length; i++) {
    if (S[i].type === type && S[i].state === 'on') return i;
  }
  return -1;
}

// край какой колонки/строки первой сетки под курсором?
function edgeAt(gr, x, y) {
  function scan(res, pos) {
    if (!res) return null;
    for (var k = 0; k < res.n; k++) {
      var L = res.x0 + k * (res.w + res.g);
      if (Math.abs(pos - L) <= EDGE_TOL) return { k: k, side: 'left' };
      if (Math.abs(pos - (L + res.w)) <= EDGE_TOL) return { k: k, side: 'right' };
    }
    return null;
  }
  var c = scan(gr.cols[0], x);
  if (c) return { axis: 'x', k: c.k, side: c.side };
  var r = scan(gr.rows[0], y);
  if (r) return { axis: 'y', k: r.k, side: r.side };
  return null;
}

function clampNum(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// решаем параметр сетки так, чтобы схваченный край встал под курсор
function applyEdgeDrag(g, res, k, side, pos, full) {
  var n = res.n, gut = res.g, w = res.w, x0 = res.x0;
  var K = side === 'left' ? k : k + 1; // сколько колонок целиком левее края
  if (g.align === 'stretch') {
    var m = g.margin;
    var gMax = n > 1 ? Math.max(0, (full - 2 * m - n * 4) / (n - 1)) : 0;
    if (K === 0) g.margin = Math.round(clampNum(pos, 0, full / 2 - 20));
    else if (K === n) g.margin = Math.round(clampNum(full - pos, 0, full / 2 - 20));
    else if (side === 'left') {
      g.gutter = Math.round(clampNum((n / K) * (pos - m) - (full - 2 * m), 0, gMax));
    } else {
      g.gutter = Math.round(clampNum(n * (pos - m - K * (full - 2 * m) / n) / (K - n), 0, gMax));
    }
  } else if (K === 0) {
    if (g.align === 'start') g.margin = Math.round(Math.max(0, pos));
    else if (g.align === 'end') g.size = Math.round(clampNum((full - g.margin - pos - (n - 1) * gut) / n, 4, full));
    else g.size = Math.round(clampNum((full - 2 * pos - (n - 1) * gut) / n, 4, full));
  } else if (K === n) {
    if (g.align === 'end') g.margin = Math.round(Math.max(0, full - pos));
    else if (g.align === 'start') g.size = Math.round(clampNum((pos - x0 - (n - 1) * gut) / n, 4, full));
    else g.size = Math.round(clampNum((2 * pos - full - (n - 1) * gut) / n, 4, full));
  } else if (side === 'left') {
    g.gutter = Math.round(Math.max(0, (pos - x0) / K - w));
  } else {
    g.size = Math.round(clampNum((pos - x0 - (K - 1) * gut) / K, 4, full));
  }
}

addEventListener('mousedown', function (e) {
  if (e.button !== 0) return;
  var t = e.target;
  if (t && t.closest && t.closest('.st-panel, .st-gear, .grid-bar, header, .st-tip')) return;
  var gr = computeGrid();
  var edge = edgeAt(gr, e.clientX, e.clientY);
  if (edge) {
    drag = { kind: 'edge', axis: edge.axis, k: edge.k, side: edge.side };
    e.preventDefault();
    return;
  }
  drag = { kind: 'maybe', x: e.clientX, y: e.clientY,
    col: colAt(e.clientX + scrollX, gr), row: rowAt(e.clientY, gr) };
});

addEventListener('mousemove', function (e) {
  var gr = computeGrid();
  if (!drag) {
    var edge = edgeAt(gr, e.clientX, e.clientY);
    document.body.style.cursor = edge ? (edge.axis === 'x' ? 'col-resize' : 'row-resize') : '';
    return;
  }
  if (drag.kind === 'edge') {
    var idx = firstOnIdx(drag.axis === 'x' ? 'cols' : 'rows');
    var res = drag.axis === 'x' ? gr.cols[0] : gr.rows[0];
    if (idx >= 0 && res) {
      applyEdgeDrag(S[idx], res, drag.k, drag.side,
        drag.axis === 'x' ? e.clientX : e.clientY,
        drag.axis === 'x' ? gr.vw : gr.vh);
    }
    return;
  }
  if (drag.kind === 'maybe') {
    if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 6) {
      if (drag.col >= 0 && drag.row !== -1) {
        drag = { kind: 'zone', c1: drag.col, r1: drag.row, c2: drag.col, r2: drag.row };
      } else drag = null;
    }
    return;
  }
  if (drag.kind === 'zone') {
    var c = colAt(e.clientX + scrollX, gr);
    var r = rowAt(e.clientY, gr);
    if (c >= 0) drag.c2 = c;
    if (r !== -1) drag.r2 = r;
  }
});

addEventListener('mouseup', function (e) {
  if (!drag) return;
  var d = drag;
  drag = null;
  if (d.kind === 'edge') { saveS(); rebuildSlots(); return; }
  if (d.kind === 'zone') {
    var vertical = d.r1 >= 0 && d.r2 >= 0;
    zones.push({
      c1: Math.min(d.c1, d.c2), c2: Math.max(d.c1, d.c2),
      r1: vertical ? Math.min(d.r1, d.r2) : -2,
      r2: vertical ? Math.max(d.r1, d.r2) : -2,
      role: '', prompt: '', state: 'on'
    });
    activeZone = zones.length - 1;
    saveZones(); rebuildZones(); updateBar();
    return;
  }
  // клик без протяжки: по зоне — открыть её, по пустой клетке — зона 1×1
  var col = d.col, row = d.row;
  if (col < 0 || row === -1) return;
  var rr = row >= 0 ? row : -2;
  var hit = -1;
  zones.forEach(function (z, i) {
    if (z.state !== 'on') return;
    var inRow = z.r1 < 0 || (rr >= z.r1 && rr <= z.r2);
    if (col >= z.c1 && col <= z.c2 && inRow) hit = i;
  });
  if (hit >= 0) activeZone = hit;
  else {
    zones.push({ c1: col, c2: col, r1: rr, r2: rr, role: '', prompt: '', state: 'on' });
    activeZone = zones.length - 1;
    saveZones();
  }
  rebuildZones(); updateBar();
});

// надиктовка в окно выделения — тот же механизм, что в панели
(function () {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    barMic.disabled = true;
    barMic.title = 'в этом браузере нет распознавания речи';
    return;
  }
  var rec = null;
  barMic.addEventListener('click', function () {
    if (rec) { rec.stop(); return; }
    rec = new SR();
    rec.lang = 'ru-RU';
    rec.continuous = true;
    rec.interimResults = false;
    rec.onresult = function (e) {
      for (var i = e.resultIndex; i < e.results.length; i++) {
        if (!e.results[i].isFinal) continue;
        var t = e.results[i][0].transcript.trim();
        if (!t) continue;
        barTa.value += (barTa.value && !/\s$/.test(barTa.value) ? ' ' : '') + t;
      }
    };
    function stop() {
      rec = null;
      barMic.classList.remove('rec');
      barMic.textContent = 'Надиктовать';
    }
    rec.onend = stop;
    rec.onerror = stop;
    rec.start();
    barMic.classList.add('rec');
    barMic.textContent = 'Идёт запись — стоп';
  });
})();

updateBar();

// ── датчики: наведение курсора в клетку активирует её —
// сетка работает клавиатурой; тут же светится выделение ──
var sensors = document.createElement('canvas');
sensors.id = 'sensors';
document.body.appendChild(sensors);

var cellFlashes = [];
var hoverCol = -1;

// клетки считает первая видимая сетка колонок и первая сетка строк
function colAt(sheetX, gr) {
  var h = gr.cols[0];
  if (!h) return -1;
  var i = Math.floor((sheetX - h.x0) / (h.w + h.g));
  if (i < 0 || i >= h.n) return -1;
  return (sheetX - h.x0 - i * (h.w + h.g)) <= h.w ? i : -1;
}

function rowAt(y, gr) {
  var v = gr.rows[0];
  if (!v) return -2; // строк нет — клетка растёт на всю высоту
  var i = Math.floor((y - v.x0) / (v.w + v.g));
  if (i < 0 || i >= v.n) return -1;
  return (y - v.x0 - i * (v.w + v.g)) <= v.w ? i : -1;
}

// прямоугольник клетки: колонка целиком или модуль на пересечении со строкой
function cellRect(col, row, gr) {
  var h = gr.cols[0];
  var x = h.x0 + col * (h.w + h.g) - scrollX;
  if (row >= 0) {
    var v = gr.rows[0];
    return [x, v.x0 + row * (v.w + v.g), h.w, v.w];
  }
  return [x, 0, h.w, innerHeight];
}

var hoverRow = -2;
addEventListener('mousemove', function (e) {
  var gr = computeGrid();
  var col = colAt(e.clientX + scrollX, gr);
  var row = rowAt(e.clientY, gr);
  if (col !== hoverCol || row !== hoverRow) {
    hoverCol = col; hoverRow = row;
    var active = col >= 0 && row !== -1;
    if (active && P.hover === 'on') {
      cellFlashes.push({ col: col, row: row, t: performance.now() });
    }
  }
});

function drawSensors(now) {
  var W = innerWidth, H = innerHeight;
  var dpr = window.devicePixelRatio || 1;
  if (sensors.width !== Math.round(W * dpr) || sensors.height !== Math.round(H * dpr)) {
    sensors.width = Math.round(W * dpr);
    sensors.height = Math.round(H * dpr);
  }
  var c = sensors.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);

  var gr = computeGrid();

  // зоны: заливка с рамкой и подписью роли; активная ярче
  zones.forEach(function (z, i) {
    if (z.state !== 'on') return;
    var r = zoneRect(z, gr);
    if (!r) return;
    var act = i === activeZone;
    c.fillStyle = act ? 'rgba(255,120,110,.32)' : 'rgba(255,120,110,.15)';
    c.fillRect(r[0], r[1], r[2], r[3]);
    c.strokeStyle = act ? 'rgba(255,140,130,.95)' : 'rgba(255,140,130,.5)';
    c.lineWidth = act ? 1.5 : 1;
    c.strokeRect(r[0] + 0.5, r[1] + 0.5, r[2] - 1, r[3] - 1);
    c.fillStyle = act ? 'rgba(255,255,255,.9)' : 'rgba(255,255,255,.55)';
    c.font = '11px ui-monospace, Menlo, monospace';
    c.fillText((i + 1) + (z.role ? ' · ' + z.role : ''), r[0] + 6, r[1] + 16);
  });

  // протяжка: живой прямоугольник будущей зоны
  if (drag && drag.kind === 'zone') {
    var mz = {
      c1: Math.min(drag.c1, drag.c2), c2: Math.max(drag.c1, drag.c2),
      r1: drag.r1 >= 0 && drag.r2 >= 0 ? Math.min(drag.r1, drag.r2) : -2,
      r2: drag.r1 >= 0 && drag.r2 >= 0 ? Math.max(drag.r1, drag.r2) : -2
    };
    var mr = zoneRect(mz, gr);
    if (mr) {
      c.fillStyle = 'rgba(255,120,110,.22)';
      c.fillRect(mr[0], mr[1], mr[2], mr[3]);
      c.setLineDash([4, 4]);
      c.strokeStyle = 'rgba(255,140,130,.9)';
      c.lineWidth = 1;
      c.strokeRect(mr[0] + 0.5, mr[1] + 0.5, mr[2] - 1, mr[3] - 1);
      c.setLineDash([]);
    }
  }

  // клетка под курсором: слабое поле + вспышка на входе
  if (P.hover === 'on' && hoverCol >= 0 && hoverRow !== -1) {
    var hr = cellRect(hoverCol, hoverRow, gr);
    c.fillStyle = 'rgba(255,255,255,.035)';
    c.fillRect(hr[0], hr[1], hr[2], hr[3]);
  }
  cellFlashes = cellFlashes.filter(function (f) {
    var a = 1 - (now - f.t) / P.flashMs;
    if (a <= 0) return false;
    var r = cellRect(f.col, f.row === undefined ? -2 : f.row, gr);
    c.fillStyle = 'rgba(255,69,58,' + (a * 0.22) + ')';
    c.fillRect(r[0], r[1], r[2], r[3]);
    return true;
  });
}

// панель пишет прямо в P — DOM перерисовывается по факту смены значений,
// окна, прокрутки или открытия панели; слой датчиков живёт каждым кадром
var lastSig = '';
(function tick(now) {
  now = now || 0;
  var sig = JSON.stringify(P) + JSON.stringify(S) + '|' + document.documentElement.clientWidth +
    'x' + innerHeight + '|' + Math.round(scrollX) + '|' + ui.panel.hidden;
  if (sig !== lastSig) { lastSig = sig; render(); updateBar(); }
  drawSensors(now);
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
