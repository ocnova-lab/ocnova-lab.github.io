<title>Каталог M7 · вид коллекции</title>
<link rel="stylesheet" href="/panel.css" />
<style>
  /* ============================================================
     КАТАЛОГ M7 — вид коллекции и бесшовный переход в него из галереи.
     Отдельный стенд на тех же файлах данных, что «Галерея M7»; при
     склейке подключается в неё модулем, носитель выбрасывается.

     Смотрит: на окно (ширина и высота) и на долю перехода t.
     Реагирует: плавно, переломов нет — теснота считается законом в коде.
     Законы: 3б «Коридор» — высота обложки как доля высоты окна; пропорция
             рамки от кадра и не правится, размер — ручкой;
             строка курсора — палец над зеркалом и обложкой (одно место);
             П9 — переход как очередь фаз со своими долями хода.

     СЛОИ (снизу вверх): фон → оригинал-шторка → зеркало/обложка (холст)
     → ярлыки (DOM над холстом). Курсор системный: палец над зеркалом.

     ПЕРЕХОД (t: 0 галерея → 1 каталог) по замыслу Сергея (07.09):
       клик по зеркалу → всё, кроме зеркала, уходит;
       1) фон чёрный → белый; фото галереи закрывается ШТОРКОЙ к своему краю —
          той же, какой открывалось на уходе: закон один на оба направления;
       2) зеркало РАСТЁТ по центру от размера покоя галереи до обложки;
          рамка не меняет пропорции — только размер; на доле подмены кадр
          в зеркале сменяется обложкой коллекции (склейка плотностью);
       3) ЯРЛЫКИ приходят после зеркала: номер, название, описание,
          метки, знак, подсказка — одной плотностью.
       Обратно — своим временем и своей кривой. Разворот с любого места:
       новый ход стартует с текущей доли, длится долей пути.

     ПУСК. Страница открывается СТОЯЩИМ каталогом: доля в единице, часов нет.
       Ход остаётся на клик и на тумблер. Пока уход был откатом входа, старт в
       нуле показывал галерею и это читалось; с отдельным законом ухода в нуле
       рисуется фаза ухода — фото слева, которого при загрузке никто не звал.

     УХОД В ГАЛЕРЕЮ (t: 1 → 0) — свой закон, а не откат входа (Сергей 09.09).
       Смотрит: на клик по зеркалу и на долю обратного хода.
       Реагирует: плавно, очередью фаз со своими долями (П9).
       НАВОДКА — обещание клика раньше клика: указатель вошёл в рамку, рамка
         ужалась на долю (15 %) своим временем и кривой; вышел — вернулась.
         Действует только в каталоге и только пока ход не идёт.
       ЯРЛЫКИ расходятся ОТ ГОРИЗОНТА на один и тот же путь: описание вниз,
         номер вверх — и тают, пересобираясь. Приём взят со склада стенда:
         тот же разлёт, каким ярлыки ходят на шаге скролла (yarlSbor), и тот
         же фронт пересборки, каким описание растворяется в кружении. Новая
         здесь только доля — своя, уходная — и своя амплитуда.
       ФОН темнеет прежним законом: та же доля ведёт цвет от каталожного к
         галерейному, отдельных часов ему не заводили.
       ФОТО ГАЛЕРЕИ приходит ШТОРКОЙ СЛЕВА НАПРАВО в левой части экрана:
         первый кадр съёмки, ширина — доля ширины окна, высота из пропорции
         кадра в коридоре полей. Фронт открывает кадр по ширине; сторона —
         ручка. Закон шторки ОДИН на оба направления: прежняя редакция входа
         (оригинал во всю высоту по центру) снята 09.09 — на возврате из
         галереи она подменяла экран скачком.

     ГЕОМЕТРИЯ КАТАЛОГА — от рамки обложки и одного ЗАЗОРА (доля высоты окна):
       номер: базовая линия на верхней кромке обложки, правый край на
              зазор левее левой кромки; в тесноте — над обложкой, от её
              левой кромки;
       название: середина капители на середине обложки, центр правее
              центра окна на долю ширины; в тесноте — под описанием;
       описание: под обложкой на зазор, ширина — доля ширины окна, но не
              уже обложки, по центру;
       подсказка «scroll»: центр, на доле высоты окна;
       метки: колонка контента (доля ширины окна, по центру), верх на
              зазор; знак — низ на зазор (® снят 09.09, тире у числа тоже).
       ЛИНИЯ ГОРИЗОНТА — доля высоты окна: на ней стоит веер имён. Была
              зашита половиной высоты, стала ручкой (08.09). В кружении на неё
              же уходит номер — влево и вниз, на зазор левее плоской кромки
              выросшего зеркала: тот же отступ, что в покое от малого, разный
              только размер рамки (09.09). Зазор держится каждый кадр, а не
              долей хода, — иначе он просаживается серединой перехода. Проворот
              номер не двигает: наложение разведено СЛОЕМ — номер и тире лежат
              над холстом (z-index 43 против 41). Вниз, на горизонт, ход идёт
              долей роста; там садится он на базовую линию имён веера.
       РАСТВОРЕНИЕ ДЕСКРИПТОРА. Смотрит: на удержание указателя (тот же порог,
              что отделяет тычок от удержания, — задержка круга).
              Реагирует: плавно — фронт идёт по описанию, на фронте знак
              перещёлкивает, за фронтом строка тает. Приём тот же, что у
              пересборки, отличается только цель: не новый текст, а пустота.
              Ширину строка держит неразрывными пробелами — раскладка под ней
              не дёргается. Возврат своим временем и своей кривой (П9),
              разворот с любого места.
       Числа сняты с макета «for vibe code», узел 4031:44228 (2534×1440).
       Базовая линия — щупом (П8), капитель — замером «H»: раз на смену
       гарнитуры и кегля, не в кадре.

     МИКРОАНИМАЦИЯ ВОЛНЫ — два движения, а не одно (09.09).
       Смотрит: на удержание (фаза прихода или ухода) и на ранг ступени —
              расстояние от горизонта. Реагирует: плавно, волной от горизонта
              наружу; порядок один на обе фазы.
       ЧАСЫ У СТУПЕНИ ОДНИ — ход по лучу: время и кривая. ПРОЗРАЧНОСТЬ ЧАСОВ
              НЕ ИМЕЕТ, она меряется местом: доля луча, к которой имя
              догорело. Десять — гаснет, едва тронувшись; пятьдесят — на
              половине; сто — догорает, ровно доехав. Время хода двигает
              КОГДА, а не ГДЕ. Путь считается ПОЛНЫЙ ВИДИМЫЙ — от радиуса
              кольца до посадки плюс свой вынос, — и берётся у живого
              положения имени: имя стоит на двух движениях, своём ходе по лучу
              и общем переезде с кольца, и мерить одно первое значило мерить
              хвост. Прежде у фейда были свои миллисекунды, и то
              же самое приходилось подбирать вслепую — половина времени при
              торможении даёт четыре пятых пути, а тронешь кривую хода, и
              место гашения уезжает.
       РАЗБЕГ ЛУЧЕЙ — сколько ждёт соседний луч. Своя величина, а не разность:
              пока волна задавалась общим временем, шаг выводился вычитанием,
              и ручка, залезшая за чужую, упиралась в клампинг. Общее время
              выводится (разбег × ступеней + ход) и ручки не имеет.

     ПРИЁМЫ: ◌ «Инверсия по подложке» — ярлыки белые в режиме разности:
             чёрные на белом поле, белые поверх кадра (кандидат, первый
             прецедент); «Разворот с любого места» — из галереи M7.

     Параметры адреса: ?stop=мс — стоп-кадр: часы замирают на отметке от
     старта хода в каталог (0 — галерея, больше входа — каталог);
     ?otkryt=1 / ?otkryt=0 — открыть каталогом или галереей, поверх ручки;
     ?reset=1, ?theme=nothing, ?panel.
     Память: localStorage['katalog-m7-params'].
     ============================================================ */
  /* Алфавит гарнитур свода — из него выбирает орган «Гарнитура»; Syne Mono
     пришла из макета каталога и вписана в алфавит 07.09. */
  @font-face { font-family:'Syne Mono'; src:url('/fonts/SyneMono-Regular.woff2') format('woff2'); font-display:swap; }
  @font-face { font-family:'Apple II Screen Typeface'; src:url('/fonts/AppleIIScreenTypeface.woff2') format('woff2'); font-display:swap; }
  @font-face { font-family:'Editorial New'; src:url('/fonts/EditorialNew-Regular.woff') format('woff'); font-display:swap; }
  @font-face { font-family:'Dentegra Display'; src:url('/fonts/DentDisplay-Regular.woff2') format('woff2'); font-display:swap; }
  @font-face { font-family:'Even Mono'; src:url('/fonts/EvenMono-Regular.woff2') format('woff2'); font-display:swap; }
  @font-face { font-family:'JetBrains Mono'; src:url('/fonts/JetBrainsMono-Regular.woff2') format('woff2'); font-display:swap; }
  /* Переменный: оси wght 100…900 и wdth 50…100, обе объявлены диапазоном —
     иначе браузер сам сузит их до умолчания и ручки осей не подействуют. */
  @font-face { font-family:'Pragmatica Next VF'; src:url('/fonts/PragmaticaNextVF.woff') format('woff'); font-weight:100 900; font-stretch:50% 100%; font-display:swap; }

  html,body{height:100%;margin:0;background:#000;overflow:hidden}
  /* ХОЛСТ — ВЕРХНИМ СЛОЕМ над ярлыками (Сергей 08.09): зеркало в кружении
     растёт вдвое и обязано перекрывать число и описание, а не просвечивать
     ими. Слои: ярлыки 40 → холст 41 → кнопки каналов 42 → курсор 45. Холст
     при этом прозрачный (alpha в контексте), фон несёт тело страницы. */
  /* ХОЛСТ ПОД СЛОЕМ ЯРЛЫКОВ (Сергей 09.09: «картинки оригиналов на нижний
     слой»). Стоял он выше — 41 против 40, — и в каталоге это не мешало:
     обложка мала и стоит по центру, ярлыки по краям, спорить негде. В галерее
     оригинал идёт во всю высоту и накрывал собой логотипы, метки, дату и
     веер. Слой у картинки нижний: над нею всё, что подписывает сцену. */
  #gl{position:fixed;inset:0;width:100vw;height:100dvh;display:block;touch-action:none;z-index:39}
  #gl.palec{cursor:pointer}                 /* палец над зеркалом — строка курсора */
  /* Ярлыки — прямые дети тела страницы, без обёртки: любая обёртка с
     position или z-index — отдельная группа наложения, и режим разности
     смешивал бы текст с пустотой внутри неё, а не с холстом (поймано
     прогоном 07.09: белые ярлыки пропали на белом поле). */
  .yar{position:fixed;z-index:40;margin:0;white-space:nowrap;line-height:1;pointer-events:none}
  /* СПРЯТАНО — ЗНАЧИТ НЕТ. Атрибут hidden даёт display:none браузерным
     стилем, и любой явный display его перебивает: у #metki свой display:flex,
     и метки оставались на экране при hidden=true (поймано 08.09). Правило —
     страховка на весь слой ярлыков, а не на одни метки. */
  .yar[hidden]{display:none!important}
  /* НАДПИСЬ ДВУСТРОЧНАЯ (Сергей 09.09: «добавь вторую строку, на ней плюс,
     выключка по центру»). Слой ярлыков набран в одну строку — `nowrap`, — а
     здесь перенос значащий: `pre` держит его как знак текста, а не как
     случайный перенос по ширине. Ширину блок берёт по длинной строке, и
     выключка по центру ставит плюс под её середину. Место блока считает
     раскладка: `left` на оси экрана и сдвиг на половину своей ширины. */
  #lookmore{white-space:pre;text-align:center}
  /* Режим разности у ярлыков снят (Сергей 08.09): зеркало теперь верхним
     слоем, и ярлыкам не с чем смешиваться — они просто своего цвета. */
  /* НОМЕР И ТИРЕ — НАД ХОЛСТОМ (Сергей 09.09). Весь слой ярлыков лежит под
     зеркалом (40 против 41), и наложение приходилось разводить местом: номер
     отходил от края и дёргался на каждом провороте. Слой решает это дешевле —
     номер просто всегда сверху, и место ему нужно только по росту зеркала. */
  #nomer,#tire{z-index:43}
  #nomer{transform:translate(-100%,0)}      /* правый край — на левом ребре опоры */
  /* ® вынесен ВЛЕВО от знака и висит правым краем на отбивке от его левой
     кромки: тот же приём, что у номера кадров. Ширину знака ® мерить не надо —
     её держит сдвиг на собственные сто процентов. */
  #znakR{transform:translate(-100%,0)}
  /* Тире висит СЛЕВА ОТ ЧИСЛА, вне его строки: своим узлом, правым краем к
     левому ребру числа. Впиши его в текст — число уехало бы вправо (в тесноте)
     или пересборка стёрла бы его вместе с текстом. */
  #tire{transform:translate(-100%,0)}
  #nazvanie{transform:translate(-50%,0)}
  /* Имя коллекции в веере: поле от центра окна вправо, выключка по центру;
     поворот вокруг центра окна — ось поворота ставит скрипт по базовой линии. */
  .veer{text-align:left;transform-origin:0 50%}   /* левый край и ось поворота ставит скрипт: посадка и выключка */
  /* pre-wrap, а не normal: описание переписывается в надпись, у которой перенос
     ЗНАЧАЩИЙ («LOOK MORE» и «+» под ним). Перенос по ширине при этом жив. */
  #opisanie{white-space:pre-wrap;text-align:center;text-transform:uppercase;transform:translate(-50%,0)}
  #podskazka,#podskazkaNiz{transform:translate(-50%,-50%);text-transform:uppercase}
  #metki{display:flex;text-transform:uppercase}
  #metki p{margin:0}
  .znak{display:block}
  .znak svg{display:block;height:100%;width:auto}
  /* Дата: день и месяц столбцом, год отдельным узлом — он садится в
     межстрочник первых двух строк, а внутри одного абзаца этого не выразить. */
  #data{white-space:nowrap}
  #data p{margin:0}
  /* absolute: год стоит в своём блоке даты, а координаты ему даёт скрипт —
     left из «Год вправо», top из половины интерлиньяжа (ровно в межстрочнике
     дня и месяца); 0,0 здесь — только исходная точка отсчёта. */
  /* координаты года: left и top ставит скрипт, см. комментарий выше */
  #dataGod{position:absolute;left:0;top:0}
  /* Каналы — кнопки: свой слой над ярлыками, курсор палец, без инверсии. */
  /* До первой раскладки узел не показывается: размеры и место ему даёт
     скрипт, а картинки внутри — свои натуральные, и в левом верхнем углу
     мелькали огромными (поймано 08.09). Скрипт снимает скрытость сам. */
  /* ИКОНКИ — САМЫЙ ВЕРХНИЙ СЛОЙ (Сергей 09.09). Выше своего курсора (45),
     чтобы он гас ПОД ними, а не поверх: иконка — вещь, к которой ведут, и
     закрывать её указателем — врать про порядок. Слои снизу вверх: ярлыки 40,
     холст 41, номер и тире 43, курсор 45, иконки 46. */
  #kanaly{position:fixed;z-index:46;display:flex;flex-direction:column;visibility:hidden;left:0;top:0}
  .kanal{display:block;border-radius:50%;overflow:hidden;cursor:pointer;
         -webkit-tap-highlight-color:transparent}
  .kanal img,.kanal svg{display:block;width:100%;height:100%}
  /* Свой курсор — перенос из галереи M7: кольцо с разрывом, точка в центре,
     два уса по оси. DOM поверх сцены, над ярлыками; координаты от указателя. */
  .kursor{position:fixed;left:0;top:0;z-index:45;pointer-events:none;display:none;
          transform:translate(-50%,-50%);will-change:transform}
  .kursor svg{display:block;overflow:visible}
  .nogl{font:14px/1.5 -apple-system,system-ui,sans-serif;color:#fff;padding:2em}  /* служебное // без ручки */
</style>
</head>

  /* ── шейдеры: квад в px с окном текстуры uUV (для шторки и обрезки обложки) ── */
  function sh(t,src){ var s=gl.createShader(t); gl.shaderSource(s,src); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
  function prog(fs){ var p=gl.createProgram();
    p._vs=sh(gl.VERTEX_SHADER,"attribute vec2 aPos;uniform vec4 uRect;uniform vec4 uUV;uniform vec2 uView;varying vec2 vUV;void main(){vUV=uUV.xy+aPos*uUV.zw;vec2 p=uRect.xy+aPos*uRect.zw;gl_Position=vec4(p.x/uView.x*2.0-1.0,1.0-p.y/uView.y*2.0,0.0,1.0);}");
    gl.attachShader(p,p._vs); gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(p);
    if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    p.uRect=gl.getUniformLocation(p,"uRect"); p.uUV=gl.getUniformLocation(p,"uUV"); p.uView=gl.getUniformLocation(p,"uView"); return p; }
  /* ПЕРЕКРАСКА ЗЕРКАЛА (макет 08.09): поверх кадра лежит слой цвета в режиме
     умножения. Умножение и есть перемножение каналов, поэтому слоя не нужно —
     цвет входит в тот же проход: c.rgb * цвет. Плотность подмешивает цвет к
     белому: ноль — кадр как есть, единица — полное умножение. */
  var pTex=prog("precision mediump float;varying vec2 vUV;uniform sampler2D uTex;uniform float uAlpha;uniform vec3 uTint;uniform float uTintK;void main(){vec4 c=texture2D(uTex,vUV);float a=c.a*uAlpha;gl_FragColor=vec4(c.rgb*mix(vec3(1.0),uTint,uTintK)*a,a);}");
  pTex.uAlpha=gl.getUniformLocation(pTex,"uAlpha");
  pTex.uTint=gl.getUniformLocation(pTex,"uTint"); pTex.uTintK=gl.getUniformLocation(pTex,"uTintK");
  /* Второй рисовальщик — цветной квад, он же диск (uCircle): точки круга и
     крестик. Порт из галереи вместе с законом круга. */
  var pCol=prog("precision mediump float;varying vec2 vUV;uniform vec4 uColor;uniform float uCircle;void main(){float a=1.0;if(uCircle>0.5){float r=length(vUV-vec2(0.5));a=1.0-smoothstep(0.34,0.5,r);}float o=uColor.a*a;gl_FragColor=vec4(uColor.rgb*o,o);}");
  pCol.uColor=gl.getUniformLocation(pCol,"uColor"); pCol.uCircle=gl.getUniformLocation(pCol,"uCircle");
  /* ПРОЕКЦИЯ С ПЕРСПЕКТИВОЙ (порт arqe spin01): четыре угла плоскости
     поворачиваются вокруг оси и проецируются фокусом; в clip-space вершина
     идёт с w = (фокус − z) / фокус, чтобы текстура тянулась перспективно, а
     не аффинно — arqe ради этого режет плоскость на 8×8 треугольников. */
  function progPersp(fs){ var p=gl.createProgram();
    gl.attachShader(p,sh(gl.VERTEX_SHADER,"attribute vec4 aPos;attribute vec2 aUV;varying vec2 vUV;void main(){vUV=aUV;gl_Position=aPos;}"));
    gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(p);
    if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; }
  var pPersp=progPersp("precision mediump float;varying vec2 vUV;uniform sampler2D uTex;uniform float uAlpha;uniform vec3 uTint;uniform float uTintK;void main(){vec4 c=texture2D(uTex,vUV);float a=c.a*uAlpha;gl_FragColor=vec4(c.rgb*mix(vec3(1.0),uTint,uTintK)*a,a);}");
  pPersp.uAlpha=gl.getUniformLocation(pPersp,"uAlpha"); pPersp.uTint=gl.getUniformLocation(pPersp,"uTint"); pPersp.uTintK=gl.getUniformLocation(pPersp,"uTintK");
  pPersp.aPos=gl.getAttribLocation(pPersp,"aPos"); pPersp.aUV=gl.getAttribLocation(pPersp,"aUV");
  var quadPersp=gl.createBuffer();
  /* ОРБИТА — порт arqe «Orbit 11». Плоскость не поворачивается вокруг себя,
     как в спине, а ЕДЕТ ПО ОКРУЖНОСТИ, оставаясь фронтальной: центр её
     описывает круг радиуса R в плоскости, заданной поворотом орбиты, и уходит
     вглубь по Z. Оттого уезжающий кадр не заваливается набок, а отступает и
     скрывается — карусель, а не разворот.
     Параметры взяты с arqe: Count 7 (шаг орбиты — полный круг на семь),
     Orbit Radius 216 при Plane Size 512 (значит 42 % размера), Perspective
     100, Rotation Z 270 — орбита вертикальная, кадры едут вверх и вниз. */
  function drawTexOrbita(t,cx,cy,w,h,ugDeg,R,fokus,zRot,alpha,uv,tint,temno){
    if(!t||!t.ready) return;
    uv=uv||[0,0,1,1];
    var a=ugDeg*Math.PI/180, dir=zRot*Math.PI/180;
    var ox=R*Math.sin(a), oz=R*Math.cos(a)-R;             // при нулевом угле кадр в плоскости экрана
    var dx=ox*Math.cos(dir), dy=ox*Math.sin(dir);
    var ugly=[[-w/2,-h/2,0,0],[w/2,-h/2,1,0],[-w/2,h/2,0,1],[w/2,h/2,1,1]], d=[];
    for(var i=0;i<4;i++){
      var X=ugly[i][0]+dx, Y=ugly[i][1]+dy, Z=oz;
      var q=Math.max(0.01,(fokus-Z)/fokus);
      var sx=cx+X/q, sy=cy+Y/q;
      d.push((sx/W*2-1)*q,(1-sy/H*2)*q,0,q, uv[0]+ugly[i][2]*uv[2], uv[1]+ugly[i][3]*uv[3]);
    }
    gl.useProgram(pPersp);
    gl.bindBuffer(gl.ARRAY_BUFFER,quadPersp); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(d),gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(pPersp.aPos); gl.vertexAttribPointer(pPersp.aPos,4,gl.FLOAT,false,24,0);
    gl.enableVertexAttribArray(pPersp.aUV);  gl.vertexAttribPointer(pPersp.aUV,2,gl.FLOAT,false,24,16);
    gl.uniform1f(pPersp.uAlpha,alpha==null?1:alpha);
    /* ЗАТЕМНЕНИЕ идёт тем же уносом цвета, что и заливка: умножение на чёрный
       с долей. Своего прохода ему не нужно — шейдер уже умеет умножать. */
    if(temno>0){ gl.uniform3f(pPersp.uTint,0,0,0); gl.uniform1f(pPersp.uTintK,zazhat01(temno)); }
    else { var tc=hexRgb(P.cvetZerkala); gl.uniform3f(pPersp.uTint,tc[0],tc[1],tc[2]); gl.uniform1f(pPersp.uTintK,(tint?tint*P.plotZerkala/100:0)); }
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,t.tex);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    gl.disableVertexAttribArray(pPersp.aUV);
  }
  function drawTexPersp(t,cx,cy,w,h,ugDeg,os,fokus,alpha,uv,tint){
    if(!t.ready) return;
    uv=uv||[0,0,1,1];
    var a=ugDeg*Math.PI/180, c=Math.cos(a), s=Math.sin(a), d=[];
    var ugly=[[-w/2,-h/2,0,0],[w/2,-h/2,1,0],[-w/2,h/2,0,1],[w/2,h/2,1,1]];   // порядок ленты треугольников
    for(var i=0;i<4;i++){
      var x=ugly[i][0], y=ugly[i][1], X,Y,Z;
      if(os==='x'){ X=x; Y=y*c; Z=y*s; } else { X=x*c; Y=y; Z=-x*s; }        // матрицы поворота arqe
      var q=Math.max(0.01,(fokus-Z)/fokus);                                   // 1/pt: ближе фокуса не бывает
      var sx=cx+X/q, sy=cy+Y/q;
      d.push((sx/W*2-1)*q,(1-sy/H*2)*q,0,q, uv[0]+ugly[i][2]*uv[2], uv[1]+ugly[i][3]*uv[3]);
    }
    gl.useProgram(pPersp);
    gl.bindBuffer(gl.ARRAY_BUFFER,quadPersp); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(d),gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(pPersp.aPos); gl.vertexAttribPointer(pPersp.aPos,4,gl.FLOAT,false,24,0);
    gl.enableVertexAttribArray(pPersp.aUV);  gl.vertexAttribPointer(pPersp.aUV,2,gl.FLOAT,false,24,16);
    gl.uniform1f(pPersp.uAlpha,alpha==null?1:alpha);
    // tint — доля перекраски (истина = 1): в кружении она уходит вместе с ростом
    var tc=hexRgb(P.cvetZerkala); gl.uniform3f(pPersp.uTint,tc[0],tc[1],tc[2]); gl.uniform1f(pPersp.uTintK,(tint?tint*P.plotZerkala/100:0));
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,t.tex);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    gl.disableVertexAttribArray(pPersp.aUV);
  }
  var quad=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,quad);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,0,1,0,0,1,1,1]),gl.STATIC_DRAW);
  function bindQuad(p){ var loc=gl.getAttribLocation(p,"aPos"); gl.bindBuffer(gl.ARRAY_BUFFER,quad); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0); }
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);   // источник приходит уже умноженным

  /* ── текстуры по требованию: только кадр зеркала и обложка, не вся съёмка ── */
  var TEKS={};
  function tekstura(ph){
    if(TEKS[ph.id]) return TEKS[ph.id];
    var o={tex:gl.createTexture(),ready:false,w:ph.w,h:ph.h};
    var img=new Image();
    img.onload=function(){
      gl.bindTexture(gl.TEXTURE_2D,o.tex);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      if(GL2){ gl.generateMipmap(gl.TEXTURE_2D); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR); }
      else     gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
      if(ANIZ) gl.texParameterf(gl.TEXTURE_2D,ANIZ.TEXTURE_MAX_ANISOTROPY_EXT,Math.min(8,ANIZ_MAX));
      o.ready=true;
    };
    img.src=ph.d; TEKS[ph.id]=o; return o;
  }
  function drawCol(x,y,w,h,rgba,circle){
    gl.useProgram(pCol); bindQuad(pCol);
    gl.uniform2f(pCol.uView,W,H); gl.uniform4f(pCol.uRect,x,y,w,h); gl.uniform4f(pCol.uUV,0,0,1,1);
    gl.uniform4f(pCol.uColor,rgba[0],rgba[1],rgba[2],rgba[3]); gl.uniform1f(pCol.uCircle,circle?1:0);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }
  function drawTex(t,x,y,w,h,alpha,uv,tint){
    if(!t.ready) return;                                     // до загрузки кадра нет — фон и есть плейсхолдер
    uv=uv||[0,0,1,1];
    gl.useProgram(pTex); bindQuad(pTex);
    gl.uniform2f(pTex.uView,W,H); gl.uniform4f(pTex.uRect,x,y,w,h); gl.uniform4f(pTex.uUV,uv[0],uv[1],uv[2],uv[3]);
    gl.uniform1f(pTex.uAlpha,alpha==null?1:alpha);
    var tc=hexRgb(P.cvetZerkala);                            // цвет со стенда, не из макета
    gl.uniform3f(pTex.uTint,tc[0],tc[1],tc[2]);
    gl.uniform1f(pTex.uTintK,(tint?tint*P.plotZerkala/100:0));           // доля, а не только да/нет
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,t.tex);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }

  /* ── данные сцены: кадр зеркала и коллекция ── */
  function kadrZerkala(){
    var sy=SYOMKI[P.syomka]; if(!sy||!sy.kadry.length) return null;   // подмена снята: имя чинится на пуске
    var i=Math.max(0,Math.min(sy.kadry.length-1,Math.round(P.kadr)-1));
    return sy.kadry[i];
  }
  /* СЪЁМКА КОЛЛЕКЦИИ. Порядок съёмок в данных повторяет порядок коллекций
     («01 Предмет» → predmet и так далее), поэтому соответствие не объявляется
     отдельно — оно в порядке подключения. */

      /* В ГАЛЕРЕЕ КОЛЬЦО КРУТИТСЯ С ЛЕНТОЙ (Сергей 10.09). Штрих — та же

  /* ПРУЖИНА ПОВОРОТА С ПРЕДЕЛОМ СКОРОСТИ — один закон на дугу и усы (из галереи). */
  function vestiUgol(tek,skor,cel,pr,predel,sdt){
    if(tek===null) return [cel,0];
    if(pr[0]){

    var shag=skor*sdt;

    return [tek+shag, skor];

      var znak=(kS>st.spinKS?1:-1)*napr;

  /* Что видно сейчас: до ребра — откуда уходим, после — куда пришли. Показ

     базы разошёлся бы с настоящей коллекцией. */
  function spinPokazan(){
    if(st.spinCelUg===st.spinOt) return st.spinKollB;

     замедлить, ни укоротить отдельно от гашения. Кривая по-прежнему кладётся
     на саму фазу, а не выворачивает наизнанку чужую (П9). */
  /* Путь по направлению: приходят и уходят на разное расстояние. */
  function putVyezda(){ return (st.ringNa?P.vyezd:P.vyezdUhod)/100; }
  function dolyaVyezda(i,now,shag){
    var na=st.ringNa, u=dolyaFazy(i,now,shag,vremyaHoda(na));
    if(na) return evalEase(P.vyezdEase,P.vyezdBez,u);
    return 1-evalEase(P.vyezdUhodEase,P.vyezdUhodBez,u);
  }
  function perevernutUV(uv,os){ return os==='x'?[uv[0],uv[1]+uv[3],uv[2],-uv[3]]:[uv[0]+uv[2],uv[1],-uv[2],uv[3]]; }

  /* ── ЗВУК: сухой щелчок на смене коллекции (порт из галереи M7, приём
     стенда M5). Браузер разрешает звук только после первого нажатия — до
     него щелчки молчат. ── */
  var actx=null, lastClickT=0;
  function ensureAudio(){
    if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(_){ } }
    if(actx&&actx.state==="suspended") actx.resume();
  }
  function click(){
    if(!P.zvuk) return;                                       // глаз секции «Звук»
    if(!actx||actx.state!=="running") return;
    var t=actx.currentTime;
    if(t-lastClickT<P.glushenie/1000) return;                 // глушение на скорости (грабля M5)
    lastClickT=t;
    // «ноготь по пластмассе»: синус с затуханием по кривой плюс микрошум контакта в атаке
    var o=actx.createOscillator(); o.type="sine"; o.frequency.value=4200;   // 4200 Гц // без ручки: типа «частота» в своде нет
    var g=actx.createGain();
    var dlina=Math.max(0.001,P.zatuhanie/1000), pik=P.gromkostTon/100;
    var ogib=new Float32Array(32);
    for(var j=0;j<32;j++) ogib[j]=pik*(1-evalEase(P.zvukEase,P.zvukBez,j/31));
    g.gain.setValueCurveAtTime(ogib,t,dlina);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t+dlina+0.002);
    var shum=Math.max(0.0005,P.dlinaShuma/1000);
    var len=Math.max(1,Math.floor(actx.sampleRate*shum)), buf=actx.createBuffer(1,len,actx.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);               // шум-щелчок контакта
    var src=actx.createBufferSource(); src.buffer=buf;
    var hp=actx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=3000;  // 3000 Гц // без ручки
    var g2=actx.createGain(); g2.gain.value=P.gromkostShum/100;
    src.connect(hp); hp.connect(g2); g2.connect(actx.destination);
    src.start(t);
  }

  /* ── КРУГ ТОЧЕК (порт из галереи M7; ось — центр экрана) ──
     Радиус — доля высоты, зажатая полем от края: на низком окне круг
     ужимается, а не вылезает. Волна: точки зажигаются одна за другой, шаг
     выводится из «появления круга» и «проявления точки», последняя догорает
     ровно к концу появления. Уход идёт обратным порядком — тем же законом. */
  function radiusKruga(){
    var R=H*(P.krugD/100)/2, pole=Math.max(0,P.krugPole);
    return Math.max(4,Math.min(R,Math.min(W,H)/2-pole));
  }
  /* ВОЛНА ИДЁТ ОТ ГЛАВНОЙ НАРУЖУ, а не по номерам коллекций: точка на
     горизонтали зажигается первой и стоит, соседние разбегаются от неё
     парами (Сергей 08.09). Ступеней в волне поэтому не N−1, а половина
     кольца: последняя пара догорает ровно к «появлению круга». */
  function rangTochki(i){
    var d=i-st.veer; d=(((d+N_K/2)%N_K)+N_K)%N_K-N_K/2;
    return Math.round(Math.abs(d));
  }
  function stupenej(){ return Math.max(1,Math.floor(N_K/2)); }
  /* ВРЕМЕНА ВОЛНЫ — по направлению И по назначению (Сергей 09.09). На каждую
     сторону их три, и они про разное: ход по лучу (путь), фейд (прозрачность)
     и вся волна (от первой ступени до последней). Прежде было два, и путь
     считался долей фейда — правка одного двигала другое. */
  function razbegLuchey(na){ return na?P.krugMs:P.krugUhodMs; }
  function vremyaHoda(na){  return na?P.vyezdMs:P.vyezdUhodMs; }
  /* Доля пути, к которой имя догорело: единственная мера прозрачности. */
  function dolyaFeyda(na){ return Math.max(0.001,(na?P.feydDolya:P.feydUhodDolya)/100); }
  /* РАЗБЕГ — своя величина, а не разность (Сергей 09.09: «ручки работают так
     же»). Пока волна задавалась ОБЩИМ временем, шаг выводился вычитанием, и
     любая ручка, залезшая за чужую, упиралась в клампинг: при общем 100 и
     фейде 200 шаг был ноль, и вся вилка до 200 не давала ничего. Общее время
     нельзя сделать меньше ступени — арифметика, — поэтому органом стал разбег:
     сколько ждёт соседний луч. Тогда ни ход, ни фейд, ни разбег друг друга не
     режут, а общее время выводится и показано заметкой. */
  /* Часы ступени одни — ход по лучу: фейд кончается вместе с ним или раньше,
     позже он кончиться не может, потому что меряется пройденным путём. */
  function vremyaTochki(na){ return vremyaHoda(na)*dolyaFeyda(na); }   // крестик и развороты часов
  function dlinaStupeni(na){ return vremyaHoda(na); }
  function shagTochkiNa(na){ return N_K>1?Math.max(0,razbegLuchey(na)):0; }
  function shagTochki(){ return shagTochkiNa(st.ringNa); }
  function dlinaVolnyNa(na){ return dlinaStupeni(na)+stupenej()*shagTochkiNa(na); }
  function dlinaVolny(){ return dlinaVolnyNa(st.ringNa); }
  /* Задержка ступени — одна на ход и на фейд: волна идёт от горизонта наружу
     обоими движениями сразу, врозь у них только длительность и кривая.
     Порядок ОДИН на приход и на уход (Сергей 08.09): первым то, что ближе к
     горизонту, дальше парами наружу. Прежде уход шёл обратным порядком, от
     краёв к центру, и читался как отдельное движение. */
  function dolyaFazy(i,now,shag,ms){
    return ms>0?zazhat01((now-st.ringT-rangTochki(i)*shag)/ms):1;
  }
  /* ПРОЗРАЧНОСТЬ ВЕДЁТ МЕСТО, А НЕ ЧАСЫ (Сергей 09.09): «фейд доходит до ста
     процентов уже на половине пути». Доля пути берётся у самого хода — той же
     кривой, тем же временем: сдвинешь время хода — сдвинется КОГДА, а не ГДЕ.
     Мера пути у каждого своя, и её даёт вызывающий (см. plotnostPoPuti). */
  function plotnostPoPuti(proydeno){
    var na=st.ringNa;
    var e=reduced?1:evalEase(na?P.krugEase:P.krugUhodEase, na?P.krugBez:P.krugUhodBez,
                             zazhat01(proydeno/dolyaFeyda(na)));
    return na?e:1-e;
  }
  /* Мера пути у каждого своя, и вычисляет её тот, кто знает свою геометрию.
     У точки кольца путь и есть её собственный ход по радиусу. У ИМЕНИ путь
     шире: поверх собственного хода его везёт общий переезд с кольца на
     посадку, и этот переезд идёт без задержки ступени. Пока мерой был один
     собственный ход, доля отсчитывалась от хвоста: замер 09.09 показал, что
     к началу собственного хода боковое имя проехало уже 58 % видимого пути,
     и «погасить к 7 %» гасило на 84 % — эффекта Сергей не видел вовсе. */
  /* ВОЛНА КОЛЬЦА — ПОРТ СО СТЕНДА ГАЛЕРЕИ M7. Задержка по номеру точки, на
     уходе обратным порядком; длина волны — от старта первой до конца
     последней, по ней же круг и гаснет. */
  function shagKolca(n){ return n>1?Math.max(0,P.kolcoMs-P.kolcoTochkaMs)/(n-1):0; }
  function dlinaKolca(n){ return P.kolcoTochkaMs+(n>1?n-1:0)*shagKolca(n); }
  function dolyaKolca(i,n,now){
    var zad=(st.ringNa?i:(n-1-i))*shagKolca(n);
    var u=P.kolcoTochkaMs>0?zazhat01((now-st.ringT-zad)/P.kolcoTochkaMs):1;
    var e=reduced?1:evalEase(P.krugEase,P.krugBez,u);
    return st.ringNa?e:1-e;
  }
  function dolyaTochki(i,now,shag){
    var eV=dolyaVyezda(i,now,shag);
    return plotnostPoPuti(st.ringNa?eV:1-eV);
  }
  /* РАЗВОРОТ С ЛЮБОГО МЕСТА (П9): новый ход стартует с зеркальной доли
     старого — отпустил посреди прихода, уход идёт оттуда же, а не с нуля. */
  function razvernutChasy(t0,msBylo,msStalo,now){
    var u=msBylo>0?zazhat01((now-t0)/msBylo):1;
    return now-(1-u)*msStalo;
  }
  function zazhechKrug(){
    if(!st.derzhim||!P.krug) return;                        // круг горит в обоих режимах: в галерее он показывает кадры
    st.kurFaza='net'; st.kurUs=1;                   // новое удержание отменяет очередь выхода
    if(st.ringOn&&st.ringNa) return;                          // уже горит и приходит — не перезапускать
    var now=performance.now();
    st.ringT=razvernutChasy(st.ringT,dlinaVolnyNa(false),dlinaVolnyNa(true),now);   // уход короче — приход разворачивается своей долей
    st.krestT0=razvernutChasy(st.krestT0,vremyaTochki(false),vremyaTochki(true),now);
    var svezhSp=!st.ringOn;
    st.ringNa=true; st.ringOn=true;
    st.spinT0=razvernutChasy(st.spinT0,P.spinShodMs,P.spinRostMs,now); st.spinNa=true;   // рост — с того места, где схождение застало
    /* База дискретного поворота ставится на свежем зажигании: угол считается
       от неё, и шаги скролла между удержаниями зеркало не докручивает. */
    if(svezhSp){ st.spinUg=0; st.spinOt=0; st.spinCelUg=0; st.spinHodT0=now; st.spinHodMs=1;
                 st.spinKS=Math.round(st.veer); st.spinKollA=st.spinKollB=st.tek; }
  }
  /* УДЕРЖАНИЕ — один порог на два ответа: круг зажигается, описание тает.
     Каждый со своей ручкой включения, но с общим порогом: жест один. */
  function nachatUderzhanie(){
    zazhechKrug();
    if(!P.rastvorenie||!st.derzhim||st.cel!==1) return;
    var now=performance.now();
    if(st.rastv&&st.rastv.na) return;
    st.rastv={ na:true, t0:razvernutChasy(st.rastv?st.rastv.t0:now-P.rastvMs,
                 st.rastv&&!st.rastv.na?P.rastvNazadMs:P.rastvMs, P.rastvMs, now) };
  }
  function konchitUderzhanie(){
    if(!st.rastv||!st.rastv.na) return;
    var now=performance.now();
    /* ОЧЕРЕДЬ (П9): возврат начинается, когда зеркало сошлось к покою, — иначе
       число и описание приходили под выросшее зеркало. Часы схождения уже
       переведены в pogasitKrug (он зовётся первым): конец схождения известен. */
    var zhdat=0;
    if(P.rastvZhdet&&P.spin&&P.krug&&P.kruzhenie&&!st.spinNa) zhdat=Math.max(0,st.spinT0+P.spinShodMs-now);
    st.rastv={ na:false, t0:razvernutChasy(st.rastv.t0,P.rastvMs,P.rastvNazadMs,now)+zhdat };
  }
  function pogasitKrug(){
    if(st.ringTimer){ clearTimeout(st.ringTimer); st.ringTimer=null; }
    if(!st.ringOn||!st.ringNa) return;
    var now=performance.now();
    /* Компас уходит своей очередью, а не обратным ходом перестроения. */
    if(P.kursor&&P.kursorKruzh&&st.kruzhKurs>0.02){ st.kurFaza='uhod'; st.kurT0=now; }
    st.ringT=razvernutChasy(st.ringT,dlinaVolnyNa(true),dlinaVolnyNa(false),now);   // с того места, где приход застал, но уходным временем
    st.krestT0=razvernutChasy(st.krestT0,vremyaTochki(true),vremyaTochki(false),now);
    st.ringNa=false;
    st.spinT0=razvernutChasy(st.spinT0,P.spinRostMs,P.spinShodMs,now); st.spinNa=false;  // схождение — с той же доли; после ранней отсечки выше сюда не попасть на тычке
  }

  /* ── ПЕРЕСБОРКА ТЕКСТА (порт набора из горизонтального лонгрида) ──
     Буква меняется на букву своего регистра и алфавита, цифра на цифру,
     знаки препинания не трогаются: перебор без сдвига в моноширинном наборе.
     Случайности нет — хеш jit от зерна и номера буквы: воспроизводимо. */
  var ALF={ lat:{lo:'abcdefghijklmnopqrstuvwxyz',up:'ABCDEFGHIJKLMNOPQRSTUVWXYZ'},
            kir:{lo:'абвгдежзийклмнопрстуфхцчшщэюя',up:'АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЭЮЯ'} };
  var CIFRY='0123456789', ZNAKI='.,;:!?—–-()“”’/*+#', NBSP='\u00A0';
  function probel(ch){ return ch===' '||ch==='\n'||ch===NBSP; }
  function jit(seed,i){ var x=Math.sin(seed*37.7+i*13.31)*43758.545; return x-Math.floor(x); }
  function flapChar(ch,n){
    var lo=ch.toLowerCase(), up=ch.toUpperCase();
    if(lo===up) return (ch>='0'&&ch<='9') ? CIFRY[n%10] : ZNAKI[n%ZNAKI.length];
    var code=ch.charCodeAt(0);
    var a=(!P.naborLat&&code>=0x400&&code<=0x4FF)?ALF.kir:ALF.lat;
    var set=(ch===up)?a.up:a.lo;
    return set[n%set.length];
  }
  /* Фронт идёт по НОВОМУ тексту слева направо: за фронтом новая буква,
     на фронте перещёлк, перед фронтом ещё старая (пока старый текст не
     кончился). Порог буквы с дрожью, чтобы фронт не был линейкой. */
  /* ЗАМОРОЖЕННЫЙ ХВОСТ (Сергей 09.09: «не пересобирай цифру 7 — это общее
     количество коллекций»). Перебор — про то, что сменилось; постоянной части
     строки менять не на что, и щёлкать ею — врать про смену. Хвост от
     заданного места идёт как есть, а доля фронта считается по одной
     перебираемой части: она и есть вся дистанция хода. */
  /* СТРОКИ. Фронт умеет идти не по всей длине, а по КАЖДОЙ строке набора
     сразу: тогда две строки описания меняются одновременно, а не волной одна
     за другой. Разбор тот же, что у растворения, — приём один, и мера у него
     одна. Без списка строк фронт идёт по всему тексту, как раньше. */
  /* ПРОБЕЛ ЦЕЛИ ТОЖЕ ИДЁТ ФРОНТОМ, ЕСЛИ ПОПРОСИТЬ (Сергей 09.09: «весь текст
     дескриптора переписывался постепенно, а не мгновенно»). По умолчанию
     пробел нового текста ставится СРАЗУ — на смене коллекции это верно: там
     оба текста описания, пробелы стоят примерно на тех же местах, и мельтешить
     ими незачем. Но когда цель — надпись, дополненная пробелами до длины
     описания, таких мест 114 из 125: описание исчезало в первом же кадре, а
     перебирались только десять знаков «LOOK MORE». Ход при этом честно длился
     объявленное время — просто смотреть было не на что.
     С флагом пробел цели ведёт себя как всякий знак: до фронта стоит старая
     буква, на фронте перещёлкивается, за фронтом становится пробелом. */
  function peresobrat(staroe,novoe,seed,p,tick,win,mrz,stroki,probFront){
    if(p>=1) return novoe;
    var L=novoe.length, out='', sN=0;
    var Lp=(mrz==null)?L:Math.max(0,Math.min(L,mrz));
    for(var i=0;i<L;i++){
      var ch=novoe[i];
      if(i>=Lp){ out+=ch; continue; }                              // хвост постоянен — перебирать нечего
      if(probel(ch)&&!probFront){ out+=ch; continue; }
      var j=i, Ln=Lp;
      if(stroki&&stroki.length>2){
        while(sN<stroki.length-2&&i>=stroki[sN+1]) sN++;
        j=i-stroki[sN]; Ln=Math.max(1,stroki[sN+1]-stroki[sN]);
      }
      var t=(j+jit(seed,i)*2.2)/(Ln+2.2);
      var znak=ch.toLowerCase()===ch.toUpperCase()&&!(ch>='0'&&ch<='9');
      var star=(i<staroe.length)?staroe[i]:'';
      /* На фронте мельтешит знак, а у пустого места своего знака нет — берём
         старый: исчезающая буква перещёлкивается, прежде чем уйти в пробел. */
      var celPusta=probFront&&probel(ch);
      if(p>=t) out+=ch;
      else if(p>0&&t-p<win) out+=celPusta?(probel(star)?ch:flapChar(star,tick+i*7+seed*3))
                                         :(znak?ch:flapChar(ch,tick+i*7+seed*3));
      else out+=(star&&!probel(star))?star:(znak?ch:NBSP);
    }
    return out;
  }
  /* РАСТВОРЕНИЕ — уход строки тем же фронтом, что и пересборка: за фронтом
     не новая буква, а неразрывный пробел, на фронте перещёлк, перед фронтом
     ещё старая. Пробел вместо пустоты держит ширину — строка тает, а
     раскладка под ней не дёргается. */
  /* Фронт идёт ПО КАЖДОЙ СТРОКЕ ОТДЕЛЬНО И ОДНОВРЕМЕННО, если границы строк
     переданы (Сергей 09.09). Одной лентой на весь текст вторая строка ждала,
     пока фронт пройдёт первую, и уход стоил вдвое больше времени, чем нужно:
     видно две строки, а тают они по очереди. Границы даёт замер, не догадка. */
  function rastvorit(staroe,seed,p,tick,win,stroki){
    var L=staroe.length, out='', sN=0;
    for(var i=0;i<L;i++){
      var ch=staroe[i];
      if(probel(ch)){ out+=ch; continue; }
      if(p>=1){ out+=NBSP; continue; }
      var j=i, Ln=L;
      if(stroki&&stroki.length>2){
        while(sN<stroki.length-2&&i>=stroki[sN+1]) sN++;
        j=i-stroki[sN]; Ln=Math.max(1,stroki[sN+1]-stroki[sN]);
      }
      var t=(j+jit(seed,i)*2.2)/(Ln+2.2);
      var znak=ch.toLowerCase()===ch.toUpperCase()&&!(ch>='0'&&ch<='9');
      if(p>=t) out+=NBSP;                                            // за фронтом — пусто
      else if(t-p<win) out+=znak?ch:flapChar(ch,tick+i*7+seed*3);    // на фронте — перещёлк
      else out+=ch;                                                  // перед фронтом — как было
    }
    return out;
  }
  /* ВТОРАЯ СТРОКА — ЗНАК, А НЕ СЛОВО (Сергей 09.09). Перенос стоит внутри
     самой надписи: `probel` считает его пробелом, и перебор проносит его
     нетронутым — обе строки собираются как одна строка знаков, а разрыв
     остаётся на месте. Знаков для темпа перебора считаем БЕЗ переноса: он не
     перебирается, и в счёт скорости ему идти незачем. */
  var NADPIS='LOOK MORE\n+';                             // зафиксировано по просьбе
  /* ОПИСАНИЕ ПЕРЕПИСЫВАЕТСЯ В НАДПИСЬ, И ОБА ТЕКСТА ДОЛЖНЫ БЫТЬ ОДНОЙ ДЛИНЫ.
     Приём перебора идёт по длине НОВОГО текста: отдай ему цель из одиннадцати
     знаков против описания в сто двадцать пять — и хвост описания пропадёт
     скачком, вместо того чтобы раствориться фронтом. Поэтому цель строится
     ПОСТРОЧНО: строка надписи центрируется пробелами до длины своей строки
     описания. Шрифт моноширинный, значит длина в знаках и есть ширина, а
     выключка по центру доводит остаток.
     Источник берётся с ТЕМИ ЖЕ переносами: цель несёт свои \n, и без них
     индексы двух строк разъехались бы на число переносов. */
  function poStrokam(tekst, stroki){
    if(!stroki||stroki.length<2) return tekst;
    var out='';
    for(var i=0;i<stroki.length-1;i++){
      if(i) out+='\n';
      out+=tekst.slice(stroki[i],stroki[i+1]);
    }
    return out;
  }
  /* Центрирует по строкам описания ЛЮБОЙ текст, не только надпись целиком:
     на уходе сюда приходит уже РАСТВОРЁННАЯ надпись, и место ей нужно то же. */
  function celPeresborki(stroki, pisatNadpis, tekst){
    var lin=(tekst!=null?tekst:NADPIS).split('\n');
    if(!stroki||stroki.length<2){                       // строк не замерили — цель той же длины пробелами
      var d=(st.pokazOpis||'').length, c=pisatNadpis?(tekst!=null?tekst:NADPIS):'';
      while(c.length<d) c+=' ';
      return c;
    }
    var out='';
    for(var i=0;i<stroki.length-1;i++){
      if(i) out+='\n';
      var dl=stroki[i+1]-stroki[i];
      var t=(pisatNadpis&&lin[i]!=null)?lin[i]:'';
      if(t.length>dl) t=t.slice(0,dl);
      var pad=dl-t.length, l=Math.floor(pad/2);
      out+=new Array(l+1).join(' ')+t+new Array(pad-l+1).join(' ');
    }
    return out;
  }
  /* Границы строк ЦЕЛИ смещены на число переносов: фронт идёт по каждой строке
     сразу, и мера у него своя от разбора текста, который он правит. */
  function strokiSPerenosami(stroki){
    if(!stroki||stroki.length<2) return null;
    var out=[0];
    for(var i=0;i<stroki.length-1;i++) out.push(out[i]+(stroki[i+1]-stroki[i])+(i<stroki.length-2?1:0));
    return out;
  }
  var NADPIS_ZN=NADPIS.replace(/\n/g,'').length;         // без ручки — длина для темпа перебора
  function pad3(n){ return ('000'+Math.max(0,Math.round(n||0))).slice(-3); }
  /* Номер коллекции вместе с общим счётом: «001—7». Тире — знак внутри

     цифру), и строка живёт одним местом. Число всего — из данных, и при
     пересборке оно заморожено: меняется только свой номер. */
  /* Свой номер и общий счёт — ДВА УЗЛА, а не одна строка (Сергей 09.09:

     textContent каждый кадр, и хвост, хоть и заморожен по знаку, всё равно

  function nomerKollekcii(){ return pad3(st.tek+1); }

  /* Ширина описания — число в пикселях, а не доля: перенос строк обязан
     стоять на месте, пока окно шире. Коридор снизу — ширина обложки, сверху —

  function shirinaOpisaniya(shirRamki){

  }

  function cvetSPlotDolya(hexA,hexB,d,plot){

  /* РАЗВОД ЗНАЧЕНИЙ ПО РЕЖИМУ. Уходя, режим складывает свои числа в свою
     половину; приходящий достаёт свои. Панель перерисовывает строки, иначе

  /* СЛУЖЕБНАЯ МЕРА КАДРА — окно наружу для прогонов. // без ручки

     прочитать. Пишется каждый кадр, стоит копейки, наружу ничего не меняет. */
  window.MERA={zerkalo:0,rost:1,cel:1,t:1,navDolya:0};
  var MERA=window.MERA;
  var PO_REZHIMU=['zerkalo','polyaOrig','polyaBoka'];
  /* ВЕЛИЧИНА ПО РЕЖИМУ ЧИТАЕТСЯ СМЕСЬЮ. Подмена набора в начале хода меняла
     числа скачком: зеркало 80,5 → 115, поля 20 → 60, — и переход начинался с
     рывка, а оригинал перескакивал в новое место ещё до того, как что-то
     поехало (Сергей 09.09). Половины остаются, но геометрия берёт не одну из
     них, а их смесь по доле хода: в покое это ровно значение своего режима, в
     ходе — непрерывный переход между ними.
     В покое половина следует за ручкой: правка в каталоге пишется в
     каталожную, в галерее — в галерейную; иначе она потерялась бы до
     следующего переключения. */
  function poR(imya){
    var K=imya+'Kat', G=imya+'Gal';
    if(P[K]==null||P[G]==null) return P[imya];
    /* ПРАВКУ РУКИ УЗНАЁМ ПО РАСХОЖДЕНИЮ С ОБЕИМИ ПОЛОВИНАМИ. Подмена набора
       всегда ставит значение равным одной из них, значит равенство — признак
       подмены, а не правки. Синхронизировать по доле хода нельзя: в первом
       кадре после подмены доля ещё прежняя, и половина уходящего режима
       затиралась значением пришедшего (поймано замером 09.09). */
    if(P[imya]!==P[K]&&P[imya]!==P[G]){
      if(st.t>=0.5) P[K]=P[imya]; else P[G]=P[imya];
    }
    return P[G]+(P[K]-P[G])*zazhat01(st.t);
  }
  /* ПОКОЙ ГАЛЕРЕИ — ОДНА ОПОРА НА ОБЕ ТОЧКИ РАСКЛАДКИ. Живая рамка и рамка
     покоя считают его врозь, и разойтись им нельзя: по первой ловится клик, по
     второй стоят ярлыки. Эталон тот же, что ведёт наводку, — оттого «под

  function pokoyGalerei(hK){

  function nabor(vGalereyu){

    for(var i=0;i<PO_REZHIMU.length;i++){
      var im=PO_REZHIMU[i];

    nabor(P.otkryt);                                   // числа режима меняются вместе с режимом

  /* ── жесты: палец и клик по зеркалу ── */

  /* ЖЕСТ. Удержание зажигает круг (через задержку), отпускание гасит.

  /* КРУЖЕНИЕ ВЕЕРА (рифма с галереей). Угол руки вокруг центра окна ведёт

  function vestiLentu(e){
    if(st.cel!==0||!P.vedenie||st.derzhim) return;
    progretSyomku();                                   // сменили коллекцию скроллом — греем новую съёмку
    var sy=syomkaKollekcii(); if(!sy||!sy.kadry.length) return;

  function vestiKruzhenie(e){
    if(!st.derzhim||!P.kruzhenie||!P.krug||!KOLL.length) return;
    /* МЕСТО РАЗВОДИТ И САМО КРУЖЕНИЕ, А НЕ ТОЛЬКО КРУГ. Запретить таймеру

        progretSyomku();

            if(P.origZaKruzheniem&&st.origKadr!==novK){

      var dtR=st.krutT<0?16:Math.min(200,now-st.krutT);
      if(P.potolokMs>0){

      if(shag){

        // логотип — от угла РУКИ, не от шага веера: свой принцип, ниже

      }

             объявлена ниже, в блоке зеркала, и наверху ещё пуста. */
          function mestoFoto(t2){
            var arF=t2.w/t2.h;
            var pOrig=poR('polyaOrig'), poleB=pOrig*(poR('polyaBoka')/100);
            var fh=Math.max(1,H-2*pOrig), fw=fh*arF;
            var wDost=Math.max(1,W-2*poleB); if(fw>wDost){ fw=wDost; fh=fw/arF; }
            if(P.origIshodnik){ var hPred=t2.h/DPR*(P.origPredel/100);

            /* МЕСТО ВЕДЁТСЯ ТОЙ ЖЕ СМЕСЬЮ, ЧТО И РАЗМЕР (Сергей 09.09: «большая

          /* Кадр СТОИТ, фронт открывает его по ширине: окно ползёт по uv,

          function fotoSloy(t2,alpha,ugolDolya,masht){

            /* ПРИХОД ИЗ ГЛУБИНЫ — размером на месте, а не по орбите: новый кадр

            if(masht&&masht!==1&&eF>=0.999){

            if(P.orbitVid&&ugolDolya!=null&&eF>=0.999){

              var udal=zazhat01(Math.abs(ugolDolya)/0.5);
              MERA.orbTemno=+(udal*(P.orbitTemno/100)).toFixed(3);   // служебное // без ручки

      var ar=P.zerkaloAR;
      var hK=H*P.oblozhka/100;                                  // размер обложки — доля высоты, без пола: пропорция от кадра, размер свободен (Сергей 07.09)

      var spinS=0;

         на подмене половина осталась бы красной, и шов стал бы виден. */
      var zalNav=1-(P.navodkaZalivka?st.navDolya*(P.navodkaZalivkaDolya/100):0);
      /* НАПЛЫВ НА СКЛЕЙКЕ поверх покоя, роста и наводки: он множитель, а не

      var fl=flikerHod(now,st.flikerT0,'');
      var zerkP=pokoyGalerei(hK);
      /* ЭТАЛОН — каталожная рамка под наводкой. К нему зеркало идёт из любого

         покоя (значит подрастает или ужимается — как выйдет). Под указателем
         размер один и тот же, и это ровно то, чего просили. */
      var mhPok=zerkP+(hK-zerkP)*t;
      var mhNav=hK*(1+P.navodkaRazmer/100);
      var mh=(mhPok+(mhNav-mhPok)*st.navDolya)*szh*fl.masht, mw=mh*ar;
      MERA.zerkalo=Math.round(mh); MERA.rost=1; MERA.cel=st.cel; MERA.t=+st.t.toFixed(3);
      MERA.navDolya=+(st.navDolya||0).toFixed(3); MERA.nad=!!st.nad; MERA.ring=!!st.ringOn;   // служебное // без ручки
      var mx=(W-mw)/2+fl.dx*mh, my=(H-mh)/2+fl.dy*mh;                  // сдвиг — долей высоты зеркала
      /* Проворот идёт и на шаге скролла (Сергей 08.09): закон один, разный

         ведётся сменой коллекции, а её даёт и рука, и колесо. В переходе из
         галереи спин не рисуется: там свой закон подмены. */
      var spinVid=P.spin&&!reduced&&KOLL.length&&(spinS>0.001||(P.spinSkroll&&t>=0.999));
      if(spinVid){
        /* СПИН (arqe spin01 на положении веера): показ — обложка ближайшей

           ребром, дальше видна уже следующая обложка. Рост — с кольцом. */
        var rostS=1+((st.cel===0?P.spinRostGal:P.spinRost)/100-1)*spinS, wS=mw*rostS, hS=mh*rostS;
        MERA.zerkalo=Math.round(hS); MERA.rost=+rostS.toFixed(3);   // служебное // без ручки

        /* ЛЮФТ: к ступенчатому углу добавлена доля его отставания от руки.

        var ugRuki=st.spinCelUg+(st.veer-st.spinKS)*180*naprS;

        var ugS=st.spinUg+otstS*(P.spinLyuft/100);
        var ikS=spinPokazan(), perevS=(Math.abs(Math.round(ugS*naprS/180))%2)===1;
        /* НА ПРОВОРОТЕ В ГАЛЕРЕЕ ЗЕРКАЛО ОСТАЁТСЯ ЗЕРКАЛОМ (Сергей 10.09: «оно
           на то и зеркало, что повторяет ту картинку, которая на фоне открыта
           как оригинал»). Проворот писался под каталог, где зеркало И ЕСТЬ
           обложка коллекции, и брал её напрямую. В галерее обложка приходит

        var tkS=(st.t<0.02&&tm)?tm:teksturaKoll(ikS), uvS=vyrezKoll(tkS,ar,0,1);

      } else {
      /* ЗАЛИВКА — ТОЛЬКО В КАТАЛОГЕ (Сергей 09.09: «с зеркала убери заливку

      /* Кадр вписывается в рамку вырезом — тем же приёмом, каким вписаны

      drawTex(tm,mx,my,mw,mh,1,vyrezKoll(tm,ar,0,1),t*zalNav);

      /* И ДЕРЖИТСЯ ДО ПРИХОДА КАТАЛОЖНОЙ. Обещание, данное под указателем,

      var oblDolya=(st.cel===0)?(st.navDolya||0):((st.oblNaUhode&&st.t<0.999)?1:0);

        var dlWh=Math.max(0.001,P.wipeDolya/100);
        var aW=zazhat01((t-(P.wipeNa/100-dlWh/2))/dlWh);
        if(a>0||(P.maskaVid==='wipe'&&aW>0)){
          /* МАСКА: рамка неподвижна, обложки едут внутри неё вслед за веером —

          var razom=P.szhatie>0&&!reduced;

          } else if(P.maskaVid==='wipe'){ /* см. ниже: полосы ведёт доля перехода */
            /* ВЫТЕСНЕНИЕ ПОЛОСАМИ (arqe «Wipe 02»). Старый кадр лежит целым,

               хода, а сама полоса проходит остаток.
               ПРОПОРЦИИ ДЕРЖАТСЯ ТЕМ, ЧТО ВЫРЕЗ И ПРЯМОУГОЛЬНИК РЕЖУТСЯ ОДНОЙ
               ДОЛЕЙ: полосе i достаётся i-я доля рамки и ровно i-я доля

               здесь нет — оттого кадр и не тянется. */
            /* Полосы ведёт ДОЛЯ ПЕРЕХОДА — та же `a`, что прежде проявляла

            var uvW=vyrezKoll(ta,ar,0,1);

            {
              for(var iW=0;iW<nW;iW++){

                } else {

              if(f>0.0005&&ib!==ia) drawTex(tb,mx,my,mw,mh,a*f,vyrezKoll(tb,ar,0,1),zalNav);

      if(st.ringOn&&P.krug&&N_K){

        if(st.cel===0){

          var ugT=dT*shagVT+P.krugUgol, auT=Math.abs(ugT-P.krugUgol);
          if(auT>=krayT) continue;                                          // за полукругом точки нет — как и имени
          /* РОСТ ВМЕСТО ГАШЕНИЯ: плотность у всех точек одна, а поперечник

          var krayD=zazhat01(P.tochkaKray/100);                              // размер у края — доля полного
          var rostT=krayD+(1-krayD)*evalEase(P.tochkaRostEase,P.tochkaRostBez,zazhat01(1-auT/krayT));
          /* ВЪЕЗД ПО ЛУЧУ — как у имён (Сергей 08.09): угол стоит, точка

          var eVT=dolyaVyezda(it,now,shagK);

          // зеркало по вертикальной оси: имена справа, точки слева

        }

          var tKms=vremyaTochki(st.ringNa), tK=tKms>0?(now-st.krestT0)/tKms:1;

            var kX=(P.osTychok&&st.osX!=null)?st.osX:ckx, kY=(P.osTychok&&st.osY!=null)?st.osY:cky;

            drawCol(kX-plK,kY-tlK/2,plK*2,tlK,colK,false);

      st.ramkaZ=[mx,my,mw,mh];

      var zerkPok=pokoyGalerei(hK);

      var rostYar=1+((st.cel===0?P.spinRostGal:P.spinRost)/100-1)*spinS;

    var uU=(st.cel===0)?(P.uhodYarlDo>0?zazhat01((1-t)/(P.uhodYarlDo/100)):((1-t)>0?1:0)):0;

    if(st.cel===0) ay=1-eU;                            // ay — плотность УХОДЯЩИХ

    var aSkvoz=1;

    var belizna=zazhat01(1-t);

    /* ПРИ СБОРКЕ СЛОЙ НЕ ПРЯЧЕМ. Плотность прихода ещё в нуле, и слой уходил

        var iGlav=((Math.round(st.veer)%N_K)+N_K)%N_K;
        var p0=derzhimLuchi?dolyaVyezda(iGlav,now,shagKr):0;
        var tochka=tochkaPok+((P.sovmeshenie?RkV:tochkaPok)-tochkaPok)*p0;
        var otstupV=(tochkaPok-RkV)*putVyezda();                         // отступ хода — общий на имена и точки, свой на приход и уход
        var topV=(gorY+mer.capNazv/2-mer.bazNazv).toFixed(1)+'px', osY=(mer.bazNazv-mer.capNazv/2).toFixed(2)+'px';
        for(var i=0;i<KOLL.length;i++){
          var d=i-st.veer; d=(((d+N_K/2)%N_K)+N_K)%N_K-N_K/2;             // кольцо: −N/2 … N/2
          var ug=d*shagV, au=Math.abs(ug), e=VEER[i];
          if(au>=kray){ e.style.display='none'; continue; }
          /* Приход у каждого имени свой — та же волна, что у точек. Угол при

             посадки, — и уходит наружу. В виде «все лучи» имена стоят всегда,
             и волна их не трогает. */
          var glav=Math.abs(ug)<shagV/2;
          /* Положение ведёт ход по лучу; в виде «все лучи» имена стоят
             всегда, и волна их не двигает. */
          var eV=(P.veerVid==='odin')?(derzhimLuchi?dolyaVyezda(i,now,shagKr):0):1;
          /* Прочие целятся туда, где стоит главное, и приходят к нему с
             общего отступа: закон тот же, что у точек, доля та же. */
          var tochkaI=tochka+(glav?0:otstupV*(1-eV));
          /* ПЛОТНОСТЬ — ПО ДОЛЕ ПОЛНОГО ВИДИМОГО ПУТИ, а не собственного хода

             Весь путь имени — от радиуса кольца до посадки плюс свой вынос;
             пройденное берётся у ЖИВОГО положения, поэтому доля означает ровно
             то, что видно в кадре, при любой кривой и любом времени хода. */
          var polnPut=(tochkaPok-RkV)+(glav?0:otstupV);
          var ostatok=Math.abs(polnPut)>0.01?zazhat01((tochkaI-RkV)/polnPut):(st.ringNa?0:1);
          var proydenoI=st.ringNa?1-ostatok:ostatok;
          var prihod=(P.veerVid==='odin')?(derzhimLuchi?zazhat01(plotnostPoPuti(proydenoI)):0):1;
          var pl;
          if(odin) pl=1-evalEase(P.gasheniyeEase,P.gasheniyeBez,Math.min(1,au/(shagV/2)));
          else {
            /* Две ступени одной кривой: от главного (1) к первому соседу
               (1 − приглушение) на первом шаге, от соседа к краю (плотность
               на краю) на остатке до 90°. Ступени стыкуются в соседе — ход
               непрерывен, кружение не даёт скачка плотности. */
            var plS=1-P.priglSoseda/100, plK=P.plotKraya/100;
            if(au<=shagV) pl=1-(1-plS)*evalEase(P.gasheniyeEase,P.gasheniyeBez,au/shagV);
            else pl=plS-(plS-plK)*evalEase(P.gasheniyeEase,P.gasheniyeBez,zazhat01((au-shagV)/Math.max(1,90-shagV)));

          }
          // главный луч всегда в полную силу, соседние приходят вместе с кругом

          var wI=(mer.shirVeer&&mer.shirVeer[i])||mer.shirNazv;

          e.style.width=''; e.style.left=(W/2+otstup).toFixed(1)+'px'; e.style.top=topV;

           другого. Ширина номера меряется по узлу — оси шрифта учтены. */
        if(P.nomerKoll&&mer.shirKoll!=null){

          var otsG=vyk==='left'?0:vyk==='right'?tochka-wG:tochka/2-wG/2;

          var wVs=mer.shirVsego||0;

      /* ПОДСКАЗКИ ЗЕРКАЛЬНО ГОРИЗОНТУ: одна выше, другая ниже на том же

      var otstG=H*P.podskazkaOtstup/100, gorL=H*P.gorizont/100;
      var otstNizh=Math.max(otstG,(nizh+zz+P.keglMetki/2)-gorL);
      podsEl.style.left=(W/2).toFixed(1)+'px'; podsEl.style.top=(gorL-otstNizh).toFixed(1)+'px';
      podsNizEl.style.left=(W/2).toFixed(1)+'px';
      var podsT=gorL+otstNizh; podsNizEl.style.top=podsT.toFixed(1)+'px';
      // базовая линия НИЖНЕЙ подсказки: от неё живут иконки каналов
      var podsBaza=podsT-mer.vysPods/2+mer.bazPods;
      // метки — прежним законом, от колонки контента; в новой композиции скрыты ручкой
      metkiEl.style.left=kL.toFixed(1)+'px'; metkiEl.style.top=zz.toFixed(1)+'px';
      /* ── ЛЕВАЯ КОЛОНКА (макет 4041:44319) ──
         Линия выводится ИЗ СЕТКИ, а не ставится долей: логотипы прижаты к левой
         линии второй колонки пятиколонника, и меняя число колонок или межколонник,
         дизайнер двигает всю колонку разом. Проверка на макете: (2558+42)/5 = 520. */
      var linia=(W+W*P.mezhkolonnik/100)/Math.max(1,P.kolonok);
      /* ЛОГОТИПЫ ПОМЕНЯЛИСЬ МЕСТАМИ (макет 4067:44610 и 4047:44530, 09.09).
         Сверху встал новый знак — он и держит колонку; словесный знак ушёл
         вниз, а колесо уменьшилось и отошло от него вправо. Все трое стоят на
         одной левой линии второй колонки — кроме колеса, которое считается от
         правой кромки словесного: они читаются одной строкой. */
      var znakW=P.znakRazmer*(44/21.2676);                 // ширина знака из пропорции его вьюбокса
      logoVerhEl.style.left=linia.toFixed(1)+'px';
      logoVerhEl.style.top=(H*P.poleZnaka/100).toFixed(1)+'px';
      /* Словесный знак — низом на той же линии, что и колесо: две вещи разной
         природы садятся на одну кромку, как ® садился на базовую линию (П8). */
      var nizStroki=H-H*P.poleLogo/100;
      var znakB=nizStroki, znakT=znakB-P.znakRazmer;
      znakEl.style.left=linia.toFixed(1)+'px'; znakEl.style.top=znakT.toFixed(1)+'px';
      // подпись «design workshop. russia» снята целиком по просьбе Сергея 08.09
      /* ® — СЛЕВА от знака, правым краем на отбивке от его левой кромки, и
         базовой линией на его нижней кромке. Рифма та же, что у подписи справа:
         три вещи разной природы садятся на одну линию (П8). */
      znakR.style.left=(linia-P.znakRvlevo).toFixed(1)+'px';
      znakR.style.top=(znakB+P.znakRsdvig-mer.bazZnakR).toFixed(1)+'px';
      /* КОЛЕСО — СЕРЕДИНОЙ НА СЕРЕДИНЕ ЗНАКА (Сергей 09.09: «оба логотипа
         должны рифмоваться по центру»). Нижняя кромка их не рифмовала: у знака
         и колеса разные высоты, и по низу они читались как сбитые. У буквенной
         вещи опорой служит базовая линия (П8), у бессловесной её нет — остаётся
         середина. Знак держит нижнюю кромку строки, колесо держится за знак. */
      /* Плюс оптический подъём: середина коробки и середина того, что видит
         глаз, у колеса не совпадают — лопасти набегают книзу. Геометрию правит
         рифма, глаз — эта ручка; смешивать их в одном числе нельзя. */
      var logoT=znakT+P.znakRazmer/2-P.logoRazmer/2-P.logoPodyom, logoB=logoT+P.logoRazmer;
      logoNizEl.style.left=(linia+znakW+P.logoOtbivka).toFixed(1)+'px'; logoNizEl.style.top=logoT.toFixed(1)+'px';
      /* ПОВОРОТ ЛОГОТИПА — от положения веера: всегда — прямо из st.veer,
         в кружении — накопленный угол от руки плюс досадка после отпускания. */
      var ugLogo=0;
      if(P.logoVrash==='vsegda') ugLogo=st.veer*(P.logoObratno?-1:1)*(P.logoPeredacha/100)*Math.max(1,P.shagVeera);
      else if(P.logoVrash==='kruzhenie') ugLogo=st.logoUg;                 // угол копится от руки в vestiKruzhenie
      /* ОСЬ — ЦЕНТР СИММЕТРИИ ЗНАКА, не центр коробки: коробка обрезана по
         стрелкам, и её середина сидит на 2 % левее и 3 % выше центра
         пятиугольной контрформы — знак болтался (поймано 08.09). Числа —
         замер: центроид заливки при 1040 px; самосовпадение при повороте на
         72° вокруг него 97,7 %, вокруг центра коробки 71,6 %. // без ручки */
      logoNizEl.style.transformOrigin='47.96% 53.02%';
      /* ЗЕРКАЛО КОЛЕСА (Сергей 09.09). Отражение идёт ПОСЛЕ поворота и вокруг
         той же оси симметрии, что и поворот: сперва знак встаёт на свой угол,

         и центр не съезжают. Порядок обратный дал бы поворот в другую сторону
         вокруг отражённой оси, и знак бы гулял. */
      var trLogo=(ugLogo?('rotate('+ugLogo.toFixed(2)+'deg)'):'')+(P.logoZerkalo?' scaleX(-1)':'');
      logoNizEl.style.transform=trLogo.trim();
      // ДАТА — верх капители первой строки на отбивке от нижней кромки логотипа
      dataEl.style.left=linia.toFixed(1)+'px';
      dataEl.style.top=(logoB+P.dataOtbivka+mer.capMetki-mer.bazData).toFixed(1)+'px';
      /* ИКОНКИ КАНАЛОВ — столбик у левого края экрана, своей мерой по горизонтали.

      kanalyEl.style.display=''; kanalyEl.style.visibility='visible';   // место и размер уже посчитаны
      kanalyEl.style.left=(W*P.poleIkonok/100).toFixed(1)+'px';
      kanalyEl.style.top=(podsBaza+P.otbivkaIkonok).toFixed(1)+'px';

      kanalyEl.style.opacity=aSkvoz.toFixed(3);

      kanalyEl.style.pointerEvents=aSkvoz>0.5?'auto':'none';   // полупрозрачную кнопку нажимать нельзя
    }

    // КУРСОР: место — пружина догона; поворот дуги и усов — по осям экрана, каждый своей пружиной
    if(P.kursor){
      var sdtK=dt;
      if(P.kursorDogon[0]>0 && st.kursNaSczene){

        st.kursVX+=((st.kursCelX-st.kursX)*wK*wK - st.kursVX*2*zt*wK)*sdtK;
        st.kursVY+=((st.kursCelY-st.kursY)*wK*wK - st.kursVY*2*zt*wK)*sdtK;
        st.kursX+=st.kursVX*sdtK; st.kursY+=st.kursVY*sdtK;

      /* ЗАНЯТОСТЬ ДУГОЙ. Цель — от тишины после последнего события колеса:
         тишина короче доли «в нуле» — цель ноль; дальше цель отрастает по
         кривой и полна ровно тогда, когда разрыв дотянул до порога и жест
         снова считается. Пока рука крутит, тишины нет — цель в нуле без
         сбросов. Показ догоняет цель формой 1−exp: на шаге дуга садится с

      /* ЗАНЯТОСТЬ = ХОД ВЕЕРА. Дуга проходит цикл ровно за ход: сжатие в ноль

         полна, и колесо снова принимает шаг. Сбросов нет: ход один, начатый

      var celDugi=1, ubyvaet=false;

        var ms=Math.max(1,st.dosadka.ms), t=Math.max(0,now-st.dosadka.t0);

        ubyvaet=t<tSzh+tPau;
        if(t<tSzh) celDugi=1-evalEase(P.blokSzhatieEase,P.blokSzhatieBez,tSzh>0?t/tSzh:1);

      st.dugaDolya=celDugi;
      // опора фазы: убывание держит Б, возврат — А; тумблер направления меняет обе местами
      /* ВЫХОД ИЗ КОМПАСА — ОЧЕРЕДЬЮ, А НЕ ОБРАТНЫМ ХОДОМ (Сергей 09.09).
         На отпускании компас стоит на оси, а указатель уже в другом месте:
         бесшовный возврат заставил бы штрихи переезжать через весь экран, и
         это читалось бы как отдельное движение. Бесшовность рвётся нарочно:
         сперва штрихи укорачиваются в ноль ТАМ ЖЕ, на оси; когда смотреть уже
         не на что — иконка переносится под указатель; и оттуда усы отрастают,
         дуга растёт, точка возвращается. Две фазы, у каждой своё время и своя
         кривая (П9), порядок держит очередь: вторая начинает, когда первая

      if(st.kurFaza==='uhod'){
        var uhK=P.kursorUhodMs>0?zazhat01((now-st.kurT0)/P.kursorUhodMs):1;
        st.kurUs=1-evalEase(P.kursorUhodEase,P.kursorUhodBez,uhK);

      } else if(st.kurFaza==='prihod'){

        if(prK>=1){ st.kurFaza='net'; st.kurUs=1; }
      } else {
        /* УХОД В ПАЛЕЦ (Сергей 09.09). Над зеркалом и над кнопками каналов своя

         Ход свой, со своим временем и кривой, и разворачивается с любого места
         (П9): ушёл наполовину и вернулся — идёт обратно оттуда же. */
      /* Палец держится и на нажатии — это НЕ спор законов (Сергей 09.09).
         Над зеркалом палец обещает клик, а клик уводит в галерею; кружение

         законам просто негде столкнуться: у каждого своё место на экране. */
      var celPalec=(P.palec&&(st.nad||st.nadKanal))?1:0;
      if(celPalec!==st.palecCel){

      }
      var uPl=P.palecMs>0?zazhat01((now-st.palecT0)/P.palecMs):1;
      var ePl=reduced?1:evalEase(P.palecEase,P.palecBez,uPl);
      st.palecDolya=st.palecCel?ePl:1-ePl;
      /* Доля перестроения — та же, что РАСТИТ зеркало, и только она.
           Схождение сюда не идёт: очередь выхода уже отыграла, а доля ещё
           падает, и компас возвращался на кадр под указателем (поймано
           замером 09.09: «штрихов 7» на 495 мс после отпускания). */
        st.kruzhKurs=(P.kursorKruzh&&st.spinNa)?zazhat01(st.spinDolya||0):0;
        st.kurUs=1;
      }
      /* Убывание дуги всегда одной опорой: перестроение идёт в одну сторону. */
      /* Одна мера длины на оба ухода: очередь выхода из компаса и уход в
         палец множатся, а не спорят. Кто из них ближе к нулю, тот и правит. */
      var duKur=st.kurUs*(1-st.palecDolya);
      sobratKursor(st.dugaDolya,st.kruzhKurs>0.0005?'B':((ubyvaet!==!!P.dugaNazad)?'B':'A'),st.kruzhKurs,duKur);
      var kk=100/Math.max(2,st.kursGab||100);
      kurT.setAttribute('r',((P.kursorTochkaR/2)*kk*(1-st.kruzhKurs)*duKur).toFixed(2));
      /* СИСТЕМНАЯ РУКА НА ВРЕМЯ КРУЖЕНИЯ (Сергей 09.09): своя иконка стала
         компасом на оси, а под указателем — классический хват драга. */
      var kurStil=(st.kruzhKurs>0.02&&st.derzhim)?'grabbing'
                 :(st.palecDolya>0.5?'pointer':(P.kursor?'none':''));
      if(kurStil!==kurStilKesh){ cv.style.cursor=kurStil; kurStilKesh=kurStil; }
      // цвет — своей ручкой; в разности ставится обратным, как у ярлыков
      /* В ГАЛЕРЕЕ КУРСОР БЕЛЕЕТ (Сергей 09.09: «он до сих пор красный»).
         Ведёт та же доля, что фон и сквозные ярлыки: на чёрном поле красная
         иконка остаётся фирменным пятном каталога, которому там не место. */
      /* Курсор белеет той же долей, что сквозные: одна величина на всё, что
         меняет цвет вместе с фоном. */
      var kc=cvetSPlotDolya(P.cvetKursora,P.cvetGalerei,st.belizna||0,P.kursorPlot);
      if(kc!==kcKesh){ kurD.setAttribute('stroke',kc); kurS.setAttribute('stroke',kc); kurT.setAttribute('fill',kc); kcKesh=kc; }
      // угол берётся от настоящего указателя, а не от места иконки: иконка отстаёт по пружине
      var dD=dolyaOsi(P.kursorDugaOt);   if(P.kursorDugaNazad)   dD=1-dD;

      dD=evalEase(P.kursorDugaEase,  P.kursorDugaBez,  zazhat01(dD));   // передаточная кривая, не временная

      /* ОСЬ ЖДЁТ ЗАНЯТОСТЬ. Пока дуга не полна — идёт сжатие, проворот или
         отрастание — осевой поворот замирает вместе со своей скоростью, чтобы
         пружина не накапливала ход впустую; дуга полна — ось догоняет цель
         пружиной с пределом, как всегда. */
      var zanyato=P.osZhdet&&(celDugi<1||st.dugaDolya<0.995);
      if(zanyato&&st.ugD!==null){ st.vD=0; }
      else { var rD=vestiUgol(st.ugD,st.vD,360*P.kursorOborotovY*dD,P.kursorDugaPruzh,  P.kursorDugaPredel,  sdtK); st.ugD=rD[0]; st.vD=rD[1]; }
      kurD.setAttribute('transform','rotate('+st.ugD.toFixed(1)+' 50 50)');
      /* ПОВОРОТ УСОВ ВЕРНУЛСЯ, как в галерее M7 (Сергей 09.09: «у нас это уже
         было, но мы отключили»). Усы — вторая стрелка на том же циферблате:
         дуга считает свою ось, усы свою, у каждой своё передаточное число,
         своя кривая и своя пружина. Одно кольцо провёрнутости не показывает —
         усы показывают.
         Отсчёт от КОЛЛЕКЦИИ — здешний ответ галерейному «от кадра»: усы
         смотрят туда же, куда штрихи компаса, и считаются от того же st.veer
         тем же полным кругом на все коллекции.
         В кружении поворот гаснет долей перестроения: там усы уже не усы, а
         веер, и его углы построены в самом пути — вторая крутка их бы сбила. */
      var dL=dolyaOsi(P.kursorLiniyaOt==='X'?'X':'Y'); if(P.kursorLiniyaNazad) dL=1-dL;
      dL=evalEase(P.kursorLiniyaEase,P.kursorLiniyaBez,zazhat01(dL));
      /* Усы отсчитываются от того же, что и штрихи компаса: в каталоге от
         коллекции, в галерее от кадра ленты. Одна стрелка на один циферблат. */
      var celL=(P.kursorLiniyaOt==='koll'&&N_K)
        ? ((st.cel===0?(st.rib||0):(st.veer||0))*360/Math.max(2,N_K))
        : 360*P.kursorOborotovX*dL;
      var rL=vestiUgol(st.ugL,st.vL,celL,P.kursorLiniyaPruzh,P.kursorLiniyaPredel,sdtK); st.ugL=rL[0]; st.vL=rL[1];
      kurS.setAttribute('transform','rotate('+(st.ugL*(1-st.kruzhKurs)).toFixed(1)+' 50 50)');
    }
    cv.classList.toggle('palec',!!(P.palec&&st.nad));
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
