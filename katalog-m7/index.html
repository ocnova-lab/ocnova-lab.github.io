  /* ============================================================
     КАТАЛОГ M7 — вид коллекции и бесшовный переход в него из галереи.
     Отдельный стенд на тех же файлах данных, что «Галерея M7»; при
     склейке подключается в неё модулем, носитель выбрасывается.

     Смотрит: на окно (ширина и высота) и на долю перехода t.
     Реагирует: плавно, переломов нет — теснота считается законом в коде.
     Законы: 3б «Коридор» — высота обложки как доля высоты окна; пропорция
             рамки от кадра и не правится, размер — ручкой;
             строка курсора — палец над зеркалом и обложкой (одно место);
             П9 — переход как очередь фаз со своими долями хода.

     СЛОИ (снизу вверх): фон → оригинал-шторка → зеркало/обложка (холст)
     → ярлыки (DOM над холстом). Курсор системный: палец над зеркалом.

     ПЕРЕХОД (t: 0 галерея → 1 каталог) по замыслу Сергея (07.09):
       клик по зеркалу → всё, кроме зеркала, уходит;
       1) фон чёрный → белый; оригинал закрывается ШТОРКОЙ — ширина к
          нулю относительно своей вертикальной оси (обрезом или сжатием);
       2) зеркало РАСТЁТ по центру от размера покоя галереи до обложки;
          рамка не меняет пропорции — только размер; на доле подмены кадр
          в зеркале сменяется обложкой коллекции (склейка плотностью);
       3) ЯРЛЫКИ приходят после зеркала: номер, название, описание,
          метки, знак, подсказка — одной плотностью.
       Обратно — своим временем и своей кривой. Разворот с любого места:
       новый ход стартует с текущей доли, длится долей пути.

     ГЕОМЕТРИЯ КАТАЛОГА — от рамки обложки и одного ЗАЗОРА (доля высоты окна):
       номер: базовая линия на верхней кромке обложки, правый край на
              зазор левее левой кромки; в тесноте — над обложкой, от её
              левой кромки;
       название: середина капители на середине обложки, центр правее
              центра окна на долю ширины; в тесноте — под описанием;
       описание: под обложкой на зазор, ширина — доля ширины окна, но не
              уже обложки, по центру;
       подсказка «scroll»: центр, на доле высоты окна;
       метки: колонка контента (доля ширины окна, по центру), верх на
              зазор; знак и ® — низ на зазор.
       Числа сняты с макета «for vibe code», узел 4031:44228 (2534×1440).
       Базовая линия — щупом (П8), капитель — замером «H»: раз на смену
       гарнитуры и кегля, не в кадре.

     ПРИЁМЫ: ◌ «Инверсия по подложке» — ярлыки белые в режиме разности:
             чёрные на белом поле, белые поверх кадра (кандидат, первый
             прецедент); «Разворот с любого места» — из галереи M7.

     Параметры адреса: ?stop=мс — стоп-кадр: часы замирают на отметке от
     старта хода в каталог (0 — галерея, больше входа — каталог);
     ?reset=1, ?theme=nothing, ?panel.
     Память: localStorage['katalog-m7-params'].
     ============================================================ */

  html,body{height:100%;margin:0;background:#000;overflow:hidden}
  #gl{position:fixed;inset:0;width:100vw;height:100dvh;display:block;touch-action:none}
  #gl.palec{cursor:pointer}                 /* палец над зеркалом — строка курсора */
  /* Ярлыки — прямые дети тела страницы, без обёртки: любая обёртка с
     position или z-index — отдельная группа наложения, и режим разности
     смешивал бы текст с пустотой внутри неё, а не с холстом (поймано
     прогоном 07.09: белые ярлыки пропали на белом поле). */
  .yar{position:fixed;z-index:40;margin:0;white-space:nowrap;line-height:1;pointer-events:none}
  /* Инверсия по подложке: в режиме разности цвет ставится обратным заданному
     (скрипт), и на белом поле выходит заданный, поверх кадра — обратный. */
  body.inv .yar{mix-blend-mode:difference}
  #nomer{transform:translate(-100%,0)}      /* правый край — на левом ребре опоры */
  #nazvanie{transform:translate(-50%,0)}
  /* Имя коллекции в веере: поле от центра окна вправо, выключка по центру;
     поворот вокруг центра окна — ось поворота ставит скрипт по базовой линии. */
  .veer{text-align:left;transform-origin:0 50%}   /* левый край и ось поворота ставит скрипт: посадка и выключка */
  #opisanie{white-space:normal;text-align:center;text-transform:uppercase;transform:translate(-50%,0)}
  #podskazka{transform:translate(-50%,-50%);text-transform:uppercase}
  #metki{display:flex;text-transform:uppercase}
  #metki p{margin:0}
  .znak{display:flex;align-items:flex-start}
  .znak svg{display:block;height:100%;width:auto}
  /* Свой курсор — перенос из галереи M7: кольцо с разрывом, точка в центре,
     два уса по оси. DOM поверх сцены, над ярлыками; координаты от указателя. */
  .kursor{position:fixed;left:0;top:0;z-index:45;pointer-events:none;display:none;
          transform:translate(-50%,-50%);will-change:transform}
  .kursor svg{display:block;overflow:visible}
  .nogl{font:14px/1.5 -apple-system,system-ui,sans-serif;color:#fff;padding:2em}  /* служебное // без ручки */

/* ── КРИВЫЕ (для органа «кривая» и для стенда — одни и те же) ────── */
var EASES = {
  'линейный':   function (t) { return t; },
  'разгон':     function (t) { return t * t * t; },
  'торможение': function (t) { return 1 - Math.pow(1 - t, 3); },
  'плавный':    function (t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; },
  'выброс':     function (t) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};
var BEZ_APPROX = {
  'линейный':   [0.25, 0.25, 0.75, 0.75], 'разгон': [0.32, 0, 0.67, 0],
  'торможение': [0.33, 1, 0.68, 1], 'плавный': [0.65, 0, 0.35, 1],
  'выброс':     [0.34, 1.56, 0.64, 1],
};
function cubicBezierY(b, t) {
  var x1 = b[0], y1 = b[1], x2 = b[2], y2 = b[3], s = t;
  for (var i = 0; i < 8; i++) {
    var x = 3 * (1 - s) * (1 - s) * s * x1 + 3 * (1 - s) * s * s * x2 + s * s * s;
    var dx = 3 * (1 - s) * (1 - s) * x1 + 6 * (1 - s) * s * (x2 - x1) + 3 * s * s * (1 - x2);
    if (Math.abs(dx) < 1e-6) break;
    s -= (x - t) / dx; if (s < 0) s = 0; if (s > 1) s = 1;
  }
  return 3 * (1 - s) * (1 - s) * s * y1 + 3 * (1 - s) * s * s * y2 + s * s * s;
}
function evalEase(name, bez, t) {
  if (name === 'bezier') return cubicBezierY(bez, t);
  return (EASES[name] || EASES['линейный'])(t);
}

  /* ── шейдеры: квад в px с окном текстуры uUV (для шторки и обрезки обложки) ── */
  function sh(t,src){ var s=gl.createShader(t); gl.shaderSource(s,src); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
  function prog(fs){ var p=gl.createProgram();
    p._vs=sh(gl.VERTEX_SHADER,"attribute vec2 aPos;uniform vec4 uRect;uniform vec4 uUV;uniform vec2 uView;varying vec2 vUV;void main(){vUV=uUV.xy+aPos*uUV.zw;vec2 p=uRect.xy+aPos*uRect.zw;gl_Position=vec4(p.x/uView.x*2.0-1.0,1.0-p.y/uView.y*2.0,0.0,1.0);}");
    gl.attachShader(p,p._vs); gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(p);
    if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    p.uRect=gl.getUniformLocation(p,"uRect"); p.uUV=gl.getUniformLocation(p,"uUV"); p.uView=gl.getUniformLocation(p,"uView"); return p; }
  var pTex=prog("precision mediump float;varying vec2 vUV;uniform sampler2D uTex;uniform float uAlpha;void main(){vec4 c=texture2D(uTex,vUV);gl_FragColor=vec4(c.rgb,c.a*uAlpha);}");
  pTex.uAlpha=gl.getUniformLocation(pTex,"uAlpha");
  var quad=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,quad);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,0,1,0,0,1,1,1]),gl.STATIC_DRAW);
  function bindQuad(p){ var loc=gl.getAttribLocation(p,"aPos"); gl.bindBuffer(gl.ARRAY_BUFFER,quad); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0); }
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);

  /* ── текстуры по требованию: только кадр зеркала и обложка, не вся съёмка ── */
  var TEKS={};
  function tekstura(ph){
    if(TEKS[ph.id]) return TEKS[ph.id];
    var o={tex:gl.createTexture(),ready:false,w:ph.w,h:ph.h};
    var img=new Image();
    img.onload=function(){
      gl.bindTexture(gl.TEXTURE_2D,o.tex);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      if(GL2){ gl.generateMipmap(gl.TEXTURE_2D); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR); }
      else     gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
      if(ANIZ) gl.texParameterf(gl.TEXTURE_2D,ANIZ.TEXTURE_MAX_ANISOTROPY_EXT,Math.min(8,ANIZ_MAX));
      o.ready=true;
    };
    img.src=ph.d; TEKS[ph.id]=o; return o;
  }
  function drawTex(t,x,y,w,h,alpha,uv){
    if(!t.ready) return;                                     // до загрузки кадра нет — фон и есть плейсхолдер
    uv=uv||[0,0,1,1];
    gl.useProgram(pTex); bindQuad(pTex);
    gl.uniform2f(pTex.uView,W,H); gl.uniform4f(pTex.uRect,x,y,w,h); gl.uniform4f(pTex.uUV,uv[0],uv[1],uv[2],uv[3]);
    gl.uniform1f(pTex.uAlpha,alpha==null?1:alpha);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,t.tex);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }

  /* ── данные сцены: кадр зеркала и коллекция ── */
  function kadrZerkala(){
    var sy=SYOMKI[P.syomka]||SYOMKI[KLYUCHI_SYOMOK[0]]; if(!sy||!sy.kadry.length) return null;
    var i=Math.max(0,Math.min(sy.kadry.length-1,Math.round(P.kadr)-1));
    return sy.kadry[i];
  }
  function kollekciya(){ return KOLL[Math.max(0,Math.min(KOLL.length-1,+P.kollekciya||0))]||null; }

  /* ── ярлыки ── */
  var nomEl=document.getElementById('nomer'), nazvEl=document.getElementById('nazvanie'), opisEl=document.getElementById('opisanie');
  var podsEl=document.getElementById('podskazka'), metkiEl=document.getElementById('metki'), znakEl=document.getElementById('znak'), znakR=document.getElementById('znakR');
  var YAR=[nomEl,nazvEl,opisEl,podsEl,metkiEl,znakEl];                   // слой ярлыков — список, не обёртка
  /* ВЕЕР: по имени на коллекцию, каждое — своё поле, повёрнутое вокруг центра окна. */
  var VEER=KOLL.map(function(k){ var e=document.createElement('p'); e.className='yar veer'; e.textContent=k.imya; document.body.appendChild(e); return e; });
  var N_K=KOLL.length||1;
  var kurEl=document.getElementById("kursor"), kurD=document.getElementById("kursorDuga"),
      kurS=document.getElementById("kursorUsy"), kurT=document.getElementById("kursorTochka");
  var KUR_SIST=100;                                           // система координат иконки // без ручки
  var gabBylo=-1, tolschBylo='', kcKesh='';                   // что уже записано в DOM // без ручки
  function teksturaKoll(i){ var k=KOLL[i]; return tekstura({id:'kol'+i,w:k.w,h:k.h,d:k.oblozhka}); }
  // окно текстуры обложки: обрез под пропорцию рамки плюс горизонтальная полоса [r0, r1] по высоте рамки
  function vyrezKoll(to,ar,r0,r1){ var A=to.w/to.h, uv=A>ar?[(1-ar/A)/2,0,ar/A,1]:[0,(1-A/ar)/2,1,A/ar]; return [uv[0],uv[1]+uv[3]*r0,uv[2],uv[3]*(r1-r0)]; }
  var kanva=document.createElement('canvas').getContext('2d');
  var mer={ bazNomer:0, capNomer:0, shirNomer:0, bazNazv:0, capNazv:0, shirNazv:0, opisH:0 };   // замеры — раз на смену гарнитуры/кегля/ширины, не в кадре

  /* Базовая линия щупом (П8): нулевой строчный блок на базовой линии
     показывает, где она проходит внутри строки выбранной гарнитуры. */
  function bazovaya(el){
    var i=document.createElement('i'); i.style.cssText='display:inline-block;width:0;height:0;vertical-align:baseline';
    el.insertBefore(i,el.firstChild);
    var b=i.getBoundingClientRect().top-el.getBoundingClientRect().top;
    el.removeChild(i); return b;
  }
  function shirinaTeksta(tekst,garn,kegl,razr){
    kanva.font=kegl+'px "'+garn+'"';
    return kanva.measureText(tekst).width+tekst.length*razr;
  }
  function kapitel(garn,kegl){ kanva.font=kegl+'px "'+garn+'"'; var m=kanva.measureText('H'); return m.actualBoundingBoxAscent||kegl*0.7; }
  function shrift(el,garn,kegl,razr,lh){
    el.style.fontFamily='"'+garn+'", ui-monospace, monospace';
    el.style.fontSize=kegl+'px'; el.style.letterSpacing=razr.toFixed(2)+'px';
    el.style.lineHeight=lh==null?'1':(lh/100).toString();
  }

  var W=0,H=0,DPR=1;
  /* Тексты главной коллекции — той, что на оси веера; замер ширин — на смену, не в кадре. */
  function postavitTeksty(){
    var kol=KOLL[st.tek]||null;
    nomEl.textContent=kol?pad3(kol.kadrov):''; nazvEl.textContent=kol?kol.imya:''; opisEl.textContent=kol?kol.opisanie:'';   // номер — сколько кадров в коллекции
    var rzN=P.keglNomer*P.razryadkaNomer/100, rzZ=P.keglNomer*P.razryadkaNazv/100;
    mer.shirNomer=shirinaTeksta(nomEl.textContent,P.garnituraNomer,P.keglNomer,rzN);
    mer.shirNazv=shirinaTeksta(nazvEl.textContent,P.garnituraNomer,P.keglNomer,rzZ);
    mer.opisH=opisEl.getBoundingClientRect().height;
  }
  function primenit(){
    var rzN=P.keglNomer*P.razryadkaNomer/100, rzZ=P.keglNomer*P.razryadkaNazv/100, rzM=P.keglMetki*P.razryadkaMetki/100;
    shrift(nomEl,P.garnituraNomer,P.keglNomer,rzN);
    shrift(nazvEl,P.garnituraNomer,P.keglNomer,rzZ);
    VEER.forEach(function(e){ shrift(e,P.garnituraNomer,P.keglNomer,rzZ); });
    shrift(opisEl,P.garnituraMetki,P.keglMetki,rzM,P.interlinyazh);
    shrift(podsEl,P.garnituraMetki,P.keglMetki,rzM);
    shrift(metkiEl,P.garnituraMetki,P.keglMetki,rzM,P.interlinyazh);
    shrift(znakR,P.garnituraMetki,P.keglMetki,rzM);
    document.body.classList.toggle('inv',!!P.inversiya);
    var cT=P.inversiya?obratnyyCvet(P.cvetTeksta):P.cvetTeksta;        // разность: обратный цвет даёт заданный на белом
    YAR.concat(VEER).forEach(function(e){ e.style.color=cT; });
    znakEl.querySelectorAll('path').forEach(function(pt){ pt.setAttribute('fill',cT); });
    var zz=H*P.zazor/100;
    metkiEl.style.gap=zz.toFixed(1)+'px';
    znakEl.style.height=(P.keglMetki*1.52).toFixed(1)+'px';        // знак: 21,3 на 14 в макете — доля кегля меток
    znakEl.style.gap=(P.keglMetki*0.5).toFixed(1)+'px';
    opisEl.style.width=Math.max(W*P.shirinaOpis/100, st.ramkaZ[2]||0).toFixed(1)+'px';
    // замеры (П8) — в том же окружении, что набор; раз на правку, не в кадре
    YAR.forEach(function(e){ e.style.display=''; });                  // показ по CSS: у меток и знака — флекс
    mer.bazNomer=bazovaya(nomEl); mer.bazNazv=bazovaya(nazvEl);
    mer.capNomer=kapitel(P.garnituraNomer,P.keglNomer); mer.capNazv=mer.capNomer;
    postavitTeksty();
    tekstura(kadrZerkala()||{id:'net',w:1,h:1,d:''});
    KOLL.forEach(function(k,i){ teksturaKoll(i); });                     // обложки все: веер крутится, ждать нельзя
    kursorVidim();
  }

  /* ── состояние перехода ── */
  var st={ t:0, cel:0, ot:0, t0:-1, ms:0, ease:'линейный', bez:null, ramkaZ:[0,0,0,0], nad:false,
           tek:-1,               // коллекция на оси — её номер, описание и обложка
           veer:0, veerCel:0,    // положение веера в коллекциях: показ и цель за скроллом
           skrollT:-1e9,         // когда скролл последний раз двигал цель
           dosadka:null,         // ход досадки: {ot, do, t0, ms}
           zhest:0, zhestSdelan:false,     // накопленный скролл текущего жеста и сделан ли в нём шаг
           kursNaSczene:false,             // свой курсор на сцене
           kursX:0, kursY:0, kursCelX:0, kursCelY:0,   // где иконка и где указатель: между ними отставание
           kursVX:0, kursVY:0,             // скорость догона — у пружины она своя величина
           ugD:null, vD:0, ugL:null, vL:0, // угол и скорость поворота: дуга и линия, каждая своя
           kursGab:100,
           nab:null,                       // ход пересборки: {t0, ms, seed, otN, otO, doN, doO}
           pokazNomer:'', pokazOpis:'' };  // что сейчас стоит в номере и описании
  var kollKesh=P.kollekciya;
  function sverkaVeera(){ if(P.kollekciya!==kollKesh){ kollKesh=P.kollekciya; st.veer=st.veerCel=+P.kollekciya||0; st.dosadka=null; } }

  /* ── КУРСОР (перенос из галереи M7) ── */
  /* Иконка рисуется в своей системе 100×100 и наружу масштабируется
     шириной, поэтому толщина линии переводится в ту же систему. */
  function sobratKursor(){
    var pol=P.kursorKolco/2+P.kursorZazor+P.kursorUs;         // половина габарита
    var GAB=Math.max(2,pol*2), k=KUR_SIST/GAB;                // px → система иконки
    if(GAB!==gabBylo){ kurEl.style.width=GAB+"px"; kurEl.style.height=GAB+"px"; gabBylo=GAB; }
    st.kursGab=GAB;
    var R=(P.kursorKolco/2)*k, duga=Math.max(0,Math.min(360,P.kursorDuga));
    function na(gr){ var r=gr*Math.PI/180; return [50+R*Math.cos(r), 50+R*Math.sin(r)]; }
    var rr=R.toFixed(2);
    if(duga<=0.5) kurD.setAttribute("d","");
    else if(duga>=360) kurD.setAttribute("d","M"+(50-R).toFixed(2)+",50 A"+rr+","+rr+" 0 1 1 "+(50+R).toFixed(2)+",50 A"+rr+","+rr+" 0 1 1 "+(50-R).toFixed(2)+",50");
    else { var p0=na(-90), p1=na(-90-duga);
      kurD.setAttribute("d","M"+p0[0].toFixed(2)+","+p0[1].toFixed(2)+" A"+rr+","+rr+" 0 "+(duga>180?1:0)+" 0 "+p1[0].toFixed(2)+","+p1[1].toFixed(2)); }
    var u0=(P.kursorKolco/2+P.kursorZazor)*k, us=P.kursorUs*k;
    kurS.setAttribute("d", us<=0.2 ? "" :
      "M"+(50-u0-us).toFixed(2)+",50H"+(50-u0).toFixed(2)+
      "M"+(50+u0).toFixed(2)+",50H"+(50+u0+us).toFixed(2));
    var tolsch=(P.kursorTolsch*k).toFixed(2);
    if(tolsch!==tolschBylo){ kurD.setAttribute("stroke-width",tolsch); kurS.setAttribute("stroke-width",tolsch); tolschBylo=tolsch; }
  }
  /* Видимость: иконка живёт на сцене, пока на ней указатель; системная стрелка гасится. */
  function kursorVidim(){
    kurEl.style.display=(P.kursor&&st.kursNaSczene)?"block":"none";
    cv.style.cursor=P.kursor?'none':'';
  }
  /* Указатель ставит ЦЕЛЬ, иконка идёт к ней в кадре пружиной: между ними отставание. */
  function vestiKursor(e,srazu){
    st.kursCelX=e.clientX; st.kursCelY=e.clientY;
    if(srazu||!P.kursorDogon[0]){ st.kursX=e.clientX; st.kursY=e.clientY; st.kursVX=st.kursVY=0; stavitKursor(); }
  }
  function stavitKursor(){
    kurEl.style.transform='translate('+st.kursX.toFixed(1)+'px,'+st.kursY.toFixed(1)+'px) translate(-50%,-50%)';
  }
  /* ПРУЖИНА ПОВОРОТА С ПРЕДЕЛОМ СКОРОСТИ — один закон на дугу и усы (из галереи). */
  function vestiUgol(tek,skor,cel,pr,predel,sdt){
    if(tek===null) return [cel,0];
    if(pr[0]){
      var w=2*Math.PI/(pr[0]/1000), z=pr[1];
      skor+=((cel-tek)*w*w - skor*2*z*w)*sdt;
    } else skor=(cel-tek)/Math.max(0.001,sdt);
    if(predel>0) skor=Math.max(-predel,Math.min(predel,skor));
    var shag=skor*sdt;
    if(Math.abs(shag)>Math.abs(cel-tek)){ shag=cel-tek; if(!pr[0]) skor=0; }
    return [tek+shag, skor];
  }
  function dolyaOsi(os){ return os==='X' ? st.kursCelX/Math.max(1,W) : st.kursCelY/Math.max(1,H); }

  /* ── ПЕРЕСБОРКА ТЕКСТА (порт набора из горизонтального лонгрида) ──
     Буква меняется на букву своего регистра и алфавита, цифра на цифру,
     знаки препинания не трогаются: перебор без сдвига в моноширинном наборе.
     Случайности нет — хеш jit от зерна и номера буквы: воспроизводимо. */
  var ALF={ lat:{lo:'abcdefghijklmnopqrstuvwxyz',up:'ABCDEFGHIJKLMNOPQRSTUVWXYZ'},
            kir:{lo:'абвгдежзийклмнопрстуфхцчшщэюя',up:'АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЭЮЯ'} };
  var CIFRY='0123456789', ZNAKI='.,;:!?—–-()“”’/*+#', NBSP='\u00A0';
  function probel(ch){ return ch===' '||ch==='\n'||ch===NBSP; }
  function jit(seed,i){ var x=Math.sin(seed*37.7+i*13.31)*43758.545; return x-Math.floor(x); }
  function flapChar(ch,n){
    var lo=ch.toLowerCase(), up=ch.toUpperCase();
    if(lo===up) return (ch>='0'&&ch<='9') ? CIFRY[n%10] : ZNAKI[n%ZNAKI.length];
    var code=ch.charCodeAt(0);
    var a=(!P.naborLat&&code>=0x400&&code<=0x4FF)?ALF.kir:ALF.lat;
    var set=(ch===up)?a.up:a.lo;
    return set[n%set.length];
  }
  /* Фронт идёт по НОВОМУ тексту слева направо: за фронтом новая буква,
     на фронте перещёлк, перед фронтом ещё старая (пока старый текст не
     кончился). Порог буквы с дрожью, чтобы фронт не был линейкой. */
  function peresobrat(staroe,novoe,seed,p,tick,win){
    if(p>=1) return novoe;
    var L=novoe.length, out='';
    for(var i=0;i<L;i++){
      var ch=novoe[i];
      if(probel(ch)){ out+=ch; continue; }
      var t=(i+jit(seed,i)*2.2)/(L+2.2);
      var znak=ch.toLowerCase()===ch.toUpperCase()&&!(ch>='0'&&ch<='9');
      if(p>=t) out+=ch;
      else if(p>0&&t-p<win) out+=znak?ch:flapChar(ch,tick+i*7+seed*3);
      else out+=(i<staroe.length&&!probel(staroe[i]))?staroe[i]:(znak?ch:NBSP);
    }
    return out;
  }
  function pad3(n){ return ('000'+Math.max(0,Math.round(n||0))).slice(-3); }
  function obratnyyCvet(hex){ var v=parseInt(String(hex).slice(1),16); if(isNaN(v)) return '#fff'; return '#'+('000000'+((0xFFFFFF^v)>>>0).toString(16)).slice(-6); }
  function zadatCel(c,now){
    if(st.cel===c) return;
    st.cel=c; st.ot=st.t; st.t0=now;
    var polnyy=c?P.vhodMs:P.vyhodMs;
    st.ms=polnyy*Math.abs(c-st.t);                             // с середины — доля пути, не полное время
    st.ease=c?P.vhodEase:P.vyhodEase; st.bez=c?P.vhodBez:P.vyhodBez;
  }
  function sverkaCeli(){ zadatCel(P.otkryt?1:0,performance.now()); }
  function perekluchit(){
    P.otkryt=!P.otkryt; sverkaCeli();
    if(PANEL.controls.otkryt) PANEL.controls.otkryt();
    PANEL.save();
  }

  /* ── жесты: палец и клик по зеркалу ── */
  cv.addEventListener('pointermove',function(e){
    st.nad=vRamke(e.clientX,e.clientY,st.ramkaZ);
    // первое движение — вход на сцену: указатель мог стоять над окном в момент загрузки
    if(!st.kursNaSczene){ st.kursNaSczene=true; vestiKursor(e,true); kursorVidim(); }
    else vestiKursor(e,false);
  });
  cv.addEventListener('pointerenter',function(e){ st.kursNaSczene=true; vestiKursor(e,true); kursorVidim(); });  // на входе без отставания
  cv.addEventListener('pointerleave',function(){ st.nad=false; st.kursNaSczene=false; kursorVidim(); });
  cv.addEventListener('click',function(e){ if(vRamke(e.clientX,e.clientY,st.ramkaZ)) perekluchit(); });
  /* СКРОЛЛ крутит веер: цель едет за колесом, показ догоняет с инерцией. Только в каталоге.
     Слушает холст, а не окно: панель лежит выше и крутится сама (поймано 07.09). */
  cv.addEventListener('wheel',function(e){
    if(st.cel!==1||!KOLL.length) return; e.preventDefault();
    var now=performance.now();
    if(P.skrollVid==='shag'){
      // ПО ОДНОЙ ЗА ЖЕСТ: разрыв длиннее паузы — новый жест; шаг делается раз на жест
      if(now-st.skrollT>P.zhestPauza){ st.zhest=0; st.zhestSdelan=false; }
      st.skrollT=now;
      if(st.zhestSdelan) return;
      st.zhest+=e.deltaY;
      if(Math.abs(st.zhest)>=Math.max(1,P.porogZhesta)){
        var cel=Math.round(st.veerCel)+(st.zhest>0?1:-1);
        st.veerCel=cel; st.dosadka={ot:st.veer,do:cel,t0:now,ms:P.dosadkaMs}; st.zhestSdelan=true;
      }
      return;
    }
    st.veerCel+=e.deltaY/Math.max(1,P.shagSkrolla); st.skrollT=now; st.dosadka=null;
  },{passive:false});

  function resize(){
    DPR=Math.min(2,window.devicePixelRatio||1);               // потолок плотности // без ручки
    W=window.innerWidth; H=window.innerHeight;
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
    primenit();
  }
  window.addEventListener('resize',resize); resize();
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(primenit);   // щуп до загрузки шрифта мерил запасной

  /* ?stop=мс — стоп-кадр: ход в каталог стартует в нуле, часы замирают
     на отметке; 0 — галерея до клика, больше времени входа — каталог. */
  st.veer=st.veerCel=+P.kollekciya||0;
  var STOP=(function(){ var m=location.search.match(/[?&]stop=(\d+)/); return m?+m[1]:null; })();
  if(STOP!==null){ P.otkryt=true; st.cel=1; st.ot=0; st.t0=0; st.ms=P.vhodMs; st.ease=P.vhodEase; st.bez=P.vhodBez; }
  else sverkaCeli();

  function hexRgb(hex){ var v=parseInt(String(hex).slice(1),16); return [((v>>16)&255)/255,((v>>8)&255)/255,(v&255)/255]; }
  function zazhat01(v){ return v<0?0:v>1?1:v; }
  function glad(v){ v=zazhat01(v); return v*v*(3-2*v); }
  var fonKesh='', prev=performance.now();

  function frame(now){
    if(STOP!==null) now=STOP;
    var dt=Math.min(0.05,Math.max(0,(now-prev)/1000)); prev=now;    // длинный кадр не взрывает погоню // без ручки
    // ВЕЕР: досадка своим ходом, иначе погоня за целью; после паузы без скролла — досадка на ближайший шаг
    if(st.dosadka){
      var ud=st.dosadka.ms>0?Math.min(1,(now-st.dosadka.t0)/st.dosadka.ms):1;
      st.veer=st.dosadka.ot+(st.dosadka.do-st.dosadka.ot)*(reduced?1:evalEase(P.dosadkaEase,P.dosadkaBez,ud));
      if(ud>=1){ st.veer=st.veerCel=st.dosadka.do; st.dosadka=null; }
    } else if(P.skrollVid!=='shag'){
      var dv=Math.min(.999,P.inerciya/100), lv=-60*Math.log(Math.max(1e-6,dv));
      st.veer=(reduced||dv<=0)?st.veerCel:st.veer+(st.veerCel-st.veer)*(1-Math.exp(-dt*lv));
      var bl=Math.round(st.veerCel);
      if(now-st.skrollT>P.pauza&&Math.abs(st.veer-bl)>0.0005) st.dosadka={ot:st.veer,do:bl,t0:now,ms:P.dosadkaMs};
    }
    var tek=((Math.round(st.veer)%N_K)+N_K)%N_K;
    if(tek!==st.tek){
      var byloN=st.pokazNomer, byloO=st.pokazOpis;
      st.tek=tek; postavitTeksty();                                   // финальный текст и замеры сразу: раскладка не ждёт фронта
      st.pokazNomer=nomEl.textContent; st.pokazOpis=opisEl.textContent;
      st.nab=(P.nabor&&!reduced&&P.naborMs>0&&byloN!=='')?{t0:now,ms:P.naborMs,seed:tek*7+1,otN:byloN,otO:byloO,doN:nomEl.textContent,doO:opisEl.textContent}:null;
    }
    // ПЕРЕСБОРКА: фронт идёт по номеру и описанию одним ходом
    if(st.nab){
      var un=Math.min(1,(now-st.nab.t0)/st.nab.ms), pn=reduced?1:evalEase(P.naborEase,P.naborBez,un);
      var tkN=Math.floor(now/Math.max(20,P.naborTick)), winN=P.naborFront/100;
      var oN=peresobrat(st.nab.otN,st.nab.doN,st.nab.seed,pn,tkN,winN), oO=peresobrat(st.nab.otO,st.nab.doO,st.nab.seed+3,pn,tkN,winN);
      if(oN!==nomEl.textContent) nomEl.textContent=oN;
      if(oO!==opisEl.textContent) opisEl.textContent=oO;
      if(un>=1) st.nab=null;
    }
    // ДОЛЯ ПЕРЕХОДА — один ход, кривая одна; фазы ниже делят его долями
    if(st.t0>=0){
      var u=st.ms>0?Math.min(1,(now-st.t0)/st.ms):1;
      var e=reduced?1:evalEase(st.ease,st.bez,u);
      st.t=st.ot+(st.cel-st.ot)*e;
      if(u>=1){ st.t=st.cel; st.t0=-1; }
    }
    var t=st.t;

    gl.viewport(0,0,cv.width,cv.height);
    // ФОН: галерея → каталог тем же ходом
    var c0=hexRgb(P.fonGalerei), c1=hexRgb(P.fonKataloga);
    var c=[c0[0]+(c1[0]-c0[0])*t, c0[1]+(c1[1]-c0[1])*t, c0[2]+(c1[2]-c0[2])*t];
    gl.clearColor(c[0],c[1],c[2],1); gl.clear(gl.COLOR_BUFFER_BIT);
    var fon='rgb('+Math.round(c[0]*255)+','+Math.round(c[1]*255)+','+Math.round(c[2]*255)+')';
    if(fon!==fonKesh){ document.body.style.background=fon; fonKesh=fon; }

    var ph=kadrZerkala();
    var tm=ph?tekstura(ph):null;
    if(tm){
      // ОРИГИНАЛ-ШТОРКА: коридор по высоте, зажатый шириной; ширина к нулю вокруг оси
      var shk=P.shtorkaK>0?zazhat01(t/(P.shtorkaK/100)):(t>0?1:0);
      if(shk<1){
        var oh=Math.max(1,H-2*P.polyaOrig), ow=oh*tm.w/tm.h;
        if(ow>W){ ow=W; oh=ow*tm.h/tm.w; }
        var vid=ow*(1-shk), ox=(W-vid)/2, oy=(H-oh)/2;
        if(P.shtorkaVid==='obrez') drawTex(tm,ox,oy,vid,oh,1,[shk/2,0,1-shk,1]);
        else drawTex(tm,ox,oy,vid,oh,1);
      }
      // ЗЕРКАЛО → ОБЛОЖКА: рамка растёт по центру, пропорция — от кадра
      var ar=tm.w/tm.h;
      var hK=H*P.oblozhka/100;                                  // размер обложки — доля высоты, без пола: пропорция от кадра, размер свободен (Сергей 07.09)
      var mh=P.zerkalo+(hK-P.zerkalo)*t, mw=mh*ar, mx=(W-mw)/2, my=(H-mh)/2;
      drawTex(tm,mx,my,mw,mh,1);
      if(KOLL.length){
        var dl=Math.max(0.001,P.podmenaDlina/100), a=glad((t-(P.podmena/100-dl/2))/dl);
        if(a>0){
          /* МАСКА: рамка неподвижна, обложки едут внутри неё вслед за веером —
             текущая уходит вверх, следующая приходит снизу (или сменяются
             плотностью). Обложка вписана обрезом: рамка держит пропорцию кадра. */
          var ia=((Math.floor(st.veer)%N_K)+N_K)%N_K, ib=(ia+1)%N_K, f=st.veer-Math.floor(st.veer);
          var ta=teksturaKoll(ia), tb=teksturaKoll(ib);
          if(P.maskaVid==='sdvig'&&f>0.0005&&ib!==ia){
            drawTex(ta,mx,my,mw,mh*(1-f),a,vyrezKoll(ta,ar,f,1));
            drawTex(tb,mx,my+mh*(1-f),mw,mh*f,a,vyrezKoll(tb,ar,0,f));
          } else {
            drawTex(ta,mx,my,mw,mh,a,vyrezKoll(ta,ar,0,1));
            if(P.maskaVid!=='sdvig'&&f>0.0005&&ib!==ia) drawTex(tb,mx,my,mw,mh,a*f,vyrezKoll(tb,ar,0,1));
          }
        }
      }
      st.ramkaZ=[mx,my,mw,mh];
    }

    // ЯРЛЫКИ: одна плотность, приходят с доли хода и доходят к концу
    var yo=P.yarlykiOt/100, ay=yo<1?zazhat01((t-yo)/(1-yo)):(t>=1?1:0);
    if(ay<=0.002){ YAR.forEach(function(e){ e.style.display='none'; }); VEER.forEach(function(e){ e.style.display='none'; }); }
    else{
      YAR.forEach(function(e){ e.style.display=''; e.style.opacity=ay.toFixed(3); });
      podsEl.style.opacity=(ay*P.podskazkaPlot/100).toFixed(3);
      var r=st.ramkaZ, zz=H*P.zazor/100, kL=(W-W*P.kontent/100)/2;
      // номер: базовая линия на верхней кромке, правый край на зазор левее; в тесноте — над обложкой
      var tesnoNomer=(r[0]-zz-mer.shirNomer)<kL;
      if(tesnoNomer){ nomEl.style.transform='none'; nomEl.style.left=r[0].toFixed(1)+'px'; nomEl.style.top=(r[1]-zz-mer.bazNomer).toFixed(1)+'px'; }
      else { nomEl.style.transform='translate(-100%,0)'; nomEl.style.left=(r[0]-zz).toFixed(1)+'px'; nomEl.style.top=(r[1]-mer.bazNomer).toFixed(1)+'px'; }
      // описание: под обложкой на зазор, не уже обложки
      var opisW=Math.max(W*P.shirinaOpis/100,r[2]);
      opisEl.style.width=opisW.toFixed(1)+'px'; opisEl.style.left=(W/2).toFixed(1)+'px'; opisEl.style.top=(r[1]+r[3]+zz).toFixed(1)+'px';
      // ВЕЕР ИМЁН: радиус — доля ширины, зажатая коридором между обложкой и краем окна;
      // коридор пуст — теснота: веер сложен, имя главной под описанием по центру
      var rMin=r[2]/2+zz+mer.shirNazv/2, rMax=Math.min(W,H)/2-zz-mer.shirNazv/2;
      var tesnoNazv=rMin>rMax;                                       // имени негде встать ни на одном луче — узкое окно
      if(tesnoNazv){
        nazvEl.style.left=(W/2).toFixed(1)+'px';
        nazvEl.style.top=(r[1]+r[3]+zz+mer.opisH+zz-mer.bazNazv+mer.capNazv).toFixed(1)+'px';
        VEER.forEach(function(e){ e.style.display='none'; });
      } else {
        nazvEl.style.display='none';
        var shagV=Math.max(1,P.shagVeera), kray=90+shagV/2, rask=P.raskrytie?ay:1;
        // ПОСАДКА: точка на луче от центра окна (0) до правого края (100); выключка — каким краем текст сидит на точке
        var tochka=W/2*P.posadka/100, vyk=P.vyklyuchka;
        var otstup=tochka-(vyk==='left'?0:vyk==='right'?mer.shirNazv:mer.shirNazv/2);   // левый край текста от центра окна
        var topV=(H/2+mer.capNazv/2-mer.bazNazv).toFixed(1)+'px', levV=(W/2+otstup).toFixed(1)+'px';
        var osV=(-otstup).toFixed(2)+'px '+(mer.bazNazv-mer.capNazv/2).toFixed(2)+'px';   // ось поворота — центр окна
        for(var i=0;i<KOLL.length;i++){
          var d=i-st.veer; d=(((d+N_K/2)%N_K)+N_K)%N_K-N_K/2;             // кольцо: −N/2 … N/2
          var ug=d*shagV, au=Math.abs(ug), e=VEER[i];
          if(au>=kray){ e.style.display='none'; continue; }
          var pl=1-(1-P.plotKraya/100)*evalEase(P.gasheniyeEase,P.gasheniyeBez,Math.min(1,au/90));
          if(au>90) pl*=1-(au-90)/(shagV/2);                               // зона кольца: гаснет за верхом, приходит снизу
          e.style.display=''; e.style.opacity=(pl*ay).toFixed(3);
          e.style.width=''; e.style.left=levV; e.style.top=topV; e.style.transformOrigin=osV;
          e.style.transform='rotate('+(ug*rask).toFixed(2)+'deg)';
        }
      }
      // подсказка: на доле высоты, но не выше низа ярлыков на зазор — в тесноте текст растёт вниз
      var nizh=r[1]+r[3]+zz+mer.opisH+(tesnoNazv?zz+mer.capNazv:0);
      podsEl.style.left=(W/2).toFixed(1)+'px';
      podsEl.style.top=Math.max(H*P.podskazkaY/100, nizh+zz+P.keglMetki/2).toFixed(1)+'px';
      // метки и знак — от колонки контента и зазора
      metkiEl.style.left=kL.toFixed(1)+'px'; metkiEl.style.top=zz.toFixed(1)+'px';
      znakEl.style.left=kL.toFixed(1)+'px'; znakEl.style.top=(H-zz-P.keglMetki*1.52).toFixed(1)+'px';
    }

    // КУРСОР: место — пружина догона; поворот дуги и усов — по осям экрана, каждый своей пружиной
    if(P.kursor){
      var sdtK=dt;
      if(P.kursorDogon[0]>0 && st.kursNaSczene){
        var wK=2*Math.PI/(P.kursorDogon[0]/1000), zt=P.kursorDogon[1];
        st.kursVX+=((st.kursCelX-st.kursX)*wK*wK - st.kursVX*2*zt*wK)*sdtK;
        st.kursVY+=((st.kursCelY-st.kursY)*wK*wK - st.kursVY*2*zt*wK)*sdtK;
        st.kursX+=st.kursVX*sdtK; st.kursY+=st.kursVY*sdtK;
        stavitKursor();
      }
      sobratKursor();
      var kk=100/Math.max(2,st.kursGab||100);
      kurT.setAttribute('r',((P.kursorTochkaR/2)*kk).toFixed(2));
      var lum=0.2126*c[0]+0.7152*c[1]+0.0722*c[2];                  // контраст текущему фону, и посреди перехода тоже
      var kc=(lum>0.5?'rgba(0,0,0,':'rgba(255,255,255,')+(P.kursorPlot/100)+')';
      if(kc!==kcKesh){ kurD.setAttribute('stroke',kc); kurS.setAttribute('stroke',kc); kurT.setAttribute('fill',kc); kcKesh=kc; }
      // угол берётся от настоящего указателя, а не от места иконки: иконка отстаёт по пружине
      var dD=dolyaOsi(P.kursorDugaOt);   if(P.kursorDugaNazad)   dD=1-dD;
      var dL=dolyaOsi(P.kursorLiniyaOt); if(P.kursorLiniyaNazad) dL=1-dL;
      dD=evalEase(P.kursorDugaEase,  P.kursorDugaBez,  zazhat01(dD));   // передаточная кривая, не временная
      dL=evalEase(P.kursorLiniyaEase,P.kursorLiniyaBez,zazhat01(dL));
      var rD=vestiUgol(st.ugD,st.vD,360*P.kursorOborotovY*dD,P.kursorDugaPruzh,  P.kursorDugaPredel,  sdtK); st.ugD=rD[0]; st.vD=rD[1];
      var rL=vestiUgol(st.ugL,st.vL,360*P.kursorOborotovX*dL,P.kursorLiniyaPruzh,P.kursorLiniyaPredel,sdtK); st.ugL=rL[0]; st.vL=rL[1];
      kurD.setAttribute('transform','rotate('+st.ugD.toFixed(1)+' 50 50)');
      kurS.setAttribute('transform','rotate('+st.ugL.toFixed(1)+' 50 50)');
    }
    cv.classList.toggle('palec',!!(P.palec&&st.nad));
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
