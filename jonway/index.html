  // лента закольцована: скролл живёт по модулю периода
  var T = loopT();
  scroll = ((scroll % T) + T) % T;

  // движение скролла: единый датчик для ч/б и глича. Лента едет —
  // motionCur тянется к 1, встала (150мс тишины) — к 0, темп от P.grayMs
  var sVel = scroll - grayPrevScroll; // знаковая скорость ленты (до перезаписи)
  if (Math.abs(sVel) > T / 2) sVel = 0; // скачок через шов кольца — не движение
  if (Math.abs(sVel) > 0.05) grayLastMove = now;
  grayPrevScroll = scroll;
  var mTgt = (now - grayLastMove < 150) ? 1 : 0;
  motionCur += (mTgt - motionCur) * (1 - Math.exp(-dt / (P.grayMs / 3)));
  if (motionCur < 0.001) motionCur = 0;
  grayCur = motionCur * P.grayAmt;
  // у глича свой, независимый хвост — гаснет быстрее ч/б
  gMotionCur += (mTgt - gMotionCur) * (1 - Math.exp(-dt / (Math.max(50, P.glitchTail) / 3)));
  if (gMotionCur < 0.001) gMotionCur = 0;
  // направленность: знак движения с хвостом глича, в покое стекает в ноль
  var dTgt = Math.max(-1, Math.min(1, sVel / 8));
  gDirCur += (dTgt - gDirCur) * (1 - Math.exp(-dt / (Math.max(50, P.glitchTail) / 3)));
  if (Math.abs(gDirCur) < 0.001) gDirCur = 0;
  warpPhase = (warpPhase + dt / 1000 * P.warpSpeed) % 628.3; // волна живёт от времени
  // импульс от курсора затухает впятеро быстрее скроллового хвоста
  gHoverCur *= Math.exp(-dt / (Math.max(50, P.glitchTail) / 15));
  if (gHoverCur < 0.001) gHoverCur = 0;
  sndPop *= Math.exp(-dt / (Math.max(50, P.glitchTail) / 15));
  if (sndPop < 0.001) sndPop = 0;

  if (musicGain && AC && AC.state === 'running') {
    musicGain.gain.setTargetAtTime(P.zoneVol, AC.currentTime, 0.1);
    // курсор ниже — больше низов, выше — больше верхов; диапазон узкий
    var tc = mouseX != null ? Math.max(0, Math.min(1, mouseY / H)) - 0.5 : 0;
    toneLow.gain.setTargetAtTime(tc * 2 * P.toneRange, AC.currentTime, 0.15);
    toneHigh.gain.setTargetAtTime(-tc * 2 * P.toneRange, AC.currentTime, 0.15);
    // ЗОНЫ С ПЕРЕКРЫТИЕМ: в полосе шириной P.zoneOverlap номеров вокруг
    // границы звучат ОБА зональных трека — равномощностный кроссфейд
    // весами от ПОЗИЦИИ на ленте (не от времени); кольцо учитывается.
    // Поверх весов у каждого слоя доплер: пролёт справа→центр→слева
    // за время своего кластера, в центре — родное стерео
    var jRef = hoverCol >= 0 ? hoverCol : (MOB ? colAtM(kinkYpx()) : colAt(W / 2 + scroll));
    var TL = TRACKS.length;
    var uz = (jRef + 0.5) * TL / N;
    var zc = ((Math.floor(uz) % TL) + TL) % TL;
    zoneCur = zc; // якорь выселения кэша
    var halfZ = Math.max(0.0001, P.zoneOverlap * TL / (2 * N));
    var zfr = uz - Math.floor(uz);
    var wants = [{ z: zc, w: 1 }];
    if (zfr < halfZ) {
      var wp = (halfZ - zfr) / (2 * halfZ);
      wants = [{ z: zc, w: 1 - wp }, { z: (zc + TL - 1) % TL, w: wp }];
    } else if (zfr > 1 - halfZ) {
      var wn = (zfr - 1 + halfZ) / (2 * halfZ);
      wants = [{ z: zc, w: 1 - wn }, { z: (zc + 1) % TL, w: wn }];
    }
    zWantIds = [];
    for (var wi = 0; wi < wants.length; wi++) zWantIds.push(wants[wi].z);
    for (var li = zoneLayers.length - 1; li >= 0; li--) {
      if (zWantIds.indexOf(zoneLayers[li].z) < 0) { dropLayer(zoneLayers[li]); zoneLayers.splice(li, 1); }
    }
    for (var wi2 = 0; wi2 < wants.length; wi2++) ensureZone(wants[wi2].z);
    loadZone((zc + 1) % TL, null); // соседи впрок — стык не ждёт сеть
    loadZone((zc + TL - 1) % TL, null);
    for (var li2 = 0; li2 < zoneLayers.length; li2++) {
      var Lz = zoneLayers[li2];
      if (!Lz.sp) continue;
      var wz = 0;
      for (var wi3 = 0; wi3 < wants.length; wi3++) if (wants[wi3].z === Lz.z) wz = wants[wi3].w;
      var lp2 = Math.max(0, Math.min(1, (jRef + 0.5) * TL / N - Lz.z)); // прогресс в кластере слоя
      var lx = (0.5 - lp2) * 2 * P.spatX;
      var lw = P.spatX > 0 ? Math.min(1, Math.abs(lx) / P.spatX) : 0;
      if (Lz.sp.positionX) Lz.sp.positionX.setTargetAtTime(lx, AC.currentTime, 0.12);
      else Lz.sp.setPosition(lx, 0, -1);
      Lz.dry.gain.setTargetAtTime(Math.cos(lw * Math.PI / 2), AC.currentTime, 0.12);
      Lz.wet.gain.setTargetAtTime(Math.sin(lw * Math.PI / 2) * 1.85, AC.currentTime, 0.12);
      Lz.gain.gain.setTargetAtTime(Math.sin(wz * Math.PI / 2), AC.currentTime, 0.25);
      Lz.flt.frequency.setTargetAtTime(16000, AC.currentTime, 0.35);
    }
    // «поезд» — постоянный слой всего сайта, своей громкостью
    if (trainL) trainL.gain.gain.setTargetAtTime(P.zoneBgVol, AC.currentTime, 0.3);
    else ensureTrain();
  }
  // радио-шум: громкость от движения, волна блуждает, прыжок — от смены колонки
  if (radioGain && AC && AC.state === 'running') {
    var lvl = Math.min(1, motionCur * P.radioVol + sndPop * P.hoverVol) * 0.5; // всплеск смены картинки — от курсора и от скролла
    radioGain.gain.setTargetAtTime(lvl * lvl, AC.currentTime, 0.06);
    var wf = 330 + 160 * Math.sin(now * 0.0013) + 110 * Math.sin(now * 0.0031); // блуждание в низах
    radioFilter.frequency.setTargetAtTime(wf + radioJumpF * sndPop, AC.currentTime, 0.1);
  }

  // мобиле: кадром правит излом шеврона — номер, стоящий в управляющей
  // позиции, всегда активен; смена номера в изломе = рождение кадра
  // в модуле (та же механика, что вход курсора в колонку на десктопе)
  if (MOB) {
    if (entered) {
      var jM = colAtM(kinkYpx());
      if (jM !== hoverCol) {
        if (hoverCol >= 0) flowDir = wrapDiff(jM, hoverCol) > 0 ? 1 : -1;
        spawnShot(jM);
        hoverCol = jM;
        gHoverCur = 1;
        sndPop = 1;
        radioJumpF = 250 + Math.random() * 1300; // зоны ведёт реконсилер кадра
      }
    }
  } else
  // покраска и кадр: каждый кадр ищем колонку под курсором — работает и
  // при скролле, когда лента едет под неподвижным курсором; вертикаль
  // не ограничена — красить можно до самых краёв экрана.
  // Пока идёт экран загрузки — лента спит
  if (entered && mouseX != null) {
    var jH = colAt(mouseX + scroll);
    if (jH >= 0) {
      var ty = mouseY - numH() / 2; // клампа нет: курсор волен вытащить цифры за раму и за экран
      // при быстром скролле за кадр проезжает несколько колонок — красим все
      // (разница считается через шов кольца)
      var dd = prevHover >= 0 ? wrapDiff(jH, prevHover) : 0;
      if (prevHover >= 0 && Math.abs(dd) <= 40 && dd !== 0) {
        for (var s = 0; s <= Math.abs(dd); s++) {
          var p = ((prevHover + (dd > 0 ? s : -s)) % N + N) % N;
          tgtY[p] = ty; mode[p] = 1; lastPaint[p] = now;
        }
      } else {
        tgtY[jH] = ty; mode[jH] = 1; lastPaint[jH] = now;
      }
      prevHover = jH;
      if (jH !== hoverCol) { // пересечение границы колонки = рождение прохода
        if (hoverCol >= 0) flowDir = wrapDiff(jH, hoverCol) > 0 ? 1 : -1; // направление через шов
        spawnShot(jH);
        hoverCol = jH;
        if (now - mouseMoveT < 160) gHoverCur = 1; // вертикальный глич — только когда колонку сменил ХОД КУРСОРА, не лента
        sndPop = 1; // звук смены картинки — от любого источника: курсор и скролл
        radioJumpF = 250 + Math.random() * 1300; // и крутит волну приёмника
      }
    } else if (hoverCol >= 0) { // курсор ушёл за края ленты
      hoverCol = -1;
    }
  }

  // цифры: под курсором догоняют его, брошенные плавно возвращаются в центр
  // цифра под курсором следует за ним; отпущенная просто остаётся свободной.
  // Окно удержания 200мс — переживает просадку кадра (загрузка текстуры),
  // не отпуская цифру без причины.
  // Мобиле: линия — неподвижный шейп, вся физика линии спит
  if (!MOB) {
  var k = 1 - Math.exp(-dt / P.followTau);
  for (var i = 0; i < N; i++) {
    if (mode[i] !== 1) continue;
    if (now - lastPaint[i] > 200) { mode[i] = 0; continue; }
    curY[i] += (tgtY[i] - curY[i]) * k;
  }

  // закон линии: свободные цифры подтягиваются к медиане соседей.
  // Изломы гаснут быстро, крупная форма живёт долго — линия всегда
  // плавная и держит нарисованный курсором рельеф; горизонта-цели нет.
  // Прикнутая курсором цифра в сглаживании не участвует: она — граничное
  // условие, от которого деформация расползается по ленте.
  if (P.couple > 0) {
    var kc = 1 - Math.pow(1 - P.couple, dt / 16);
    var firstY = curY[0], lastY = curY[N - 1]; // кольцо: соседи через шов
    var prevLeft = curY[0];
    for (var c = 0; c < N; c++) {
      var left = c > 0 ? prevLeft : lastY;
      var right = c < N - 1 ? curY[c + 1] : firstY;
      prevLeft = curY[c];
      if (mode[c] === 1) continue;
      curY[c] += ((left + right) / 2 - curY[c]) * kc;
    }
  }

  // память места: слабое тяготение к запомненной форме держит крупный
  // рельеф против долгой диффузии; сама память медленно перенимает то
  // положение, где цифра задержалась (короткие мазки забываются)
  if (P.memory > 0) {
    var km = 1 - Math.pow(1 - P.memory, dt / 16);
    for (var mi = 0; mi < N; mi++) {
      if (mode[mi] !== 1) curY[mi] += (memY[mi] - curY[mi]) * km;
    }
  }
  var ka = 1 - Math.exp(-dt / P.memTau);
  for (var ai = 0; ai < N; ai++) memY[ai] += (curY[ai] - memY[ai]) * ka;

  // память — тоже живая линия: сглаживается по соседям, поэтому у формы
  // нет абсолютного якоря. Горизонт — лишь место рождения; потянул рельеф
  // и подержал — со временем уплывает вся линия, включая дальние края
  if (P.couple > 0) {
    var kms = 1 - Math.pow(1 - P.couple * 0.5, dt / 16);
    var firstM = memY[0], lastM = memY[N - 1]; // кольцо и у памяти
    var prevM = memY[0];
    for (var mc = 0; mc < N; mc++) {
      var ml = mc > 0 ? prevM : lastM;
      var mr = mc < N - 1 ? memY[mc + 1] : firstM;
      prevM = memY[mc];
      memY[mc] += ((ml + mr) / 2 - memY[mc]) * kms;
    }
  }
  // память места живёт В РАМЕ модуля цифр: рельеф свободен внутри, дрейф
  // за раму срезается — вытянутая курсором линия сама стекает в модуль
  var nbF = numBox();
  var nLo = nbF.top, nHi = nbF.bot - numH();
  for (var nc = 0; nc < N; nc++) {
    if (memY[nc] < nLo) memY[nc] = nLo;
    else if (memY[nc] > nHi) memY[nc] = nHi;
  }
  } // конец физики линии (!MOB)

  // сцена рисуется в текстуру — кино-проход положит её на экран
  gl.bindFramebuffer(gl.FRAMEBUFFER, post.fb);
  gl.viewport(0, 0, cvs.width, cvs.height);
  gl.clear(gl.COLOR_BUFFER_BIT);

  // экран загрузки: одна цифра в центре считает 00→99, потом лента волной
  if (!entered) {
    var lp = (now - bootT) / LOAD_MS;
    if (lp >= 1) {
      entered = true;
      enterT = now;
      waveCol = MOB ? colAtM(kinkYpx()) : ((Math.round(scroll / pitch()) % N) + N) % N;
    } else {
      var cs = String(Math.min(99, Math.floor(lp * 100))).padStart(3, '0');
      var csc = MOB ? MB.scale : P.numScale;
      var cTot = 3 * DIG_ADV * csc;
      for (var ck = 0; ck < 3; ck++) {
        var cOff = (ck * DIG_ADV - (DIG_H - DIG_ADV) / 2) * csc;
        if (MOB) drawQuad(atlasTex, (W - cTot) / 2 + cOff, (H - numHm()) / 2, DIG_H * csc, numHm(), digitUv(+cs[ck]), 0, 1, ink(), 0);
        else drawQuad(atlasTex, (W - CELL_W * csc) / 2, (H - cTot) / 2 + cOff, CELL_W * csc, DIG_H * csc, digitUv(+cs[ck]), 0, 1, ink(), 0);
      }
    }
  }

  // цифры — НИЖНИЙ слой (просьба Сергея 2026-07-30): кадры ложатся
  // поверх и перекрывают номера; сквозь полупрозрачные места кадра
  // (фейды, дырки зерна) цифры просвечивают
  // волна входа расходится от очага в обе стороны кольца: экранная часть
  // шагом WAVE_STEP, дальняя сторона ускоряется — всё кольцо за WAVE_TOTAL
  var tIn = entered ? now - enterT : 0;
  var waveHalf = N / 2;
  var waveNear = Math.min(waveHalf, Math.ceil(MOB ? H / pitchM() : W / pitch()));
  var waveFast = waveNear < waveHalf ? Math.max(0, (WAVE_TOTAL - waveNear * WAVE_STEP) / (waveHalf - waveNear)) : WAVE_STEP;
  for (var d = 0; entered && d < N; d++) {
    var wr = Math.abs(d - waveCol);
    if (wr > N - wr) wr = N - wr; // кольцевое расстояние до очага
    var wDelay = wr <= waveNear ? wr * WAVE_STEP : waveNear * WAVE_STEP + (wr - waveNear) * waveFast;
    var pIn = reduce ? 1 : Math.max(0, Math.min(1, (tIn - wDelay) / WAVE_DUR));
    if (pIn <= 0) continue;
    var ease = 1 - Math.pow(1 - pIn, 3); // волна входа: scaleX 4→1 + прозрачность
    var sx = 4 - 3 * ease;
    if (MOB) { // вертикальное кольцо: номер стоит на шевроне
      var sy = ((scroll - d * pitchM()) % T + T) % T;
      if (sy > T / 2) sy -= T; // ближний путь через шов кольца
      if (sy < -numHm() || sy > H) continue;
      // магнит-кернинг: расстояние до излома в шагах кольца
      var kdM = Math.abs(sy + numHm() / 2 - kinkYpx()) / pitchM();
      var spM = DIG_ADV * (P.kernAmt / 100) * Math.exp(-(kdM * kdM) / (P.kernRad * P.kernRad));
      var totM = (3 * DIG_ADV + 2 * spM) * MB.scale * sx;
      var x0 = shapeX(sy) + (numWm() - totM) / 2;
      for (var mk = 0; mk < 3; mk++) {
        var mo = (mk * (DIG_ADV + spM) - (DIG_H - DIG_ADV) / 2) * MB.scale * sx;
        drawQuad(atlasTex, x0 + mo, sy, DIG_H * MB.scale * sx, numHm(), digitUv(+NUMS[d][mk]), 0, ease, ink(), 0);
      }
    } else {
      var x = colX(d) - scroll;
      if (x < -pitch()) x += T; // хвост кольца показывается спереди
      if (x + P.colW < 0 || x > W) continue;
      // магнит-кернинг: непрерывное расстояние колонки до курсора (в колонках)
      var kdD = 1e9;
      if (mouseX != null) {
        var dxc = Math.abs(colX(d) + P.colW / 2 - (mouseX + scroll));
        kdD = Math.min(dxc, T - dxc) / pitch();
      }
      var spD = DIG_ADV * (P.kernAmt / 100) * Math.exp(-(kdD * kdD) / (P.kernRad * P.kernRad));
      var cw = CELL_W * P.numScale * sx;
      var totD = (3 * DIG_ADV + 2 * spD) * P.numScale;
      var y0 = curY[d] + (numH() - totD) / 2;
      for (var dk = 0; dk < 3; dk++) {
        var doff = (dk * (DIG_ADV + spD) - (DIG_H - DIG_ADV) / 2) * P.numScale;
        drawQuad(atlasTex, x + (P.colW - cw) / 2, y0 + doff, cw, DIG_H * P.numScale, digitUv(+NUMS[d][dk]), 0, ease, ink(), 0);
      }
    }
  }

  // кадры-появления — ПОВЕРХ ленты: старшие ниже, новые выше
  if (entered && shots.length) {
    var box = photoBox();
    // кадры пишут свою плотность в альфа-маску сцены — по ней пост-проход
    // отдаёт «чистую картинку» без киноплёнки
    gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    // аналоговое зерно картинок: как печать кинопостера — паттерн замер,
    // фактура ощущается, изображение не плывёт
    gl.uniform1f(U.uPGrain, P.photoGrain);
    gl.uniform1f(U.uPGSize, Math.max(0.25, P.photoGrainPx * DPR));
    gl.uniform1f(U.uPGAlpha, P.photoGrainAlpha);
    gl.uniform1f(U.uGDir, gDirCur * P.glitchDir); // направленность глича — по движению
    gl.uniform1f(U.uWarpF, P.warpFreq);
    gl.uniform1f(U.uWarpT, warpPhase);
    var appearDur = P.revealDelay + P.revealMs;
    for (var si = 0; si < shots.length; si++) {
      var sh = shots[si];
      var age = now - sh.born;
      // кадр по таймеру НЕ умирает: пара «активный + предыдущий» висит,
      // пока рождение нового кадра не вытеснит старшего (см. spawnShot)
      // мозаика проявления — по своей внутренней шкале появления
      var amount;
      if (age < P.revealDelay) amount = 100;
      else if (age < appearDur) amount = 100 * (1 - evalEase(P.revealEase, P.revealBez, (age - P.revealDelay) / P.revealMs));
      else amount = 0;
      // горизонтальный ход: рождение левее центра → центр → смерть правее.
      // Размер и пропорции неизменны, работают только смещение и фейд
      var xOff, alpha, gFactor;
      if (sh.die != null) {
        var dp = (now - sh.die) / P.hideMs;
        if (dp >= 1) { shots.splice(si, 1); si--; continue; }
        var q = evalEase(P.hideEase, P.hideBez, dp);
        xOff = 0;      // уход — затухание НА МЕСТЕ, в центре экрана
        alpha = 1 - q; // плотность 100→0
        gFactor = P.glitchDur > 0 ? Math.max(0, (q - (1 - P.glitchDur)) / P.glitchDur) : 0; // хвост распада длиной glitchDur
      } else {
        var ap = Math.min(1, age / appearDur);
        var qa = evalEase(P.revealEase, P.revealBez, ap);
        xOff = -sh.dir * (MOB ? 0 : P.slideDist) * (1 - qa); // въезд навстречу движению; в мобильном модуле — на месте
        alpha = Math.min(1, qa);                 // из прозрачности к плотности
        gFactor = P.glitchDur > 0 ? Math.max(0, 1 - Math.min(1, qa) / P.glitchDur) : 0; // начало въезда длиной glitchDur
      }
      var e = photoTex(sh.idx);
      if (!e) continue;
      // размер: кадр вписывается в модуль целиком (contain), «Масштаб
      // кадров» — множитель поверх; потолок экрана действует всегда
      var s2 = Math.min(box.w / e.w, box.h / e.h) * P.photoScale;
      s2 = Math.min(s2, (W - 40) / e.w, (H - 40) / e.h);
      var dw = e.w * s2, dh = e.h * s2;
      // каждый кадр — свой модуль (невидимая рамка по центру экрана),
      // фото внутри ставит закон: сторона — направлением движения
      // (вперёд по ходу), полка — чётностью номера (чёт вверх, нечет вниз).
      // Широкий кадр заполняет ширину и показывает только полку,
      // вертикальный — только сторону: ось закона видна там, где свобода
      var MARG = MOB ? MB.margin : 20; // поле у прижатого края
      var px, py;
      if (MOB) {
        // мобильный модуль стоит над изломом: кадр по центру ширины,
        // прижат к низу модуля — к управляющей позиции
        px = MB.margin + (box.w - dw) / 2;
        py = MB.margin + box.h - dh;
      } else {
        var mx = P.anchorX === 'left' ? MARG : P.anchorX === 'right' ? W - box.w - MARG : (W - box.w) / 2;
        var my = P.anchorY === 'top' ? MARG : P.anchorY === 'bottom' ? H - box.h - MARG : (H - box.h) / 2;
        // три класса пропорций: сильно вертикальный (уже 2:3) — центр;
        // сильно горизонтальный (шире 3:2) — угол по направлению движения
        // (вперёд — правый-нижний, назад — левый-верхний); квадратный и
        // близкие (между 2:3 и 3:2) — диагонально противоположный угол
        var rp = e.w / e.h;
        if (rp < 2 / 3) {
          // вертикальный: у центральной оси модуля, ВЫКЛЮЧКОЙ КРАЕМ по ходу
          // движения — вперёд правая граница на оси, назад левая
          px = sh.dir > 0 ? mx + box.w / 2 - dw : mx + box.w / 2;
          py = my + (box.h - dh) / 2;
        } else {
          var corner = rp > 1.5 ? sh.dir : -sh.dir;
          px = corner > 0 ? mx + box.w - dw : mx;
          py = corner > 0 ? my + box.h - dh : my;
        }
      }
      // кадр натурального размера может быть больше модуля — но в экране целиком
      px = Math.max(MARG, Math.min(W - dw - MARG, px));
      py = Math.max(MARG, Math.min(H - dh - MARG, py));
      // глич: смена кадра (въезд/распад) + движение скролла
      // оси по датчикам: ГОРИЗОНТАЛЬ — от скролла (лента везёт картинки),
      // ВЕРТИКАЛЬ (дождь) — от движения курсора; въезд/распад кадра — в обе
      var gScroll = Math.min(1, gFactor + gMotionCur) * P.glitchAmt;
      var gCursor = Math.min(1, gFactor + gHoverCur) * P.glitchAmt;
      var g = Math.max(gScroll, gCursor); // общая сила — порогу и грязи; P.glitchAmt может быть до 5 — перегруз
      var hasG = g > 0.001 && P.glitchShift > 0;
      var wA = P.warpAmp;
      gl.uniform1f(U.uWarpX, wA > 0.01 ? wA / dw : 0);
      gl.uniform1f(U.uWarpY, wA > 0.01 ? wA / dh : 0);
      if (hasG || wA > 0.01) {
        // поля шире худшего сдвига (гличевого и волнового) —
        // ни полосы, ни волна не режутся кромкой маски
        var gm = (hasG ? P.glitchShift * 1.4 * Math.max(1, g) : 0) + wA * 1.3 + 2;
        if (hasG) {
          gl.uniform1f(U.uGlitch, g);
          gl.uniform1f(U.uGSeed, Math.floor(now / 70) % 1000);
          gl.uniform1f(U.uGNoise, P.glitchNoise);
          gl.uniform1f(U.uGAmp, P.glitchShift / dw * (gScroll / g));
          gl.uniform1f(U.uGAmpY, P.glitchShift / dh * (gCursor / g));
          gl.uniform1f(U.uGBand, Math.max(2, P.glitchBand * DPR));
        }
        gl.uniform1f(U.uGx, (dw + 2 * gm) / dw);
        gl.uniform1f(U.uGo, gm / dw);
        gl.uniform1f(U.uGy, (dh + 2 * gm) / dh);
        gl.uniform1f(U.uGoY, gm / dh);
        drawQuad(e.tex, px + xOff - gm, py - gm, dw + 2 * gm, dh + 2 * gm, [0, 0, 1, 1], amount, alpha * P.photoAlpha, P.photoDark, 0, grayCur);
        gl.uniform1f(U.uGlitch, 0);
        gl.uniform1f(U.uGx, 1);
        gl.uniform1f(U.uGo, 0);
        gl.uniform1f(U.uGy, 1);
        gl.uniform1f(U.uGoY, 0);
      } else {
        drawQuad(e.tex, px + xOff, py, dw, dh, [0, 0, 1, 1], amount, alpha * P.photoAlpha, P.photoDark, 0, grayCur);
      }
    }
    gl.uniform1f(U.uPGrain, 0); // дальше цифры — без зерна
    gl.uniform1f(U.uPGAlpha, 0);
    gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ZERO, gl.ONE); // маску пишут только кадры
  }

  // индикатор — позиция на кольце ленты
  if (entered) {
    if (MOB) { // вертикальный, у правого края
      var th = Math.max(30, H * H / T);
      var tyI = (scroll / T) * (H - th);
      drawQuad(whiteTex, W - 4, tyI, 2, th, [0, 0, 1, 1], 0, 0.7, ink());
    } else {
      var tw = Math.max(30, W * W / T);
      var tx = (scroll / T) * (W - tw);
      drawQuad(whiteTex, tx, H - 4, tw, 2, [0, 0, 1, 1], 0, 0.7, ink());
    }
  }

  // кино-проход: сцена из текстуры на экран с фокусом, зерном, виньеткой
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, cvs.width, cvs.height);
  gl.useProgram(postProg);
  gl.bindTexture(gl.TEXTURE_2D, post.tex);
  gl.uniform4f(PU.uRect, 0, 0, W, H);
  gl.uniform2f(PU.uView, W, H);
  gl.uniform2f(PU.uSize, cvs.width, cvs.height);
  gl.uniform1f(PU.uBlur, P.filmBlur * DPR);
  gl.uniform1f(PU.uGrain, P.grain);
  gl.uniform1f(PU.uVign, P.vignette);
  gl.uniform1f(PU.uTemp, P.temp);
  gl.uniform1f(PU.uExpo, P.exposure);
  gl.uniform1f(PU.uTime, (now % 100000) / 1000);
  gl.uniform1f(PU.uLight, THEME === 'light' ? 1 : 0);
  gl.uniform1f(PU.uRaw, P.photoRaw === 'on' ? 1 : 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  if (/[?&]probe/.test(location.search)) // временный зонд геометрии (отладка)
    document.title = 'PROBE ' + [W, H, DPR, scroll.toFixed(1), kinkYpx().toFixed(1), shapeX(460).toFixed(1), colAtM(kinkYpx()), numWm().toFixed(1), MOB].join(' | ');

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ── Звук: радио-шум при скролле (синтез, файлов нет) ──────────────────
// Белый шум → полосовой фильтр → громкость. Громкость ведёт датчик
// движения ленты (тот же, что ч/б и глич); смена колонки «крутит ручку
// настройки» — фильтр прыгает на случайную волну и съезжает обратно.
var AC = null, radioGain = null, radioFilter = null, radioJumpF = 0;
function audioInit() {
  if (AC) return;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  var len = AC.sampleRate * 2;
  var buf = AC.createBuffer(1, len, AC.sampleRate);
  var d = buf.getChannelData(0);
  // «гравий» вместо гладкого шума: значение держится 9 сэмплов —
  // грубая цифровая крошка, звучит ниже и жёстче белого шума
  var hold = 0, hv = 0;
  for (var i = 0; i < len; i++) {
    if (hold <= 0) { hv = Math.random() * 2 - 1; hold = 9; }
    d[i] = hv; hold--;
  }
  // редкие трески — пыль на дорожке
  for (var c = 0; c < len; c++) {
    if (Math.random() < 0.0006) {
      var burst = 30 + Math.floor(Math.random() * 90);
      for (var b = 0; b < burst && c + b < len; b++) d[c + b] = (Math.random() * 2 - 1) * 1.6;
      c += burst;
    }
  }
  var src = AC.createBufferSource();
  src.buffer = buf; src.loop = true;
  var drive = AC.createGain();
  drive.gain.value = 3.2; // разгон в клиппинг
  var shaper = AC.createWaveShaper(); // перегруз: жёсткая грязь
  var curve = new Float32Array(1024);
  for (var s = 0; s < 1024; s++) {
    var x = s / 511.5 - 1;
    curve[s] = Math.max(-0.6, Math.min(0.6, x * 1.6)) / 0.6;
  }
  shaper.curve = curve;
  radioFilter = AC.createBiquadFilter();
  radioFilter.type = 'bandpass';
  radioFilter.frequency.value = 340;
  radioFilter.Q.value = 0.8; // широкая низкая полоса — рокот, не свист
  radioGain = AC.createGain();
  radioGain.gain.value = 0;
  musicGain = AC.createGain();
  musicGain.gain.value = 0;
  // тембральные качели от высоты курсора: полочки на шине музыки
  toneLow = AC.createBiquadFilter();
  toneLow.type = 'lowshelf';
  toneLow.frequency.value = 200;
  toneHigh = AC.createBiquadFilter();
  toneHigh.type = 'highshelf';
  toneHigh.frequency.value = 2500;
  // бинауральная сцена живёт в слоях: у каждого трека свой HRTF-паннер
  // (создаётся в ensureZone), здесь шина уже сведённая
  musicGain.connect(toneLow);
  toneLow.connect(toneHigh);
  toneHigh.connect(AC.destination);
  src.connect(drive);
  drive.connect(shaper);
  shaper.connect(radioFilter);
  radioFilter.connect(radioGain);
  radioGain.connect(AC.destination);
  src.start();
}
// ── Музыка зон: лента делится на столько областей, сколько треков ─────
// В каждой области фотографии сопровождает свой трек (луп); переход в
// другую область — кроссфейд на её трек. Треки грузятся по требованию,
// в памяти держим текущий и соседей.
var TRACKS = ['zone-00.m4a','zone-01.m4a','zone-02.m4a','zone-03.m4a','zone-04.m4a','zone-05.m4a','zone-06.m4a','zone-07.m4a','zone-08.m4a','zone-09.m4a','zone-10.m4a','zone-11.m4a']; // 12 зон (мелодии 03/06/10); «поезд» Manhattan — отдельным постоянным слоем (train.m4a)
var AUDIO_BASE = '/jonway/audio/';
var musicGain = null, toneLow = null, toneHigh = null;
var zoneCur = -1, zoneBufs = {}, zoneLoading = {};
// слои музыки: [0] — фоновый (в глубине), последний — передний
var zoneLayers = [];
// ПРАВИЛО: возврат к треку — с места, где он остановился (позиции по зонам)
var zonePos = {};
function loadZone(z, cb) {
  if (zoneBufs[z]) { if (cb) cb(zoneBufs[z]); return; }
  if (zoneLoading[z]) { if (cb) zoneLoading[z].push(cb); return; }
  zoneLoading[z] = cb ? [cb] : [];
  fetch(AUDIO_BASE + TRACKS[z])
    .then(function (r) { return r.arrayBuffer(); })
    .then(function (ab) { return AC.decodeAudioData(ab); })
    .then(function (buf) {
      zoneBufs[z] = buf;
      (zoneLoading[z] || []).forEach(function (f) { f(buf); });
      delete zoneLoading[z];
      Object.keys(zoneBufs).forEach(function (k) { // память: текущая зона + соседи по кольцу
        var dz = Math.abs(+k - zoneCur);
        if (Math.min(dz, TRACKS.length - dz) > 2) delete zoneBufs[k];
      });
    })
    .catch(function () { delete zoneLoading[z]; });
}
function dropLayer(L) { // старший слой уходит совсем
  // запоминаем, где остановились — возврат продолжит с этого места
  zonePos[L.z] = (L.offset + AC.currentTime - L.startedAt) % L.src.buffer.duration;
  L.gain.gain.setTargetAtTime(0, AC.currentTime, 0.7);
  setTimeout(function () { try { L.src.stop(); } catch (e) {} }, 3000);
}
var zWantIds = []; // зоны, которые кадр отрисовки хочет прямо сейчас
function ensureZone(z) {
  if (!AC || AC.state !== 'running') return;
  for (var zi = 0; zi < zoneLayers.length; zi++) if (zoneLayers[zi].z === z) return;
  loadZone(z, function (buf) {
    // отложенный колбэк перепроверяет закон на момент прихода:
    // зона ещё в полосе желания и слоя на неё нет
    if (zWantIds.indexOf(z) < 0) return;
    for (var zj = 0; zj < zoneLayers.length; zj++) if (zoneLayers[zj].z === z) return;
    var src = AC.createBufferSource();
    src.buffer = buf;
    src.loop = true;
    var g = AC.createGain();
    g.gain.value = 0;
    var f = AC.createBiquadFilter();
    f.type = 'lowpass';
    f.frequency.value = 16000;
    f.Q.value = 0.5;
    src.connect(g);
    g.connect(f);
    // бинаураль гибридом: сухой стерео-путь + HRTF-путь, микс ведёт кадр
    // отрисовки. HRTF сваливает стерео в моно и глушит ~6 дБ даже в
    // центре — поэтому в центре звучит родное стерео, и только увод
    // курсора вбок постепенно выносит звук в «комнату»
    var sp = AC.createPanner();
    sp.panningModel = 'HRTF';
    sp.distanceModel = 'linear';
    sp.rolloffFactor = 0;
    if (sp.positionZ) sp.positionZ.value = -1;
    else sp.setPosition(0, 0, -1);
    var dry = AC.createGain();
    var wet = AC.createGain();
    wet.gain.value = 0;
    f.connect(dry); dry.connect(musicGain);
    f.connect(sp); sp.connect(wet); wet.connect(musicGain);
    var off = (zonePos[z] || 0) % buf.duration; // продолжаем с места остановки
    src.start(0, off);
    var L = { z: z, src: src, gain: g, flt: f, sp: sp, dry: dry, wet: wet, startedAt: AC.currentTime, offset: off };
    zoneLayers.push(L); // громкость и вес ведёт кадр отрисовки
  });
}

// «поезд» (Manhattan Bridge Trains) — постоянный трек всего сайта: лупится
// всегда, зональная музыка идёт поверх; громкость — ручка «Поезд»
var trainL = null, trainLoading = false;
function ensureTrain() {
  if (!AC || AC.state !== 'running' || trainL || trainLoading) return;
  trainLoading = true;
  fetch(AUDIO_BASE + 'train.m4a')
    .then(function (r) { return r.arrayBuffer(); })
    .then(function (ab) { return AC.decodeAudioData(ab); })
    .then(function (buf) {
      trainLoading = false;
      if (trainL) return;
      var src = AC.createBufferSource();
      src.buffer = buf;
      src.loop = true;
      var g = AC.createGain();
      g.gain.value = 0;
      src.connect(g);
      g.connect(musicGain);
      src.start();
      trainL = { src: src, gain: g };
    })
    .catch(function () { trainLoading = false; });
}

// мьют пользователя: пока включён — жесты звук НЕ запускают, только кнопка
var userMuted = false;
try { userMuted = localStorage.getItem('jonway-muted') === '1'; } catch (e) {}
function kickZone() { // первое оживление звука: заводим поезд, зоны поднимет кадр
  if (!AC || AC.state !== 'running') return;
  ensureTrain();
}
function audioKick() { // звук разрешается только после жеста пользователя
  if (userMuted) return;
  audioInit();
  // колесо браузер жестом не считает: resume со скролла проходит, только
  // если раньше был хоть один клик/тап/клавиша. Пробуем на каждом жесте,
  // пока звук не оживёт; зону включаем по факту оживления, не по таймеру
  if (AC && AC.state === 'suspended') {
    var pr = AC.resume();
    if (pr && pr.then) pr.then(kickZone, function () {});
  }
  kickZone();
}
window.addEventListener('pointerdown', audioKick);
window.addEventListener('keydown', audioKick);
window.addEventListener('wheel', audioKick, { passive: true });

// (пропадают цифры/картинки, застывает линия). Ловим потерю и перезапускаем
// страницу при возврате: настройки живут в localStorage, потерь нет.

  try { var n = +(sessionStorage.getItem('gl-lost-n') || 0) + 1; sessionStorage.setItem('gl-lost-n', n); if (/[?&]probe/.test(location.search)) document.title = 'GLLOST x' + n; } catch (e2) {}
  if (!document.hidden) location.reload();
});

document.addEventListener('visibilitychange', function () {
  if (!document.hidden) {

});

// временная отладка: ?dbg показывает состояние кадров-появлений
if (/[?&]dbg/.test(location.search)) {
  var dbgEl = document.createElement('div');
  dbgEl.style.cssText = 'position:fixed;top:8px;left:8px;color:#0f0;font:12px monospace;z-index:99';
  document.body.appendChild(dbgEl);
  window.addEventListener('error', function (ev) {
    dbgEl.dataset.err = '1';
    dbgEl.textContent = 'ERR: ' + ev.message + ' @' + ev.lineno;
    dbgEl.style.color = '#f66';
  });
  setInterval(function () {
    if (dbgEl.dataset.err) return;
    var s0 = shots[0];
    var cache = [];
    photoCache.forEach(function (v, k) { cache.push(k + ':' + (v.ready ? 'R' : '…')); });
    dbgEl.textContent = 'shots=' + shots.length + ' hoverCol=' + hoverCol +
      (s0 ? ' idx=' + s0.idx + ' die=' + (s0.die != null) + ' age=' + Math.round(performance.now() - s0.born) : '') +
      ' | ' + cache.join(',');
  }, 300);
}

  var btn = document.createElement('button');
  btn.className = 'st-gear';
  btn.style.left = '56px'; // рядом с шестерёнкой
  btn.title = 'звук';
  btn.innerHTML = userMuted ? ICON_OFF : ICON_ON;
  document.body.appendChild(btn);
  btn.addEventListener('click', function () {
    userMuted = !userMuted;
    try { localStorage.setItem('jonway-muted', userMuted ? '1' : '0'); } catch (e) {}
    btn.innerHTML = userMuted ? ICON_OFF : ICON_ON;
    if (userMuted) {
      if (AC) AC.suspend();
    } else {
      audioInit();
      if (AC && AC.state === 'suspended') AC.resume(); // поезд и зоны поднимет кадр отрисовки
    }
  });
})();

  var tb = document.createElement('button');
  tb.className = 'st-gear';
  tb.style.left = '100px'; // третья в ряду: шестерёнка, звук, тема
  tb.title = 'тема';
  tb.innerHTML = THEME === 'light' ? ICON_MOON : ICON_SUN; // иконка показывает, куда переключишься
  document.body.appendChild(tb);
  tb.addEventListener('click', function () {
    THEME = THEME === 'light' ? 'dark' : 'light';
    try { localStorage.setItem('jonway-theme', THEME); } catch (e) {}
    tb.innerHTML = THEME === 'light' ? ICON_MOON : ICON_SUN;
    applyTheme();
  });
})();

// отладочный крючок: ?hover=N подъезжает к колонке N и ставит на неё
// виртуальный курсор — кадр и покраска включаются штатной логикой кадра
var m = location.search.match(/hover=(\d+)/);
if (m) {
  setTimeout(function () {
    var idx = Math.min(N - 1, +m[1]);
    scroll = colX(idx) + P.colW / 2 - cvs.clientWidth / 2;
    mouseX = cvs.clientWidth / 2;
    mouseY = cvs.clientHeight / 2;
  }, 300);
}
