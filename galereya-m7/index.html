<style>
  /* ============================================================
     ГАЛЕРЕЯ M7 «Symmetry Symptom» — фотогалерея целиком на мышке, без
     единой кнопки. Один канвас, три слоя (имена — по паспорту макета
     «2026-07-07 — Галерея M7», панель называет вещи так же):
       ФОН      — краска на всём экране.
       СЪЁМКА   — материал: список наборов кадров, у каждого своё число.
                  N живёт в данных, не в коде; смена переносит долю кольца.
       ЛЕНТА    — непрерывная позиция rib в кадрах, кольцо через mod(N);
                  невидима по определению: DOM и геометрии у неё нет вовсе.
       ЗЕРКАЛО  — кадр, доехавший до центра; растёт от УДЕРЖАНИЯ вместе с
                  кругом и крестиком, подскок на тычке. Каждая смена кадра —
                  склейка с наплывом: кадр приходит крупнее и оседает в
                  размер (порт режима flicker01 из arqe, шаблон «Flicker 10»).
                  Верхний слой сцены (ручкой «Слой»): в холсте рисуется после
                  круга и крестика, а слой DOM над холстом — усы, номер,
                  слово, подпись — вырезан по рамке зеркала. Над зеркалом
                  только курсор: он подсказка жеста и пропадать не вправе.
       ОРИГИНАЛ — большое фото сзади, во всю высоту в коридоре полей (боковое
                  выводится долей от вертикального), X = точка последнего тычка;
                  нажатие ужимает его и гасит, отпускание разворачивает;
                  подмена кадра — на дне этого хода. Ход один, величин на
                  нём две: доля общая, кривая общая. В кружении каждая
                  смена кадра — склейка с наплывом, своим, не зеркальным.
       НОМЕР    — 001 … 0NN на радиусе кольца, долей и углом; DOM, своя
                  гарнитура — пиксельная Apple II Screen Typeface (ручкой),
                  кегль общий с ярлыками. Слово-подсказка стоит тем же законом.
       КУРСОР   — кольцо с разрывом, точка в центре и два уса по оси
                  (компонент макета 4028:44141): подсказка, что вокруг
                  этой точки кружат. Три части порознь: точка стоит, дуга
                  и усы отсчитывают оси экрана (какую — ручкой). На
                  удержании иконка схлопывается НА МЕСТЕ тычка: дуга
                  укорачивается, докручивая обороты, и гаснет; усы
                  укорачиваются, доворачивая на активный кадр; точка
                  садится в ноль своим временем. На отпускании собирается
                  под рукой обратным ходом — своим временем и своей кривой.
                  К кругу ничего не едет: у круга свои усы. Идёт за
                  указателем с отставанием: указатель ставит цель, иконка
                  догоняет. DOM поверх сцены.
       КРУГ     — точки-кадры вокруг ОСИ КРУЧЕНИЯ; зажигается от удержания
                  через задержку, гаснет с отпусканием кнопки — той же
                  волной наоборот. В центре крестик — метка той самой оси:
                  круг зовёт крутить ещё до того, как человек начал. На оси
                  усы круга: длинный целится в активный кадр, короткий —
                  напротив; своя сущность, не усы курсора.

     Смотрит: на курсор — на путь, пройденный им по X (ведение), и на угол,
     который он наматывает вокруг точки нажатия (кручение). Обе величины
     непрерывны и бесконечны, упоров нет.

     Реагирует: щелчком — непрерывный вход квантуется дискретной лентой,
     кадр меняется скачком и отзывается сухим щелчком в динамике.

     Закон: 10 «Догон» (под курсором всегда элемент: непрерывный вход
     квантуется сеткой кадров, реакция щелчком) и 11 «Шлейф» (каждый квант
     пути — ровно один шаг: оборот руки делится на «кадров за оборот»).
     Оригинал стоит на 3б «Коридоре»: доля высоты, зажатая шириной экрана,
     — за края не выходит и не обрезается ни на какой ширине. На том же
     коридоре стоит круг: его центр — точка нажатия, зажатая полем
     «радиус + поле от края», чтобы круг помещался в экран целиком.
     Ось кручения ходит вместе с центром: крестик не имеет права врать
     о точке, вокруг которой человек кружится.

     Приём: «Совмещённый жест — драг как клик и курсор» (карточка в
     «ИТМО — Вёрстка/Приёмы взаимодействий»). Нажатие ставит сцепку и несёт
     восприятие (оригинал берёт кадр), протягивание несёт навигацию (угол
     листает ленту), отпускание рвёт сцепку — значения остаются. Автомат
     трёх жестов: не нажато → ведение; нажал и отпустил в пределах порога →
     тычок; нажал и повёл дальше порога → кручение.

     Сцепка ставится вместе с кругом, по удержанию: лента встаёт на кадр
     оригинала, и кручение продолжает счёт от того, что человек видит
     крупно, а не от того, куда её увело ведение. Та же задержка, что
     отделяет тычок от удержания, отделяет и «взять кадр из зеркала» от
     «продолжить от оригинала». На отпускании коммитить нечего: после
     сцепки лента и оригинал идут в ногу.

     Только мышь (паспорт, «Диапазон»): на пальце нет состояния «двигаю, не
     нажимая», а на нём держится ведение. Узкие ширины проверяются на
     раскладку и панель, а не на жест.

     Параметры адреса: ?stop=мс — стоп-кадр (стенд встаёт в фазу кручения:
     зеркало выросло, круг проявляется, часы замерли на названной отметке),
     ?reset=1, ?theme=nothing, ?panel.
     Память: localStorage['galereya-m7-params'].
     ============================================================ */
  /* Алфавит гарнитур свода — из него выбирает орган «Гарнитура» в панели.
     Медианный системный гротеск в наборе не участвует (правило алфавита). */
  @font-face { font-family:'Editorial New'; src:url('/fonts/EditorialNew-Regular.woff') format('woff'); font-display:swap; }
  @font-face { font-family:'Dentegra Display'; src:url('/fonts/DentDisplay-Regular.woff2') format('woff2'); font-display:swap; }
  @font-face { font-family:'Even Mono'; src:url('/fonts/EvenMono-Regular.woff2') format('woff2'); font-display:swap; }
  @font-face { font-family:'JetBrains Mono'; src:url('/fonts/JetBrainsMono-Regular.woff2') format('woff2'); font-display:swap; }
  @font-face { font-family:'Pragmatica Next VF'; src:url('/fonts/PragmaticaNextVF.woff') format('woff'); font-weight:100 900; font-stretch:50% 100%; font-display:swap; }
  @font-face { font-family:'Apple II Screen Typeface'; src:url('/fonts/AppleIIScreenTypeface.woff2') format('woff2'); font-display:swap; }

  html,body{height:100%;margin:0;background:#000;overflow:hidden}
  /* Только СВОЙ канвас. Голое правило canvas{} накрывало и канвасы панели —
     квадрат пипетки и редакторы кривых становились position:fixed на весь
     экран: панель показывала градиент во всё окно. Инструмент живёт в том же
     документе, что сцена, и общие имена тегов у них общие. */
  #gl{position:fixed;inset:0;width:100vw;height:100dvh;display:block;cursor:grab;touch-action:none}
  #gl.grabbing{cursor:grabbing}
  .nogl{color:#fff;font:400 14px/1.5 'Pragmatica Next VF',system-ui,sans-serif;padding:24px}

  /* Подпись-первоисточник ОРИГИНАЛА: низ по центру, выключка по центру.
     Гарнитура, кегль, ширина, отбивка и плотность приходят ручками (см. скрипт);
     здесь остаётся только то, что законом задано намертво. */
  /* Подпись набрана как дескриптор каталога: та же гарнитура, тот же кегль,
     та же разрядка долей кегля, тот же интерлиньяж 150 % и тот же верхний
     регистр законом, а не набором. Две страницы одного сайта — служебный
     слой у них общий; цвет расходится, потому что расходятся поля: там
     типографика на белом, здесь на чёрном. */
  .cap{position:fixed;left:50%;transform:translateX(-50%);text-align:center;font-weight:400;
       line-height:1.5;text-transform:uppercase;z-index:40;pointer-events:none;word-break:break-word}
  /* Номер кадра: встаёт справа сверху от крестика. Координаты приходят из
     кадра (они выводятся из оси), поэтому здесь только то, что законом
     задано намертво: подъём над точкой на свою высоту и невмешательство
     в жест. Гарнитуру и кегль даёт скрипт. */
  .nomer{position:fixed;transform:translateY(-100%);font-weight:400;line-height:1;
         z-index:40;pointer-events:none;white-space:nowrap;display:none}
  /* ФИРМЕННЫЙ СЛОЙ (перенос из стенда каталога, 08.09): знак с ®, нижний
     логотип, дата и счётчик съёмок. Разметка, стиль и закон места взяты
     оттуда без правки — две страницы одного сайта; расходится только цвет,
     он выводится от светлоты фона, как у остальных ярлыков галереи. */
  /* ЯРЛЫКИ СПРЯТАНЫ ДО ПЕРВОЙ РАСКЛАДКИ. `position:fixed` без координат
     ставит строку в левый верхний угол, и она видна ОТТУДА, пока скрипт ещё
     не начал считать: данные галереи весят мегабайты, и до их разбора
     разметка уже нарисована. Оттого счётчик коллекции прыгал сверху на
     горизонт каждую перезагрузку. Прячем видимостью, а не показом: `display`
     у слоя рабочий, им управляют ручки и видимость луча. Снимает скрытие
     stavitVeer, когда места посчитаны. */
  .yar{position:fixed;z-index:40;margin:0;white-space:nowrap;line-height:1;pointer-events:none;visibility:hidden}
  .znak{display:block}
  .znak svg{display:block;height:100%;width:auto}
  #data{white-space:nowrap}
  #data p{margin:0}
  #dataGod{position:absolute;left:0;top:0}
  #nazvanie{text-transform:uppercase}
  .veer{text-transform:uppercase;text-align:left}   /* левый край и ось поворота ставит скрипт: посадка и выключка */
  /* Каналы — кнопки: свой слой над ярлыками, курсор палец, без инверсии.
     Перенос из стенда каталога (08.09): те же иконки, тот же слой. */
  #kanaly{position:fixed;z-index:42;display:flex;flex-direction:column;visibility:hidden;left:0;top:0}
  .kanal{display:block;border-radius:50%;overflow:hidden;cursor:pointer;
         -webkit-tap-highlight-color:transparent}
  .kanal img,.kanal svg{display:block;width:100%;height:100%}
  /* Свой курсор: кольцо с разрывом, точка под остриём и два уса — подсказка
     жеста, а не украшение. Живёт в DOM поверх сцены, координаты приходят от
     указателя; системный курсор на сцене при этом гасится. */
  /* Слово-подсказка внутри кольца: стоит на вертикальной оси, на доле
     радиуса от центра. Живёт в той же фазе, что круг, крестик и номер. */
  /* Усы круга — отдельная сущность, не те, что у курсора. Живут на оси,
     показывают активный кадр и приходят своим движением. Разрыв связи с
     усами иконки убрал четыре связанных лерпа и их рассинхрон. */
  .usy{position:fixed;transform:translate(-50%,-50%);z-index:39;pointer-events:none;
       display:none;overflow:visible}
  .slovo{position:fixed;transform:translate(-50%,-50%);font-weight:400;line-height:1;
         z-index:40;pointer-events:none;white-space:nowrap;display:none}
  /* Надпись в зеркале: стоит в его середине и едет вместе с рамкой. Тот же
     класс набора, что у слова в кольце, — оба подсказки на сцене. */
  .zakryt{position:fixed;transform:translate(-50%,-50%);font-weight:400;line-height:1;
          z-index:46;pointer-events:none;white-space:nowrap;display:none}
  /* Слой над холстом: усы, номер, слово, подпись. Одна обёртка, чтобы
     вырез по рамке зеркала (clip-path) делался в одном месте — и чтобы
     курсор остался снаружи, над всем. */
  .sloi{position:fixed;inset:0;z-index:40;pointer-events:none}
  .kursor{position:fixed;left:0;top:0;z-index:45;pointer-events:none;display:none;
          transform:translate(-50%,-50%);will-change:transform}
  .kursor svg{display:block;overflow:visible}
</style>

/* Порядок ходов: значения (DEFAULTS и P) → места → панель → эффект.
   Закон стенда словами и приём со склада названы в шапке файла, выше. */
'use strict';

/* ── КРИВЫЕ (для органа «кривая» и для стенда — одни и те же) ────── */
var EASES = {
  'линейный':   function (t) { return t; },
  'разгон':     function (t) { return t * t * t; },
  'торможение': function (t) { return 1 - Math.pow(1 - t, 3); },
  'плавный':    function (t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; },
  'выброс':     function (t) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};
var BEZ_APPROX = {
  'линейный':   [0.25, 0.25, 0.75, 0.75], 'разгон': [0.32, 0, 0.67, 0],
  'торможение': [0.33, 1, 0.68, 1], 'плавный': [0.65, 0, 0.35, 1],
  'выброс':     [0.34, 1.56, 0.64, 1],
};
function cubicBezierY(b, t) {
  var x1 = b[0], y1 = b[1], x2 = b[2], y2 = b[3], s = t;
  for (var i = 0; i < 8; i++) {
    var x = 3 * (1 - s) * (1 - s) * s * x1 + 3 * (1 - s) * s * s * x2 + s * s * s;
    var dx = 3 * (1 - s) * (1 - s) * x1 + 6 * (1 - s) * s * (x2 - x1) + 3 * s * s * (1 - x2);
    if (Math.abs(dx) < 1e-6) break;
    s -= (x - t) / dx; if (s < 0) s = 0; if (s > 1) s = 1;
  }
  return 3 * (1 - s) * (1 - s) * s * y1 + 3 * (1 - s) * s * s * y2 + s * s * s;
}
function evalEase(name, bez, t) {
  if (name === 'bezier') return cubicBezierY(bez, t);
  return (EASES[name] || EASES['линейный'])(t);
}

(function(){

  var SYOMKI=window.SYOMKI||{}, KLYUCHI_SYOMOK=Object.keys(SYOMKI);

     уменьшение без мипов — это выборка двух соседей из восьми: деталь
     превращается в кашу, и чем крупнее исходник, тем хуже. WebGL1 мипов на

  /* ── шейдеры: один вершинный (квад в px, top-left origin) + два фрагментных (текстура / цвет-диск) ── */
  function sh(t,src){ var s=gl.createShader(t); gl.shaderSource(s,src); gl.compileShader(s);
    if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
  function prog(fs){ var p=gl.createProgram();
    p._vs=sh(gl.VERTEX_SHADER,"attribute vec2 aPos;uniform vec4 uRect;uniform vec4 uUV;uniform vec2 uView;varying vec2 vUV;void main(){vUV=uUV.xy+aPos*uUV.zw;vec2 p=uRect.xy+aPos*uRect.zw;gl_Position=vec4(p.x/uView.x*2.0-1.0,1.0-p.y/uView.y*2.0,0.0,1.0);}");
    gl.attachShader(p,p._vs); gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(p);
    if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    p.uRect=gl.getUniformLocation(p,"uRect"); p.uUV=gl.getUniformLocation(p,"uUV"); p.uView=gl.getUniformLocation(p,"uView"); return p; }
  var pTex=prog("precision mediump float;varying vec2 vUV;uniform sampler2D uTex;uniform float uAlpha;void main(){vec4 c=texture2D(uTex,vUV);gl_FragColor=vec4(c.rgb,c.a*uAlpha);}");
  pTex.uAlpha=gl.getUniformLocation(pTex,"uAlpha");
  var pCol=prog("precision mediump float;varying vec2 vUV;uniform vec4 uColor;uniform float uCircle;void main(){float a=1.0;if(uCircle>0.5){float r=length(vUV-vec2(0.5));a=1.0-smoothstep(0.34,0.5,r);}gl_FragColor=vec4(uColor.rgb,uColor.a*a);}");
  pCol.uColor=gl.getUniformLocation(pCol,"uColor"); pCol.uCircle=gl.getUniformLocation(pCol,"uCircle");
  var quad=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,quad);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,0,1,0,0,1,1,1]),gl.STATIC_DRAW);
  function bindQuad(p){ var loc=gl.getAttribLocation(p,"aPos"); gl.bindBuffer(gl.ARRAY_BUFFER,quad); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0); }

  /* ── ПЕРЕБОР ЯРЛЫКОВ (перенос из стенда каталога, где им живут дескрипторы
     коллекции). Там перебор делает две работы — пересобирает текст при смене
     коллекции и растворяет его удержанием; здесь нужна вторая: номер и слово
     не гаснут прозрачностью, а собираются и рассыпаются знак за знаком.
     Долю берёт фаза круга, своего времени у перебора нет — две величины об
     одном спорили бы, как и у крестика. ── */
  /* ── ПЕРЕСБОРКА ТЕКСТА (порт набора из горизонтального лонгрида) ──
     Буква меняется на букву своего регистра и алфавита, цифра на цифру,
     знаки препинания не трогаются: перебор без сдвига в моноширинном наборе.
     Случайности нет — хеш jit от зерна и номера буквы: воспроизводимо. */
  var ALF={ lat:{lo:'abcdefghijklmnopqrstuvwxyz',up:'ABCDEFGHIJKLMNOPQRSTUVWXYZ'},
            kir:{lo:'абвгдежзийклмнопрстуфхцчшщэюя',up:'АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЭЮЯ'} };
  var CIFRY='0123456789', ZNAKI='.,;:!?—–-()“”’/*+#', NBSP='\u00A0';
  function probel(ch){ return ch===' '||ch==='\n'||ch===NBSP; }
  function jit(seed,i){ var x=Math.sin(seed*37.7+i*13.31)*43758.545; return x-Math.floor(x); }
  function flapChar(ch,n){
    var lo=ch.toLowerCase(), up=ch.toUpperCase();
    if(lo===up) return (ch>='0'&&ch<='9') ? CIFRY[n%10] : ZNAKI[n%ZNAKI.length];
    var code=ch.charCodeAt(0);
    var a=(!P.pereborLat&&code>=0x400&&code<=0x4FF)?ALF.kir:ALF.lat;
    var set=(ch===up)?a.up:a.lo;
    return set[n%set.length];
  }
  /* Фронт идёт по НОВОМУ тексту слева направо: за фронтом новая буква,
     на фронте перещёлк, перед фронтом ещё старая (пока старый текст не
     кончился). Порог буквы с дрожью, чтобы фронт не был линейкой. */
  /* Фронт идёт по НОВОМУ тексту слева направо: за фронтом новая буква,
     на фронте перещёлк, перед фронтом ещё старая (пока старый текст не
     кончился). Порог буквы с дрожью, чтобы фронт не был линейкой. */
  function peresobrat(staroe,novoe,seed,p,tick,win,obratno){
    if(p>=1) return novoe;
    var L=novoe.length, out='';
    for(var i=0;i<L;i++){
      var ch=novoe[i];
      if(probel(ch)){ out+=ch; continue; }
      /* Место знака в очереди фронта: слева направо или справа налево.
         Считается не сам порог, а с какого конца его мерить, — дрожь берётся
         от того же номера, иначе на развороте она перескакивала бы. */
      var j=obratno?(L-1-i):i;
      var t=(j+jit(seed,j)*2.2)/(L+2.2);
      var znak=ch.toLowerCase()===ch.toUpperCase()&&!(ch>='0'&&ch<='9');
      if(p>=t) out+=ch;
      else if(p>0&&t-p<win) out+=znak?ch:flapChar(ch,tick+i*7+seed*3);
      else out+=(i<staroe.length&&!probel(staroe[i]))?staroe[i]:(znak?ch:NBSP);
    }
    return out;
  }

  function rastvorit(staroe,seed,p,tick,win){
    var L=staroe.length, out='';
    for(var i=0;i<L;i++){
      var ch=staroe[i];
      if(probel(ch)){ out+=ch; continue; }
      if(p>=1){ out+=NBSP; continue; }
      var t=(i+jit(seed,i)*2.2)/(L+2.2);
      var znak=ch.toLowerCase()===ch.toUpperCase()&&!(ch>='0'&&ch<='9');
      if(p>=t) out+=NBSP;                                            // за фронтом — пусто
      else if(t-p<win) out+=znak?ch:flapChar(ch,tick+i*7+seed*3);    // на фронте — перещёлк
      else out+=ch;                                                  // перед фронтом — как было
    }
    return out;
  }

  var VEER=KLYUCHI_SYOMOK.map(function(k,i){

  var N_S=KLYUCHI_SYOMOK.length||1;

  var kanva=document.createElement('canvas').getContext('2d');
  var mer={ capMetki:0, bazData:0, bazGod:0, bazCap:0, shirSchyot:0, vysSchyot:0,
            bazNazv:0, capNazv:0, shirNazv:0 };   // замеры — раз на правку, не в кадре
  function bazovaya(el){
    /* Поворот снимается на время замера: у повёрнутого узла рамка — это
       габарит наклонной строки, и разница верхов даёт не базовую линию, а
       проекцию. Строка от этого гуляла по вертикали при каждой смене имени. */
    /* И показ: у скрытого узла рамка нулевая, щуп отдаёт ноль, и строка
       прыгает на всю высоту базовой линии. Луч уходит за край веера — это
       обычное дело, замер от этого зависеть не должен. */
    var tr=el.style.transform, dsp=el.style.display;
    if(tr) el.style.transform='none';
    if(dsp==='none') el.style.display='';
    var i=document.createElement('i'); i.style.cssText='display:inline-block;width:0;height:0;vertical-align:baseline';
    el.insertBefore(i,el.firstChild);
    var b=i.getBoundingClientRect().top-el.getBoundingClientRect().top;
    el.removeChild(i);
    if(tr) el.style.transform=tr; if(dsp==='none') el.style.display=dsp;
    return b;
  }
  function kapitel(garn,kegl){ kanva.font=kegl+'px "'+garn+'"'; var m=kanva.measureText('H'); return m.actualBoundingBoxAscent||kegl*0.7; }
  /* Середина знаков строки над базовой линией: верх минус низ пополам. Для
     прописных без выносных это половина капители, для строки с хвостами —
     меньше. Горизонт ложится именно сюда: не на базовую линию, не на верх
     и не на низ, а на середину того, что видно. */
  function seredinaZnakov(tekst,garn,kegl){
    kanva.font=kegl+'px "'+garn+'"';
    var m=kanva.measureText(tekst||'H');
    var asc=m.actualBoundingBoxAscent||kegl*0.7, desc=m.actualBoundingBoxDescent||0;
    return (asc-desc)/2;
  }
  /* Оси переменного шрифта пишутся напрямую: через font-weight браузер

  function shrift(el,garn,kegl,razr,lh,tol,shir){

  }
  /* Счётчик пишется отдельно от набора: съёмку меняет ручка, и текст надо

  function pisatSchyot(){
    if(!schyotEl) return;
    var i=KLYUCHI_SYOMOK.indexOf(tekSyomka), sy=SYOMKI[tekSyomka];
    schyotEl.textContent=P.schyot?(pad3((i<0?0:i)+1)+'—'+KLYUCHI_SYOMOK.length):'';
    /* На сцене имя стоит по-английски, как в стенде каталога: гарнитура
       имён набрана для латиницы, и две страницы одного сайта подписаны
       одинаково. Русское имя остаётся в панели — она разговаривает с
       человеком, а не с сайтом. */
    /* Имена всех лучей: у каждого своё, и ширина меряется у каждого — одна
       ширина на всех двигала бы правый край чужих лучей (урок каталога). */
    VEER.forEach(function(e,i){
      var s=SYOMKI[KLYUCHI_SYOMOK[i]];

    mer.shirVeer=VEER.map(function(e){
      var d=e.style.display, tr=e.style.transform;

    /* ДАТА: день и месяц из часов, год прибит. Третья строка — точка, она

    /* Красятся и лучи веера: цвет им не наследуется, а `.yar` его не задаёт —

    /* ПОКАЗ — ТОЛЬКО ПОСЛЕ РАСКЛАДКИ. `.yar` стоит fixed без координат, и до
       первого расчёта строка висит в левом верхнем углу. Сбор фирменного слоя

    FIRMA.concat(VEER).forEach(function(e){ e.style.color=cF; e.style.display=''; });

  function stavitFirmu(){

    var znakW=znakEl.getBoundingClientRect().width||P.znakRazmer*(44/21.2676);   // ширина знака — замером, пропорция вьюбокса лишь запасной путь

    logoNizEl.style.transformOrigin='47.96% 53.02%';

    dataEl.style.left=linia.toFixed(1)+'px';

    /* ПОДПИСЬ садится базовой линией на базовую линию года: две вещи разной

       ПОСАДКА — точка на пути от центра окна до правого края; выключка
       говорит, каким краем имя сидит на этой точке. Поле имени идёт от
       центра окна до точки, потому правый край один при любой выключке. */
    /* ВЕЕР. Каждое имя сидит на своём луче: угол — расстояние до главного в
       шагах, отсчёт по кольцу. Плотность гаснет двумя ступенями одной кривой —

  function stavitVeer(){
    if(!W||!VEER.length) return;
    /* Горизонт держит СЕРЕДИНУ ЗНАКОВ строки: верх и низ её глифов берутся
       у самой строки, и на линию ложится их середина — не базовая линия, не
       верхняя и не нижняя кромка. Сдвиг — на случай, когда глазу нужна
       поправка к геометрии. */
    var gorY=H*P.gorizont/100, topV=(gorY+mer.capNazv/2-mer.bazNazv+P.imyaSdvig).toFixed(1)+'px';
    var osY=(mer.bazNazv-mer.capNazv/2-P.imyaSdvig).toFixed(2)+'px';
    var tochka=W/2*P.posadka/100, vyk=P.vyklyuchka;
    /* ВИДНО. «Только главный» — край в полушаге: имя гаснет, уходя с
       горизонтали, а соседнее приходит ему навстречу тем же поворотом;
       закон один, разный только край. «Все лучи» — веер до ±90° и зона
       кольца за ними. */
    var odin=(P.veerVid==='odin');
    var shagV=Math.max(1,P.shagVeera), kray=odin?shagV/2:90+shagV/2;
    var plS=1-P.priglSoseda/100, plK=P.plotKraya/100;
    for(var iV=0;iV<VEER.length;iV++){
      var e=VEER[iV];
      if(!P.imya){ e.style.display='none'; continue; }
      var d=iV-st.veer; d=(((d+N_S/2)%N_S)+N_S)%N_S-N_S/2;     // кольцо: −N/2 … N/2
      var ug=d*shagV, au=Math.abs(ug);
      if(au>=kray){ e.style.display='none'; continue; }
      var pl;
      if(odin) pl=1-evalEase(P.gasheniyeEase,P.gasheniyeBez,Math.min(1,au/(shagV/2)));
      else {
        if(au<=shagV) pl=1-(1-plS)*evalEase(P.gasheniyeEase,P.gasheniyeBez,au/shagV);
        else pl=plS-(plS-plK)*evalEase(P.gasheniyeEase,P.gasheniyeBez,Math.max(0,Math.min(1,(au-shagV)/Math.max(1,90-shagV))));
        if(au>90) pl*=1-(au-90)/(shagV/2);
      }
      var wI=(mer.shirVeer&&mer.shirVeer[iV])||0;
      var ots=vyk==='left'?0:vyk==='right'?tochka-wI:tochka/2-wI/2;   // левый край имени от центра окна
      e.style.display=''; e.style.opacity=pl.toFixed(3);
      e.style.left=(W/2+ots).toFixed(1)+'px'; e.style.top=topV;
      e.style.transformOrigin=(-ots).toFixed(2)+'px '+osY;
      e.style.transform='rotate('+ug.toFixed(2)+'deg)';
    }
    /* СЧЁТЧИК — в зазоре между правым краем имени и правым краем окна, на
       доле этого пути. Правый край имени один при любой выключке и при любом
       имени, поэтому счётчик стоит на месте, а не пляшет за длиной слова. */
    /* Раскладка прошла — слой можно показывать: места у всех строк уже свои.
       Счётчик ниже получает показ по своей ручке, поэтому флаг поднимается
       здесь, до него. */
    /* Снимаем у ВСЕХ ярлыков, а не только у фирменных: прячет их общий класс,
       и забытый в списке узел остался бы невидимым навсегда. */
    if(!firmaRazlozhena){ firmaRazlozhena=true; document.querySelectorAll('.yar').forEach(function(e){ e.style.visibility='visible'; }); }
    var zz=H*P.zazor/100;
    var levo=W/2+tochka+zz, pravo=W-zz-mer.shirSchyot;
    schyotEl.style.display=P.schyot?'':'none';
    schyotEl.style.left=(levo+Math.max(0,pravo-levo)*P.nomerKollMesto/100).toFixed(1)+'px';
    schyotEl.style.top=topV;
  }

  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ sobratFirmu(); });

  /* КАНАЛЫ. Адреса живут в коде, а не в разметке: ссылка — величина стенда,

  var kanalyEl=document.getElementById('kanaly');

  var usyEl=document.getElementById("usy"), usyD=document.getElementById("usyD"),
      usyG=document.getElementById("usyG");
  var usyGab='';                                             // габарит усов, уже записанный в DOM // без ручки
  function usySkryt(){ if(usyEl.style.display!=="none") usyEl.style.display="none"; }
  var kurEl=document.getElementById("kursor"),  kurG=document.getElementById("kursorG"),
      kurD=document.getElementById("kursorDuga"), kurS=document.getElementById("kursorUsy"),
      kurT=document.getElementById("kursorTochka");
  /* Иконка строится из ручек, а не лежит готовой картинкой, по компоненту
     макета «for vibe code», узел 4028:44141: кольцо с разрывом, точка в
     центре и два уса по оси, выходящие за кольцо через зазор. Габарит
     выводится из трёх величин — кольцо, зазор, ус, — своей ручки у него
     нет: она спорила бы с ними. Усы показывают, на сколько иконка
     провернулась; одно кольцо этого не показывает. Всё в системе 0…100,
     наружу масштабируется шириной иконки, поэтому толщина линии
     переводится в ту же систему. */
  var KUR_SIST=100;                                           // система координат иконки // без ручки
  /* Геометрия зависит от ДОЛИ УХОДА hk: 0 — иконка собрана, 1 — ушла в
     кружение. Иконка схлопывается НА МЕСТЕ: дуга укорачивается до нуля,
     усы — вслед за ней, поперечник кольца сжимается на заданную долю.
     Габарит постоянный: к кругу ничего не летит, у круга свои усы. */
  var gabBylo=-1, tolschBylo='';                              // что уже записано в DOM // без ручки
  function sobratKursor(hk){
    hk=Math.max(0,Math.min(1,hk||0));
    var pol=P.kursorKolco/2+P.kursorZazor+P.kursorUs;         // половина габарита — постоянная
    var GAB=Math.max(2,pol*2), k=KUR_SIST/GAB;                // px → система иконки
    if(GAB!==gabBylo){ kurEl.style.width=GAB+"px"; kurEl.style.height=GAB+"px"; gabBylo=GAB; }
    st.kursGab=GAB;                                           // габарит нужен кадру для точки

    var R=(P.kursorKolco/2)*(1-P.kursorKolcoSzhatie/100*hk)*k;// кольцо сжимается к своей точке
    var duga=Math.max(0,Math.min(360,P.kursorDuga))*(1-hk);   // и укорачивается до нуля
    function na(gr){ var r=gr*Math.PI/180; return [50+R*Math.cos(r), 50+R*Math.sin(r)]; }
    var rr=R.toFixed(2);
    if(duga<=0.5) kurD.setAttribute("d","");
    else if(duga>=360) kurD.setAttribute("d","M"+(50-R).toFixed(2)+",50 A"+rr+","+rr+" 0 1 1 "+(50+R).toFixed(2)+",50 A"+rr+","+rr+" 0 1 1 "+(50-R).toFixed(2)+",50");
    else { var p0=na(-90), p1=na(-90-duga);
      kurD.setAttribute("d","M"+p0[0].toFixed(2)+","+p0[1].toFixed(2)+" A"+rr+","+rr+" 0 "+(duga>180?1:0)+" 0 "+p1[0].toFixed(2)+","+p1[1].toFixed(2)); }

    /* Усы иконки укорачиваются вместе с дугой, по её же доле: обе части

    var u0=(P.kursorKolco/2+P.kursorZazor)*k, us=P.kursorUs*(1-hk)*k;

  /* Видимость и рука. Иконка живёт на сцене всё время, пока на ней

  function kursorVidim(){
    /* Над кликаемым иконка остаётся на экране свёрнутой: она уходит тем же
       ходом, что уводит её в кружение, — гасить её сразу значило бы рвать
       переход. Системный курсор там показывает палец: место кликаемое. */
    var est=P.kursor && st && (st.kursNaSczene||st.nadKlikom);

    if(!cv) return;
    cv.style.cursor = !P.kursor ? (st&&st.nadKlikom?'pointer':'')
                    : (st&&st.nadKlikom)?'pointer':((st&&st.kursDerzhim)?'grabbing':'none');
  }
  /* Один вход для обоих кликаемых мест: рамки зеркала и кнопок каналов.
     Ход иконки заводится только на смене состояния — иначе каждый кадр
     движения перезапускал бы часы перехода. */
  function nadKlikom(da){
    if(!st||st.nadKlikom===da) return;

  /* РАЗВОРОТ С ЛЮБОГО МЕСТА (П9). Новый ход стартует не с нуля, а с
     зеркальной доли того, что успел пройти старый: отпустил посреди ухода —
     сборка начинается оттуда, где уход её застал. Иначе дуга, ушедшая на
     треть, прыгала бы в ноль и росла заново. Часы возвращают старт,
     сдвинутый в прошлое на уже «пройденный» остаток. Старый ход прошёл
     целиком (или его не было) — новый стартует сейчас. */
  function razvernutChasy(t0,msBylo,msStalo,now){
    var u=msBylo>0?Math.max(0,Math.min(1,(now-t0)/msBylo)):1; // доля старого хода
    return now-(1-u)*msStalo;
  }
  /* Переход иконки — три пары часов от одного события: дуга (уход и

     кольца и уход точки (у них одно время в обе стороны). Направление
     держит kursSvorot; доли считает кадр, здесь только старты. */
  function vestiKursorHod(svorachivaem){
    if(st.kursSvorot===svorachivaem) return;
    var now=performance.now();
    st.kursT0  =razvernutChasy(st.kursT0, st.kursSvorot?P.kursorKolcoUhod:P.kursorKolcoSborka,
                                          svorachivaem?P.kursorKolcoUhod:P.kursorKolcoSborka, now);
    st.gashT0  =razvernutChasy(st.gashT0,  P.kursorKolcoGash,  P.kursorKolcoGash,  now);
    st.tochkaT0=razvernutChasy(st.tochkaT0,P.kursorTochkaUhod,P.kursorTochkaUhod,now);
    st.kursSvorot=svorachivaem;
  }

     id→первоисточник остаётся в данных: её показывает стенд каталога.

  function syncCap(now,dolyaFazy,dSkl){
    /* Подписи нет вне кружения: она приходит с кольцом и уходит с ним.

    if(dolyaFazy<=0.002){ if(capEl.style.display!=='none') capEl.style.display='none'; return; }

  }

  /* ── НАПЛЫВ НА СКЛЕЙКЕ — порт режима flicker01 из arqe (шаблон «Flicker 10»,
     templates.arqe.ai/list). Там кадры сменяются сами, по времени —
     duration/count на склейку, — и внутри склейки кадр приходит крупнее на
     половину размаха, оседает в размер хвостом кривой (от самого крутого её
     места к концу), а под конец уходит головой кривой дальше, навстречу
     следующей склейке. Здесь склейки делает рука (setCur), следующая
     приходит когда угодно, поэтому уход снят: без него кадр в покое остался
     бы мельче размера. Шаг «eased» (неравные склейки по кривой) руке не
     нужен — темп склеек задаёт она. ── */
  /* Точка пика кривой — где её наклон наибольший (порт функции arqe):
     оседание идёт от неё до конца кривой. Симметричная и линейная кривые
     дают середину. Считается на правке ручки, не в кадре. */
  function tochkaPika(b){
    var x1=b[0],y1=b[1],x2=b[2],y2=b[3], F=.5, nakl=0, menyalsya=false, SHAGOV=200;
    for(var i=1;i<SHAGOV;i++){ var t=i/SHAGOV, u=1-t;
      var dx=3*u*u*x1+6*u*t*(x2-x1)+3*t*t*(1-x2), dy=3*u*u*y1+6*u*t*(y2-y1)+3*t*t*(1-y2);
      if(dx<1e-6) continue;
      var k=dy/dx;
      if(nakl>0 && Math.abs(k-nakl)>.01) menyalsya=true;
      if(k>nakl+.01){ nakl=k; F=3*u*u*t*x1+3*u*t*t*x2+t*t*t; } else if(nakl===0) nakl=k;
    }
    return menyalsya?Math.max(.05,Math.min(.95,F)):.5;
  }
  function ruchkiKrivoy(imya,bez){ return imya==='bezier'?bez:(BEZ_APPROX[imya]||BEZ_APPROX['линейный']); }
  /* Два набора ручек на один закон: зеркало — fliker*, оригинал — flikerO*.
     Приставка выбирает набор; часы у каждого свои. */
  var flikerPik={'':.5,'O':.5};                               // пик кривой оседания каждого набора
  function flikerHod(now,t0,pre){
    var r={masht:1,dx:0,dy:0}, k='fliker'+pre, vid=P[k+'Vid'], ms=P[k+'Ms'];
    if(vid==='net'||reduced||t0<0||ms<=0) return r;
    var u=(now-t0)/ms;
    if(u>=1) return r;
    var ease=P[k+'Ease'], bez=P[k+'Bez'], de=flikerPik[pre], Ke=evalEase(ease,bez,de);
    var e=evalEase(ease,bez,de+(1-de)*Math.max(0,u));                    // хвост кривой: от пика к концу
    var ost=1-Math.max(0,Math.min(1,(e-Ke)/Math.max(.001,1-Ke)));        // сколько наплыва ещё осталось
    if(vid==='masht'){ var a=P[k+'Masht']/100/2; r.masht=1+(P[k+'Napr']==='naplyv'?a:-a)*ost; }
    else { var d=(P[k+'Sdvig']/100/2)*ost, st_=P[k+'Storona'];            // пришёл со сдвигом, оседает в центр
      if(st_==='left') r.dx=d; else if(st_==='right') r.dx=-d;
      else if(st_==='up') r.dy=d; else r.dy=-d; }
    return r;
  }

  /* ── закон подписи и фона: всё, что живёт в DOM и в очистке канваса.
        Зовётся на старте и на каждой правке ручки (onChange). ── */
  var bgLum=0;                       // светлота фона (0 тёмный … 1 светлый) — от неё контраст точек круга
  function hexRgb(hex){
    var v=parseInt(String(hex).slice(1),16);
    return [((v>>16)&255)/255, ((v>>8)&255)/255, (v&255)/255];
  }
  function primenit(){
    var c=hexRgb(P.fon);
    gl.clearColor(c[0],c[1],c[2],1);
    bgLum=0.2126*c[0]+0.7152*c[1]+0.0722*c[2];
    document.body.style.background=P.fon;                     // и подложка страницы — в тот же цвет
    capEl.style.fontFamily=P.garnitura+', ui-monospace, monospace';
    capEl.style.fontSize=P.keglCap+'px';
    capEl.style.letterSpacing=(P.keglCap*P.razryadkaCap/100).toFixed(2)+'px';   // разрядка долей кегля, как у ярлыков
    capEl.style.width=P.shirinaCap+'vw';
    capEl.style.color=(bgLum>0.5?'rgba(0,0,0,':'rgba(255,255,255,')+(P.plotnostCap/100)+')';  // подпись контрастна фону
    nomEl.style.fontFamily='"'+P.yarlykGarnitura+'", ui-monospace, monospace';   // гарнитура ярлыков — своя ручка
    var yarKegl=P.yarlykKegl+'px';
    var yarRazr=(P.yarlykKegl*P.yarlykRazryadka/100).toFixed(2)+'px';
    var yarCvet=(bgLum>0.5?'rgba(0,0,0,':'rgba(255,255,255,')+(P.yarlykPlot/100)+')';   // тот же закон контраста, что у точек
    nomEl.style.fontSize=yarKegl; nomEl.style.letterSpacing=yarRazr; nomEl.style.color=yarCvet;
    slovoEl.style.fontFamily='"'+P.yarlykGarnitura+'", ui-monospace, monospace';   // гарнитура ярлыков — своя ручка
    slovoEl.style.fontSize=yarKegl; slovoEl.style.letterSpacing=yarRazr; slovoEl.style.color=yarCvet;
    zakrytEl.style.fontFamily='"'+P.yarlykGarnitura+'", ui-monospace, monospace';   // тот же набор, что у слова
    zakrytEl.style.fontSize=yarKegl; zakrytEl.style.letterSpacing=yarRazr; zakrytEl.style.color=yarCvet;
    var kc=(bgLum>0.5?'rgba(0,0,0,':'rgba(255,255,255,')+(P.kursorPlot/100)+')';
    kurD.setAttribute('stroke',kc); kurS.setAttribute('stroke',kc); kurT.setAttribute('fill',kc);
    kursorVidim();                                            // геометрию иконки собирает кадр; здесь видимость и рука
    flikerPik['']=tochkaPika(ruchkiKrivoy(P.flikerEase,P.flikerBez));    // пик кривой оседания — раз на правку, не в кадре
    flikerPik['O']=tochkaPika(ruchkiKrivoy(P.flikerOEase,P.flikerOBez));
    stavitKanaly();                                           // размер, шов и место группы — из ручек
    sobratFirmu();                                            // набор, замеры и место фирменного слоя
  }
  primenit();

  /* ── текстуры из вшитых фото; до загрузки кадр рисуется серым квадом того же аспекта.
        Готовые держатся по ключу съёмки: вторая и следующие смены мгновенны. ── */
  function sobratTeksty(kadry){ return kadry.map(function(ph){
    var o={tex:gl.createTexture(),ready:false,w:ph.w,h:ph.h};
    var img=new Image();
    img.onload=function(){
      gl.bindTexture(gl.TEXTURE_2D,o.tex);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);   // не-степень-двойки: только clamp
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      if(GL2){ gl.generateMipmap(gl.TEXTURE_2D);                            // уменьшение идёт по мипам, а не по двум соседям
               gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR); }
      else     gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
      if(ANIZ) gl.texParameterf(gl.TEXTURE_2D,ANIZ.TEXTURE_MAX_ANISOTROPY_EXT,Math.min(8,ANIZ_MAX));
      o.ready=true;
    };
    img.src=ph.d; return o;
  }); }

  /* Шаг скролла двигает ЦЕЛЬ ВЕЕРА, а не съёмку напрямую: съёмка меняется
     сама, когда на горизонталь выходит новое имя. Между шагами веер идёт
     своим временем и кривой — это и есть смещение по дуге. */
  function menyatSyomku(shag){
    click();                                                   // смена съёмки щёлкает так же, как склейка кадра
    var cel=Math.round(st.veerCel)+shag;
    st.veerCel=cel;
    st.dosadka={ot:st.veer,do:cel,t0:performance.now(),ms:P.dosadkaMs};
    return KLYUCHI_SYOMOK[((cel%N_S)+N_S)%N_S];
  }
  /* Съёмка на сцене — та, чьё имя стоит на горизонтали. Ручка «Съёмка» ведёт
     то же значение, поэтому её двигаем вместе со сценой: иначе следующая же
     правка любой ручки вернула бы прежнюю съёмку через onChange. */
  /* Веер ставится на съёмку без хода: так он встаёт при старте и при правке
     ручки «Съёмка» — ехать по дуге ему тут не от чего. */
  function stavitVeerNa(k){
    var i=KLYUCHI_SYOMOK.indexOf(k); if(i<0) return;
    st.veer=st.veerCel=i; st.dosadka=null; pisatSchyot();
  }
  function sverkaVeera(){
    var i=((Math.round(st.veer)%N_S)+N_S)%N_S, k=KLYUCHI_SYOMOK[i];
    if(k&&k!==tekSyomka){ P.syomka=k; postavitSyomku(k); pisatSchyot(); }
  }

  /* Смена съёмки. Позиция ленты переносится ДОЛЕЙ кольца, а не номером
     кадра: 20-й из 40 становится 16-м из 32 — то же место круга, другой
     кадр. Номер прыгает, место держится; лента остаётся непрерывной. */
  function postavitSyomku(k){
    var sy=SYOMKI[k]||SYOMKI[KLYUCHI_SYOMOK[0]];
    if(!sy) return;
    var dolya=(st&&N)?st.rib/N:0;
    PHOTOS=sy.kadry||[]; SRC=sy.src||{}; N=PHOTOS.length;
    if(!TEKSTY[k]) TEKSTY[k]=sobratTeksty(PHOTOS);
    texs=TEKSTY[k]; tekSyomka=k;
    if(st){ st.rib=N?dolya*N:0; st.cur=curFrame(); st.origCur=st.cur; }   // подпись не следует за кадром — сбрасывать нечего
    pisatSchyot();                                            // съёмка сменилась — счётчик за ней
  }

  /* ── отрисовка примитивов (все координаты в css px, top-left origin) ── */
  var W=0,H=0,DPR=1;
  function drawTex(t,x,y,w,h,alpha,uv){
    if(t.ready){ uv=uv||[0,0,1,1];                            // окно текстуры: целое полотно или вырез под рамку
      gl.useProgram(pTex); bindQuad(pTex);
      gl.uniform2f(pTex.uView,W,H); gl.uniform4f(pTex.uRect,x,y,w,h); gl.uniform4f(pTex.uUV,uv[0],uv[1],uv[2],uv[3]);
      gl.uniform1f(pTex.uAlpha,alpha==null?1:alpha);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,t.tex);
      gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    } else drawCol(x,y,w,h,[0.16,0.18,0.20,1],false); // плейсхолдер до загрузки // без ручки
  }
  function drawCol(x,y,w,h,rgba,circle){
    gl.useProgram(pCol); bindQuad(pCol);
    gl.uniform2f(pCol.uView,W,H); gl.uniform4f(pCol.uRect,x,y,w,h); gl.uniform4f(pCol.uUV,0,0,1,1);
    gl.uniform4f(pCol.uColor,rgba[0],rgba[1],rgba[2],rgba[3]); gl.uniform1f(pCol.uCircle,circle?1:0);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }

  /* ЗАПОЛНЕНИЕ. Рамка зеркала держит свою пропорцию, а кадры бывают любые,
     и вписывать их в неё — значит оставлять поля. Вырез берёт из полотна
     середину нужной формы: шире рамки — режется по бокам, выше — сверху и
     снизу. Порт обрезки обложки из стенда каталога. */
  function vyrezPodRamku(tex,ar){
    var A=tex.w/tex.h;
    return A>ar ? [(1-ar/A)/2,0,ar/A,1] : [0,(1-A/ar)/2,1,A/ar];
  }

  /* ── состояние (та же модель, что в DOM-версии) ── */
  var st={ rib:0,               // ЛЕНТА: непрерывная позиция в кадрах; кольцо = mod N; ничем не сбрасывается
           cur:0,               // кадр зеркала (на управляющей позиции)
           origCur:0,           // кадр оригинала (меняется тычком и кручением)
           openX:null,          // X центра оригинала = точка последнего тычка
           lastX:null,          // опора относительного ведения
           drag:null,           // жест с зажатой кнопкой
           mScale:1, mTarget:1, // масштаб зеркала (покой ↔ прирост, плавно)
           bounceT:-1,          // старт подскока (тычок)
           flikerT0:-1,         // старт наплыва на склейке (смена кадра зеркала)
           flikerOrigT0:-1,     // то же у оригинала — в кружении
           ringOn:false, ringT:-1e9, usyT0:-1e9, krestT0:-1e9, ringTimer:null, ringNa:true,   // часы круга, усов и крестика; ringNa: приходит или уходит
           oHod:0, oFrom:0, oTo:0, oT0:0, oMs:0,     // ход оригинала: 0 в покое, 1 в удержании
           kursNaSczene:false, kursDerzhim:false,             // свой курсор: на сцене / держим
           nadKlikom:false,     // указатель над кликаемым: зеркало или кнопка канала // без ручки — закон, не величина
           kursX:0, kursY:0, kursCelX:0, kursCelY:0,          // где иконка и где указатель: между ними отставание
           tychokX:0, tychokY:0,                              // место тычка: на нём иконка стоит всё удержание
           ugD:null, vD:0, ugL:null, vL:0,                    // угол и скорость поворота: дуга и линия, каждая своя
           ugU:null, vU:0, syrU:null,                         // усы круга: угол, скорость и последняя сырая цель
           kursVX:0, kursVY:0,                                // скорость догона — у пружины она своя величина
           kursSvorot:false,                                  // куда идёт иконка: уходит в кружение или собирается
           kursT0:-1e9, gashT0:-1e9, tochkaT0:-1e9,           // старты часов дуги, гашения и точки; в прошлом — иконка собрана
           schipT:-1,                                         // старт щипка точки на тычке
           oEase:'линейный', oBez:[0.25,0.25,0.75,0.75],
           veer:0, veerCel:0,   // положение веера в съёмках и его цель: ход идёт между ними
           skrollT:-1e9,        // когда скролл последний раз двигал цель
           dosadka:null,        // идёт ход смены: пока он не кончился, колесо занято
           zhest:0, zhestSdelan:false, rostPodryad:0,   // накопленный скролл жеста, сделан ли шаг, сколько событий подряд дельта растёт
           delMax:0, delMinPosle:0,        // пик дельт жеста и дно ПОСЛЕ пика: всплеск считается только когда хвост стаял за пиком
           delPosled:0,                    // дельта предыдущего события — по ней видно, растёт ли рука после разрыва
           momBylo:false,                  // последнее событие было инерцией: следующее событие руки — новое касание
           sklT0:-1, nomCel:'', nomBylo:'', sklObratno:false,   // склейка: часы волны, показанный номер, прежний и сторона фронта
           poChasovoy:true,     // куда последний раз вели ленту: по часовой (вперёд) или против // без ручки — сторона берётся у руки
           ramkaZ:null, ramkaO:null };   // рамки последнего кадра — для карты мест
  postavitSyomku(P.syomka);                                   // материал на сцену до первого кадра
  st.veer=st.veerCel=Math.max(0,KLYUCHI_SYOMOK.indexOf(P.syomka));   // веер смотрит на неё же
  function mod(i){ return ((i%N)+N)%N; }
  function curFrame(){ return mod(Math.round(st.rib)); }

  /* ── звук: тихий сухой щелчок при переключении кадра (синтез Web Audio, приём стенда M5);
        браузер разрешает звук только после первого нажатия — до него щелчки молчат ── */
  var actx=null, lastClickT=0;
  function ensureAudio(){
    if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(_){ } }
    if(actx&&actx.state==="suspended") actx.resume();
  }
  function click(){
    if(!P.zvuk) return;                                       // глаз секции «Звук»
    if(!actx||actx.state!=="running") return;
    var t=actx.currentTime;
    if(t-lastClickT<P.glushenie/1000) return;                 // глушение на высокой скорости листания (грабля M5)
    lastClickT=t;
    // «ноготь по пластмассе»: тонкий точечный тик — синус, затухание кривой + микрошум-контакт в атаке
    var o=actx.createOscillator(); o.type="sine"; o.frequency.value=4200;   // 4200 Гц // без ручки: типа «частота» в своде нет
    var g=actx.createGain();
    var dlina=Math.max(0.001,P.zatuhanie/1000), pik=P.gromkostTon/100;
    /* Огибающая идёт кривой панели (П4: длительность без изинга —
       недоделанная ручка). «Торможение» даёт (1−t)³ — на слух та же
       форма, что прежняя экспонента, но теперь она названа ручкой. */
    var ogib=new Float32Array(32);
    for(var j=0;j<32;j++) ogib[j]=pik*(1-evalEase(P.zvukEase,P.zvukBez,j/31));
    g.gain.setValueCurveAtTime(ogib,t,dlina);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t+dlina+0.002);
    var shum=Math.max(0.0005,P.dlinaShuma/1000);
    var len=Math.max(1,Math.floor(actx.sampleRate*shum)), buf=actx.createBuffer(1,len,actx.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);               // шум-щелчок контакта
    var src=actx.createBufferSource(); src.buffer=buf;
    var hp=actx.createBiquadFilter(); hp.type="highpass"; hp.frequency.value=3000;  // 3000 Гц // без ручки: типа «частота» в своде нет
    var g2=actx.createGain(); g2.gain.value=P.gromkostShum/100;
    src.connect(hp); hp.connect(g2); g2.connect(actx.destination);
    src.start(t);
  }
  function setCur(c){ if(c!==st.cur){ st.cur=c; st.flikerT0=performance.now(); click(); } }  // кадр сменился → щелчок и наплыв

  function radiusKruga(){ return H*(P.krugD/100)/2; }       // круг — доля высоты; закон один на кадр и карту мест
  /* ВОЛНА КРУГА. Точки зажигаются одна за другой, последняя догорает ровно
     к «появлению круга»: задержка между соседними выводится из двух времён,
     своей ручки у неё нет. Длина волны — от старта первой до конца
     последней; по ней же круг уходит обратным порядком и разворачивается
     с любого места. */
  function shagTochki(){ return N>1?Math.max(0,P.krugMs-P.tochkaMs)/(N-1):0; }
  function dlinaVolny(){ return P.tochkaMs+(N>1?N-1:0)*shagTochki(); }
  /* Ось кручения: под пальцем (паспорт) или в центре сцены — ручка «Ось вращения». */
  /* Ось кручения и центр круга — одна точка, и крестик показывает именно её.
     Круг обязан помещаться в экран целиком, поэтому точка нажатия зажимается
     коридором «радиус + поле» от каждого края (3б «Коридор»). Круг шире
     экрана — коридор вырождается, и точка падает в середину: закон сильнее
     точки тычка, как у оригинала. */
  function zazhat(v,R,gabarit){
    var pole=R+P.krugPole;
    return (gabarit-2*pole)<=0 ? gabarit/2 : Math.max(pole,Math.min(v,gabarit-pole));
  }
  function osVrash(d){

  window.addEventListener("resize",resize); resize();

  /* ?stop=мс — стоп-кадр для снимков: часы замирают на названной
     отметке, а стенд встаёт в фазу кручения — иначе на снимке не видно
     ни выросшего зеркала, ни круга точек, ради которых ручки и заведены. */
  var STOP=(function(){ var m=location.search.match(/[?&]stop=(\d+)/); return m?+m[1]:null; })();
  if(STOP!==null){ st.ringOn=true; st.ringT=0; st.usyT0=0; st.krestT0=0; st.mTarget=st.mScale=1+P.prirost/100;
    /* Фаза на снимке одна — удержание: раз круг горит и зеркало выросло,
       оригинал обязан стоять ужатым и погашенным, иначе кадр показывает
       две фазы разом и врёт про переход. */
    st.oHod=st.oFrom=st.oTo=1; st.oMs=0;
    /* Нажатия на снимке не было: ось ставится в четверть ширины — так на
       кадре видно и коридор, и то, что круг больше не привязан к центру. */
    st.osX=null; st.osY=null; }

  /* ПРУЖИНА ПОВОРОТА С ПРЕДЕЛОМ СКОРОСТИ — один закон на дугу, усы курсора
     и усы круга. Пружина смягчает подход, но скорость у неё не ограничена:
     на быстрой руке угол успевает за целью и догонять нечего. Предел режет
     скорость сверху — и когда рука встала, часть отставания остаётся
     невыбранной: угол ДОКРУЧИВАЕТСЯ. Работает и без пружины: тогда это
     чистый ограничитель, идущий к цели с постоянной скоростью и встающий
     ровно на ней, без перелёта. Угол ведётся несвёрнутым, шаг времени
     приходит от кадра уже зажатым. */
  function vestiUgol(tek,skor,cel,pr,predel,sdt){
    if(tek===null) return [cel,0];
    if(pr[0]){
      var w=2*Math.PI/(pr[0]/1000), z=pr[1];
      skor+=((cel-tek)*w*w - skor*2*z*w)*sdt;
    } else skor=(cel-tek)/Math.max(0.001,sdt);           // без пружины — сразу на цель
    if(predel>0) skor=Math.max(-predel,Math.min(predel,skor));
    var shag=skor*sdt;
    if(Math.abs(shag)>Math.abs(cel-tek)){ shag=cel-tek; if(!pr[0]) skor=0; }  // не перескакивать цель
    return [tek+shag, skor];
  }
  /* ДОЛЯ ТОЧКИ КРУГА. На приходе отсчёт от первой к последней, на уходе —
     обратным порядком, от последней к первой. Задержка та же, время то же,
     кривая та же; меняется только с какого конца волна идёт. */
  function dolyaTochki(i,now,shag){
    var zad=(st.ringNa?i:(N-1-i))*shag;
    var t=P.tochkaMs>0?(now-st.ringT-zad)/P.tochkaMs:1;
    t=Math.max(0,Math.min(1,t));
    var e=reduced?1:evalEase(P.krugEase,P.krugBez,t);
    return st.ringNa?e:1-e;
  }

  /* ── кадр: фон → оригинал (нижний слой) → зеркало → круг точек ── */
  var prev=performance.now();
  function frame(now){
    if(STOP!==null) now=STOP;
    var dt=(now-prev)/1000; prev=now;

    var sdtU=Math.min(dt,0.05);                    // длинный кадр не должен взрывать пружины // без ручки
    /* УГОЛ АКТИВНОГО КАДРА — цель для усов, и больших, и малых. Считается
       всегда, а не только при горящем круге: усы курсора целятся в него
       и до нажатия. Разворачивается в сплошной угол — кадр ходит по
       кольцу, и на переходе через ноль сырая величина скачет на 360°,
       по которому пружина поехала бы в обход через весь круг. */
    if(N){
      var syrK=-90+P.krugUgol+st.cur*(360/N);
      if(st.syrU===null){ st.syrU=syrK; st.celU=syrK; st.ugU=syrK; }
      else{ var dK=syrK-st.syrU; while(dK>180)dK-=360; while(dK<-180)dK+=360;
            st.celU+=dK; st.syrU=syrK; }
      /* УСЫ КРУГА ведутся всегда, не только при горящем круге: пружина,
         замершая на погашенном круге, на следующем появлении стартовала бы
         со старого угла и заметно доворачивала. Закон тот же, что у усов
         курсора: пружина и предел берутся у линии — одна семья, один
         характер. */
      var rU=vestiUgol(st.ugU,st.vU,st.celU,P.kursorLiniyaPruzh,P.kursorLiniyaPredel,sdtU);
      st.ugU=rU[0]; st.vU=rU[1];
    }
    gl.viewport(0,0,cv.width,cv.height);
    gl.clear(gl.COLOR_BUFFER_BIT);
    /* ХОД ВЕЕРА: доля хода ведёт положение от прежнего луча к цели своей
       кривой; кончился — колесо снова считается. Съёмка сверяется каждый
       кадр: на горизонталь выходит новое имя — за ним идут кадры. */
    if(st.dosadka){
      var uV=st.dosadka.ms>0?Math.min(1,(now-st.dosadka.t0)/st.dosadka.ms):1;
      st.veer=st.dosadka.ot+(st.dosadka.do-st.dosadka.ot)*(reduced?1:evalEase(P.dosadkaEase,P.dosadkaBez,uV));
      if(uV>=1){ st.veer=st.veerCel=st.dosadka.do; st.dosadka=null; }
      sverkaVeera(); stavitVeer();                            // съёмка за главным лучом, лучи — за ходом
    }
    var dolyaSluzh=0;                                         // доля фазы круга; при погашенном круге ноль
    /* СКЛЕЙКА — переход с кадра на кадр. Номер на ней пересобирается из
       прежнего числа в новое, подпись перещёлкивается на месте; ход общий
       и короткий: в кружении склейки идут одна за другой, и долгая волна
       не успевала бы кончиться. Приход и уход кольца — не её дело. */
    var tNov=N?pad3(st.origCur+1):'';
    if(tNov!==st.nomCel){
      if(st.nomCel) { st.nomBylo=st.nomCel; st.sklT0=now; st.sklObratno=!st.poChasovoy; }   // первый показ волны не заводит
      st.nomCel=tNov;
    }
    var dSkl=1;
    if(st.sklT0>=0){
      var uS=P.naborMs>0?Math.min(1,(now-st.sklT0)/P.naborMs):1;
      dSkl=reduced?1:evalEase(P.naborEase,P.naborBez,uS);
      if(uS>=1) st.sklT0=-1;
    }

    // ОРИГИНАЛ: во всю высоту, contain (не больше экрана), X центра = точка последнего тычка;
    // кламп по краям (ход модельера): у границы упирается в неё целиком, за экран не выходит — закон сильнее точки тычка
    var to=texs[st.origCur], ar=to.w/to.h;
    var ot=st.oMs>0?Math.min(1,(now-st.oT0)/st.oMs):1;        // ход по своему времени и своей кривой
    st.oHod = reduced ? st.oTo : st.oFrom+(st.oTo-st.oFrom)*evalEase(st.oEase,st.oBez,ot);
    var oMasht=1-(P.origSzhatie/100)*st.oHod;                 // обе величины сняты с одной доли хода
    var oPlot =1-(P.origGashenie/100)*st.oHod;
    var poleB=P.polyaOrig*(P.polyaBoka/100);                  // боковое поле выводится из вертикального, своего числа у него нет
    var oh=Math.max(1,H-2*P.polyaOrig), ow=oh*ar;
    var wDost=Math.max(1,W-2*poleB); if(ow>wDost){ ow=wDost; oh=ow/ar; }   // коридор: ширина за вычетом боковых полей
    /* ПОТОЛОК РОСТА — собственный размер кадра. Высота во всю сцену тянет
       кадр выше исходника, и лишнее там не деталь, а её домысел: пиксели
       размазываются, съёмка мылится. Потолок меряется в ФИЗИЧЕСКИХ пикселях
       (to.h/DPR — css-высота, на которой один пиксель кадра ложится на один
       пиксель экрана), поэтому на плотном экране он вдвое ниже. Коридор
       ширины сильнее потолка: он уже сузил кадр, потолок только опускает. */
    if(P.origIshodnik){ var ohPredel=to.h/DPR*(P.origPredel/100);
      if(oh>ohPredel){ oh=ohPredel; ow=oh*ar; } }
    oh*=oMasht; ow*=oMasht;                                   // сжатие вокруг центра: кламп ниже считается уже от сжатого
    /* НАПЛЫВ НА СКЛЕЙКЕ у оригинала — в кружении, своим набором ручек и
       своими часами. Сдвиг идёт до клампа: у края коридор сильнее наплыва,
       как он сильнее и точки тычка. */
    var flO=flikerHod(now,st.flikerOrigT0,'O');
    oh*=flO.masht; ow*=flO.masht;
    var celX=((P.origGde==="centr"||st.openX==null)?W/2:st.openX)+flO.dx*oh;
    /* ПРИЖИМ ПО ВЫСОТЕ. Пока кадр шёл во всю сцену, место было предрешено:
       он занимал её целиком. Под потолком роста кадр ниже сцены, и остаток
       высоты надо кому-то отдать — верхнему полю, обеим сторонам поровну
       или нижнему. Поле в прижиме то же, что в законе высоты. */
    var oyBaza = P.origPrizhim==='top'    ? P.polyaOrig
               : P.origPrizhim==='bottom' ? H-oh-P.polyaOrig
               : (H-oh)/2;
    var ox=Math.max(poleB,Math.min(W-ow-poleB,celX-ow/2)), oy=oyBaza+flO.dy*oh;
    drawTex(to,ox,oy,ow,oh,oPlot);
    st.ramkaO=[ox,oy,ow,oh];


    // ЗЕРКАЛО: по центру; плавный ход к приросту и обратно; подскок на тычке.
    // Инерция → скорость погони λ. Ручка — доля, остающаяся за кадр при 60 Гц;
    // форма 1−exp(−λ·dt) не зависит от частоты кадров: два кадра на 120 Гц
    // оставляют ту же долю, что один на 60 (претензия настройщика 05.09).
    var dolya=Math.min(.999,P.pogonya/100), lam=-60*Math.log(Math.max(1e-6,dolya));
    st.mScale = (reduced||dolya<=0) ? st.mTarget : st.mScale+(st.mTarget-st.mScale)*(1-Math.exp(-dt*lam));
    var s=st.mScale;
    if(st.bounceT>0){ var bt=(now-st.bounceT)/Math.max(1,P.podskokMs);
      if(bt>=1) st.bounceT=-1;
      else if(st.mTarget===1) s*=1+(P.podskok/100)*Math.sin(Math.PI*evalEase(P.podskokEase,P.podskokBez,bt)); }
    var fl=flikerHod(now,st.flikerT0,''); s*=fl.masht;        // НАПЛЫВ НА СКЛЕЙКЕ поверх покоя, прироста и подскока
    var tm=texs[st.cur], mh=P.zerkalo*s, mw=mh*P.zerkaloAR;   // ширина из пропорции РАМКИ, а не кадра
    var uvZ=vyrezPodRamku(tm,P.zerkaloAR);                    // кадр заполняет рамку, лишнее уходит за края
    var mx=(W-mw)/2+fl.dx*mh, my=(H-mh)/2+fl.dy*mh;           // сдвиг — долей высоты зеркала
    st.ramkaZ=[mx,my,mw,mh];
    /* НАДПИСЬ В ЗЕРКАЛЕ — в середине его рамки: не на середине экрана, а
       именно рамки, чтобы ходить с ней в приросте, подскоке и наплыве. */
    if(P.zakryt){ zakrytEl.style.display='block';
      zakrytEl.style.left=(mx+mw/2).toFixed(1)+'px';
      zakrytEl.style.top=(my+mh/2).toFixed(1)+'px';
    } else if(zakrytEl.style.display!=='none') zakrytEl.style.display='none';
    if(!P.zerkaloVerh) drawTex(tm,mx,my,mw,mh,1,uvZ);        // под кругом: рисуем сейчас, точки лягут поверх
    /* ВЕРХНИЙ СЛОЙ. Холст один, и DOM над ним под зеркало не опустить —
       поэтому слой DOM вырезается по рамке зеркала (evenodd: окно минус
       рамка), а само зеркало в холсте рисуется после круга и крестика. */
    var vyrez=P.zerkaloVerh
      ? 'polygon(evenodd, 0 0, 100% 0, 100% 100%, 0 100%, 0 0, '+
        mx.toFixed(2)+'px '+my.toFixed(2)+'px, '+mx.toFixed(2)+'px '+(my+mh).toFixed(2)+'px, '+
        (mx+mw).toFixed(2)+'px '+(my+mh).toFixed(2)+'px, '+(mx+mw).toFixed(2)+'px '+my.toFixed(2)+'px, '+
        mx.toFixed(2)+'px '+my.toFixed(2)+'px)'
      : 'none';
    if(vyrez!==sloiVyrez){ sloiEl.style.clipPath=vyrez; sloiVyrez=vyrez; }

    // КРУГ ТОЧЕК (кручение): точки-кадры по окружности; появление по часовой,
    // волной — шаг и длина волны выведены в shagTochki и dlinaVolny.
    if(st.ringOn){
      var R=radiusKruga();
      var cx=(st.osX!=null?st.osX:zazhat(W*0.25,R,W)), cy=(st.osY!=null?st.osY:H/2);
      var shag=shagTochki();
      /* Номер и слово живут долей ПЕРВОЙ точки: она зажигается первой и,
         раз уход идёт обратным порядком, гаснет последней — служебный слой
         виден всю волну, и разворот с середины его не рвёт. Раньше на
         уходе бралась последняя точка, и слой пропадал в первые
         миллисекунды ухода, а на развороте прыгал. */
      dolyaSluzh=dolyaTochki(0,now,shag);
      /* Круг гаснет, когда догорели все трое: волна точек, усы и крестик —
         у каждого своё время, и самое длинное никого не обрезает. */
      if(!st.ringNa && now-st.ringT>=dlinaVolny() && now-st.usyT0>=P.usyMs && now-st.krestT0>=P.tochkaMs) st.ringOn=false;
      var dotC=bgLum>0.5?0:1;                                  // контраст фону: светлый фон → чёрные точки, тёмный → белые
      var akt=hexRgb(P.tsvetAkt);
      for(var i=0;i<N;i++){
        var alpha=dolyaTochki(i,now,shag);
        if(alpha<=0) continue;
        var a2=(-90+P.krugUgol+i*(360/N))*Math.PI/180;         // 0 наверху, далее по часовой
        var act=(i===st.cur), sz=(act?P.tochkaAkt:P.tochkaProch)+2;   // +2px под сглаженный край диска // без ручки
        var col=act?[akt[0],akt[1],akt[2],alpha]:[dotC,dotC,dotC,(P.tochkaPlot/100)*alpha];
        drawCol(cx+R*Math.cos(a2)-sz/2, cy+R*Math.sin(a2)-sz/2, sz, sz, col, true);
      }
      /* КРЕСТИК — метка оси: показывает точку, вокруг которой кружиться.
         Своего времени не имеет, проявляется вместе с первой точкой круга:
         две величины об одном спорили бы. // без ручки — время крестика */
      if(P.krest && P.krestPlecho>0 && P.krestTolsch>0){
        /* Своими часами (krestT0): на свежем старте они сдвинуты на уход
           дуги курсора, на развороте — продолжают с места. */
        var tK=P.tochkaMs>0?(now-st.krestT0)/P.tochkaMs:1;
        var eK=reduced?1:evalEase(P.krugEase,P.krugBez,Math.max(0,Math.min(1,tK)));
        var aK=st.ringNa?eK:1-eK;
        if(aK>0){
          var pl=P.krestPlecho, tl=P.krestTolsch, colK=[dotC,dotC,dotC,(P.krestPlot/100)*aK];
          drawCol(cx-pl, cy-tl/2, pl*2, tl, colK, false);
          drawCol(cx-tl/2, cy-pl, tl, pl*2, colK, false);
        }
      }
      /* НОМЕР КАДРА — 001 … 0NN, справа сверху от крестика, на том же
         проявлении, что круг и крестик. Живёт в DOM, а не в канвасе:
         текст здесь один и мелкий, шрифтовой атлас ради него не нужен. */
      if(P.nomer){
        var aN=dolyaSluzh;                                    // приход и уход номера — прозрачностью вместе с кругом
        /* ПЕРЕСБОРКА НА СКЛЕЙКЕ: фронт идёт по новому числу, перед ним
           стоит прежнее. Кольцо к этому отношения не имеет — номер живёт
           сменой кадра, а не появлением круга. */
        var tN=(P.perebor&&!reduced&&dSkl<1)
          ? peresobrat(st.nomBylo,st.nomCel,7,dSkl,Math.floor(now/Math.max(20,P.pereborTick)),P.pereborFront/100,st.sklObratno)
          : st.nomCel;
        if(nomEl.textContent!==tN) nomEl.textContent=tN;
        nomEl.style.display='block';
        /* Номер стоит на радиусе тем же законом, что слово: доля и угол,
           а не пара отступов. Кольцо меняет поперечник — номер едет с ним,
           а не остаётся на прежнем месте, оторвавшись от своей опоры. */
        var rN=R*(P.nomerDolya/100), ugN=(P.nomerUgol-90)*Math.PI/180;   // не aN: то имя занято прозрачностью номера
        nomEl.style.left=(cx+rN*Math.cos(ugN))+'px';
        nomEl.style.top=(cy+rN*Math.sin(ugN))+'px';
        nomEl.style.opacity=aN;
      } else nomSkryt();
      /* УСЫ КРУГА — своя сущность, а не переехавшие усы курсора. Стоят на
         оси, целятся длинным концом в красную точку активного кадра,
         коротким — напротив. Приходят своим временем: перехлёст с уходом
         усов курсора настраивается двумя ручками, и на глаз это читается
         как одна вещь, быстро перестроившаяся. */
      if(P.usyKruga && N){
        var tU=P.usyMs>0?(now-st.usyT0)/P.usyMs:1;
        var eU=reduced?1:evalEase(P.krugEase,P.krugBez,Math.max(0,Math.min(1,tU)));
        var aU=st.ringNa?eU:1-eU;
        if(aU<=0.002) usySkryt();
        else{
          var Rv=Math.max(1,R), kv=100/Rv;                      // px → единицы усов: 100 = радиус круга
          var gabU=(2*Rv).toFixed(0);
          if(gabU!==usyGab){ usyEl.setAttribute('viewBox','0 0 200 200'); usyEl.setAttribute('width',gabU); usyEl.setAttribute('height',gabU); usyGab=gabU; }
          usyEl.style.left=cx+'px'; usyEl.style.top=cy+'px'; usyEl.style.display='block';
          var vn=100-P.kursorZazorTochek*kv;                    // внешний конец: не доходя до точек
          var dl=P.kursorUsDlinnyy*kv*aU, kr=P.kursorUsKorotkiy*kv*aU;
          usyD.setAttribute('d',
            'M'+(100+vn-dl).toFixed(2)+',100H'+(100+vn).toFixed(2)+
            'M'+(100-vn).toFixed(2)+',100H'+(100-vn+kr).toFixed(2));
          usyD.setAttribute('stroke-width',(P.kursorTolsch*kv).toFixed(2));
          usyD.setAttribute('stroke',(bgLum>0.5?'rgba(0,0,0,':'rgba(255,255,255,')+(P.kursorPlot/100)+')');
          usyG.setAttribute('transform','rotate('+st.ugU.toFixed(1)+' 100 100)');   // угол ведётся выше, вместе с целью
        }
      } else usySkryt();
      /* СЛОВО — на вертикальной оси, на доле радиуса от центра. Проявление
         общее с крестиком и номером: подсказка приходит вместе с кругом,
         а не отдельной жизнью. Сам текст — литерал: органа для ввода слов
         в своде нет, менять его правкой разметки. // без ручки — текст */
      if(P.slovo){
        var aS=dolyaSluzh;
        /* Слово живёт приходом и уходом кольца, и только ими: в покое
           доля растворения нулевая, а нулевая доля — это уже не ход, и
           перебирать нечего. Без этой проверки фронт вечно стоял бы на
           первых знаках: у растворения, в отличие от пересборки, порога
           «доля больше нуля» внутри нет. */
        var tS=SLOVO, pS=1-aS;
        if(P.perebor&&!reduced&&pS>0.002){                    // своё зерно: фронты слова и номера не идут в ногу
          tS=rastvorit(tS,9,pS,Math.floor(now/Math.max(20,P.pereborTick)),P.pereborFront/100);
          aS=1;
        }
        if(slovoEl.textContent!==tS) slovoEl.textContent=tS;
        slovoEl.style.display='block';
        slovoEl.style.left=cx+'px';
        slovoEl.style.top=(cy+(P.slovoSnizu?1:-1)*R*(P.slovoDolya/100))+'px';
        slovoEl.style.opacity=aS;
      } else slovoSkryt();
    } else { nomSkryt(); slovoSkryt(); usySkryt(); }
    syncCap(now,dolyaSluzh,dSkl);                             // приход с кольцом, перещёлк на склейках
    if(P.zerkaloVerh) drawTex(tm,mx,my,mw,mh,1,uvZ);         // над кругом: последним в холсте

    /* КУРСОР. Место — пружина догона; форма — доля ухода hk и три пары
       часов перехода; поворот — своя пружина у дуги и у усов, у дуги
       поверх неё обороты ухода и доворот сборки. */
    if(P.kursor){
      /* ДОГОН ПРУЖИНОЙ. У экспоненты характера нет: она всегда подходит
         к цели с одной стороны и одинаково. Пружина даёт то, ради чего
         спрашивают про кривую, — перелёт и оседание: затухание 1 идёт
         вязко, без отскока, ниже единицы иконка проскакивает остриё и
         возвращается. Считается уравнением, а не готовым откликом:
         цель едет, и отклик на ступеньку тут не годится. */
      /* НА УДЕРЖАНИИ ИКОНКА СТОИТ НА МЕСТЕ ТЫЧКА. Раньше она продолжала
         догонять указатель, и дуга с усами исчезали, убегая за рукой:
         движение исчезновения складывалось с движением догона и выходило
         грязным. Место тычка неподвижно — уход стал предсказуемым.
         Пружина на это время замирает вместе с ней: иначе на отпускании
         иконка телепортировалась бы туда, куда пружина успела уехать.
         Отпустил — пружина трогается от тычка и летит к руке. */
      if(st.kursDerzhim){
        st.kursX=st.tychokX; st.kursY=st.tychokY; st.kursVX=st.kursVY=0;
        stavitKursor();
      } else if(P.kursorDogon[0]>0 && st.kursNaSczene){
        var sdt=Math.min(dt,0.05);                              // длинный кадр не должен взрывать пружину // без ручки
        var w=2*Math.PI/(P.kursorDogon[0]/1000), zt=P.kursorDogon[1];
        st.kursVX+=((st.kursCelX-st.kursX)*w*w - st.kursVX*2*zt*w)*sdt;
        st.kursVY+=((st.kursCelY-st.kursY)*w*w - st.kursVY*2*zt*w)*sdt;
        st.kursX+=st.kursVX*sdt; st.kursY+=st.kursVY*sdt;
        stavitKursor();
      }
      /* ДОЛЯ УХОДА hk — форма иконки: 0 собрана, 1 ушла. Уход и сборка —
         разные ходы (П9): своё время и своя кривая на каждое направление.
         Уходя, дуга укорачивается до нуля; собираясь, растёт от нуля и
         доворачивает на угол сборки. Часы уже развёрнуты с нужного места
         (razvernutChasy) — здесь только доля. */
      var svor=st.kursSvorot, ugSb=0, hk;
      if(svor){                                                // уходим: дуга в ноль
        var u=P.kursorKolcoUhod>0?Math.min(1,(now-st.kursT0)/P.kursorKolcoUhod):1;
        hk=reduced?1:evalEase(P.kursorSvorotEase,P.kursorSvorotBez,u);
      } else {                                                 // собираемся: дуга от нуля
        var sb=P.kursorKolcoSborka>0?Math.min(1,(now-st.kursT0)/P.kursorKolcoSborka):1;
        sb=reduced?1:evalEase(P.kursorRazvorotEase,P.kursorRazvorotBez,sb);
        hk=1-sb; ugSb=P.kursorSborkaUgol*(1-sb);                // доворачивает к своему месту, пока растёт
      }
      /* ГАШЕНИЕ — прозрачность кольца поверх длины дуги, своими часами от
         того же старта. Хвост дуги на последних градусах короче кадра и
         рвётся на частоте отрисовки; гашение короче ухода прячет его.
         Время одно в обе стороны: на сборке кольцо проявляется тем же
         ходом наоборот. */
      var g=(P.kursorKolcoGash>0&&!reduced)?Math.min(1,(now-st.gashT0)/P.kursorKolcoGash):1;
      kurD.setAttribute('opacity',(svor?1-g:g).toFixed(3));
      sobratKursor(hk);
      /* ТОЧКА стоит под указателем: она не часть кольца, а острие курсора.
         Садится в ноль своим временем и тем же временем встаёт обратно. */
      var kk=100/Math.max(2,st.kursGab||100);
      var tf=(P.kursorTochkaUhod>0&&!reduced)?Math.min(1,(now-st.tochkaT0)/P.kursorTochkaUhod):1;
      var tH=svor?tf:1-tf;
      /* ЩИПОК точки — ответ курсора на клик. Раньше клик отзывался только
         на сцене: оригинал переезжал, зеркало подскакивало. Сам указатель
         не показывал, что его услышали. Полуволна синуса: точка проседает
         и возвращается ровно туда же, без остатка. */
      var rT=(P.kursorTochkaR/2)*(1-tH)*kk;
      if(st.schipT>0){
        var bt=(now-st.schipT)/Math.max(1,P.kursorSchipMs);
        if(bt>=1) st.schipT=-1;
        else rT*=1-(P.kursorSchip/100)*Math.sin(Math.PI*evalEase(P.kursorSchipEase,P.kursorSchipBez,bt));
      }
      kurT.setAttribute('r',Math.max(0,rT).toFixed(2));
      /* Три части иконки живут порознь. Точка стоит — она и есть ось.
         Дуга и усы отсчитывают каждая свою ось экрана (какую — ручкой):
         начало оси ноль, конец — заданное число оборотов. Угол берётся от
         НАСТОЯЩЕГО указателя, а не от места иконки: иконка отстаёт по
         пружине, и поворот, снятый с неё, врал бы про руку. Разворот
         меняет знак доли, а не угла: иначе на числе оборотов больше
         единицы отсчёт поехал бы не от края, а от случайного места круга. */
      function dolyaOsi(os){ return os==='X' ? st.kursCelX/Math.max(1,W) : st.kursCelY/Math.max(1,H); }
      var dD=dolyaOsi(P.kursorDugaOt);   if(P.kursorDugaNazad)   dD=1-dD;
      var dL=dolyaOsi(P.kursorLiniyaOt); if(P.kursorLiniyaNazad) dL=1-dL;
      /* Кривая здесь ПЕРЕДАТОЧНАЯ, а не временная: угол идёт за рукой без
         задержки, кривая гнёт только то, как быстро он растёт вдоль оси.
         Разгон — иконка вяло стоит у начала оси и разлетается к концу;
         торможение — наоборот. Считается ПОСЛЕ разворота, чтобы форма шла
         за направлением отсчёта, а не против него. */
      dD=evalEase(P.kursorDugaEase,   P.kursorDugaBez,   Math.max(0,Math.min(1,dD)));
      dL=evalEase(P.kursorLiniyaEase, P.kursorLiniyaBez, Math.max(0,Math.min(1,dL)));
      /* У усов курсора ДВЕ цели, и какая из них — решает фаза. На экране
         они держат свою ось; в кружении доворачивают на угол активного
         кадра — туда же смотрят усы круга. Между целями ведёт доля ухода
         hk: уходя, усы доворачивают на кадр, возвращаясь — обратно на ось,
         поэтому на сборке они не просто отрастают, а прокручиваются к
         своему месту. Кратчайшей дугой: иначе на развороте они поехали бы
         через весь круг в обход. «Кадра» в ручке — усы держат кадр всегда. */
      var celL=(P.kursorLiniyaOt==='kadr'&&N) ? st.celU : 360*P.kursorOborotovX*dL;
      if(P.kursorLiniyaOt!=='kadr' && N && hk>0){
        var dK2=st.celU-celL; while(dK2>180)dK2-=360; while(dK2<-180)dK2+=360;
        celL+=dK2*hk;                                          // кратчайшей дугой, чтобы не идти в обход
      }
      var celD=360*P.kursorOborotovY*dD;
      /* ПРУЖИНА ПОВОРОТА. Угол не садится на цель, а догоняет её вторым
         порядком: перелетает и оседает. Считается по НЕСВЁРНУТОМУ углу —
         он копится сплошным числом, поэтому переход через ноль пружину не
         разворачивает длинной стороной. Цель берётся итоговая, вместе с
         уводом усов на красную точку, — тогда увод получает ту же мягкость,
         а не спорит с ней. Длинный кадр зажат, как у догона места. */
      var rD=vestiUgol(st.ugD,st.vD,celD,P.kursorDugaPruzh,  P.kursorDugaPredel,  sdtU); st.ugD=rD[0]; st.vD=rD[1];
      var rL=vestiUgol(st.ugL,st.vL,celL,P.kursorLiniyaPruzh,P.kursorLiniyaPredel,sdtU); st.ugL=rL[0]; st.vL=rL[1];
      var ugL=st.ugL;
      kurD.setAttribute('transform','rotate('+(st.ugD+360*P.kursorSvorotOb*hk+ugSb).toFixed(1)+' 50 50)');
      kurS.setAttribute('transform','rotate('+ugL.toFixed(1)+' 50 50)');
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
