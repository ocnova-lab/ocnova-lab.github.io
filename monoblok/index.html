<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Моноблок</title>
<link rel="stylesheet" href="/panel.css" />
<style>
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('/fonts/JetBrainsMono-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: block; /* сетка выводится из шрифта — ждём его, а не мигаем подменой */
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('/fonts/JetBrainsMono-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'Pragmatica Next VF';
    src: url('/fonts/PragmaticaNextVF.woff') format('woff-variations');
    font-weight: 100 900;
    font-stretch: 50% 100%;
    font-style: normal;
    font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #eae9e4;
    color: #1b1b1b;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.2;
    overflow: hidden;
    overscroll-behavior: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 1rem;
    z-index: 6;
    color: #6a6a66;
    pointer-events: none;
  }
  header a { color: inherit; pointer-events: auto; }

  /* ── ось движения: лента элементов едет по кривой через экран ── */
  #os, #osline {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    overflow: hidden;
  }
  #os {
    font-family: 'Pragmatica Next VF', "Helvetica Neue", Arial, sans-serif;
    text-transform: uppercase;
    /* кегль, ширину знака, промежуток и разрядку ставит закон в скрипте */
  }
  #os .el {
    position: absolute;
    top: 0; left: 0;
    white-space: pre;
    transform-origin: 0 0;
    color: #4f4032; /* цвет макета, вычтенный из поля стенда заранее */
    text-box-trim: trim-both;
    text-box-edge: cap alphabetic;
  }
  /* плашка — тогда цвет знаков рождается вычитанием прямо из неё, как в макете */
  body.os-plate #os .el {
    background: #323232;
    color: #9ba9b2;
    mix-blend-mode: difference;
    padding: 0.28em 0.5em;
    margin: -0.28em -0.5em;
  }
  #osline { display: none; }
  body.os-line #osline { display: block; }

  /* ── блок: ширина = доля экрана, внутри 24 колонки символов ── */
  #blok {
    position: relative;
    font-family: 'JetBrains Mono', Menlo, "DejaVu Sans Mono", monospace;
    font-weight: 400;
    white-space: pre;
    /* кегль, ширина, интерлиньяж и трекинг ставит закон в скрипте */
  }
  #blok .ln {
    position: relative;
    height: 1lh;
  }
  #blok .c, #blok .r { position: absolute; top: 0; }
  #blok .c { left: 50%; transform: translateX(-50%); }
  /* трекинг добавляет пробел и после последнего знака — правый край его снимает */
  #blok .r { right: 0; margin-right: calc(-1 * var(--track, 0px)); }

  /* ── датчик: символьная сетка блока ── */
  #setka {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
    display: none;
    outline: 1px solid rgba(180, 60, 40, 0.5);
  }
  body.grid #setka { display: block; }
</style>
</head>
<body>
  <canvas id="osline"></canvas>
  <div id="os"></div>

  <header>Сергей Гуров — моноблок · блок на символьной сетке, вокруг — лента элементов на редактируемой оси движения: кривую двигают в панели, скролл везёт ленту · <a href="/">стенды</a></header>

  <div id="blok"><div id="setka"></div></div>

<script src="/panel.js"></script>
<script>
'use strict';
/* ============================================================
   Стенд «Моноблок» — по референсу с адресом на THEANXIETTTY.

   Закон блока:
   строка блока = 24 колонки моноширинного шрифта. Ширина блока
   задаётся долей ширины экрана, а кегль не подбирается на глаз,
   а вычисляется из неё: кегль = ширина / (24 × (шаг знака + трекинг)).
   Шаг знака берётся замером у самого шрифта, поэтому подмена
   гарнитуры не ломает сетку.

   Внутри строки три зоны — левый край, центр, правый край.
   Центр честный (не по колонкам), поэтому нечётные строки
   вроде «PHONE» стоят ровно посередине, как в оригинале.

   Датчик «Символьная сетка» показывает те самые 24 колонки и
   строки: закон объявлен — вот его линии.

   Ось движения (приём «вёрстка по редактируемой оси»):
   элементы из макета «for vibe code» едут лентой по кривой через
   экран. Кривая — вход на левой кромке, свободные вершины, выход
   на правой; все точки таскаются в редакторе-холсте с пропорциями
   экрана, крайние можно увести за кромку. «Острота» ведёт от
   гладкой кривой к ломаной, «ход» сгущает ленту у вершин или
   расталкивает от них. Длина ленты равна ширине экрана — цикл
   замыкается без шва; кегль, как и у блока, выводится замером.
   Скролл (колесо, палец, стрелки) двигает цель, лента догоняет
   её аналогово. Diatype Condensed заменён вариативной Прагматикой,
   сужённой до макетной ширины ряда.
   ============================================================ */

var COLS = 24; // ширина блока в знаках — задана самой длинной строкой

// Строки блока: raw — вся строка целиком (ровно 24 знака),
// l / c / r — левый край, центр, правый край; bold — жирная зона строки.
var LINES = [
  { c: '814 BERRY STREET' },
  { raw: 'SAN FRANCISCO . CP 94158' },
  { l: '3', c: 'CA — USA', bold: 'c', r: '1' },
  { l: '2', r: '2' },
  { l: '1', c: 'PHONE', r: '3' },
  { raw: '+   00  1  415  324 1379' },
  { c: 'THEANXIETTTY.COM' },
  { c: 'REPEAT' }
];

// Ось сверху — по макету «for vibe code» (2822:44076): строка элементов,
// набранных узким гротеском вразрядку. Массив — элемент оси; вложенный
// массив — элемент в несколько строк.
var OS_ITEMS = [
  'osnova', '®', 'lab.',
  '1', '1', '1', '1', '1',
  ['authors design', 'workshop'],
  '2', '2', '2', '2',
  '–    00:05:42    –',
  'sergei gurov',
  '3', '3', '3',
  ['oakmoss, green fig', 'charcoal'],
  ['107–325.67', '/5'],
  '4', '4',
  ['mossfield soft', 'volcanic salted', 'wind'],
  'aewol andelok',
  '5',
  ['mossfield soft', 'volcanic salted', 'wind'],
  ['oakmoss, green fig', 'charcoal'],
  'aewol andelok',
  '0', '0', '0'
];

var DEFAULTS = {
  frac: 25,     // ширина блока, % ширины экрана
  lead: 1.14,   // интерлиньяж, доли кегля
  track: 0,     // трекинг, тысячные кегля
  grid: 'off',  // датчик: символьная сетка
  osFit: 'on',  // ось: длина ленты равна ширине экрана
  osSize: 18,   // кегль оси, px — когда лента не вписывается
  osGap: 1.83,  // промежуток между элементами, доли кегля (33/18 из макета)
  osTrack: 200, // разрядка, тысячные кегля (3.6/18 из макета)
  osWdth: 78.5, // ширина знака, % — узкий гротеск вместо Diatype Condensed
  osWght: 450,  // насыщенность знака оси
  // геометрия оси: вход на левой кромке, две свободные вершины, выход на правой
  osPts: [[0, 0.06], [0.34, 0.06], [0.68, 0.06], [1, 0.06]],
  osSharp: 0,   // острота: 0 — гладкая кривая, 1 — ломаная
  osHod: 0,     // ход: −1 спешит от вершин, +1 липнет к ним
  osRot: 0,     // поворот элемента по касательной к оси, доля
  osSpeed: 14,  // самоход ленты, px/с
  osEase: 88,   // мягкость погони ленты за целью скролла
  osPlate: 'off', // плашка под элементом — тогда цвет вычитается, как в макете
  osLine: 'off'   // датчик: линия оси на экране
};
var P = Object.assign({}, DEFAULTS);
try {
  var saved = JSON.parse(localStorage.getItem('monoblok-params'));
  if (saved) Object.assign(P, saved);
} catch (e) {}

// ?frac=33&grid=on&osBack=none — параметры из адреса (удобно для скриншотов)
new URLSearchParams(location.search).forEach(function (v, k) {
  if (!(k in DEFAULTS)) return;
  if (Array.isArray(DEFAULTS[k])) {
    P[k] = v.split(';').map(function (pair) { return pair.split(',').map(parseFloat); });
  } else {
    P[k] = (typeof DEFAULTS[k] === 'number') ? parseFloat(v) : v;
  }
});

// ── разметка блока ──
var blok = document.getElementById('blok');
var setka = document.getElementById('setka');
LINES.forEach(function (L) {
  var ln = document.createElement('div');
  ln.className = 'ln';
  if (L.raw) {
    ln.textContent = L.raw;
  } else {
    ['l', 'c', 'r'].forEach(function (zone) {
      if (!L[zone]) return;
      var s = document.createElement('span');
      s.className = zone;
      s.textContent = L[zone];
      if (L.bold === zone) s.style.fontWeight = 700;
      ln.appendChild(s);
    });
  }
  blok.appendChild(ln);
});

// ── ось: те же элементы, что в макете, в один ряд ──
var os = document.getElementById('os');
var header = document.querySelector('header');
var osEls = OS_ITEMS.map(function (it) {
  var el = document.createElement('div');
  el.className = 'el';
  if (Array.isArray(it)) {
    it.forEach(function (s) {
      var d = document.createElement('div');
      d.textContent = s;
      el.appendChild(d);
    });
  } else {
    el.textContent = it;
  }
  os.appendChild(el);
  return el;
});

var OS_LEAD = 20 / 18; // интерлиньяж оси из макета: 20 px на кегле 18
var OS_BASE = 100;     // кегль замера: чем крупнее, тем меньше ошибка округления

/* ── геометрия оси ───────────────────────────────────────────────
   Ось — кривая через экран: вход на левой кромке, выход на правой,
   между ними свободные вершины. Точки живут в долях экрана и
   таскаются в редакторе; вход и выход можно увести за кромку.
   y(t) идёт катмулл-ромом по узлам, «острота» подмешивает ломаную,
   «ход» сгущает или расталкивает элементы у вершин.
   ───────────────────────────────────────────────────────────────── */

function osNodes() {
  return P.osPts.slice().sort(function (a, b) { return a[0] - b[0]; });
}

// катмулл-ром по узлам, отсортированным по x; sharp подмешивает ломаную
function osY(t) {
  var n = osNodes(), i;
  if (t <= n[0][0]) return n[0][1];
  if (t >= n[n.length - 1][0]) return n[n.length - 1][1];
  for (i = 0; i < n.length - 1 && !(t >= n[i][0] && t <= n[i + 1][0]); i++) {}
  var p1 = n[i], p2 = n[i + 1];
  var p0 = n[i - 1] || [2 * p1[0] - p2[0], 2 * p1[1] - p2[1]];
  var p3 = n[i + 2] || [2 * p2[0] - p1[0], 2 * p2[1] - p1[1]];
  var u = (t - p1[0]) / (p2[0] - p1[0] || 1e-6);
  var lin = p1[1] + (p2[1] - p1[1]) * u;
  var u2 = u * u, u3 = u2 * u;
  var cr = 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * u +
                  (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2 +
                  (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * u3);
  var sharp = P.osSharp;
  return cr * (1 - sharp) + lin * sharp;
}

// «ход»: где лента идёт плотнее. 0 — ровно, +1 — липнет к вершинам,
// −1 — спешит от них. Внутри каждого пролёта между узлами меняем темп.
function osWarp(u) {
  var h = P.osHod;
  if (!h) return u;
  var n = osNodes(), xs = [0], i;
  for (i = 0; i < n.length; i++) if (n[i][0] > 0 && n[i][0] < 1) xs.push(n[i][0]);
  xs.push(1);
  for (i = 0; i < xs.length - 1 && !(u >= xs[i] && u <= xs[i + 1]); i++) {}
  var a = xs[i], b = xs[i + 1], p = (u - a) / (b - a || 1e-6);
  var s = p * p * (3 - 2 * p);                    // липнет к краям пролёта
  var f = h > 0 ? p + (s - p) * h                  // ...то есть к вершинам
                : p + (p - s) * (-h);              // ...или расталкивает
  return a + f * (b - a);
}

var osRedrawEditor = null;
var osW = 0, osL = 0, osSpans = [], osFs = 18, osOff = 0, osTarget = 0, osPrev = 0;

// ширины элементов и длина ленты: закон опирается на замер, а не на числа
function measureOs() {
  var track = P.osTrack / 1000;
  os.style.fontVariationSettings = "'wdth' " + P.osWdth + ", 'wght' " + P.osWght;
  os.style.letterSpacing = track + 'em';
  os.style.lineHeight = OS_LEAD;
  osEls.forEach(function (el) { el.style.transform = 'none'; });

  os.style.fontSize = OS_BASE + 'px';
  var w = osEls.map(function (el) {
    return el.getBoundingClientRect().width / OS_BASE - track; // без хвоста разрядки
  });
  var lenEm = w.reduce(function (a, b) { return a + b; }, 0) + w.length * P.osGap;

  osW = window.innerWidth;
  // вписывание: лента длиной ровно в экран замыкается без шва
  osFs = (P.osFit === 'on') ? osW / lenEm : P.osSize;
  os.style.fontSize = osFs + 'px';

  osL = lenEm * osFs;
  osSpans = [];
  var s = 0;
  for (var i = 0; i < w.length; i++) {
    osSpans.push(s);
    s += (w[i] + P.osGap) * osFs;
  }
  document.body.classList.toggle('os-plate', P.osPlate === 'on');
  document.body.classList.toggle('os-line', P.osLine === 'on');
  drawOsLine();
}

// датчик: сама кривая на экране
var oslineCv = document.getElementById('osline');
function drawOsLine() {
  var dpr = window.devicePixelRatio || 1;
  var W = window.innerWidth, H = window.innerHeight;
  oslineCv.width = W * dpr; oslineCv.height = H * dpr;
  oslineCv.style.width = W + 'px'; oslineCv.style.height = H + 'px';
  var g = oslineCv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  g.strokeStyle = 'rgba(180,60,40,.5)';
  g.lineWidth = 1;
  g.beginPath();
  for (var i = 0; i <= 200; i++) {
    var t = i / 200;
    var x = t * W, y = osY(t) * H;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.stroke();
  // узлы оси
  g.fillStyle = 'rgba(180,60,40,.5)';
  P.osPts.forEach(function (p) {
    g.beginPath(); g.arc(p[0] * W, p[1] * H, 3, 0, 6.2832); g.fill();
  });
}

// кадр: лента едет, каждый элемент садится на кривую своей долей пути
function frameOs(dt) {
  var W = window.innerWidth, H = window.innerHeight;
  osTarget += P.osSpeed * dt;
  var k = 1 - Math.pow(1 - (1 - P.osEase / 100), dt * 60); // аналоговая погоня
  osOff += (osTarget - osOff) * k;

  for (var i = 0; i < osEls.length; i++) {
    var u = ((osSpans[i] + osOff) % osL) / osL;
    if (u < 0) u += 1;
    var t = osWarp(u);
    var x = t * W, y = osY(t) * H;
    var a = 0;
    if (P.osRot) { // поворот по касательной к оси
      var d = 0.004;
      a = Math.atan2((osY(Math.min(1, t + d)) - osY(Math.max(0, t - d))) * H,
                     (Math.min(1, t + d) - Math.max(0, t - d)) * W) * P.osRot;
    }
    osEls[i].style.transform = 'translate(' + x + 'px,' + y + 'px) rotate(' + a + 'rad)';
  }
}

// ── скролл: колесо, палец и клавиши двигают цель, лента догоняет ──
addEventListener('wheel', function (e) {
  osTarget += (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY) * 1.2;
}, { passive: true });
var osTouch = null;
addEventListener('touchstart', function (e) { osTouch = e.touches[0].clientX; }, { passive: true });
addEventListener('touchmove', function (e) {
  if (osTouch !== null) { osTarget -= e.touches[0].clientX - osTouch; osTouch = e.touches[0].clientX; }
}, { passive: true });
addEventListener('touchend', function () { osTouch = null; });
addEventListener('keydown', function (e) {
  if (e.key === 'ArrowRight') osTarget += 60;
  if (e.key === 'ArrowLeft') osTarget -= 60;
});

// ── шаг знака: спрашиваем у самого шрифта, а не помним числом ──
var advRatio = 0.6; // до замера — обычная моношириная доля кегля
function measureAdvance() {
  var cv = document.createElement('canvas').getContext('2d');
  cv.font = '100px ' + getComputedStyle(blok).fontFamily;
  var w = cv.measureText('MMMMMMMMMM').width; // десять знаков — меньше ошибка округления
  if (w > 0) advRatio = w / 10 / 100;
}

function apply() {
  var target = window.innerWidth * P.frac / 100; // ширина блока
  var track = P.track / 1000;                    // трекинг в долях кегля
  var fs = target / (COLS * (advRatio + track));

  blok.style.width = target + 'px';
  blok.style.fontSize = fs + 'px';
  blok.style.lineHeight = P.lead;
  blok.style.letterSpacing = (track * fs) + 'px';
  blok.style.setProperty('--track', (track * fs) + 'px');

  // датчик рисует ту же сетку, из которой выведен кегль
  var colw = target / COLS;
  var lineh = fs * P.lead;
  setka.style.width = target + 'px';
  setka.style.height = (lineh * LINES.length) + 'px';
  setka.style.backgroundImage =
    'repeating-linear-gradient(90deg, rgba(180,60,40,.35) 0 1px, transparent 1px ' + colw + 'px),' +
    'repeating-linear-gradient(180deg, rgba(180,60,40,.35) 0 1px, transparent 1px ' + lineh + 'px)';
  document.body.classList.toggle('grid', P.grid === 'on');
}

// ── панель ──
var ui = StendPanel.build({
  storageKey: 'monoblok-params',
  params: P,
  defaults: DEFAULTS,
  defs: [
    ['h', 'Блок'],
    ['frac', 'Доля ширины экрана, %', 8, 70, 0.5],
    ['lead', 'Интерлиньяж', 0.85, 2.2, 0.01],
    ['track', 'Трекинг, ‰ кегля', -40, 150, 1],
    ['h', 'Ось сверху'],
    ['osFit', 'Вписывать в экран', 'select', [['on', 'весь ряд в ширину'], ['off', 'свой кегль']]],
    ['osSize', 'Кегль оси, px', 6, 28, 0.5],
    ['osGap', 'Промежуток, доли кегля', 0.4, 5, 0.01],
    ['osTrack', 'Разрядка, ‰ кегля', 0, 400, 5],
    ['osWdth', 'Ширина знака, %', 50, 100, 0.5],
    ['osWght', 'Насыщенность', 100, 900, 10],
    ['osPlate', 'Плашка под элементом', 'select', [['off', 'нет'], ['on', 'тёмная — как в макете']]],
    ['h', 'Движение по оси'],
    ['osSharp', 'Острота оси', 0, 1, 0.01],
    ['osHod', 'Ход', -1, 1, 0.01],
    ['osRot', 'Поворот по касательной', 0, 1, 0.01],
    ['osSpeed', 'Самоход, px/с', -200, 200, 1],
    ['osEase', 'Мягкость погони', 0, 97, 1],
    ['h', 'Датчик'],
    ['osLine', 'Линия оси', 'select', [['off', 'скрыть'], ['on', 'показать']]],
    ['grid', 'Символьная сетка', 'select', [['off', 'скрыть'], ['on', 'показать']]]
  ],
  desc: {
    frac: 'Ширина блока в долях ширины экрана. Кегль пересчитывается за ней: 24 знака всегда занимают ровно эту ширину. В оригинале — четверть экрана.',
    lead: 'Расстояние между строками в долях кегля. 1.14 — как в оригинале.',
    track: 'Разрядка между знаками, тысячные кегля. Колонка становится шире — кегль уменьшается, ширина блока держится.',
    osFit: 'Весь ряд занимает ровно ширину экрана: кегль оси выводится из неё замером. Со «своим кеглем» ось живёт макетным размером и уходит за правый край.',
    osSize: 'Кегль оси, когда она не вписывается в экран. В макете — 18 px.',
    osGap: 'Расстояние между элементами оси в долях кегля. В макете 33 px на кегле 18 — это 1.83.',
    osTrack: 'Разрядка оси. В макете 3.6 px на кегле 18 — это 200‰.',
    osWdth: 'Ширина знака вариативной Прагматики. В макете стоит ABC Diatype Condensed; 78.5% подгоняют ряд под макетные 2882 px.',
    osWght: 'Насыщенность вариативной Прагматики. В макете — Diatype Condensed Medium.',
    osPlate: 'Тёмная плашка под каждым элементом. С ней цвет знаков рождается вычитанием, как в макете, — выходит макетный сине-серый; без неё тот же цвет посчитан от поля стенда.',
    osSharp: 'Ноль — ось идёт гладкой кривой через вершины, единица — ломаной с углами на вершинах.',
    osHod: 'Как лента распределяется вдоль оси. Ноль — ровно; вправо — элементы липнут к вершинам и разрежаются между ними; влево — наоборот, спешат от вершин.',
    osRot: 'Насколько элемент доворачивается по касательной к оси. Ноль — все стоят горизонтально, единица — ложатся вдоль кривой.',
    osSpeed: 'Постоянный ход ленты. Ноль — ось стоит и живёт только от скролла.',
    osEase: 'Инерция погони: лента догоняет цель скролла мягко. Ноль — мгновенно, к 97 — тягуче.',
    osLine: 'Показать саму кривую оси и её узлы поверх экрана.',
    grid: 'Показать 24 колонки и строки, из которых выведен кегль.'
  }
});

/* ── редактор оси: холст с пропорциями экрана ──────────────────────
   Вход слева, выход справа, между ними свободные вершины. Все точки
   таскаются, крайние можно увести за кромку — холст шире экрана.
   Двойной клик по линии добавляет вершину, по вершине — убирает.
   ────────────────────────────────────────────────────────────────── */
(function buildOsEditor() {
  var EX0 = -0.2, EX1 = 1.2, EY0 = -0.15, EY1 = 1.15; // холст шире экрана

  var wrap = document.createElement('div');
  wrap.className = 'card';
  var cap = document.createElement('h4');
  cap.className = 'st-sec';
  cap.textContent = 'Ось движения';
  var cv = document.createElement('canvas');
  cv.style.cssText = 'width:100%;display:block;border-radius:6px;cursor:crosshair;touch-action:none';
  wrap.appendChild(cv);

  var panel = ui.panel;
  panel.insertBefore(cap, panel.firstChild);
  panel.insertBefore(wrap, cap.nextSibling);

  function ex(x) { return (x - EX0) / (EX1 - EX0) * cv.width; }
  function ey(y) { return (y - EY0) / (EY1 - EY0) * cv.height; }
  function ix(px) { return EX0 + px / cv.width * (EX1 - EX0); }
  function iy(py) { return EY0 + py / cv.height * (EY1 - EY0); }

  function redraw() {
    var w = cv.clientWidth || 240;
    var ratio = window.innerHeight / window.innerWidth;
    var h = w * ratio * ((EY1 - EY0) / (EX1 - EX0));
    var dpr = window.devicePixelRatio || 1;
    cv.width = w * dpr; cv.height = h * dpr;
    cv.style.height = h + 'px';
    var g = cv.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.scale(dpr, dpr);
    var W = cv.width / dpr, H = cv.height / dpr;
    function EX(x) { return (x - EX0) / (EX1 - EX0) * W; }
    function EY(y) { return (y - EY0) / (EY1 - EY0) * H; }

    g.clearRect(0, 0, W, H);
    g.fillStyle = 'rgba(127,127,127,.13)';
    g.fillRect(0, 0, W, H);
    // прямоугольник самого экрана — за его кромками точки тоже живут
    g.fillStyle = 'rgba(127,127,127,.16)';
    g.fillRect(EX(0), EY(0), EX(1) - EX(0), EY(1) - EY(0));

    g.strokeStyle = '#e0603c';
    g.lineWidth = 1.5;
    g.beginPath();
    for (var i = 0; i <= 160; i++) {
      var t = i / 160;
      i ? g.lineTo(EX(t), EY(osY(t))) : g.moveTo(EX(t), EY(osY(t)));
    }
    g.stroke();

    P.osPts.forEach(function (p, i) {
      g.beginPath(); g.arc(EX(p[0]), EY(p[1]), 4.5, 0, 6.2832);
      g.fillStyle = (i === 0 || i === P.osPts.length - 1) ? '#e0603c' : '#fff';
      g.fill();
      g.lineWidth = 1.5; g.strokeStyle = '#e0603c'; g.stroke();
    });
  }

  var drag = -1;
  function pick(e) {
    var r = cv.getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    return [EX0 + x * (EX1 - EX0), EY0 + y * (EY1 - EY0)];
  }
  function nearest(pt) {
    var best = -1, bd = 0.05;
    P.osPts.forEach(function (p, i) {
      var d = Math.hypot(p[0] - pt[0], p[1] - pt[1]);
      if (d < bd) { bd = d; best = i; }
    });
    return best;
  }
  cv.addEventListener('pointerdown', function (e) {
    var pt = pick(e);
    drag = nearest(pt);
    if (drag >= 0) { cv.setPointerCapture(e.pointerId); e.preventDefault(); }
  });
  cv.addEventListener('pointermove', function (e) {
    if (drag < 0) return;
    var pt = pick(e);
    P.osPts[drag] = [Math.max(EX0, Math.min(EX1, pt[0])), Math.max(EY0, Math.min(EY1, pt[1]))];
    ui.save(); redraw(); drawOsLine();
  });
  cv.addEventListener('pointerup', function () { drag = -1; });
  cv.addEventListener('dblclick', function (e) {
    var pt = pick(e), i = nearest(pt);
    if (i > 0 && i < P.osPts.length - 1 && P.osPts.length > 3) {
      P.osPts.splice(i, 1);           // двойной по вершине — убрать
    } else if (i < 0) {
      P.osPts.push([pt[0], pt[1]]);   // двойной по полю — добавить вершину
      P.osPts.sort(function (a, b) { return a[0] - b[0]; });
    }
    ui.save(); redraw(); drawOsLine();
  });

  osRedrawEditor = redraw;
  redraw();
  addEventListener('resize', redraw);
})();

// панель пишет прямо в P — сторожим значения, лента едет каждый кадр
var last = '', prevT = 0;
(function tick(now) {
  var dt = prevT ? Math.min(0.05, (now - prevT) / 1000) : 0;
  prevT = now || 0;
  var s = [P.frac, P.lead, P.track, P.grid,
           P.osFit, P.osSize, P.osGap, P.osTrack, P.osWdth, P.osWght,
           P.osSharp, P.osPlate, P.osLine, JSON.stringify(P.osPts),
           window.innerWidth, window.innerHeight].join('|');
  if (s !== last) {
    last = s;
    apply(); measureOs();
    if (osRedrawEditor) osRedrawEditor();
  }
  frameOs(dt);
  requestAnimationFrame(tick);
})(0);

measureAdvance();
apply();
measureOs();
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function () { measureAdvance(); apply(); measureOs(); });
}
</script>
</body>
