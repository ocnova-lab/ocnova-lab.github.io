<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Моноблок</title>
<link rel="stylesheet" href="/panel.css" />
<style>
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('/fonts/JetBrainsMono-Regular.woff2') format('woff2');
    font-weight: 400;
    font-style: normal;
    font-display: block; /* сетка выводится из шрифта — ждём его, а не мигаем подменой */
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('/fonts/JetBrainsMono-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'Pragmatica Next VF';
    src: url('/fonts/PragmaticaNextVF.woff') format('woff-variations');
    font-weight: 100 900;
    font-stretch: 50% 100%;
    font-style: normal;
    font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #eae9e4;
    color: #1b1b1b;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.2;
    overflow: hidden;
    overscroll-behavior: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: 1rem;
    z-index: 6;
    color: #6a6a66;
    pointer-events: none;
  }
  header a { color: inherit; pointer-events: auto; }

  /* ── ось движения: лента элементов едет по кривой через экран ── */
  #os, #osline {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    overflow: hidden;
  }
  #os {
    font-family: 'Pragmatica Next VF', "Helvetica Neue", Arial, sans-serif;
    text-transform: uppercase;
    /* кегль, ширину знака, промежуток и разрядку ставит закон в скрипте */
  }
  #os .el {
    position: absolute;
    top: 0; left: 0;
    white-space: pre;
    transform-origin: 0 0;
    color: #4f4032; /* цвет макета, вычтенный из поля стенда заранее */
    text-box-trim: trim-both;
    text-box-edge: cap alphabetic;
  }
  /* плашка — тогда цвет знаков рождается вычитанием прямо из неё, как в макете */
  body.os-plate #os .el {
    background: #323232;
    color: #9ba9b2;
    mix-blend-mode: difference;
    padding: 0.28em 0.5em;
    margin: -0.28em -0.5em;
  }
  #osline { display: none; }
  body.os-line #osline { display: block; }

  /* ── блок: ширина = доля экрана, внутри 24 колонки символов ── */
  #blok {
    position: relative;
    font-family: 'JetBrains Mono', Menlo, "DejaVu Sans Mono", monospace;
    font-weight: 400;
    white-space: pre;
    /* кегль, ширина, интерлиньяж и трекинг ставит закон в скрипте */
  }
  #blok .ln {
    position: relative;
    height: 1lh;
  }
  #blok .c, #blok .r { position: absolute; top: 0; }
  #blok .c { left: 50%; transform: translateX(-50%); }
  /* трекинг добавляет пробел и после последнего знака — правый край его снимает */
  #blok .r { right: 0; margin-right: calc(-1 * var(--track, 0px)); }

  /* ── датчик: символьная сетка блока ── */
  #setka {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
    display: none;
    outline: 1px solid rgba(180, 60, 40, 0.5);
  }
  body.grid #setka { display: block; }
</style>
</head>
<body>
  <canvas id="osline"></canvas>
  <div id="os"></div>

  <header>Сергей Гуров — моноблок · блок на символьной сетке, вокруг — поток строк на редактируемой оси: фразы набираются в строки, строки едут по петле · <a href="/">стенды</a></header>

  <div id="blok"><div id="setka"></div></div>

<script src="/panel.js"></script>
<script>
'use strict';
/* ============================================================
   Стенд «Моноблок» — по референсу с адресом на THEANXIETTTY.

   Закон блока:
   строка блока = 24 колонки моноширинного шрифта. Ширина блока
   задаётся долей ширины экрана, а кегль не подбирается на глаз,
   а вычисляется из неё: кегль = ширина / (24 × (шаг знака + трекинг)).
   Шаг знака берётся замером у самого шрифта, поэтому подмена
   гарнитуры не ломает сетку.

   Внутри строки три зоны — левый край, центр, правый край.
   Центр честный (не по колонкам), поэтому нечётные строки
   вроде «PHONE» стоят ровно посередине, как в оригинале.

   Датчик «Символьная сетка» показывает те самые 24 колонки и
   строки: закон объявлен — вот его линии.

   Ось движения (приём «вёрстка по редактируемой оси»):
   элементы из макета «for vibe code» — фразы-атомы. Атомы
   набираются в СТРОКИ по заданной ширине (узкая несёт одну фразу,
   широкая склеивает несколько целиком; фразу набор не рвёт), и по
   оси едут именно строки. Отсюда строчная структура движения:
   ширина строки и шаг ритма перестраивают поток на ходу.
   Ось по умолчанию замкнута в кольцо вокруг блока и размыкается
   лентой одной ручкой. Вершины таскаются в редакторе-холсте с
   пропорциями экрана, их можно уводить за кромку, добавлять и
   убирать двойным кликом. «Острота» ведёт от
   гладкой кривой к ломаной, «ход» сгущает ленту у вершин или
   расталкивает от них. Длина ленты равна длине пути — кольцо
   замыкается без шва; кегль, как и у блока, выводится замером.
   Скролл (колесо, палец, стрелки) двигает цель, лента догоняет
   её аналогово. Diatype Condensed заменён вариативной Прагматикой,
   сужённой до макетной ширины ряда.
   ============================================================ */

var COLS = 24; // ширина блока в знаках — задана самой длинной строкой

// Строки блока: raw — вся строка целиком (ровно 24 знака),
// l / c / r — левый край, центр, правый край; bold — жирная зона строки.
var LINES = [
  { c: '814 BERRY STREET' },
  { raw: 'SAN FRANCISCO . CP 94158' },
  { l: '3', c: 'CA — USA', bold: 'c', r: '1' },
  { l: '2', r: '2' },
  { l: '1', c: 'PHONE', r: '3' },
  { raw: '+   00  1  415  324 1379' },
  { c: 'THEANXIETTTY.COM' },
  { c: 'REPEAT' }
];

// Ось сверху — по макету «for vibe code» (2822:44076): строка элементов,
// набранных узким гротеском вразрядку. Массив — элемент оси; вложенный
// массив — элемент в несколько строк.
var OS_ITEMS = [
  'osnova', '®', 'lab.',
  '1', '1', '1', '1', '1',
  ['authors design', 'workshop'],
  '2', '2', '2', '2',
  '–    00:05:42    –',
  'sergei gurov',
  '3', '3', '3',
  ['oakmoss, green fig', 'charcoal'],
  ['107–325.67', '/5'],
  '4', '4',
  ['mossfield soft', 'volcanic salted', 'wind'],
  'aewol andelok',
  '5',
  ['mossfield soft', 'volcanic salted', 'wind'],
  ['oakmoss, green fig', 'charcoal'],
  'aewol andelok',
  '0', '0', '0'
];

var DEFAULTS = {
  frac: 25,     // ширина блока, % ширины экрана
  lead: 1.14,   // интерлиньяж, доли кегля
  track: 0,     // трекинг, тысячные кегля
  grid: 'off',  // датчик: символьная сетка
  osFit: 'on',  // ось: длина ленты равна ширине экрана
  osSize: 18,   // кегль оси, px — когда лента не вписывается
  osGap: 1.83,  // промежуток между элементами, доли кегля (33/18 из макета)
  osTrack: 200, // разрядка, тысячные кегля (3.6/18 из макета)
  osWdth: 78.5, // ширина знака, % — узкий гротеск вместо Diatype Condensed
  osWght: 450,  // насыщенность знака оси
  osShape: 'ring', // ось замкнута в кольцо или разомкнута лентой
  // геометрия оси: вершины в долях экрана; по умолчанию — кольцо вокруг блока
  osPts: // без ручки — вершины тянутся мышью по холсту, не слайдером
        [[0.500, 0.130], [0.666, 0.238], [0.735, 0.500], [0.666, 0.762],
          [0.500, 0.870], [0.334, 0.762], [0.265, 0.500], [0.334, 0.238]],
  osLineW: 20,  // ширина строки набора, доли кегля: сколько фраз склеится
  osRitm: 'width', // ритм потока: шаг по ширине строки или постоянный
  osStep: 22,   // постоянный шаг строки, доли кегля
  osSharp: 0,   // острота: 0 — гладкая кривая, 1 — ломаная
  osHod: 0,     // ход: −1 спешит от вершин, +1 липнет к ним
  osRot: 1,     // поворот элемента по касательной к оси, доля
  osShift: 0,   // сдвиг поперёк оси, доли кегля: наружу кольца или внутрь
  osSpeed: 14,  // самоход ленты, px/с
  osEase: 88,   // мягкость погони ленты за целью скролла
  osPlate: 'off', // плашка под элементом — тогда цвет вычитается, как в макете
  osLine: 'off'   // датчик: линия оси на экране
};
var P = Object.assign({}, DEFAULTS);
try {
  var saved = JSON.parse(localStorage.getItem('monoblok-params'));
  if (saved) Object.assign(P, saved);
} catch (e) {}

// ?frac=33&grid=on&osBack=none — параметры из адреса (удобно для скриншотов)
new URLSearchParams(location.search).forEach(function (v, k) {
  if (!(k in DEFAULTS)) return;
  if (Array.isArray(DEFAULTS[k])) {
    P[k] = v.split(';').map(function (pair) { return pair.split(',').map(parseFloat); });
  } else {
    P[k] = (typeof DEFAULTS[k] === 'number') ? parseFloat(v) : v;
  }
});

// ── разметка блока ──
var blok = document.getElementById('blok');
var setka = document.getElementById('setka');
LINES.forEach(function (L) {
  var ln = document.createElement('div');
  ln.className = 'ln';
  if (L.raw) {
    ln.textContent = L.raw;
  } else {
    ['l', 'c', 'r'].forEach(function (zone) {
      if (!L[zone]) return;
      var s = document.createElement('span');
      s.className = zone;
      s.textContent = L[zone];
      if (L.bold === zone) s.style.fontWeight = 700;
      ln.appendChild(s);
    });
  }
  blok.appendChild(ln);
});

/* ── поток оси ────────────────────────────────────────────────────
   Атом набора — фраза (строка макета): многострочный элемент
   входит в поток отдельными строками. Атомы набираются в СТРОКИ
   по заданной ширине: узкая строка несёт одну фразу, широкая
   склеивает несколько целиком — фразу набор не рвёт. По оси едут
   именно строки, поэтому у движения есть строчная структура:
   крутишь ширину строки — набор перестраивается на ходу.
   ───────────────────────────────────────────────────────────────── */
var os = document.getElementById('os');
var header = document.querySelector('header');
var osEls = [];

// плоский список фраз-атомов в порядке макета
var OS_ATOMS = [];
OS_ITEMS.forEach(function (it) {
  if (Array.isArray(it)) it.forEach(function (t) { OS_ATOMS.push(t); });
  else OS_ATOMS.push(it);
});

// мерка атомов: ширины в долях кегля, чтобы набор не зависел от размера
var osMeter = document.createElement('div');
osMeter.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;top:0;left:0';
os.appendChild(osMeter);
var osAtomW = [];

function measureAtoms() {
  osMeter.textContent = '';
  var spans = OS_ATOMS.map(function (t) {
    var sp = document.createElement('span');
    sp.textContent = t;
    sp.style.cssText = 'display:block;width:max-content';
    osMeter.appendChild(sp);
    return sp;
  });
  var track = P.osTrack / 1000;
  osAtomW = spans.map(function (sp) {
    return sp.getBoundingClientRect().width / OS_BASE - track; // без хвоста разрядки
  });
  osMeter.textContent = '';
}

// набор: атомы склеиваются в строки, пока строка не шире заданного
function setLines() {
  var lines = [], cur = [], w = 0;
  for (var i = 0; i < OS_ATOMS.length; i++) {
    var aw = osAtomW[i] || 0;
    var add = cur.length ? P.osGap + aw : aw;
    if (cur.length && w + add > P.osLineW) { lines.push({ a: cur, w: w }); cur = []; w = 0; add = aw; }
    cur.push(i); w += add;
  }
  if (cur.length) lines.push({ a: cur, w: w });

  os.textContent = '';
  os.appendChild(osMeter);
  osEls = lines.map(function (L) {
    var el = document.createElement('div');
    el.className = 'el';
    el.style.display = 'flex';
    el.style.gap = P.osGap + 'em';
    L.a.forEach(function (i) {
      var sp = document.createElement('span');
      sp.textContent = OS_ATOMS[i];
      el.appendChild(sp);
    });
    os.appendChild(el);
    return el;
  });
  return lines;
}

var OS_LEAD = 20 / 18; // интерлиньяж оси из макета: 20 px на кегле 18
var OS_BASE = 100;     // кегль замера: чем крупнее, тем меньше ошибка округления

/* ── геометрия оси ───────────────────────────────────────────────
   Ось — путь по экрану через свободные вершины. Кольцо замыкает
   путь сам на себя, лента оставляет концы открытыми — механизм
   один: катмулл-ром по вершинам, «острота» подмешивает ломаную,
   путь меряется по длине (таблица сэмплов), поэтому лента едет
   ровно и на коротких пролётах не частит.
   «Ход» сгущает элементы у вершин или расталкивает от них.
   ───────────────────────────────────────────────────────────────── */

var osRedrawEditor = null;
var osPath = null;   // путь оси в пикселях: { pts, len, nodeU }
var osL = 0, osSpans = [], osFs = 18, osOff = 0, osTarget = 0;

function osRing() { return P.osShape === 'ring'; }

function buildPath(PTS) {
  var W = window.innerWidth, H = window.innerHeight;
  var n = PTS.length, closed = osRing(), SUB = 20, sharp = P.osSharp;
  function pt(i) {
    if (closed) { var p = PTS[(i % n + n) % n]; return [p[0] * W, p[1] * H]; }
    if (i < 0) i = 0; if (i > n - 1) i = n - 1;     // концы держим прямыми
    return [PTS[i][0] * W, PTS[i][1] * H];
  }
  function cr(a, b, c, d, u) {
    var u2 = u * u, u3 = u2 * u;
    return 0.5 * (2 * b + (-a + c) * u + (2 * a - 5 * b + 4 * c - d) * u2 +
                  (-a + 3 * b - 3 * c + d) * u3);
  }
  var pts = [], nodeU = [], cum = 0, prev = null;
  var segs = closed ? n : n - 1;
  for (var i = 0; i < segs; i++) {
    var p0 = pt(i - 1), p1 = pt(i), p2 = pt(i + 1), p3 = pt(i + 2);
    nodeU.push(cum);
    for (var j = 0; j < SUB; j++) {
      var u = j / SUB;
      var x = cr(p0[0], p1[0], p2[0], p3[0], u), y = cr(p0[1], p1[1], p2[1], p3[1], u);
      x = x * (1 - sharp) + (p1[0] + (p2[0] - p1[0]) * u) * sharp;
      y = y * (1 - sharp) + (p1[1] + (p2[1] - p1[1]) * u) * sharp;
      if (prev) cum += Math.hypot(x - prev[0], y - prev[1]);
      pts.push({ x: x, y: y, s: cum });
      prev = [x, y];
    }
  }
  var end = closed ? pt(0) : pt(n - 1);
  cum += prev ? Math.hypot(end[0] - prev[0], end[1] - prev[1]) : 0;
  pts.push({ x: end[0], y: end[1], s: cum });
  nodeU.push(cum);
  return { pts: pts, len: cum || 1, nodeU: nodeU.map(function (s) { return s / (cum || 1); }) };
}

function buildPath0() { osPath = buildPath(P.osPts); }

// «ход»: где лента идёт плотнее. 0 — ровно, +1 — липнет к вершинам,
// −1 — спешит от них. Темп меняем внутри каждого пролёта между вершинами.
function osWarp(u) {
  var h = P.osHod;
  if (!h || !osPath) return u;
  var xs = osPath.nodeU, i;
  for (i = 0; i < xs.length - 1 && !(u >= xs[i] && u <= xs[i + 1]); i++) {}
  var a = xs[i], b = xs[i + 1];
  if (b === undefined || b <= a) return u;
  var p = (u - a) / (b - a);
  var s = p * p * (3 - 2 * p);        // липнет к краям пролёта, то есть к вершинам
  var f = h > 0 ? p + (s - p) * h : p + (p - s) * (-h);
  return a + f * (b - a);
}

// точка пути по доле длины + угол касательной
function pathAt(path, u) {
  var pts = path.pts, len = path.len;
  var s = u * len, lo = 0, hi = pts.length - 1;
  while (lo < hi - 1) { var m = (lo + hi) >> 1; if (pts[m].s <= s) lo = m; else hi = m; }
  var a = pts[lo], b = pts[hi];
  var k = (s - a.s) / ((b.s - a.s) || 1e-6);
  return {
    x: a.x + (b.x - a.x) * k,
    y: a.y + (b.y - a.y) * k,
    ang: Math.atan2(b.y - a.y, b.x - a.x)
  };
}

// замер атомов → набор строк → ритм потока → кегль из длины пути
function measureOs() {
  var track = P.osTrack / 1000;
  os.style.fontVariationSettings = "'wdth' " + P.osWdth + ", 'wght' " + P.osWght;
  os.style.letterSpacing = track + 'em';
  os.style.lineHeight = OS_LEAD;

  os.style.fontSize = OS_BASE + 'px';
  measureAtoms();
  var lines = setLines();

  // ритм: шаг строки постоянный или по её собственной ширине
  var steps = lines.map(function (L) {
    return P.osRitm === 'even' ? P.osStep : L.w + P.osGap;
  });
  var lenEm = steps.reduce(function (a, b) { return a + b; }, 0);

  buildPath0();
  // вписывание: поток строк ровно замыкает путь — кегль выводится из него
  osFs = (P.osFit === 'on') ? osPath.len / lenEm : P.osSize;
  os.style.fontSize = osFs + 'px';

  osL = lenEm * osFs;
  osSpans = [];
  var s = 0;
  for (var i = 0; i < steps.length; i++) { osSpans.push(s); s += steps[i] * osFs; }

  document.body.classList.toggle('os-plate', P.osPlate === 'on');
  document.body.classList.toggle('os-line', P.osLine === 'on');
  drawOsLine();
}

// датчик: сама кривая на экране
var oslineCv = document.getElementById('osline');
function drawOsLine() {
  var dpr = window.devicePixelRatio || 1;
  var W = window.innerWidth, H = window.innerHeight;
  oslineCv.width = W * dpr; oslineCv.height = H * dpr;
  oslineCv.style.width = W + 'px'; oslineCv.style.height = H + 'px';
  var g = oslineCv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  if (!osPath) return;
  g.strokeStyle = 'rgba(180,60,40,.5)'; g.fillStyle = 'rgba(180,60,40,.5)'; g.lineWidth = 1;
  g.beginPath();
  osPath.pts.forEach(function (p, i) { i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y); });
  g.stroke();
  P.osPts.forEach(function (p) {
    g.beginPath(); g.arc(p[0] * W, p[1] * H, 3, 0, 6.2832); g.fill();
  });
}

// кадр: лента едет, каждый элемент садится на путь своей долей длины
function frameOs(dt) {
  if (!osPath) return;
  osTarget += P.osSpeed * dt;
  var k = 1 - Math.pow(1 - (1 - P.osEase / 100), dt * 60); // аналоговая погоня
  osOff += (osTarget - osOff) * k;

  for (var i = 0; i < osEls.length; i++) {
    var u = ((osSpans[i] + osOff) % osL) / osL;
    if (u < 0) u += 1;
    var el = osEls[i];
    if (u > 1) { el.style.visibility = 'hidden'; continue; } // лента длиннее пути
    el.style.visibility = '';
    var p = pathAt(osPath, osWarp(u));
    var off = P.osShift * osFs; // поперёк оси, по нормали
    var x = p.x - Math.sin(p.ang) * off, y = p.y + Math.cos(p.ang) * off;
    el.style.transform = 'translate(' + x + 'px,' + y + 'px) rotate(' + (p.ang * P.osRot) + 'rad)';
  }
}

// ── скролл: колесо, палец и клавиши двигают цель, лента догоняет ──
addEventListener('wheel', function (e) {
  // колесо шлёт пиксели, строки (deltaMode 1) или экраны (2) — сводим к пикселям // без ручки
  var kx = e.deltaMode === 1 ? 100 / 6 : e.deltaMode === 2 ? innerWidth : 1;
  var ky = e.deltaMode === 1 ? 100 / 6 : e.deltaMode === 2 ? innerHeight : 1;
  var dx = e.deltaX * kx, dy = e.deltaY * ky;
  osTarget += (Math.abs(dx) > Math.abs(dy) ? dx : dy) * 1.2;
}, { passive: true });
var osTouch = null;
addEventListener('touchstart', function (e) { osTouch = e.touches[0].clientX; }, { passive: true });
addEventListener('touchmove', function (e) {
  if (osTouch !== null) { osTarget -= e.touches[0].clientX - osTouch; osTouch = e.touches[0].clientX; }
}, { passive: true });
addEventListener('touchend', function () { osTouch = null; });
addEventListener('keydown', function (e) {
  if (e.key === 'ArrowRight') osTarget += 60;
  if (e.key === 'ArrowLeft') osTarget -= 60;
});

// ── шаг знака: спрашиваем у самого шрифта, а не помним числом ──
var advRatio = 0.6; // до замера — обычная моношириная доля кегля
function measureAdvance() {
  var cv = document.createElement('canvas').getContext('2d');
  cv.font = '100px ' + getComputedStyle(blok).fontFamily;
  var w = cv.measureText('MMMMMMMMMM').width; // десять знаков — меньше ошибка округления
  if (w > 0) advRatio = w / 10 / 100;
}

function apply() {
  var target = window.innerWidth * P.frac / 100; // ширина блока
  var track = P.track / 1000;                    // трекинг в долях кегля
  var fs = target / (COLS * (advRatio + track));

  blok.style.width = target + 'px';
  blok.style.fontSize = fs + 'px';
  blok.style.lineHeight = P.lead;
  blok.style.letterSpacing = (track * fs) + 'px';
  blok.style.setProperty('--track', (track * fs) + 'px');

  // датчик рисует ту же сетку, из которой выведен кегль
  var colw = target / COLS;
  var lineh = fs * P.lead;
  setka.style.width = target + 'px';
  setka.style.height = (lineh * LINES.length) + 'px';
  setka.style.backgroundImage =
    'repeating-linear-gradient(90deg, rgba(180,60,40,.35) 0 1px, transparent 1px ' + colw + 'px),' +
    'repeating-linear-gradient(180deg, rgba(180,60,40,.35) 0 1px, transparent 1px ' + lineh + 'px)';
  document.body.classList.toggle('grid', P.grid === 'on');
}

// ── панель ──

    ['osRitm', 'Ритм потока', 'select', [['width', 'шаг по ширине строки'], ['even', 'постоянный шаг']]],

  ],

/* ── редактор оси: холст с пропорциями экрана ──────────────────────
   Вход слева, выход справа, между ними свободные вершины. Все точки
   таскаются, крайние можно увести за кромку — холст шире экрана.
   Двойной клик по линии добавляет вершину, по вершине — убирает.
   ────────────────────────────────────────────────────────────────── */
(function buildOsEditor() {
  var EX0 = -0.2, EX1 = 1.2, EY0 = -0.15, EY1 = 1.15; // холст шире экрана

  var wrap = document.createElement('div');
  wrap.className = 'card';
  var cap = document.createElement('h4');
  cap.className = 'st-sec';
  cap.textContent = 'Ось движения';
  var cv = document.createElement('canvas');
  cv.style.cssText = 'width:100%;display:block;border-radius:6px;cursor:crosshair;touch-action:none';
  wrap.appendChild(cv);

  var panel = ui.panel;
  panel.insertBefore(cap, panel.firstChild);
  panel.insertBefore(wrap, cap.nextSibling);

  function ex(x) { return (x - EX0) / (EX1 - EX0) * cv.width; }
  function ey(y) { return (y - EY0) / (EY1 - EY0) * cv.height; }
  function ix(px) { return EX0 + px / cv.width * (EX1 - EX0); }
  function iy(py) { return EY0 + py / cv.height * (EY1 - EY0); }

  function redraw() {
    if (!osPath) buildPath0(); // редактор может открыться раньше первого замера
    var w = cv.clientWidth || 240;
    var ratio = window.innerHeight / window.innerWidth;
    var h = w * ratio * ((EY1 - EY0) / (EX1 - EX0));
    var dpr = window.devicePixelRatio || 1;
    cv.width = w * dpr; cv.height = h * dpr;
    cv.style.height = h + 'px';
    var g = cv.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.scale(dpr, dpr);
    var W = cv.width / dpr, H = cv.height / dpr;
    function EX(x) { return (x - EX0) / (EX1 - EX0) * W; }
    function EY(y) { return (y - EY0) / (EY1 - EY0) * H; }

    g.clearRect(0, 0, W, H);
    g.fillStyle = 'rgba(127,127,127,.13)';
    g.fillRect(0, 0, W, H);
    // прямоугольник самого экрана — за его кромками точки тоже живут
    g.fillStyle = 'rgba(127,127,127,.16)';
    g.fillRect(EX(0), EY(0), EX(1) - EX(0), EY(1) - EY(0));

    // тот же путь, что и на экране, только в долях
    var sw = window.innerWidth, sh = window.innerHeight;
    g.strokeStyle = '#e0603c';
    g.lineWidth = 1.5;
    g.beginPath();
    osPath.pts.forEach(function (p, i) {
      var x = EX(p.x / sw), y = EY(p.y / sh);
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    });
    if (osRing()) g.closePath();
    g.stroke();
    P.osPts.forEach(function (p, i) {
      g.beginPath(); g.arc(EX(p[0]), EY(p[1]), 4.5, 0, 6.2832);
      // у разомкнутой ленты крайние вершины — вход и выход
      g.fillStyle = (!osRing() && (i === 0 || i === P.osPts.length - 1)) ? '#e0603c' : '#fff';
      g.fill();
      g.lineWidth = 1.5; g.strokeStyle = '#e0603c'; g.stroke();
    });
  }

  var drag = -1;
  function pick(e) {
    var r = cv.getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    return [EX0 + x * (EX1 - EX0), EY0 + y * (EY1 - EY0)];
  }
  function nearest(pt) {
    var best = -1, bd = 0.05;
    P.osPts.forEach(function (p, i) {
      var d = Math.hypot(p[0] - pt[0], p[1] - pt[1]);
      if (d < bd) { bd = d; best = i; }
    });
    return best;
  }
  cv.addEventListener('pointerdown', function (e) {
    drag = nearest(pick(e));
    if (drag >= 0) { cv.setPointerCapture(e.pointerId); e.preventDefault(); }
  });
  cv.addEventListener('pointermove', function (e) {
    if (drag < 0) return;
    var pt = pick(e);
    P.osPts[drag] = [Math.max(EX0, Math.min(EX1, pt[0])), Math.max(EY0, Math.min(EY1, pt[1]))];
    ui.save(); measureOs(); redraw();
  });
  cv.addEventListener('pointerup', function () { drag = -1; });
  cv.addEventListener('dblclick', function (e) {
    var pt = pick(e), i = nearest(pt);
    if (i >= 0 && P.osPts.length > 3) {
      P.osPts.splice(i, 1);             // двойной по вершине — убрать
    } else if (i < 0) {
      // новая вершина встаёт в тот пролёт, к которому ближе указатель
      var W = window.innerWidth, H = window.innerHeight, bd = 1e9, bestK = 0;
      var n = P.osPts.length, lim = osRing() ? n : n - 1;
      for (var k = 0; k < lim; k++) {
        var a = P.osPts[k], b = P.osPts[(k + 1) % n];
        var mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
        var d = Math.hypot((mx - pt[0]) * W, (my - pt[1]) * H);
        if (d < bd) { bd = d; bestK = k; }
      }
      P.osPts.splice(bestK + 1, 0, [pt[0], pt[1]]);
    }
    ui.save(); measureOs(); redraw();
  });

  osRedrawEditor = redraw;
  redraw();
  addEventListener('resize', redraw);
})();

// панель пишет прямо в P — сторожим значения, лента едет каждый кадр
var last = '', prevT = 0;
(function tick(now) {
  var dt = prevT ? Math.min(0.05, (now - prevT) / 1000) : 0;
  prevT = now || 0;
  var s = [P.frac, P.lead, P.track, P.grid,
           P.osFit, P.osSize, P.osGap, P.osTrack, P.osWdth, P.osWght,
           P.osShape, P.osLineW, P.osRitm, P.osStep, P.osSharp, P.osPlate, P.osLine,
           JSON.stringify(P.osPts),
           window.innerWidth, window.innerHeight].join('|');
  if (s !== last) {
    last = s;
    apply(); measureOs();
    if (osRedrawEditor) osRedrawEditor();
  }
  frameOs(dt);
  requestAnimationFrame(tick);
})(0);

measureAdvance();
apply();
measureOs();
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function () { measureAdvance(); apply(); measureOs(); });
}
</script>
