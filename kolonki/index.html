<!DOCTYPE html>
<!-- Двенадцать колонок — демонстрационный стенд деления формата.
     Смотрит: на окно (ширина и высота формата).
     Реагирует: плавно, ни одного перелома.
     Закон 3 «Доли и Коридор» — поля доли формата, полоса делится на
     N равных долей; ширина колонки не задана нигде, она следствие.
     Плюс закон 10 «Догон» на курсорном слое.
     Приём: «Зональная интерпретация — зона наведения».
     Полная запись закона — в шапке скрипта ниже. -->
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Двенадцать колонок</title>
<link rel="stylesheet" href="/panel.css" />
<style>
  @font-face { font-family: "Editorial New"; font-weight: 400; font-style: normal;
    src: url("/fonts/EditorialNew-Regular.woff") format("woff"); font-display: swap; }
  @font-face { font-family: "Even Mono"; font-weight: 400; font-style: normal;
    src: url("/fonts/EvenMono-Regular.woff2") format("woff2"),
         url("/fonts/EvenMono-Regular.woff") format("woff"); font-display: swap; }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; font-style: normal;
    src: url("/fonts/JetBrainsMono-Regular.woff2") format("woff2"); font-display: swap; }
  @font-face { font-family: "Pragmatica Next VF"; font-weight: 100 900; font-style: normal;
    src: url("/fonts/PragmaticaNextVF.woff") format("woff"); font-display: swap; }
  @font-face { font-family: "Trigonon"; font-weight: 400; font-style: normal;
    src: url("/fonts/Trigonon-Regular.woff2") format("woff2"); font-display: swap; }
  @font-face { font-family: "Dentegra Display"; font-weight: 400; font-style: normal;
    src: url("/fonts/DentDisplay-Regular.woff2") format("woff2"); font-display: swap; }
  @font-face { font-family: "Syne Mono"; font-weight: 400; font-style: normal;
    src: url("/fonts/SyneMono-Regular.woff2") format("woff2"); font-display: swap; }
  @font-face { font-family: "Apple II Screen Typeface"; font-weight: 400; font-style: normal;
    src: url("/fonts/AppleIIScreenTypeface.woff2") format("woff2"); font-display: swap; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bumaga);
    color: var(--figura);
    font-family: var(--garn), "Even Mono", monospace;
    overflow: hidden;
    overscroll-behavior: none;
  }

  /* ПОЛЯ — рамкой, а не отступом: толщина рамки и есть поле, объявленное
     долей формата. Боковое меряется от ширины (vw), верхнее и нижнее —
     от высоты (vh); одна доля на два измерения врала бы на любом экране,
     кроме квадратного. */
  #pole {
    position: fixed;
    inset: 0;
    border-style: solid;
    border-width: calc(var(--poleV) * 1vh) calc(var(--poleB) * 1vw);
    border-color: color-mix(in srgb, var(--sluzhba) calc(var(--alfa) * 1%), transparent);
    pointer-events: none;
    z-index: 1;
  }

  /* ПОЛОСА — то, что осталось от формата после полей. Координаты те же
     доли, что у рамки выше: inset и border-width считают одно и то же
     место с двух сторон, потому расхождения между ними быть не может. */
  #lenta {
    position: fixed;
    inset: calc(var(--poleV) * 1vh) calc(var(--poleB) * 1vw);
    display: grid;                  /* колонки ставит JS: repeat(N, 1fr) */
    z-index: 2;
  }
  #lenta.ramka { outline: 1px solid color-mix(in srgb, var(--sluzhba) 55%, transparent); }

  /* КОЛОНКА — доля полосы, ширина ей не назначается ни разу. Она же зона
     наведения: активна вся высота, а не сам прямоугольник. */
  .col {
    position: relative;
    display: flex;
    min-width: 0;
    transition: background-color var(--ms) var(--bez);
  }
  .col.pod { background: color-mix(in srgb, var(--sluzhba) calc(var(--alfa) * 1%), transparent); }
  /* ГРАНЬ — левый край своей колонки. Отдельным слоем, а не border:
     бордер съел бы пиксель внутренней ширины, и «фигура во всю колонку»
     перестала бы быть правдой. */
  .gran {
    /* координаты: левый край своей колонки, во всю высоту полосы */
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 1px;
    background: color-mix(in srgb, var(--sluzhba) 55%, transparent);
    pointer-events: none;
  }
  .col:first-child > .gran { display: none; }   /* первую грань держит рамка полосы */
  .col.on  { background: color-mix(in srgb, var(--sluzhba) calc(var(--alfa) * 2%), transparent); }

  /* ФИГУРА — единственное фиксированное число стенда: высота в пикселях.
     Ширина — доля колонки, то есть доля доли: течёт вместе с форматом. */
  .fig {
    height: calc(var(--vys) * 1px);
    width: calc(var(--shir) * 1%);
    background: var(--figura);
    /* Подъём за курсором и рост ведёт кадр (transform ставится из JS),
       переходом идёт только цвет: два механизма на одном свойстве
       дрались бы за него, и догон дребезжал бы. */
    transition: background-color var(--ms) var(--bez);
    will-change: transform;
  }
  .col.on > .fig {
    background: color-mix(in srgb, var(--figura), var(--sluzhba) calc(var(--podsvet) * 1%));
  }

  /* НОМЕР колонки. Координаты: верх колонки, левый край колонки —
     служебная метка стоит в начале своей доли, собственного места
     в потоке ей не дают, чтобы она не двигала фигуру. */
  .nom {
    /* координаты: верх и левый край своей колонки — начало доли */
    position: absolute;
    top: 0; left: 0;
    padding-left: .45em;          /* отбивка от грани колонки — доля кегля метки */
    font-size: calc(var(--kegl) * 1px);
    line-height: 1.6;
    color: var(--sluzhba);
    opacity: .5;
    font-style: normal;
    transition: opacity var(--ms) var(--bez);
    pointer-events: none;
  }
  .col.on > .nom { opacity: 1; }

  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: .8rem 1rem;
    display: flex;
    gap: 1.2em;
    flex-wrap: wrap;
    align-items: baseline;
    font-size: calc(var(--kegl) * 1px);
    line-height: 1.6;
    color: var(--figura);
    z-index: 5;
    pointer-events: none;
  }
  header a { color: inherit; pointer-events: auto; }
  header .back { opacity: .5; text-decoration: none; }
  header .back:hover { opacity: 1; }
  header #svodka { opacity: .65; }
  header #svodka b { font-weight: 400; color: var(--sluzhba); }
</style>
</head>
<body>
  <div id="pole"></div>
  <div id="lenta"></div>
  <header>
    <a class="back" href="/">← стенды</a>
    <span>Двенадцать колонок</span>
    <span id="svodka"></span>
  </header>

<script>
/* Витринный гейт (panel.js) гасит панель на публичных адресах: наружу
   уходит результат, ручки живут на локалке. Здесь исключение по той же
   причине, что у каталога органов, — панель И ЕСТЬ содержание стенда:
   закон показывает не картинка, а то, как она перестраивается от правки
   величины. // без ручки */
window.STEND_PANEL_VSEGDA = true;
</script>
<script src="/panel.js"></script>
<script src="/panel-lib/obyavlenie.js"></script>
<script src="/panel-lib/palitra.js"></script>
<script src="/panel-lib/garnitura.js"></script>
<script src="/panel-lib/segment.js"></script>
<script src="/panel-lib/schyot.js"></script>
<script src="/panel-lib/toggle.js"></script>
<script src="/panel-lib/vyvod.js"></script>
<script>
'use strict';
/* ─────────────────────────────────────────────────────────────────────
   Двенадцать колонок — демонстрационный стенд разделения формата.
   Формат делится на N равных колонок, в каждой стоит прямоугольник
   фиксированной высоты во всю ширину своей колонки.

   Смотрит: на окно — ширину и высоту формата.
   Реагирует: плавно, ни одного перелома (@media нет вовсе).
   Закон 3 «Доли и Коридор»: поля — доли формата (боковое от ширины,
   вертикальное от высоты), полоса делится на N равных долей
   repeat(N, 1fr). Ширина колонки числом не задана нигде: она следствие,
   и панель показывает её строкой вывода, а не ручкой.
   Курсорный слой держат два закона сразу, каждый на своей оси.
   По горизонтали — 10 «Догон»: непрерывное положение курсора квантуется
   сеткой, под курсором всегда ровно одна колонка; индекс считается
   арифметикой из долей, а не замером элементов (П3).
   По вертикали — 12 «Магнит» ◌: сегмент активной колонки плавно тянется
   за курсором внутри коридора — от своего дома у нижней границы до
   верхней. Закон помечен кандидатом, стенд ему первый прецедент.
   Подъём не кончается на своей колонке: соседи идут следом по кривой
   убывания — каждый берёт названную долю от того, что взял ближний к
   курсору (приём «магнит на соседей одной кривой убывания», снят со
   стенда «Шесть зон»). Это уже закон 9 «Силовое поле»: величина
   элемента — функция расстояния до источника, а не его собственная
   настройка. Доля соседа и охват волны — ручки.
   Коридор здесь и есть ограничитель (П7): подъём нигде не выводится из
   соседа и не копится, он всякий раз доля свободного хода колонки.
   Возврат домой идёт своим ходом и своей кривой, а не теми же, что
   подъём (П9: вход и выход — разные параметры).

   Приём со склада: «Зональная интерпретация — зона наведения».
   Активна колонка во всю высоту полосы, а не сам прямоугольник: 40 px
   по высоте — дорогая цель по Фиттсу. Зоны нарезаны без мёртвых
   промежутков — шов и поля отходят к ближайшей колонке.

   Что стенд показывает. Фиксированное число здесь одно — высота фигуры.
   Всё остальное течёт. На узком экране колонка становится уже этой
   высоты, и прямоугольник из горизонтальной полосы превращается в
   вертикальную: сводка называет этот момент вслух. Теснота приходит не
   от точки перелома, а от встречи единственного жёсткого числа
   с текущим форматом.

   Параметры адреса: ?stop=мс — стоп-кадр (курсор ставится на середину
   полосы над средней колонкой, физика прогоняется на названный момент,
   цикл не запускается), ?stolb=N — какая колонка под курсором в
   стоп-кадре, ?reset=1, ?theme=nothing, ?mesto=Имя, ?nabor=имя.
   ───────────────────────────────────────────────────────────────────── */

var EASES = {
  'линейный':   function (t) { return t; },
  'разгон':     function (t) { return t * t * t; },
  'торможение': function (t) { return 1 - Math.pow(1 - t, 3); },
  'плавный':    function (t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; },
  'выброс':     function (t) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
};
var BEZ_APPROX = {
  'линейный':   [0.25, 0.25, 0.75, 0.75], 'разгон': [0.32, 0, 0.67, 0],
  'торможение': [0.33, 1, 0.68, 1], 'плавный': [0.65, 0, 0.35, 1],
  'выброс':     [0.34, 1.56, 0.64, 1],
};
function cubicBezierY(b, t) {
  var x1 = b[0], y1 = b[1], x2 = b[2], y2 = b[3], s = t;
  for (var i = 0; i < 8; i++) {
    var x = 3 * (1 - s) * (1 - s) * s * x1 + 3 * (1 - s) * s * s * x2 + s * s * s;
    var dx = 3 * (1 - s) * (1 - s) * x1 + 6 * (1 - s) * s * (x2 - x1) + 3 * s * s * (1 - x2);
    if (Math.abs(dx) < 1e-6) break;
    s -= (x - t) / dx; if (s < 0) s = 0; if (s > 1) s = 1;
  }
  return 3 * (1 - s) * (1 - s) * s * y1 + 3 * (1 - s) * s * s * y2 + s * s * s;
}
function evalEase(name, bez, t) {
  if (name === 'bezier') return cubicBezierY(bez, t);
  return (EASES[name] || EASES['торможение'])(t);
}
function bezCss(name, bez) {
  var b = name === 'bezier' ? bez : (BEZ_APPROX[name] || BEZ_APPROX['торможение']);
  return 'cubic-bezier(' + b.join(',') + ')';
}

/* ── ЗНАЧЕНИЯ ──────────────────────────────────────────────────────── */
var DEFAULTS = {
  kolonok: 12,        // на сколько равных долей делится полоса
  shov: 0,            // межколонник: 0 — двенадцать долей встык
  poleB: 6,           // боковое поле, % ширины формата
  poleV: 5,           // верхнее и нижнее поле, % высоты формата
  vys: 26,            // высота фигуры, px — единственное жёсткое число
  shir: 100,          // ширина фигуры, % колонки
  stoyka: 'bottom',   // где фигура стоит по высоте колонки
  stoykaX: 'center',  // куда прижата, когда уже колонки
  rost: 0,            // подсветка: насколько фигура подрастает под курсором
  podsvet: 0,         // подсветка: сколько служебного цвета примешано
  zahvat: 100,        // насколько полно сегмент доходит до курсора
  predel: 100,        // докуда пускает коридор: 100 — до верхней границы
  ubyv: 50,           // сколько подъёма достаётся соседу: доля от подъёма ближнего к курсору
  ohvat: 12,          // докуда волна вообще доходит, колонок в каждую сторону
  dogonIn: 82,        // лень догона: 0 — сегмент приклеен к курсору
  vozvratMs: 520,     // возврат домой: свой ход, не тот, что у подъёма
  vozvratEase: 'плавный',
  vozvratBez: [0.65, 0, 0.35, 1],
  otklikMs: 260,      // ход подсветки
  otklikEase: 'торможение',
  otklikBez: [0.33, 1, 0.68, 1],
  podlozhka: false,   // видна ли заливка колонок и рамка полосы
  nomera: false,      // видны ли номера колонок
  alfa: 0,            // плотность служебного слоя, % от служебного цвета
  garn: 'Even Mono',  // гарнитура служебных меток
  kegl: 11,           // кегль служебных меток
  figura: '#ffffff',
  sluzhba: '#c2361f',
  bumaga: '#0000ff',
  palitra: 'bumaga',
};
var P = Object.assign({}, DEFAULTS);
try {
  var sohr = JSON.parse(localStorage.getItem('kolonki-params') || '{}');
  if (sohr) Object.assign(P, sohr);
} catch (e) {}

var lenta = document.getElementById('lenta');
var svodka = document.getElementById('svodka');
var VYKL = { top: 'flex-start', middle: 'center', bottom: 'flex-end' };
var VYKLX = { left: 'flex-start', center: 'center', right: 'flex-end' };

/* ── ГЕОМЕТРИЯ ─────────────────────────────────────────────────────────
   Всё, что стенду нужно знать о раскладке, выводится из формата и долей
   ДО отрисовки (П3): ширина колонки не замеряется у готового элемента,
   а считается — тем же выражением, которым её потом посчитает грид. */
function geom() {
  var W = window.innerWidth, H = window.innerHeight;
  var pb = W * P.poleB / 100, pv = H * P.poleV / 100;
  var n = Math.max(1, Math.round(P.kolonok));
  var polosa = Math.max(0, W - 2 * pb);
  var kol = (polosa - (n - 1) * P.shov) / n;
  return { W: W, H: H, pb: pb, pv: pv, n: n, polosa: polosa,
           kol: kol, lenta: Math.max(0, H - 2 * pv) };
}

/* ── КОЛОНКИ ─────────────────────────────────────────────────────────
   Пересборка только при смене числа колонок: остальное держат
   переменные. repeat() ставится из JS — var() внутри счётчика repeat
   браузер не читает, и грид молча схлопывается в одну колонку. */
var postroeno = 0;
function postroit() {
  var n = Math.max(1, Math.round(P.kolonok));
  lenta.style.gridTemplateColumns = 'repeat(' + n + ', 1fr)';
  if (n === postroeno) { odezhda(); return; }
  lenta.textContent = '';
  for (var i = 0; i < n; i++) {
    var c = document.createElement('div');
    c.className = 'col';
    var nom = document.createElement('i');
    nom.className = 'nom';
    nom.textContent = String(i + 1);
    var g = document.createElement('i');
    g.className = 'gran';
    var f = document.createElement('div');
    f.className = 'fig';
    c.appendChild(g); c.appendChild(nom); c.appendChild(f);
    lenta.appendChild(c);
    figury[i] = f;
  }
  figury.length = n;
  Y = []; Y0 = []; t0 = []; doma = []; vozvr = [];
  for (var j = 0; j < n; j++) { Y[j] = 0; Y0[j] = 0; t0[j] = 0; doma[j] = true; vozvr[j] = false; }
  postroeno = n;
  pod = -1;
  odezhda();
  narisovat();
}

/* Одежда колонок: что показано, а что погашено ручками. */
function odezhda() {
  var cols = lenta.children;
  for (var i = 0; i < cols.length; i++) {
    cols[i].classList.toggle('pod', !!P.podlozhka);
    cols[i].querySelector('.gran').style.display = P.podlozhka ? '' : 'none';
    cols[i].querySelector('.nom').style.display = P.nomera ? '' : 'none';
  }
  lenta.classList.toggle('ramka', !!P.podlozhka);
}

/* ── ПРИМЕНЕНИЕ ──────────────────────────────────────────────────── */
function primenit() {
  var s = document.documentElement.style;
  s.setProperty('--poleB', P.poleB);
  s.setProperty('--poleV', P.poleV);
  s.setProperty('--vys', P.vys);
  s.setProperty('--shir', P.shir);
  s.setProperty('--rost', P.rost);
  s.setProperty('--podsvet', P.podsvet);
  s.setProperty('--alfa', P.alfa);
  s.setProperty('--kegl', P.kegl);
  s.setProperty('--garn', '"' + P.garn + '"');
  s.setProperty('--figura', P.figura);
  s.setProperty('--sluzhba', P.sluzhba);
  s.setProperty('--bumaga', P.bumaga);
  s.setProperty('--ms', P.otklikMs + 'ms');
  s.setProperty('--bez', bezCss(P.otklikEase, P.otklikBez));
  lenta.style.columnGap = P.shov + 'px';
  lenta.style.alignItems = VYKL[P.stoyka] || 'center';
  lenta.style.justifyItems = 'stretch';
  var cols = lenta.children;
  for (var i = 0; i < cols.length; i++) {
    cols[i].style.alignItems = VYKL[P.stoyka] || 'center';
    cols[i].style.justifyContent = VYKLX[P.stoykaX] || 'center';
  }
  /* Рост идёт от дома, а не от середины: сегмент, стоящий на нижней
     границе, растёт вверх, стоящий у верхней — вниз. */
  var opora = P.stoyka === 'top' ? 'top' : P.stoyka === 'bottom' ? 'bottom' : 'center';
  for (var k = 0; k < figury.length; k++) if (figury[k]) figury[k].style.transformOrigin = opora + ' center';
  narisovat();
  skazat();
}

/* Сводка: живые числа раскладки и названный вслух момент тесноты. */
function skazat() {
  var g = geom();
  var tesno = g.kol < P.vys;
  svodka.innerHTML = g.n + ' × <b>' + g.kol.toFixed(1) + '</b> px' +
    ' · полоса ' + Math.round(g.polosa) + ' × ' + Math.round(g.lenta) + ' px' +
    ' · поля ' + P.poleB + ' % / ' + P.poleV + ' %' +
    ' · ' + (tesno ? 'фигура выше колонки' : 'колонка шире фигуры');
}

/* ── КУРСОР: зона наведения ───────────────────────────────────────────
   Приём «Зональная интерпретация»: попадание считается арифметикой по
   тем же долям, что строят сетку, поэтому мёртвых промежутков нет —
   шов отходит к ближайшей колонке, а боковые поля к крайним. Замера у
   элементов не спрашиваем: их координаты уже известны из geom(). */
var pod = -1, kursorY = 0;
var figury = [], Y = [], Y0 = [], t0 = [], doma = [], vozvr = [];

/* Сколько у сегмента свободного хода вверх — от дома до верхней границы
   полосы. Считается из долей, а не замером: дом задан стойкой, коридор
   равен остатку полосы за вычетом самой фигуры. */
function hodVverh(g) {
  var svobodno = Math.max(0, g.lenta - P.vys);
  if (P.stoyka === 'bottom') return svobodno;
  if (P.stoyka === 'middle') return svobodno / 2;
  return 0;                       // дом уже наверху — подниматься некуда
}

/* Цель подъёма: положение курсора по высоте полосы, переведённое в долю
   коридора. Низ полосы — ноль, верх — полный ход; за края полосы доля
   зажимается, поэтому в полях сегмент стоит на крайнем положении, а не
   улетает. Захват и предел — две ручки, режущие один и тот же ход:
   первая говорит, насколько полно слушаться курсора, вторая — докуда
   вообще пускать. */
function celPodyoma(g) {
  var niz = g.pv + g.lenta;
  var u = g.lenta > 0 ? (niz - kursorY) / g.lenta : 0;
  if (u < 0) u = 0; if (u > 1) u = 1;
  return u * hodVverh(g) * (P.predel / 100) * (P.zahvat / 100);
}

function narisovat() {
  for (var i = 0; i < figury.length; i++) {
    if (!figury[i]) continue;
    var rast = (i === pod && P.rost) ? ' scaleY(' + (1 + P.rost / 100) + ')' : '';
    figury[i].style.transform = 'translateY(' + (-Y[i]).toFixed(2) + 'px)' + rast;
  }
}

/* ── КАДР ─────────────────────────────────────────────────────────────
   Подъём под курсором идёт догоном: за кадр проходится доля пути до
   цели, лень доли — ручка инерции. Возврат домой идёт ИНАЧЕ — по
   времени и своей кривой от точки отрыва (П9). Цикл спит, пока все
   дома и курсор никого не держит: вертеть кадры вхолостую незачем. */
var ANIM = { id: 0, posl: 0 };
function pusk() {
  if (!ANIM.id) { ANIM.posl = 0; ANIM.id = requestAnimationFrame(kadr); }
}
function shag(dt, ts) {
  var g = geom(), cel = pod >= 0 ? celPodyoma(g) : 0, zhivo = pod >= 0;
  var len = Math.max(0, Math.min(0.999, P.dogonIn / 100));
  var k = 1 - Math.pow(len, dt / 16.7);
  var ubyv = P.ubyv / 100, ohvat = Math.round(P.ohvat);
  for (var i = 0; i < Y.length; i++) {
    var shag_ot = Math.abs(i - pod);                 // на сколько колонок дальше курсора
    var v_volne = pod >= 0 && shag_ot <= ohvat;
    if (v_volne) {
      /* Доля соседа — не вычитание, а множитель на каждом шаге: сосед
         берёт названную долю от того, что взял ближний к курсору, а не
         от полного подъёма. Оттого кривая убывает сама и никогда не
         уходит в минус, сколько бы колонок ни стояло в ряд. */
      Y[i] += (cel * Math.pow(ubyv, shag_ot) - Y[i]) * k;
      doma[i] = false; vozvr[i] = false;
    } else if (!doma[i]) {
      /* Выход из волны — тот же отрыв, что и уход курсора: колонка
         засекает, откуда пошла домой, и дальше идёт по времени. */
      if (!vozvr[i]) { Y0[i] = Y[i]; t0[i] = ts; vozvr[i] = true; }
      var d = P.vozvratMs > 0 ? Math.min(1, (ts - t0[i]) / P.vozvratMs) : 1;
      Y[i] = Y0[i] * (1 - evalEase(P.vozvratEase, P.vozvratBez, d));
      if (d >= 1) { Y[i] = 0; doma[i] = true; vozvr[i] = false; }
      else zhivo = true;
    }
  }
  return zhivo;
}
function kadr(ts) {
  var dt = ANIM.posl ? Math.min(64, ts - ANIM.posl) : 16.7;
  ANIM.posl = ts;
  var zhivo = shag(dt, ts);
  narisovat();
  ANIM.id = zhivo ? requestAnimationFrame(kadr) : 0;
}

/* Отрыв засекает сам кадр, когда колонка выходит из волны, — здесь
   только снимается метка «идёт домой», чтобы засечка взялась заново от
   нового положения, а не от старого. */
function otorvat(i) {
  for (var j = 0; j < Y.length; j++) if (!doma[j]) vozvr[j] = false;
}

/* ── КУРСОР: зона наведения ───────────────────────────────────────────
   Приём «Зональная интерпретация»: попадание считается арифметикой по
   тем же долям, что строят сетку, поэтому мёртвых промежутков нет —
   шов отходит к ближайшей колонке, а боковые поля к крайним. Замера у
   элементов не спрашиваем: их координаты уже известны из geom(). */
function navesti(x, y) {
  var g = geom();
  kursorY = y;
  var i = Math.floor((x - g.pb + P.shov / 2) / (g.kol + P.shov));
  if (i < 0) i = 0; if (i > g.n - 1) i = g.n - 1;
  pusk();
  if (i === pod) return;
  if (pod >= 0 && lenta.children[pod]) lenta.children[pod].classList.remove('on');
  otorvat();
  pod = i;
  if (lenta.children[pod]) lenta.children[pod].classList.add('on');
}
function snyat() {
  if (pod >= 0 && lenta.children[pod]) lenta.children[pod].classList.remove('on');
  otorvat();
  pod = -1;
  pusk();
}
addEventListener('pointermove', function (e) { navesti(e.clientX, e.clientY); });
addEventListener('pointerleave', snyat);
addEventListener('pointerdown', function (e) { navesti(e.clientX, e.clientY); });

/* ── ПАНЕЛЬ ───────────────────────────────────────────────────────── */

  onChange: function (key) {

});

/* Панель открыта сразу: стенд про ручки, и закон здесь показывает не
   картинка, а то, как она перестраивается от правки величины. Дальше —
   как человек оставил: закрыл однажды, и стенд это помнит. // без ручки */
var pamyatPaneli = null;
try { pamyatPaneli = localStorage.getItem('kolonki-panel'); } catch (e) {}
if (pamyatPaneli !== 'zakryta' && PANEL && PANEL.pokazat) PANEL.pokazat(true);
if (window.MutationObserver && PANEL && PANEL.panel) {
  new MutationObserver(function () {
    try { localStorage.setItem('kolonki-panel', PANEL.panel.hidden ? 'zakryta' : 'otkryta'); } catch (e) {}
  }).observe(PANEL.panel, { attributes: true, attributeFilter: ['hidden'] });
}

postroit();
primenit();

/* ── СТОП-КАДР ────────────────────────────────────────────────────────
   ?stop=мс — один кадр названного момента: курсор ставится на середину
   полосы над средней колонкой (?stolb=N выбирает другую), физика
   прогоняется шагами по 16.7 мс и рисуется один раз, цикл не идёт.
   Движение здесь ведёт курсор, а не часы, поэтому снимок обязан
   назвать и положение курсора — иначе он невоспроизводим. */
var ADRES = new URLSearchParams(location.search);
var stopMs = parseFloat(ADRES.get('stop'));
if (isFinite(stopMs) && stopMs > 0) {
  var g0 = geom();
  var stolb = parseInt(ADRES.get('stolb'), 10);
  pod = isFinite(stolb) ? Math.max(0, Math.min(g0.n - 1, stolb - 1)) : Math.floor(g0.n / 2);
  kursorY = g0.pv + g0.lenta / 2;
  if (lenta.children[pod]) lenta.children[pod].classList.add('on');
  for (var t = 0; t < stopMs; t += 16.7) shag(16.7, t);
  narisovat();
}

/* Ресайз: раскладку двигает сам грид, стенду остаётся пересказать числа.
   Замер один — окно; позиции колонок из него выводятся, а не снимаются. */
var rT;
addEventListener('resize', function () {
  clearTimeout(rT);
  rT = setTimeout(function () { skazat(); if (PANEL && PANEL.obnovit) PANEL.obnovit(); }, 120);
});
