<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="380" fill="#ffffff"/>

  <!-- случай 1: горизонтальное/квадратное — к низу -->
  <g>
    <text x="160" y="45" font-size="13" fill="#555" text-anchor="middle">горизонтальное или квадратное</text>
    <rect x="60" y="60" width="200" height="200" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6 5"/>
    <rect x="60" y="127" width="200" height="133" fill="#dbe4f7" stroke="#2749B0"/>
    <line x1="60" y1="272" x2="60" y2="300" stroke="#A63A2B" stroke-width="2"/>
    <rect x="66" y="278" width="130" height="7" fill="#cccccc"/>
    <rect x="66" y="292" width="95" height="7" fill="#cccccc"/>
    <text x="160" y="330" font-size="12" fill="#777" text-anchor="middle">фото прижато к низу</text>
  </g>

  <!-- случай 2: вертикальное, линии 1–2 — влево -->
  <g>
    <text x="490" y="45" font-size="13" fill="#555" text-anchor="middle">вертикальное · линии 1–2</text>
    <rect x="390" y="60" width="200" height="200" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6 5"/>
    <rect x="390" y="60" width="133" height="200" fill="#dbe4f7" stroke="#2749B0"/>
    <line x1="390" y1="272" x2="390" y2="300" stroke="#A63A2B" stroke-width="2"/>
    <rect x="396" y="278" width="130" height="7" fill="#cccccc"/>
    <rect x="396" y="292" width="95" height="7" fill="#cccccc"/>
    <text x="490" y="330" font-size="12" fill="#777" text-anchor="middle">прижато к левому краю</text>
  </g>

  <!-- случай 3: вертикальное, линии 3–4 — вправо, подпись уезжает -->
  <g>
    <text x="820" y="45" font-size="13" fill="#555" text-anchor="middle">вертикальное · линии 3–4</text>
    <rect x="720" y="60" width="200" height="200" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6 5"/>
    <rect x="787" y="60" width="133" height="200" fill="#dbe4f7" stroke="#2749B0"/>
    <line x1="787" y1="272" x2="787" y2="300" stroke="#A63A2B" stroke-width="2"/>
    <rect x="793" y="278" width="120" height="7" fill="#cccccc"/>
    <rect x="793" y="292" width="88" height="7" fill="#cccccc"/>
    <text x="820" y="330" font-size="12" fill="#777" text-anchor="middle">прижато к правому краю</text>
    <line x1="720" y1="310" x2="787" y2="310" stroke="#A63A2B" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="920" y="356" font-size="12" fill="#A63A2B" text-anchor="end">сопряжение: подпись стартует от левого края фото и уезжает вместе с ним</text>
  </g>
</svg>
