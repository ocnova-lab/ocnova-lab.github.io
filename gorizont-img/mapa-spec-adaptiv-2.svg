<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 456" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="456" fill="#ffffff"/>

  <!-- широкая сцена -->
  <g>
    <rect x="40" y="60" width="560" height="300" fill="none" stroke="#999" stroke-width="1.5"/>
    <line x1="60" y1="60" x2="60" y2="360" stroke="#cccccc" stroke-dasharray="4 5"/>
    <line x1="580" y1="60" x2="580" y2="360" stroke="#cccccc" stroke-dasharray="4 5"/>
    <rect x="60" y="100" width="90" height="90" fill="#dbe4f7" stroke="#2749B0"/>
    <rect x="347" y="130" width="90" height="90" fill="#dbe4f7" stroke="#2749B0"/>
    <rect x="203" y="230" width="90" height="90" fill="#dbe4f7" stroke="#2749B0"/>
    <rect x="490" y="260" width="90" height="90" fill="#dbe4f7" stroke="#2749B0"/>
    <g stroke="#A63A2B" stroke-width="1.5">
      <line x1="60" y1="86" x2="203" y2="86"/>
      <line x1="60" y1="80" x2="60" y2="92"/>
      <line x1="203" y1="80" x2="203" y2="92"/>
    </g>
    <text x="131" y="78" font-size="12" fill="#A63A2B" text-anchor="middle">шаг</text>
    <g stroke="#A63A2B" stroke-width="1.5">
      <line x1="490" y1="86" x2="580" y2="86"/>
      <line x1="490" y1="80" x2="490" y2="92"/>
      <line x1="580" y1="80" x2="580" y2="92"/>
    </g>
    <text x="535" y="78" font-size="12" fill="#A63A2B" text-anchor="middle">модуль</text>
    <text x="320" y="390" font-size="13" fill="#777" text-anchor="middle">широкая сцена: шаг линий больше модуля, последний промежуток — меньше</text>
  </g>

  <!-- узкий формат: наезд -->
  <g>
    <rect x="680" y="60" width="220" height="300" fill="none" stroke="#999" stroke-width="1.5"/>
    <line x1="700" y1="60" x2="700" y2="360" stroke="#cccccc" stroke-dasharray="4 5"/>
    <line x1="880" y1="60" x2="880" y2="360" stroke="#cccccc" stroke-dasharray="4 5"/>
    <rect x="700" y="100" width="90" height="90" fill="#dbe4f7" stroke="#2749B0" fill-opacity="0.75"/>
    <rect x="760" y="130" width="90" height="90" fill="#dbe4f7" stroke="#2749B0" fill-opacity="0.75"/>
    <rect x="730" y="230" width="90" height="90" fill="#dbe4f7" stroke="#2749B0" fill-opacity="0.75"/>
    <rect x="790" y="260" width="90" height="90" fill="#dbe4f7" stroke="#2749B0" fill-opacity="0.75"/>
    <text x="790" y="390" font-size="13" fill="#777" text-anchor="middle">узкий формат: шаг меньше модуля — модули наезжают</text>
  </g>

  <text x="480" y="420" font-size="14" fill="#555" text-anchor="middle">позиция силовой линии = поле + (номер линии − 1) · шаг;   шаг = (ширина сцены − поля − модуль) / (число линий − 1)</text>
  <text x="480" y="444" font-size="14" fill="#555" text-anchor="middle">число линий — от формата: 4 на десктопе, 3 на планшете, 2 на телефоне</text>
</svg>
