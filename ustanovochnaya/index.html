<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Рабочие группы — установочная</title>
<link rel="stylesheet" href="/panel.css" />
<!--
  Установочная встреча рабочих групп «Основа», 1 сентября 2026.

  ЗАКОН. Смотрит: на окно (ширина) и на номер текущего слайда.
  Реагирует: щелчком — слайд встаёт целиком, промежуточных положений нет
  (закон защёлки); внутри слайда плавно — весь набор течёт долями ширины
  окна (закон долей). Один перелом на тесноте: ниже коридора несущая
  вертикаль складывается под опорную горизонталь.

  ПРИЁМ. «Короткая связка горизонталь — вертикаль» (опорно-несущая схема,
  склад «Приёмы сеток»): на каждом слайде доминанта стоит на опорной
  горизонтали, раскрывающий текст подвешен на несущую вертикаль. Взят
  сознательно: встреча, объявляющая программу, собрана приёмом из этой же
  программы. Второй приём — «Пустота как увеличительное стекло»: поля не
  заполняются, значимость держится свободным полем.

  АДРЕС. ?slide=N — открыть слайд N (стоп-кадр для скриншотов).
         ?reset=1 — сбросить сохранённые настройки панели.
  КЛАВИШИ. → ↓ пробел — вперёд, ← ↑ — назад, Home — в начало.
-->
<style>
  @font-face { font-family: "Editorial New"; font-weight: 200;
    src: url("/fonts/EditorialNew-Thin.woff") format("woff"); font-display: swap; }
  @font-face { font-family: "Editorial New"; font-weight: 400;
    src: url("/fonts/EditorialNew-Regular.woff") format("woff"); font-display: swap; }
  @font-face { font-family: "Editorial New"; font-weight: 500;
    src: url("/fonts/EditorialNew-Medium.woff") format("woff"); font-display: swap; }
  @font-face { font-family: "Even Mono"; font-weight: 400;
    src: url("/fonts/EvenMono-Regular.woff2") format("woff2"),
         url("/fonts/EvenMono-Regular.woff") format("woff"); font-display: swap; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Editorial New", Times, serif;
    overflow: hidden;
    transition: background .4s, color .4s;
  }

  /* ── Сетка слайда: опорная горизонталь + несущая вертикаль ──
     Поле слева до несущей — доля ширины окна. Всё остальное течёт от него. */
  #deck { position: fixed; inset: 0; }
  .slide {
    position: absolute; inset: 0;
    display: grid;
    grid-template-columns: calc(var(--nesushaya) * 1vw) 1fr;
    align-content: start;
    padding: calc(var(--opora) * 1vh) calc(var(--polya) * 1vw);
    opacity: 0; pointer-events: none;
    transition: opacity calc(var(--hod) * 1ms) var(--krivaya);
  }
  .slide.on { opacity: 1; pointer-events: auto; }

  /* Метка слева на несущей: техслой, моноширинный */
  .metka {
    grid-column: 1;
    font-family: "Even Mono", monospace;
    font-size: clamp(10px, calc(var(--tekst) * .62vw), 20px);
    letter-spacing: .08em;
    text-transform: uppercase;
    opacity: .45;
    padding-top: .55em;
  }
  .telo { grid-column: 2; max-width: calc(var(--mera) * 1vw); }

  /* Доминанта на опорной горизонтали */
  h1 {
    font-weight: 200;
    font-size: clamp(28px, calc(var(--titul) * 1vw), 120px);
    line-height: .96;
    letter-spacing: -.02em;
    margin-bottom: .7em;
  }
  h2 {
    font-weight: 200;
    font-size: clamp(22px, calc(var(--titul) * .58vw), 72px);
    line-height: 1.05;
    letter-spacing: -.015em;
    margin-bottom: .9em;
  }
  p, li {
    font-size: clamp(15px, calc(var(--tekst) * 1vw), 34px);
    line-height: calc(var(--interlinyaz) / 100);
    margin-bottom: .8em;
  }
  ul { list-style: none; }
  li { padding-left: 1.4em; position: relative; }
  li::before {
    content: "—"; position: absolute; left: 0; opacity: .4;
  }
  em { font-style: normal; font-weight: 500; }
  .tiho { opacity: .5; }
  .vrezka {
    font-family: "Even Mono", monospace;
    font-size: clamp(12px, calc(var(--tekst) * .68vw), 24px);
    line-height: 1.5;
    letter-spacing: .01em;
    opacity: .6;
    margin-top: 1.6em;
    padding-top: 1em;
    border-top: 1px solid currentColor;
  }

  /* Счётчик — служебная геометрия, пиксели законны */
  #schet {
    position: fixed; right: 22px; bottom: 20px;
    font-family: "Even Mono", monospace;
    font-size: 12px; letter-spacing: .1em;
    opacity: .35;
  }

  /* Единственный перелом: теснота. Несущая складывается под опорную. */
  @media (max-width: 760px) {
    .slide { grid-template-columns: 1fr; }
    .metka { grid-column: 1; margin-bottom: 1.2em; padding-top: 0; }
    .telo  { grid-column: 1; max-width: none; }
    h1 { font-size: calc(var(--titul) * 2.4vw); }
    h2 { font-size: calc(var(--titul) * 1.5vw); }
    p, li, .metka, .vrezka { font-size: calc(var(--tekst) * 2.6vw); }
    }
</style>
</head>
<body>

<div id="deck"></div>
<div id="schet"></div>

<script src="/panel.js"></script>
<script>
// ── Ручки раньше эффекта ─────────────────────────────────────────────────
var P = {
  titul: 4.4, tekst: 1.25, interlinyaz: 145, mera: 46,
  nesushaya: 15, opora: 16, polya: 7,
  hod: 380, krivaya: 'плавный',
  palitra: 'svet', bg: '#efece6', ink: '#1a1a1a',
};
var DEFAULTS = Object.assign({}, P);
var stopKadr = /[?&]slide=/.test(location.search);   // стоп-кадр гасит ход

// Изинг-слот панели: словарь кривых плюс их безье-приближения.
// Функции нужны редактору кривой, приближения — чтобы отдать кривую в CSS.
var EASES = {
  'линейный':   function (t) { return t; },
  'разгон':     function (t) { return t * t * t; },
  'торможение': function (t) { return 1 - Math.pow(1 - t, 3); },
  'плавный':    function (t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; },
};
var BEZ_APPROX = {
  'линейный':   [0.25, 0.25, 0.75, 0.75],
  'разгон':     [0.32, 0, 0.67, 0],
  'торможение': [0.33, 1, 0.68, 1],
  'плавный':    [0.65, 0, 0.35, 1],
};
function evalEase(name, t) { return (EASES[name] || EASES['плавный'])(t); }
function krivayaCSS(v) {
  if (Array.isArray(v)) return 'cubic-bezier(' + v.join(',') + ')';
  var b = BEZ_APPROX[v];
  return b ? 'cubic-bezier(' + b.join(',') + ')' : 'ease';
}
try { Object.assign(P, JSON.parse(localStorage.getItem('ustanovochnaya-params') || '{}')); } catch (e) {}

var PALITRY = {
  svet:  { bg: '#efece6', ink: '#1a1a1a' },
  chb:   { bg: '#ffffff', ink: '#111111' },
  noch:  { bg: '#111114', ink: '#eceae4' },
};

function apply() {
  if (P.palitra !== 'svoi' && PALITRY[P.palitra]) {
    P.bg = PALITRY[P.palitra].bg; P.ink = PALITRY[P.palitra].ink;
  }
  var s = document.documentElement.style;
  ['titul','tekst','interlinyaz','mera','nesushaya','opora','polya','bg','ink']
    .forEach(function (k) { s.setProperty('--' + k, P[k]); });
  if (!stopKadr) s.setProperty('--hod', P.hod);
  s.setProperty('--krivaya', krivayaCSS(P.krivaya));
}

// ── Слайды ───────────────────────────────────────────────────────────────
var SLIDES = [
  { m: '01.09.2026', h1: 'Рабочие группы', b: `
    <p class="tiho">Третий набор. Две группы по десять человек.</p>` },

  { m: 'формат', h2: 'Менторский формат — не курс', b: `
    <p>Он отличается от разнообразных курсов тем, что у него <em>нет чёткого финала, нет чёткого окончания</em>.</p>
    <p>Это даёт большое преимущество: мы идём по теме столько, сколько необходимо. Нужно что-то зафиксировать — идём по этой теме, пока не зафиксируем. Зафиксировали — идём дальше.</p>
    <p class="vrezka">Торопить не буду.</p>` },

  { m: 'формат', h2: 'Формат неформальный', b: `
    <p>Немного похоже на то, как ходят к психотерапевту. Отношения неформальные.</p>
    <p>Не стесняйтесь мне писать, спрашивать, предлагать встречи онлайн и офлайн. С предыдущими группами я часто встречался онлайн, а если вы в Питере — с удовольствием встречусь.</p>
    <p>И вы тоже не относитесь слишком строго к тому, что процесс будет меняться: мы всегда исходим из соображений целесообразности.</p>` },

  { m: 'встречи', h2: 'Две встречи в неделю', b: `
    <ul>
      <li><em>Дискуссионная.</em> Обсуждаем темы, немного практикуемся онлайн — не со всеми, а с теми, кто готов: два-три человека.</li>
      <li><em>Консультация.</em> Своя у каждой группы.</li>
    </ul>
    <p>Ведёт Сергей. Михаил помогает и иногда ведёт консультацию.</p>` },

  { m: 'материалы', h2: 'Что остаётся после лекции', b: `
    <ul>
      <li>запись — пропустили дискуссионную, не беда, её всегда можно посмотреть;</li>
      <li>транскрибация по этой записи — чтобы кормить её нейронке и задавать вопросы;</li>
      <li>презентация по ссылке в Фигме: общий файл, там лекции копятся.</li>
    </ul>
    <p>У каждой группы свой чатик: отдельно лекции, отдельно задания. Там же общаемся — я достаточно часто отвечаю внутри чатиков.</p>` },

  { m: 'расписание', h2: 'Выбираем время', b: `
    <ul>
      <li><em>Дискуссионная</em> — вторник или четверг, на буднях.</li>
      <li><em>Консультации</em> — на выходных, утренние часы: 11:00 в субботу или 11:00 в воскресенье. Можно и вечер субботы.</li>
    </ul>` },

  { m: 'контекст', h2: 'Контекст нужен прежде всего нейронке', b: `
    <p>Транскрибации и презентации отдавайте нейронке, чтобы она их изучала и пополняла вашу библиотеку. Это настойчивая рекомендация.</p>
    <p>Будете просто слушать и складывать куда-то ссылки — будет неудобно. Организуете правильно — нейронка сможет отвечать на ваши вопросы по материалу.</p>
    <p>Конечно, не на все: нейронка никогда не заменит преподавателя и человека. Но какие-то вопросы — как что с чем связано — вы сможете адресовать ей.</p>` },

  { m: 'темп', h2: 'Темп задаёт усвояемость', b: `
    <p>Не календарь. Оценок нет.</p>
    <p>Отсюда и открытая дата окончания, о которой говорили в начале: идём по теме, пока не зафиксируем.</p>
    <p>У меня есть общий план, который я покажу дальше. По нему и пойдём.</p>` },

  { m: 'программа', h2: 'От формы к пространству и времени', b: `
    <p><em>Форма — это база графического дизайна.</em> С этого начнём: что-то вспомним, что-то потренируем.</p>
    <p>Тренировать прежде всего будем <em>декомпозицию</em> — способность разбирать чужие решения и свои собственные. Это супервизия самого себя: увидеть, что мы делаем и где ошибаемся, в чём проблема макета.</p>
    <p>Без этого исправлять свои и чужие работы будет сложно.</p>` },

  { m: 'вайб-кодинг', h2: 'Первый месяц — декомпозиция и код', b: `
    <p>На консультациях первый месяц, а может и дольше, занимаемся вайб-кодингом, совмещённым с декомпозицией.</p>
    <p>Берём разные старые работы, декомпозируем и стараемся придать им движение. Этот эффект реализуем на <em>демонстрационных стендах</em> — HTML, можно и WebGL. Самое главное, что с этим можно взаимодействовать.</p>
    <p class="vrezka">Вайб-кодингу учимся на базе заданий по композиции и декомпозиции.</p>` },

  { m: 'проект', h2: 'Свой проект — со второго месяца', b: `
    <p>Начнётся не сразу, а постепенно. Сейчас нужно освоить базовые моменты: разобраться с вайб-кодингом и декомпозицией. После — более сложные задачи, например сайт.</p>
    <p>Моё предложение — начать с <em>сайтов портфолио</em>. Клиенты всё чаще находят дизайнеров через нейронки, а нейронки не видят Telegram, Instagram, Behance, Dprofile. Они видят сайты и вашу упоминаемость на других сайтах.</p>
    <p>Найти дизайнера через площадки становится сложнее: они коммерциализированы, на многих нужно заплатить, чтобы вас увидели. Ценится не столько качество, сколько лояльность платформе.</p>` },

  { m: 'портфолио', h2: 'Сегодня нужен рабочий вариант', b: `
    <p>Раньше достаточно было кейса на Behance — сегодня необходимо показывать рабочий вариант.</p>
    <p>Делайте сайты, неважно какие, придумывайте себе темы. За два-три месяца накопится три-четыре проекта, которые реально кликабельны и на которые есть ссылка.</p>
    <p>Для клиента это сильно лучше: верифицирует ваши скилы и новый скилл — что вы сами можете всё сверстать.</p>
    <p class="tiho">Behance не бросайте, продолжайте. Но не забывайте, что сайты тоже нужны.</p>` },

  { m: 'инструмент', h2: 'Нейронка и Фигма', b: `
    <p><em>Основной инструмент сегодня — нейронка.</em> Фигма — скорее дополнительный демонстрационный инструмент: работает как чертёж, помогает нейронке понять, что вы от неё хотите.</p>
    <p>Экраны рисовать по-прежнему нужно, но процесс сильно упрощается. Вы заметите, что рисовать в Фигме все разрешения не очень-то нужно: это решается прямо с нейронкой на стенде. Стенд — страница в браузере, сразу видно, как что работает, и можно продумать правила, по которым дизайн адаптируется.</p>
    <p class="tiho">Желательно соединить нейронку с Фигмой по MCP. Не сразу получится — бывают проблемки. Тогда она сможет и сама рисовать, менять, видеть шрифтовые стили.</p>` },

  { m: 'хранилище', h2: 'Хранилище на локалке', b: `
    <p>Для нейронки необходимо организовать хранилище у себя на локалке. Можно завести GitHub и держать там копии — или облако, решайте сами. Я предпочитаю локалку: она всегда в доступе.</p>
    <p>Лишились нейронки или перешли на другую — контекст не потеряете. Любая другая будет работать по сути на том же контексте.</p>
    <p><em>Отнеситесь серьёзно к организации хранилища и к его защите.</em> Дополняйте его всем, что будет появляться: лекциями, транскрибациями, презентациями.</p>` },

  { m: 'даём', h2: 'Контекст, который даём', b: `
    <ul>
      <li><em>Словарь терминов</em>, на который опирается нейронка: и наши термины, и устоявшиеся в профессиональной среде.</li>
      <li><em>Библиотека панелей</em> — дадим буквально сразу.</li>
      <li><em>Шаблон стенда</em> — чтобы сразу начинать и чтобы нейронка понимала, что вы хотите сделать.</li>
      <li>Разные библиотеки для работы — например, с текстами, со скроллом.</li>
      <li><em>Свод вёрстки</em> — правила, по которым мы верстаем.</li>
    </ul>
    <p class="vrezka">Всё, что находим для себя, тем и делимся. Не теряйте, сохраняйте у себя.</p>` },

  { m: 'дальше', h2: 'Ближайшие встречи', b: `
    <p><em>Консультация</em> на выходных — на две группы вместе. Делимся библиотеками и контекстом, разбираем, что нужно сделать: Vercel, локальные папки, Obsidian, нейронка с доступом к папке. Вопросы можно писать Мише — поможет с установкой.</p>
    <p><em>Следующая дискуссионная</em> — база, основа и контраст вместе. База — то, из чего состоит. Основа — то, как строится. Контраст — один из самых частых и важных инструментов, но чтобы контрастировать, нужно понять базу.</p>` },
];

// ── Сборка и защёлка ─────────────────────────────────────────────────────
var deck = document.getElementById('deck'), schet = document.getElementById('schet');
SLIDES.forEach(function (s) {
  var el = document.createElement('section');
  el.className = 'slide';
  el.innerHTML = '<div class="metka">' + s.m + '</div><div class="telo">'
    + (s.h1 ? '<h1>' + s.h1 + '</h1>' : '')
    + (s.h2 ? '<h2>' + s.h2 + '</h2>' : '')
    + s.b + '</div>';
  deck.appendChild(el);
});
var els = deck.children, cur = 0;

// Стоп-кадр: ?slide=N открывает слайд N и гасит ход, иначе при виртуальном
// времени скриншотилки переход не проигрывается и кадр выходит полупрозрачным.
var m = /[?&]slide=(\d+)/.exec(location.search);
if (m) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, +m[1] - 1));
  document.documentElement.style.setProperty('--hod', 0);
}

function pokazat(i) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  for (var k = 0; k < els.length; k++) els[k].classList.toggle('on', k === cur);
  schet.textContent = (cur + 1) + ' / ' + SLIDES.length;
}
addEventListener('keydown', function (e) {
  if (['ArrowRight','ArrowDown',' ','PageDown'].indexOf(e.key) >= 0) { pokazat(cur + 1); e.preventDefault(); }
  if (['ArrowLeft','ArrowUp','PageUp'].indexOf(e.key) >= 0)          { pokazat(cur - 1); e.preventDefault(); }
  if (e.key === 'Home') pokazat(0);
});
addEventListener('click', function (e) { if (!e.target.closest('.st-panel, .st-gear')) pokazat(cur + 1); });

// ── Панель ───────────────────────────────────────────────────────────────
StendPanel.build({
  storageKey: 'ustanovochnaya-params',
  params: P, defaults: DEFAULTS, onChange: apply,
  eases: EASES, evalEase: evalEase, bezApprox: BEZ_APPROX,
  defs: [
    ['h', 'Набор'],
    ['titul',       'Кегль титула, % ширины',      1.5, 12,  0.1],
    ['tekst',       'Кегль текста, % ширины',      0.5, 4,   0.05],
    ['interlinyaz', 'Интерлиньяж, % кегля',         90, 260, 1],
    ['mera',        'Мера строки, % ширины',        20, 80,  1],
    ['h', 'Опорно-несущая'],
    ['nesushaya',   'Несущая вертикаль, % ширины',   0, 40,  0.5],
    ['opora',       'Опорная горизонталь, % высоты', 0, 45,  0.5],
    ['polya',       'Поля, % ширины',                0, 25,  0.5],
