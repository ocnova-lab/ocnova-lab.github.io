<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ─────────────────────────────────────────────────────────────────
     Диагональная полоса — лента набора едет по оси от угла к углу.

     Смотрит: на окно (длина и наклон оси считаются от его сторон),
     на курсор (кластер сот идёт догоном) и на протяжку (лента везётся
     драгом и колесом).
     Реагирует: плавно — ход ленты и догон сот идут кривыми-изингами;
     щелчком — смена варианта композиции и цветового профиля.
     Законы: коридор (кегль и кернинг текут между границами clamp),
     доля (шаг ряда и модуль строки берутся от стороны окна),
     догон (сота тянется за курсором с ограничителем связности).
     Приёмы: «вёрстка по осям» (текст на траектории), сотовое меню из
     стенда «Hi Five», курсор-прицел цветом профиля.

     Адрес: ?lang=ru|en — язык ленты, ?panel — панель раскрыта сразу,
     ?reset=1 — сброс сохранённых ручек.
     ───────────────────────────────────────────────────────────────── -->
<title>Диагональная полоса — стенд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=Roboto+Mono:ital,wght@1,100..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/panel.css">
<style>
  /* ────────────────────────────────────────────────────────────────
     Диагональная полоса текста — по референсу конверта
     General Purpose Records (дизайн Luke Brown).

     Устройство: строки горизонтальные, левый край каждой лежит
     на диагонали экрана — от левого верхнего угла к правому нижнему.
     Скролл везёт текст вдоль этой диагонали, текст зациклен.
     На второй оси — заголовки смысловых частей; каждый абзац
     предваряется меткой «(N)» на той же оси.
     ──────────────────────────────────────────────────────────────── */
  /* шрифты едут с самим сайтом — у всех зрителей та же гарнитура,
     что у Сергея локально (оси wght/wdth работают одинаково везде) */
  @font-face{
    font-family:'Pragmatica Next VF';
    src:url('/fonts/PragmaticaNextVF.woff') format('woff');
    font-weight:100 900;
    font-stretch:50% 100%;
    font-display:swap;
  }
  @font-face{
    font-family:'Even Mono';
    src:url('/fonts/EvenMono-Regular.woff') format('woff');
    font-weight:400;
    font-style:normal;
    font-display:swap;
  }
  *, *::before, *::after{ box-sizing:border-box; }
  html, body{ margin:0; height:100%; }
  body{
    background:#fff; color:#000;
    background-size:cover; background-position:center; background-repeat:no-repeat;
    overflow:hidden; overscroll-behavior:none; touch-action:none;
    /* Прагматика — если стоит на машине; иначе вариативный Roboto Flex */
    font-family:'Pragmatica Next VF','Roboto Flex','Helvetica Neue',Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    user-select:none; -webkit-user-select:none;
    /* курсор-прицел: полотно кликабельно целиком (клик раскрывает соты),
       поэтому курсор и есть подсказка. Рисунок плюса собирается в JS
       цветами профиля и приезжает переменной --cur; crosshair — запас
       до первого кадра и на случай, если data-URI курсор не принят */
    cursor:var(--cur, crosshair);
  }
  body.dragging{ cursor:grabbing; }
  /* --trk — живой кернинг: шкала от покоя к разгону и обратно;
     --trk0 — кернинг покоя (по нему же меряются переносы);
     строка растёт вправо от левого края */
  #band{ position:fixed; inset:0; z-index:1; letter-spacing:0.01em; --trk:0.01em; --trk0:0.01em; }
  .ln{
    position:absolute; left:0; top:0;
    width:var(--colw, 340px);
    text-align:left;
    white-space:nowrap;
    will-change:transform;
    /* высотный масштаб кегля крутится вокруг левого края — строка
       не сходит с оси и не гуляет по вертикали */
    transform-origin:0 50%;
    letter-spacing:var(--trk);
    color:var(--txc, #000);
  }
  /* ось номеров: капс; толщина и кернинг — ручки секции «Ось номеров»
     (--numw/--numtrk ставит relayout); в разгоне кернинга не участвует;
     у цифровых меток .ln.dig свой вес — правило ниже перебивает */
  .ln.num{ font-size:var(--numsz, 1em); letter-spacing:var(--numtrk, 0em); font-weight:var(--numw, 700); text-transform:uppercase; color:var(--numc, #000); }
  /* цифры — Even Mono (локальный у Сергея; у зрителей Roboto Mono):
     medium, италик, кегль на 3 меньше основного (--dg считает relayout);
     толщина гротеска на моно не давит */
  .ln.dig{
    font-family:'Even Mono', 'Roboto Mono', Georgia, monospace;
    font-weight:var(--digw, 500);
    font-style:italic;
    font-size:var(--dg, 1em);
    letter-spacing:var(--digtrk, 0em);
  }
  /* плашки: прямоугольники в строчных слотах; цвет ВСЕГДА оси номеров —
     и у тех, что сидят на текстовой оси (правило Сергея 2026-08-06) */
  .ln.rect{ width:150px; height:12px; background:currentColor; color:var(--numc, #000); }
  /* выделенные слова — свой цвет из панели («Цвет выделений») */
  .ln .hl{ color:var(--hlc, #fff); }
  /* кликабельная строка (контакт): подчёркивание и курсор */
  .ln.link{ text-decoration:underline; text-underline-offset:0.15em; cursor:pointer; }
  .meas{ letter-spacing:var(--trk0); } /* линейка меряет спокойный набор */
  /* невидимая строка-линейка: в ней меряются слова для переноса */
  .meas{ position:absolute; left:0; top:0; visibility:hidden; white-space:pre; }
  /* степпер числа вершин оси */
  .st-panel .ax-pts{ display:flex; gap:8px; align-items:center; }
  .st-panel .ax-pts button{
    width:26px; height:22px; border-radius:6px; border:0; cursor:pointer;
    background:rgba(255,255,255,.14); color:#fff; font-size:14px; line-height:1;
  }
  .st-panel .ax-pts span{ min-width:18px; text-align:center; }
  /* цвет оси/фона — образец, открывающий системную палитру */
  .st-panel .ax-colors{ display:flex; justify-content:flex-end; }
  .st-panel .ax-colors input[type=color]{
    width:48px; height:26px; padding:0; border:0;
    border-radius:6px; background:none; cursor:pointer;
  }
  .st-panel .ax-colors input[type=color]::-webkit-color-swatch-wrapper{ padding:2px; }
  .st-panel .ax-colors select{ margin-right:8px; }
  /* градиент оси: полоса с двумя стопами, как в графических редакторах */
  .st-panel .ax-grad{ display:flex; gap:8px; align-items:center; margin:2px 0 10px; }
  .st-panel .ax-grad input[type=color]{
    width:30px; height:22px; padding:0; border:0; border-radius:6px;
    background:none; cursor:pointer; flex:none;
  }
  .st-panel .ax-grad input[type=color]::-webkit-color-swatch-wrapper{ padding:2px; }
  .st-panel .ax-grad input[type=color]::-webkit-color-swatch{
    border:none; border-radius:4px;
  }
  .st-panel .ax-grad-strip{
    position:relative; flex:1; height:14px; border-radius:7px;
    box-shadow:inset 0 0 0 1px rgba(127,127,127,.35);
    cursor:pointer; touch-action:none;
  }
  .st-panel .ax-grad-strip .stop{
    position:absolute; top:50%; width:14px; height:14px; border-radius:50%;
    border:2.5px solid #fff; box-shadow:0 0 0 1.5px rgba(0,0,0,.45);
    transform:translate(-50%,-50%); cursor:ew-resize;
  }
  .st-panel .ax-grad-strip .stop.sel{
    box-shadow:0 0 0 2px var(--st-accent, #0A84FF);
  }
  .st-panel .ax-colors input[type=color]::-webkit-color-swatch{
    border:1.5px solid rgba(255,255,255,.5); border-radius:5px;
  }
  /* редактор оси: холст с пропорциями экрана, живёт в панели */
  .st-panel canvas.axis-ed{
    display:block; width:calc(100% - 24px); height:auto;
    aspect-ratio:600/380;
    margin:4px auto 12px; border-radius:8px;
    touch-action:none; cursor:crosshair;
  }
  /* кнопки угла — без теней; шестерёнка и язык по умолчанию белые
     с тёмно-серой графикой (слово Сергея 2026-08-07); у кнопок
     вариантов фон и буква инлайном — они этот белый перебивают */
  /* панель и кнопки угла — над сотовым меню */
  .st-panel{ z-index:50; }
  .st-tip{ z-index:51; }
  .st-gear{
    z-index:50;
    box-shadow:none;
    border:none;
    background:#ffffff;
  }
  .st-gear:hover{ background:#f2f2f2; }
  .st-gear svg{ stroke:#4a4a4a; }
  .st-gear svg circle{ fill:#ffffff; }
  /* кнопка языка — рядом с шестерёнкой, тот же круглый вид */
  .lang-btn{
    left:56px;
    color:#4a4a4a;
    font:600 11px/1 -apple-system,"Helvetica Neue",Arial,sans-serif;
    letter-spacing:.04em;
  }
  /* кнопка «Цвет» — третья в ряду: живой свотч текущего профиля
     (CSS-переменные --txc/--bgc с body); меню профилей падает вверх */
  .prof-btn{ left:100px; }
  .prof-btn .dot{
    width:14px; height:14px; border-radius:50%;
    background:var(--bgc, #ffffff);
    border:2px solid var(--txc, #141414);
    box-sizing:border-box;
  }
  .prof-menu{
    position:fixed; left:100px; bottom:56px; z-index:52;
    display:none; min-width:150px;
    background:#ffffff; border-radius:12px; padding:6px;
  }
  .prof-menu.open{ display:block; }
  .prof-item{
    display:flex; align-items:center; gap:10px;
    width:100%; padding:8px 10px; border:none; background:none;
    border-radius:8px; cursor:pointer; text-align:left;
    font:500 13px/1 -apple-system,"Helvetica Neue",Arial,sans-serif;
    color:#4a4a4a;
  }
  .prof-item:hover{ background:#f2f2f2; }
  .prof-item .sw{
    width:16px; height:16px; border-radius:50%;
    box-sizing:border-box; flex:none;
  }
  .prof-item.sel{ font-weight:700; }
  /* режим лепки: ось редактируется прямо на экране поверх живой ленты */
  #axisScreen{
    position:fixed; inset:0; z-index:40; width:100vw; height:100vh;
    cursor:crosshair; touch-action:none;
  }
  .axis-done{
    position:fixed; top:16px; right:16px; z-index:41;
    padding:10px 18px; border:none; border-radius:999px;
    background:#ffffff; color:#4a4a4a; cursor:pointer;
    font:600 13px/1 -apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  .axis-done:hover{ background:#f2f2f2; }
  .st-panel .ax-screen{ margin-top:8px; }
  /* поле снимка настроек: видно глазами, что именно скопировано */
  .st-panel .snap-box{
    display:block; width:100%; height:120px; margin-top:6px;
    box-sizing:border-box; padding:6px 8px; border-radius:8px;
    border:1px solid rgba(255,255,255,.12); background:rgba(0,0,0,.35);
    color:#dcdcdc; font:400 10px/1.35 ui-monospace,Menlo,Consolas,monospace;
    resize:vertical;
  }
  /* ── сотовое меню вариантов (перенос стенда «Hi Five») ──
     клик в любой точке экрана раскрывает шесть гекс-ячеек — по ячейке
     на вариант композиции; сота НЕПРОЗРАЧНА, в цветах текущего профиля */
  .hex-cell{
    position:fixed; left:0; top:0; z-index:30; pointer-events:none;
    width:139px; height:161px;
  }
  .hex-cell.selected{ z-index:32; }
  /* сота: внешний гекс — обводка вторым цветом (цвет текста),
     внутренний гекс на 2px меньше — заливка цветом фона; тени нет */
  .hex-in{
    position:relative; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    font:600 15px/1 -apple-system,"Helvetica Neue",Arial,sans-serif;
    letter-spacing:.06em;
    background:var(--txc, #141414);
    color:var(--txc, #141414);
  }
  .hex-fill{ position:absolute; inset:2px; background:var(--bgc, #ffffff); }
  .hex-in > span{ position:relative; z-index:1; }
  /* ховер — вуаль цветом буквы, размер соты не меняется */
  .hex-in::after{
    content:''; position:absolute; inset:0;
    background:currentColor; opacity:0;
    transition:opacity .15s ease;
  }
  .hex-cell.hover .hex-in::after{ opacity:.12; }
  .hex-in .mark{
    position:absolute; left:50%; bottom:28%; width:5px; height:5px;
    margin-left:-2.5px; border-radius:50%; background:currentColor; opacity:0;
    z-index:1;
  }
  .hex-cell.selected .mark{ opacity:1; }
  /* сота логотипа: сама сота видна — сплошная заливка цветом фона,
     БЕЗ обводки (внешний гекс того же цвета, что и заливка), знак по
     центру цветом текста; ховера у неё нет */
  .hex-cell.logo .hex-in{ background:var(--bgc, #ffffff); color:var(--txc, #141414); }
  .hex-cell.logo .hex-fill{ background:var(--bgc, #ffffff); }
  .hex-cell.logo .hex-in::after,
  .hex-cell.logo.hover .hex-in::after{ opacity:0; }
  /* знак — поверх заливки: .hex-fill позиционирована абсолютно и,
     став непрозрачной, накрывала бы его */
  .hex-cell.logo svg{ position:relative; z-index:1; height:17.5%; width:auto; display:block; }
  /* активная сота — кнопка выхода: вместо буквы надпись «закрыть»,
     цвета ИНВЕРТИРОВАНЫ против остальных сот (заливка цветом текста,
     обводка и надпись — цветом фона) — выход отличим с одного взгляда */
  .hex-cell.close .hex-in{
    font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    background:var(--bgc, #ffffff); color:var(--bgc, #ffffff);
  }
  .hex-cell.close .hex-fill{ background:var(--txc, #141414); }
  .hex-cell.close .mark{ opacity:0; }
  /* кнопка «Меню» — четвёртая в ряду угловых кнопок, шаг ряда 44px
     (12 → 56 → 100 → 144); открывает сотовое меню вариантов, которое
     раньше открывалось цветным кружком */
  .menu-btn{ left:144px; }
  .menu-btn svg{ width:18px; height:18px; }
  .menu-btn.is-open svg{ opacity:.45; }
</style>
</head>

<div id="band"></div>

<script src="/panel.js"></script>

  // ── интерполяция многостопного градиента ──
  function gradRgbAt(stops, t) { // stops: [[позиция, [r,g,b]], ...]
    if (t <= stops[0][0]) return stops[0][1];
    var last = stops[stops.length - 1];
    if (t >= last[0]) return last[1];
    for (var gi = 1; gi < stops.length; gi++) {
      if (t <= stops[gi][0]) {

        var u = (t - a[0]) / Math.max(0.0001, b[0] - a[0]);

          Math.round(a[1][0] + (b[1][0] - a[1][0]) * u),
          Math.round(a[1][1] + (b[1][1] - a[1][1]) * u),
          Math.round(a[1][2] + (b[1][2] - a[1][2]) * u),

      st = [
        [P[base + 'Pos1'] || 0, P[base + 'Color']],
        [P[base + 'Pos2'] == null ? 1 : P[base + 'Pos2'], P[base + 'Color2'] || P[base + 'Color']],
      ];
    }
    return st.map(function (s) { return [s[0], hexRgb(s[1])]; });
  }

  // ── цвет каждой оси и фона — системная палитра (спектр, пипетка) ──
  function buildColorRow(title, labelText, key) {
    var row = document.createElement('div'); row.className = 'row';
    var lab = document.createElement('label'); lab.textContent = labelText;
    var box = document.createElement('div'); box.className = 'ax-colors';
    var inp = document.createElement('input');
    inp.type = 'color';
    inp.value = P[key];
    inp.addEventListener('input', function () {
      P[key] = inp.value;
      pan.save();
    });
    box.appendChild(inp);
    function refresh() {
      // не дёргаем значение, пока палитра открыта и цвет крутится рукой
      if (document.activeElement !== inp && inp.value !== P[key]) inp.value = P[key];
    }
    row.appendChild(lab); row.appendChild(box);
    var hs = pan.panel.querySelectorAll('h4');
    for (var i2 = 0; i2 < hs.length; i2++) {
      if (hs[i2].textContent === title) { hs[i2].nextElementSibling.appendChild(row); break; }
    }
    return refresh;
  }
  // ── заливка оси по-фигмовски: селект «Заливка/Градиент»; в градиенте
  // полоса с 2–5 СТОПАМИ: клик по стопу выбирает его (цвет — инпутом
  // справа), тяга двигает, двойной клик по пустому месту полосы рождает
  // стоп, двойной клик по стопу убирает; крайние стопы зеркалятся в
  // старую пару ключей Color/Color2+Pos1/Pos2 — на ней живут варианты,
  // сплошная заливка и кольцо ──
  function buildFillControl(title, base) {
    var cKey = base + 'Color', c2Key = base + 'Color2';
    var gKey = base + 'Grad', p1Key = base + 'Pos1', p2Key = base + 'Pos2';
    var sKey = base + 'Stops';
    var card = null;
    var hs = pan.panel.querySelectorAll('h4');
    for (var i3 = 0; i3 < hs.length; i3++) {
      if (hs[i3].textContent === title) { card = hs[i3].nextElementSibling; break; }
    }
    var row = document.createElement('div'); row.className = 'row';
    var lab = document.createElement('label'); lab.textContent = 'Цвет';
    lab.title = 'Заливка — один цвет. Градиент — полоса со стопами (2–5): клик по стопу выбирает, инпут справа красит выбранный, двойной клик по полосе добавляет стоп, двойной клик по стопу убирает.';
    var box = document.createElement('div'); box.className = 'ax-colors';
    var sel = document.createElement('select');
    [['solid', 'Заливка'], ['grad', 'Градиент']].forEach(function (o) {
      var op = document.createElement('option');
      op.value = o[0]; op.textContent = o[1];
      sel.appendChild(op);
    });
    var inpSolid = document.createElement('input'); inpSolid.type = 'color';
    box.appendChild(sel); box.appendChild(inpSolid);
    row.appendChild(lab); row.appendChild(box);
    if (card) card.appendChild(row);

    var gw = document.createElement('div'); gw.className = 'ax-grad';
    var strip = document.createElement('div'); strip.className = 'ax-grad-strip';
    var inpStop = document.createElement('input'); inpStop.type = 'color';
    gw.appendChild(strip); gw.appendChild(inpStop);
    if (card) card.appendChild(gw);

    var selStop = 0;
    function stops() { // канон — массив [позиция, цвет]; собирается из пары
      if (!Array.isArray(P[sKey]) || P[sKey].length < 2) {
        P[sKey] = [
          [P[p1Key] || 0, P[cKey]],
          [P[p2Key] == null ? 1 : P[p2Key], P[c2Key] || P[cKey]],
        ];
      }
      return P[sKey];
    }
    function cloneStops() { // правки — только по копии: литералы вариантов
      P[sKey] = stops().map(function (s) { return [s[0], s[1]]; }); // не мутируем
      return P[sKey];
    }
    function syncPair() {
      var st = stops();
      P[cKey] = st[0][1]; P[p1Key] = st[0][0];
      P[c2Key] = st[st.length - 1][1]; P[p2Key] = st[st.length - 1][0];
    }
    var handles = [];
    function rebuildHandles() {
      handles.forEach(function (h) { strip.removeChild(h); });
      handles = [];
      stops().forEach(function (s, si) {
        var h = document.createElement('div');
        h.className = 'stop' + (si === selStop ? ' sel' : '');
        strip.appendChild(h);
        handles.push(h);
      });
    }
    function idxAt(fx) {
      var st = stops(), best = 0, bd = 2;
      st.forEach(function (s, si) {
        var d = Math.abs(fx - s[0]);
        if (d < bd) { bd = d; best = si; }
      });
      return best;
    }
    function fxOf(e) {
      var r = strip.getBoundingClientRect();
      return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    }
    var dragIdx = -1;
    strip.addEventListener('pointerdown', function (e) {
      dragIdx = idxAt(fxOf(e));
      selStop = dragIdx;
      strip.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    strip.addEventListener('pointermove', function (e) {
      if (dragIdx < 0) return;
      var st = cloneStops();
      var fx = Math.round(fxOf(e) * 100) / 100;
      var lo = dragIdx > 0 ? st[dragIdx - 1][0] + 0.02 : 0;
      var hi = dragIdx < st.length - 1 ? st[dragIdx + 1][0] - 0.02 : 1;
      st[dragIdx][0] = Math.max(lo, Math.min(hi, fx));
      syncPair(); pan.save();
    });
    function endStopDrag() { dragIdx = -1; }
    strip.addEventListener('pointerup', endStopDrag);
    strip.addEventListener('pointercancel', endStopDrag);
    strip.addEventListener('dblclick', function (e) {
      var fx = Math.round(fxOf(e) * 100) / 100;
      var st = cloneStops();
      var near = idxAt(fx);
      if (Math.abs(st[near][0] - fx) < 0.05) {
        if (st.length > 2) { st.splice(near, 1); selStop = 0; } // минимум два
      } else if (st.length < 5) {
        var at = 0;
        while (at < st.length && st[at][0] < fx) at++;
        st.splice(at, 0, [fx, gradHexAt(st, fx)]); // цвет — из точки полосы
        selStop = at;
      }
      syncPair(); pan.save();
      rebuildHandles();
    });
    inpStop.addEventListener('input', function () {
      var st = cloneStops();
      if (st[selStop]) st[selStop][1] = inpStop.value;
      syncPair(); pan.save();
    });

    sel.addEventListener('input', function () {
      P[gKey] = sel.value === 'grad';
      pan.save();
    });
    inpSolid.addEventListener('input', function () {
      var st = cloneStops();
      st[0][1] = inpSolid.value;
      syncPair(); pan.save();
    });

    function refresh() {
      var grad = !!P[gKey];
      var want = grad ? 'grad' : 'solid';
      if (document.activeElement !== sel && sel.value !== want) sel.value = want;
      inpSolid.style.display = grad ? 'none' : '';
      gw.style.display = grad ? '' : 'none';
      if (document.activeElement !== inpSolid && inpSolid.value !== P[cKey]) inpSolid.value = P[cKey];
      if (!grad) return;
      var st = stops();
      if (selStop >= st.length) selStop = 0;
      if (handles.length !== st.length) rebuildHandles();
      var parts = st.map(function (s) { return s[1] + ' ' + (s[0] * 100) + '%'; });
      strip.style.background = 'linear-gradient(to right, ' + parts.join(', ') + ')';
      st.forEach(function (s, si) {
        var h = handles[si];
        h.style.left = (s[0] * 100) + '%';
        h.style.background = s[1];
        h.classList.toggle('sel', si === selStop);
      });
      var selCol = st[selStop] ? st[selStop][1] : '#000000';
      if (document.activeElement !== inpStop && inpStop.value !== selCol) inpStop.value = selCol;
    }
    refresh();
    return refresh;
  }

  var colorRefresh = [
    buildColorRow('Полоса', 'Фон', 'bgColor'),
    buildColorRow('Полоса', 'Цвет выделений', 'hlColor'),
    buildFillControl('Текстовая ось', 'text'),
    buildFillControl('Ось номеров', 'num'),
  ];

  // ── редакторы-экраны осей: вершин от 2 до 12; вершины таскаются,
  // хват за саму линию рождает новую вершину, двойной клик убирает,
  // степпер «Точки» меняет число с сохранением формы ──
  var ED_X0 = -0.25, ED_X1 = 1.25; // холст шире экрана — точки ходят за кромку
  var ED_MAX = 12;
  function hKeyOf(k) { return k === 'textPts' ? 'textH' : k === 'rectPts' ? 'rectH' : 'numH'; }
  var axisEditOn = function () { return false; }; // читают драг ленты и соты
  var enterScreenEd = function () {};             // назначает экранный модуль ниже

  // ── общее ядро редактора оси: живёт и в панельном холсте, и в
  // полноэкранном режиме лепки; cfg читается динамически — экранный
  // редактор подменяет в нём ось. Alt-тяга за ромбик РАЗРЫВАЕТ усик
  // (половины расходятся, угол острый), Alt-клик по вершине склеивает ──
  function attachAxisEditor(cv, cfg) {
    function ex(v) { return (v - cfg.x0()) / (cfg.x1() - cfg.x0()) * cv.width; }
    function ey(t) { return t * cv.height; }
    function clonePts() { return P[cfg.axKey].map(function (p) { return p.slice(); }); }
    function cloneH() {
      return handlesOf(cfg.axKey).map(function (v) { return v ? v.slice() : null; });
    }
    var sel = -1; // выбранная вершина — у неё видны усики

    function insertPointAt(t, x) {
      if (P[cfg.axKey].length >= ED_MAX) return;
      var pts = clonePts();
      var at = pts.length - 1;
      for (var j = 1; j < pts.length; j++) {
        if (pts[j][0] > t) { at = j; break; }
      }
      var H = cloneH();
      H.splice(at, 0, null); // новая вершина рождается с авто-усиками
      pts.splice(at, 0, [t, x]);
      P[cfg.axKey] = pts;
      P[hKeyOf(cfg.axKey)] = H;
      pan.save();
    }
    function removePoint(i) {
      if (i <= 0 || i >= P[cfg.axKey].length - 1) return;
      var pts = clonePts();
      var H = cloneH();
      H.splice(i, 1);
      pts.splice(i, 1);
      P[cfg.axKey] = pts;
      P[hKeyOf(cfg.axKey)] = H;
      sel = -1;
      pan.save();
    }
    function insertMid() {
      var k = P[cfg.axKey];
      if (k.length >= ED_MAX) return;
      // вершина встаёт на середину самого длинного отрезка, x берём
      // с текущей кривой — форма не прыгает
      var bi = 0, bl = -1;
      for (var j = 0; j < k.length - 1; j++) {
        var l = k[j + 1][0] - k[j][0];
        if (l > bl) { bl = l; bi = j; }
      }
      var tm = (k[bi][0] + k[bi + 1][0]) / 2;
      insertPointAt(Math.round(tm * 200) / 200,
                    Math.round(axisXf(cfg.axKey, P[cfg.sharpKey], tm) * 200) / 200);
    }
    function removeBest() {
      var k = P[cfg.axKey];
      if (k.length <= 2) return;
      // убираем вершину, чьё выпадение меньше всего меняет форму
      var bi = 1, bd = Infinity;
      for (var j = 1; j < k.length - 1; j++) {
        var t0 = k[j - 1][0], t1 = k[j + 1][0];
        var u = t1 > t0 ? (k[j][0] - t0) / (t1 - t0) : 0.5;
        var lin = k[j - 1][1] + (k[j + 1][1] - k[j - 1][1]) * u;
        var d = Math.abs(k[j][1] - lin);
        if (d < bd) { bd = d; bi = j; }
      }
      removePoint(bi);
    }

    function axPath(g, key, sharp) {
      g.beginPath();
      for (var s = 0; s <= 100; s++) {
        var t = s / 100;
        var px = ex(axisXf(key, sharp, t));
        if (s === 0) g.moveTo(px, ey(t)); else g.lineTo(px, ey(t));
      }
      g.stroke();
    }
    function draw() {
      var g = cv.getContext('2d');
      var w = cv.width, h = cv.height, K = cfg.k();
      var ac = (getComputedStyle(pan.panel).getPropertyValue('--st-accent') || '#0A84FF').trim();
      g.clearRect(0, 0, w, h);
      cfg.drawBg(g, w, h, ex, ey);
      // соседние оси — серым, для контекста
      g.strokeStyle = cfg.otherStroke; g.lineWidth = 2 * K;
      cfg.others().forEach(function (o) { axPath(g, o[0], P[o[1]]); });
      if (cfg.halo) { // подложка: кривая читается на ленте её же цвета
        g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 5 * K;
        axPath(g, cfg.axKey, P[cfg.sharpKey]);
      }
      // своя ось — в собственном цвете
      g.strokeStyle = P[cfg.colorKey] || '#fff'; g.lineWidth = 3 * K;
      axPath(g, cfg.axKey, P[cfg.sharpKey]);
      // вершины с белым кольцом — как в редакторе кривых панели
      P[cfg.axKey].forEach(function (pt, pi) {
        g.beginPath(); g.arc(ex(pt[1]), ey(pt[0]), (pi === sel ? 9 : 8) * K, 0, Math.PI * 2);
        g.fillStyle = ac; g.fill();
        g.lineWidth = 2.5 * K; g.strokeStyle = '#fff'; g.stroke();
      });
      drawHandles(g, K);
    }
    // усики выбранной вершины: линии через вершину и ромбики, как в
    // векторных редакторах; разорванный усик даёт излом линий
    function autoHandle(j) {
      var k = P[cfg.axKey], n = k.length;
      var p0 = k[Math.max(0, j - 1)], p2 = k[Math.min(n - 1, j + 1)];
      var m = (p2[1] - p0[1]) / Math.max(1e-6, p2[0] - p0[0]);
      var hh = (j < n - 1 ? k[j + 1][0] - k[j][0] : k[j][0] - k[j - 1][0]) / 3;
      return [hh, m * hh];
    }
    function handleOf(j) { // нормальный вид: четвёрка [outT,outX,inT,inX]
      var H = handlesOf(cfg.axKey);
      var h = H[j] ? H[j] : autoHandle(j);
      return h.length > 2 ? h : [h[0], h[1], h[0], h[1]];
    }
    function drawHandles(g, K) {
      var k = P[cfg.axKey];
      if (sel < 0 || sel >= k.length) return;
      var j = sel, h = handleOf(j);
      var vx = ex(k[j][1]), vy = ey(k[j][0]);
      var ox = ex(k[j][1] + h[1]), oy = ey(k[j][0] + h[0]);
      var ix = ex(k[j][1] - h[3]), iy = ey(k[j][0] - h[2]);
      g.strokeStyle = cfg.hstroke; g.lineWidth = 1.5 * K;
      g.beginPath();
      if (j > 0) { g.moveTo(ix, iy); g.lineTo(vx, vy); }
      if (j < k.length - 1) { g.moveTo(vx, vy); g.lineTo(ox, oy); }
      g.stroke();
      function dia(x, y) {
        var s = 6 * K;
        g.beginPath();
        g.moveTo(x, y - s); g.lineTo(x + s, y); g.lineTo(x, y + s); g.lineTo(x - s, y);
        g.closePath();
        g.fillStyle = cfg.diaFill; g.fill();
        g.lineWidth = 2 * K; g.strokeStyle = '#fff'; g.stroke();
      }
      if (j < k.length - 1) dia(ox, oy);
      if (j > 0) dia(ix, iy);
    }

    // указатель в долях холста и попадания
    function toF(e) {
      var r = cv.getBoundingClientRect();
      return {
        fx: cfg.x0() + (e.clientX - r.left) / r.width * (cfg.x1() - cfg.x0()),
        fy: (e.clientY - r.top) / r.height,
        r: r,
      };
    }
    function nearKnot(e) {
      var f = toF(e);
      var k = P[cfg.axKey];
      var best = -1, bd = Infinity;
      for (var j = 0; j < k.length; j++) {
        var hx = f.r.left + ex(k[j][1]) / cv.width * f.r.width;
        var hy = f.r.top + ey(k[j][0]) / cv.height * f.r.height;
        var d = Math.hypot(e.clientX - hx, e.clientY - hy);
        if (d < bd) { bd = d; best = j; }
      }
      return { i: best, d: bd };
    }
    function nearCurve(e) {
      var f = toF(e);
      var best = 0.5, bd = Infinity;
      for (var s = 0; s <= 120; s++) {
        var t = s / 120;
        var hx = f.r.left + ex(axisXf(cfg.axKey, P[cfg.sharpKey], t)) / cv.width * f.r.width;
        var hy = f.r.top + ey(t) / cv.height * f.r.height;
        var d = Math.hypot(e.clientX - hx, e.clientY - hy);
        if (d < bd) { bd = d; best = t; }
      }
      return { t: best, d: bd };
    }

    var drag = -1;        // вершина в перетаскивании
    var dragSeg = -1;     // отрезок в изгибе
    var dragH = 0;        // усик: 1 — нижний ромбик, −1 — верхний
    var dragBreak = false;// Alt-тяга — разрыв усика
    function applyDrag(e) {
      var f = toF(e);
      var fx = Math.max(cfg.x0(), Math.min(cfg.x1(), Math.round(f.fx * 200) / 200));
      var fy = Math.max(0, Math.min(1, Math.round(f.fy * 200) / 200));
      var pts = clonePts();
      var last = pts.length - 1;
      if (drag === 0 || drag === last) {
        pts[drag][1] = fx; // кромочные вершины ходят только по горизонтали
      } else {
        pts[drag][1] = fx;
        pts[drag][0] = Math.max(pts[drag - 1][0] + 0.02,
                       Math.min(pts[drag + 1][0] - 0.02, fy));
      }
      P[cfg.axKey] = pts;
      pan.save();
    }
    function applyHandle(e) {
      // тянем ромбик: симметричный усик зеркалит второй ромбик сам;
      // разорванный (или Alt рвёт сейчас) двигает только свою половину
      var f = toF(e);
      var k = P[cfg.axKey], j = sel;
      var H = cloneH();
      var half = [Math.round((f.fy - k[j][0]) * dragH * 200) / 200,
                  Math.round((f.fx - k[j][1]) * dragH * 200) / 200];
      var cur = H[j] ? H[j] : autoHandle(j);
      if (!dragBreak && cur.length <= 2) {
        H[j] = half;
      } else {
        var four = cur.length > 2 ? cur.slice() : [cur[0], cur[1], cur[0], cur[1]];
        if (dragH === 1) { four[0] = half[0]; four[1] = half[1]; }
        else { four[2] = half[0]; four[3] = half[1]; }
        H[j] = four;
      }
      P[hKeyOf(cfg.axKey)] = H;
      pan.save();
    }
    function applyBend(e) {
      // хват за отрезок: кривая проводится через курсор, поправка
      // раскладывается на усики обеих вершин отрезка
      var f = toF(e);
      var k = P[cfg.axKey];
      var t0 = k[dragSeg][0], t1 = k[dragSeg + 1][0];
      var v0 = k[dragSeg][1], v1 = k[dragSeg + 1][1];
      var tp = Math.max(t0 + 0.01, Math.min(t1 - 0.01, f.fy));
      var xp = Math.max(cfg.x0(), Math.min(cfg.x1(), f.fx));
      var u = (tp - t0) / Math.max(1e-6, t1 - t0);
      var mu = 1 - u;
      var w1 = 3 * mu * mu * u, w2 = 3 * mu * u * u;
      var den = w1 * w1 + w2 * w2;
      if (den < 1e-4) return; // хват у самой вершины — гнуть нечем
      var cc = segCtrl(cfg.axKey, dragSeg);
      var bt = mu * mu * mu * t0 + 3 * mu * mu * u * cc[0][0] + 3 * mu * u * u * cc[1][0] + u * u * u * t1;
      var bx = mu * mu * mu * v0 + 3 * mu * mu * u * cc[0][1] + 3 * mu * u * u * cc[1][1] + u * u * u * v1;
      var dT = tp - bt, dX = xp - bx;
      var c1 = [cc[0][0] + dT * w1 / den, cc[0][1] + dX * w1 / den];
      var c2 = [cc[1][0] + dT * w2 / den, cc[1][1] + dX * w2 / den];
      var H = cloneH();
      var outA = [Math.round((c1[0] - t0) * 200) / 200,
                  Math.round((c1[1] - v0) * 200) / 200];
      var inB = [Math.round((t1 - c2[0]) * 200) / 200,
                 Math.round((v1 - c2[1]) * 200) / 200];
      var hA = H[dragSeg], hB = H[dragSeg + 1];
      // разорванные усики держат свою нетронутую половину
      H[dragSeg] = hA && hA.length > 2 ? [outA[0], outA[1], hA[2], hA[3]] : outA;
      H[dragSeg + 1] = hB && hB.length > 2 ? [hB[0], hB[1], inB[0], inB[1]] : inB;
      P[hKeyOf(cfg.axKey)] = H;
      pan.save();
    }
    function nearHandle(e) {
      // ромбики усиков ловятся только у выбранной вершины
      var k = P[cfg.axKey];
      if (sel < 0 || sel >= k.length) return 0;
      var f = toF(e), h = handleOf(sel);
      function dTo(tt, xx) {
        var hx = f.r.left + ex(xx) / cv.width * f.r.width;
        var hy = f.r.top + ey(tt) / cv.height * f.r.height;
        return Math.hypot(e.clientX - hx, e.clientY - hy);
      }
      if (sel < k.length - 1 && dTo(k[sel][0] + h[0], k[sel][1] + h[1]) < 13) return 1;

  }

  function frame() {
    var s = [P.kegl, P.digSize, P.fontRef, P.wght, P.wdth, P.width, P.leading, P.gap,
             P.parGap, P.textRectH, P.trackFrom, P.numSize, P.numWght, P.numTrack,
             P.digWght, P.digTrack, lang,
             window.innerWidth, window.innerHeight].join('|');
    if (s !== sig) { sig = s; relayout(); }

    // выкат броска: после свайпа цель едет со скоростью пальца
    // и затухает как в нативном скролле (~325 мс) — аналогово, без рывка
    var nowF = performance.now();
    var dtF = lastFrameT ? Math.min(50, nowF - lastFrameT) : 16;
    lastFrameT = nowF;
    if (TRANS) { // ход перехода: темп задаёт изинг из панели, ритм —
      // волна по высоте (transK); по финишу — чистовые цвета
      var tkr = (nowF - TRANS.t0) / Math.max(1, TRANS.dur);
      if (tkr >= 1) { TRANS = null; colSet = ''; }
      else {
        TRANS.p = Math.max(0, tkr);
        TRANS.k = evalEase(P.compEase, P.compBez, TRANS.p);
        TRANS.wave = Math.min(0.9, Math.abs(+P.compWave || 0));
        TRANS.waveDn = (+P.compWave || 0) > 0;
      }
    }
    if (flingV) {
      target += flingV * dtF;
      flingV *= Math.exp(-dtF / 325);
      if (Math.abs(flingV) < 0.002) flingV = 0;
    }

    scroll += (target - scroll) * P.smooth;

    // шкала кернинга: датчик — недоезд ленты до цели; разгон везёт
    // межбуквие от «покоя» к «разгону», остановка возвращает обратно
    var gapDist = Math.abs(target - scroll);
    var sat = Math.min(1, gapDist / Math.max(1, P.trackDist));
    var goal = P.trackFrom + (P.trackTo - P.trackFrom) * sat;
    // атака — движение от покоя к разгону, возврат — обратно к покою
    var trkRes = Math.abs(goal - P.trackFrom) >= Math.abs(trackNow - P.trackFrom)
      ? P.trackRes : (P.trackRel || P.trackRes);
    trackNow += (goal - trackNow) * trkRes;
    if (Math.abs(trackNow - trackSet) > 0.0002) {
      trackSet = trackNow;
      band.style.setProperty('--trk', trackNow + 'em');
    }

    var N = lines.length;
    var kMin = Math.floor((scroll - 1.5 * L) / L);
    var kMax = Math.ceil((scroll + H + 1.5 * L) / L);
    var need = kMax - kMin + 1;
    while (pool.length < need) {
      var el = document.createElement('div');
      el.className = 'ln';
      band.appendChild(el);
      pool.push(el);
    }
    for (var i = 0; i < pool.length; i++) {
      var elI = pool[i];
      if (i >= need) { if (elI.style.display !== 'none') elI.style.display = 'none'; continue; }
      if (elI.style.display) elI.style.display = '';
      var k = kMin + i;
      var y = k * L - scroll;          // центр строки по вертикали
      var x;                           // левый край строки — на своей оси
      var m = ((k % N) + N) % N;       // зацикливание текста
      var it = lines[m];
      // каждая ось рисуется своим редактором-экраном; по вертикали обе
      // в общем потоке строк, поэтому движение всегда согласовано
      var tA = Math.max(0, Math.min(1, y / H));
      // плашки текстового кластера могут ехать по своей оси (rectPts) —
      // включается селектом «Ось плашек» в панели
      var ownRect = !!it.rect && !it.num && +P.rectAxisOwn;
      x = axisXf(ownRect ? 'rectPts' : it.num ? 'numPts' : 'textPts',
                 ownRect ? P.rectSharp : it.num ? P.numSharp : P.textSharp, tA) * W;
      var kL = 1; // доля перехода этой строки — с ритмом-волной
      if (TRANS) { // морф: старая траектория оси тает в новую
        var luOld = (it.rect && !it.num) ? TRANS.from.rectLut
                  : it.num ? TRANS.from.numLut : TRANS.from.textLut;
        kL = transK(tA);
        x = lutAt(luOld, tA) * W * (1 - kL) + x * kL;
      }
      if (elI.classList.contains('num') !== it.num) elI.classList.toggle('num', it.num);
      var dig = !!it.dig;
      if (elI.classList.contains('dig') !== dig) elI.classList.toggle('dig', dig);
      var isRect = !!it.rect;
      if (elI.classList.contains('rect') !== isRect) elI.classList.toggle('rect', isRect);
      // градиент оси: строка красится по своей экранной высоте —
      // цвет верха у верхней кромки, цвет низа у нижней
      if (gradCols) {
        // плашки всегда в цвете оси номеров — и в заливке (CSS),
        // и в градиенте, на какой бы оси плашка ни сидела
        var asNum = it.num || isRect;
        if (TRANS) { // переход: цвет строки миксуется старый→новый
          var ncl = (asNum ? gradCols.nGrad : gradCols.tGrad)
            ? gradRgbAt(asNum ? gradCols.nS : gradCols.tS, tA)
            : (asNum ? gradCols.nS : gradCols.tS)[0][1];
          var ocl = (asNum ? TRANS.from.numGrad : TRANS.from.textGrad)
            ? gradRgbAt(asNum ? TRANS.from.nS : TRANS.from.tS, tA)
            : (asNum ? TRANS.from.nS : TRANS.from.tS)[0][1];
          elI.style.color = mix3(ocl, ncl, kL);
        } else {
          var gOn = asNum ? gradCols.nGrad : gradCols.tGrad;
          if (gOn) {
            var gc = gradRgbAt(asNum ? gradCols.nS : gradCols.tS, tA);
            elI.style.color = 'rgb(' + gc[0] + ',' + gc[1] + ',' + gc[2] + ')';
          } else if (elI.style.color) {
            elI.style.color = '';
          }
        }
      }
      var href = it.href || '';
      if ((elI.dataset.href || '') !== href) {
        if (href) elI.dataset.href = href; else delete elI.dataset.href;
        elI.classList.toggle('link', !!href);
      }
      // выделения: ключевые слова красятся своим цветом; строка
      // перерисовывается только при смене содержимого или режима.
      // НА ПЕРЕХОДЕ строка вдобавок НАБИРАЕТСЯ ЗАНОВО, как на печатной
      // машинке: пока едет на новое место, буквы добегают слева —
      // подсветка на это время снята (ck сбит, штатная ветка вернёт её
      // сразу по финишу набора)
      var typing = TRANS && +P.compType && !isRect && it.t &&
                   typeVis(k, kL) < 1;
      if (typing) {
        var vis = typeVis(k, kL);
        var full = it.t;
        var cut = Math.floor(full.length * vis);
        // машинка не рвёт слово посередине буквы — режем по символам
        var part = full.slice(0, cut);
        if (elI.textContent !== part) elI.textContent = part;
        elI.dataset.ck = '';
      } else {
        var hlActive = +P.hlOn && !it.num && it.t;
        var ck = (hlActive ? 'h:' : 't:') + it.t;
        if (elI.dataset.ck !== ck) {
          elI.dataset.ck = ck;
          if (hlActive) {
            elI.innerHTML = esc(it.t).replace(lang === 'en' ? HL_RE_EN : HL_RE,
              '<span class="hl">$1</span>');
          } else {
            elI.textContent = it.t;
          }
        }
      }
      // высотный масштаб кегля: 100% у верхней кромки → btm% у нижней
      var sc = (100 + (P.btm - 100) * tA) / 100;
      // толщина ВСЕХ плашек одинакова: 12px (0.8 от прежних 15),
      // правил толщины больше нет (слово Сергея 2026-08-07). Правила
      // длины живут: у оси номеров внизу длиннее (rectStretch), у
      // текстового кластера — зеркально вверху (textRectStretch) плюс
      // горизонталь (textRectLeft); кривые — шаги Фибоначчи
      var sx = sc, sy = isRect ? 1 : sc;
      if (isRect) {
        if (it.num) {
          sx = sc * Math.pow(bl('rectStretch'), 2 * rectThinF(tA) - 1);
        } else {
          // излом кривой: '0' — фибоначчи сгущается у низа (как было),
          // '1' — у верха (концы правила те же, ход зеркальный)
          var fT = +P.textRectInv ? 1 - rectThinF(tA) : rectThinF(1 - tA);
          sx = sc * Math.pow(bl('textRectStretch'), 2 * fT - 1);
          var xF = Math.max(0, Math.min(1, x / W));
          sx *= Math.pow(bl('textRectLeft'), 1 - 2 * xF);
        }
      }
      elI.style.transform =
        'translate(' + x + 'px,' + (y - (isRect ? 6 : L / 2)) + 'px) scale(' + sx + ',' + sy + ')';
    }
    // цвета осей и фона — через переменные, пишем только при смене
    var cols = [P.textColor, P.textColor2, P.numColor, P.numColor2,
                P.textGrad ? 1 : 0, P.numGrad ? 1 : 0,
                P.textPos1, P.textPos2, P.numPos1, P.numPos2,
                JSON.stringify(P.textStops || 0), JSON.stringify(P.numStops || 0),
                P.bgColor, P.bgImage || '', P.hlColor].join('|');
    if (cols !== colSet) {
      colSet = cols;
      band.style.setProperty('--txc', P.textColor);
      band.style.setProperty('--numc', P.numColor);
      band.style.setProperty('--hlc', P.hlColor);
      // соты меню и точка-кнопка живут вне ленты — переменные на body
      document.body.style.setProperty('--txc', P.textColor);
      document.body.style.setProperty('--bgc', P.bgColor);
      setPlusCursor(P.textColor, P.bgColor);
      document.body.style.backgroundColor = P.bgColor;
      document.body.style.backgroundImage = P.bgImage ? 'url(' + P.bgImage + ')' : 'none';
      // градиент оси: включается флагом; стопов 2–5 (textStops/numStops;
      // если их нет — пара Color/Color2 с позициями Pos1/Pos2)
      gradCols = {
        tS: stopsOf('text'), nS: stopsOf('num'),
        tGrad: !!P.textGrad, nGrad: !!P.numGrad,
      };
    }
    if (TRANS) { // переход: фон и переменные цветов — миксом поверх
      var kb = TRANS.k;
      var bgm = mix3(TRANS.from.bg, hexRgb(P.bgColor), kb);
      var txm = mix3(TRANS.from.tx, hexRgb(P.textColor), kb);
      document.body.style.backgroundColor = bgm;
      document.body.style.setProperty('--bgc', bgm);
      document.body.style.setProperty('--txc', txm);
      band.style.setProperty('--txc', txm);
      band.style.setProperty('--numc', mix3(TRANS.from.nu, hexRgb(P.numColor), kb));
      band.style.setProperty('--hlc', mix3(TRANS.from.hl, hexRgb(P.hlColor), kb));
    }

    // редакторы-экраны и палитры живут в кадре:
    // подхватывают лепку, сброс и тему
    if (!pan.panel.hidden) {
      drawEds.forEach(function (d) { d.draw(); d.refresh(); });
      colorRefresh.forEach(function (f) { f(); });
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // когда доехал вебшрифт — перемерить и переложить строки
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { sig = ''; });
  }

  // ── управление: колесо, перетаскивание, клавиши ──
  window.addEventListener('wheel', function (e) {
    if (e.target.closest && e.target.closest('.st-panel, .st-gear')) return;
    e.preventDefault();
    touched = true;
    var d = e.deltaY + e.deltaX;
    if (e.deltaMode === 1) d *= 16;
    target += d * P.speed;
  }, { passive: false });

  var dragging = false, lastX = 0, lastY = 0, lastT = 0, velP = 0;
  var dragDist = 0, downEl = null;
  window.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('.st-panel, .st-gear')) return;
    if (hexMenuOpen()) return; // соты открыты — лента не тянется
    if (axisEditOn()) return;  // режим лепки — лента не тянется
    dragging = true; touched = true; lastX = e.clientX; lastY = e.clientY;
    lastT = performance.now(); velP = 0;
    flingV = 0; // палец перехватывает выкат
    dragDist = 0; downEl = e.target;
    document.body.classList.add('dragging');
  });
  window.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    dragDist += Math.abs(dx) + Math.abs(dy);
    // тянем полосу за собой: сдвиг пальца проецируется на диагональ,
    // ручка «Скорость» усиливает и палец, не только колесо
    var adv = -(dx * W + dy * H) * H / (W * W + H * H) * P.speed;
    target += adv;
    var now = performance.now(), dt = Math.max(1, now - lastT);
    lastT = now;
    velP = velP * 0.7 + (adv / dt) * 0.3; // скорость пальца, px/мс
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    document.body.classList.remove('dragging');
    // инерция броска: скорость пальца продолжает жить в выкате
    // (затухание в кадре); если палец замер перед отпусканием — броска нет
    if (performance.now() - lastT < 80) flingV = velP;
    velP = 0;
    // клик без движения по кликабельной строке — переход
    if (dragDist < 6 && downEl && downEl.dataset && downEl.dataset.href) {
      window.open(downEl.dataset.href, '_blank');
    }
    downEl = null;
  }
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  window.addEventListener('keydown', function (e) {
    var step = L * 3;
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') target += step;
    else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') target -= step;
    else if (e.key === 'PageDown' || e.key === ' ') target += H * 0.8;
    else if (e.key === 'PageUp') target -= H * 0.8;
    else return;
    touched = true;
    e.preventDefault();
  });
})();
</script>
</body>
</html>
