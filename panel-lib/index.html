<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Библиотека органов управления</title>
<link rel="stylesheet" href="/panel.css" />
<style>
  @font-face { font-family: "Even Mono"; font-weight: 400; font-style: normal;
    src: url("/fonts/EvenMono-Regular.woff2") format("woff2"),
         url("/fonts/EvenMono-Regular.woff") format("woff"); font-display: swap; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg, #101014); color: var(--ink, #f0f0f2);
    font-family: "Even Mono", ui-monospace, monospace;
    display: grid; place-items: center; overflow: hidden;
    /* коридор вместо перелома: пока места хватает, содержимое уходит правее
       панели (348 px), на узком экране отступ сам стекает к нулю */
    padding-left: clamp(0px, calc(100vw - 620px), 348px);
  }
  main { width: min(92vw, 700px); }
  h1 { font-size: clamp(16px, 2.3vw, 27px); font-weight: 400; letter-spacing: -0.01em;
       margin-bottom: clamp(10px, 1.6vh, 20px); }
  ul { list-style: none; display: grid; gap: clamp(4px, .8vh, 9px); }
  li { display: grid; grid-template-columns: minmax(8ch, 13ch) 1fr; gap: 1.5ch;
       font-size: clamp(10px, 1.15vw, 13px); line-height: 1.45; }
  b { font-weight: 400; color: var(--acc, #4d8dff); }
  code { opacity: .55; word-break: break-word; }
  p.hint { margin-top: clamp(10px, 1.8vh, 22px); font-size: clamp(9px, 1vw, 11px); opacity: .42; }
</style>
</head>
<body>
<main>
  <h1>Библиотека органов управления</h1>
  <ul id="spisok"></ul>
  <p class="hint">Шестерёнка слева внизу — все органы живые. Объявление копируется в defs как есть. ⌘Z отменяет правку. Скролл живёт отдельным стендом: /skroll</p>
</main>

<script src="/panel.js"></script>
<script src="/panel-lib/anchor.js"></script>
<script src="/panel-lib/segment.js"></script>
<script src="/panel-lib/toggle.js"></script>
<script src="/panel-lib/nabor.js"></script>
<script src="/panel-lib/koridor.js"></script>
<script src="/panel-lib/otkat.js"></script>
<script src="/panel-lib/datchik.js"></script>
<script src="/panel-lib/pruzhina.js"></script>
<script src="/panel-lib/vybor.js"></script>
<script src="/panel-lib/ugol.js"></script>
<script src="/panel-lib/palitra.js"></script>
<script src="/panel-lib/garnitura.js"></script>
<script src="/panel-lib/para.js"></script>
<script src="/panel-lib/nasledovanie.js"></script>
<script src="/panel-lib/inspektor.js"></script>
<script src="/panel-lib/obyavlenie.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────────
   Библиотека органов управления — живой каталог ручек панели.

   Смотрит: ни на что, страница служебная. Реагирует: не реагирует.
   Закон: не применяется — это каталог, а не стенд композиции.
   Приём: «Набор приёмов в панели» — каждый орган включается и щупается.

   Принципы и таблица «эффект → ручки» — skills/stend/references/panel.md,
   карточки — «ИТМО — Вёрстка/Приёмы панелей/», код — /panel-lib/*.js.
   Параметры адреса: ?panel=1 — панель открыта сразу, ?reset=1 — сброс.
   ───────────────────────────────────────────────────────────────── */

var ORGANY = [
  ['слайдер',   "[key, 'Кегль, % ширины', 1.5, 12, 0.1]"],
  ['селект',    "[key, 'Гарнитура', 'select', [['evenmono', 'Even Mono']]]"],
  ['пресет',    "[key, 'Палитра', 'preset', [['night', 'Ночь', { bg: '#101014' }]]]"],
  ['пипетка',   "[key, 'Фон', 'color']"],
  ['изинг',     "[key, 'Кривая проезда', 'ease']"],
  ['якорь',     "[key, 'Якорь', 'anchor']"],
  ['сегментер', "[key, 'Тип сетки', 'segment', [['lesenka', 'Лесенка']]]"],
  ['тумблер',   "[key, '', 'toggle', ['Показать сетку', 'Скрыть сетку']]"],
  ['набор',     "[key, 'Ходы', 'nabor', [['akcent', 'Акцент']]]"],
  ['коридор',   "[key, 'Поле, px', 'koridor', 0, 300, 4]"],
  ['откат',     "[key, 'Правки', 'otkat']"],
  ['датчик',    "[key, 'Профиль', 'datchik', { fn: function (x) { … }, x: [0, 1] }]"],
  ['пружина',   "[key, 'Пружина', 'pruzhina']  →  [период мс, затухание]"],
  ['превью',    "[key, 'Композиция', 'vybor', [['A', 'Колонки']], { risovat: … }]"],
  ['угол',      "[key, 'Завал оси, °', 'ugol', 0, 45]"],
  ['палитра',   "[key, 'Палитра', 'palitra', [['night', 'Ночь', { bg: '#101014' }]]]"],
  ['гарнитура', "[key, 'Гарнитура', 'garnitura']  —  алфавит свода + свой набор из витрины /shrifty"],
  ['пара',      "[key, 'Поле, px', 'para', [['padT', 'сверху', 0, 300, 4], …]]"],
  ['инспектор', "[key, 'Правим', 'inspektor', [['oblozhka', 'Обложка'], …]]  —  первый пункт списка = общий закон"],
  ['наследование', "[key, 'Кегль', 'nasledovanie', 12, 48, 1]  →  StendPanel.znachenie(P, key, 'oblozhka')"],
  ['этажность',  "['kegl', 'Кегль', 'кегль', { k: 'этаж' }] + ['aktivnyi', 'Правим', 'этажи', { iz: … }]  —  в объявлении"],
  ['наборы',     "nabory: { 'всё': null, 'волна': ['Волна', 'Ход'] }  —  панель показывает текущую работу; ?nabor=имя"],
  ['скролл',    "StendSkroll.pusk({ params: P, na: … })  —  образец: /skroll"],
];
document.getElementById('spisok').innerHTML = ORGANY.map(function (o) {
  return '<li><b>' + o[0] + '</b><code>' + o[1].replace(/</g, '&lt;') + '</code></li>';
}).join('');

var EASES = { 'линейный': [0, 0, 1, 1], 'плавный': [0.65, 0, 0.35, 1], 'мягкий выход': [0.23, 1, 0.32, 1] };
function bezier(b, t) { var u = 1 - t; return 3 * u * u * t * b[1] + 3 * u * t * t * b[3] + t * t * t; }
function evalEase(name, bez, t) { return bezier(bez || EASES[name] || EASES['линейный'], t); }

var DEFAULTS = {
  size: 4.5, face: 'evenmono', palette: 'night', bg: '#101014', ink: '#f0f0f2', acc: '#4d8dff',
  hodEase: 'плавный', hodBez: EASES['плавный'].slice(),
  yakor: 'c', vid: 'lesenka', setka: true, priemy: ['akcent'],
  pole: [40, 180], sila: 60, ostrota: 2.2,
  spring: [320, 0.35], kompoziciya: 'A',
  zaval: 12, padT: 60, padB: 120, shrift: 'Editorial New',
  aktivnyi: '', etazhKegl: 100, etazhVozduh: 0,
  otkloneniya: {}, // служебное: гнездо отступлений, ручка ему не нужна
};
var P = Object.assign({}, DEFAULTS);
try { Object.assign(P, JSON.parse(localStorage.getItem('panel-lib-params') || '{}')); } catch (e) {}
if (!Array.isArray(P.priemy)) P.priemy = DEFAULTS.priemy.slice();
if (!Array.isArray(P.pole)) P.pole = DEFAULTS.pole.slice();
if (!P.otkloneniya || typeof P.otkloneniya !== 'object') P.otkloneniya = {};

var main = document.querySelector('main');
function prilozhit() {
  var s = document.body.style;
  s.setProperty('--bg', P.bg); s.setProperty('--ink', P.ink); s.setProperty('--acc', P.acc);
  main.style.opacity = P.setka ? 1 : 0.25;
  main.style.textAlign = ({ l: 'left', c: 'center', r: 'right' })[P.yakor.replace(/^[tb]/, '')] || 'left';
  main.style.paddingLeft = P.pole[0] / 8 + 'px';
  main.style.paddingRight = P.pole[1] / 8 + 'px';
  main.style.fontSize = P.size / 4.5 + 'em';
  main.style.transform = 'rotate(' + (-P.zaval / 6) + 'deg)';
  main.style.marginTop = (P.padT - P.padB) / 8 + 'px';
  // Три этажа каталога живут одним законом; отступивший читает своё значение.
  [['zagolovok', 'h1'], ['spisok', 'ul'], ['snoska', 'p.hint']].forEach(function (e) {
    var el = main.querySelector(e[1]);
    if (!el) return;
    el.style.fontSize = StendPanel.znachenie(P, 'etazhKegl', e[0]) / 100 + 'em';
    el.style.marginTop = StendPanel.znachenie(P, 'etazhVozduh', e[0]) + 'px';
  });
}

StendPanel.build({
  storageKey: 'panel-lib-params', params: P, defaults: DEFAULTS,
  eases: EASES, evalEase: evalEase, bezApprox: EASES,
  defs: [
    ['h', 'Свои органы'],
    ['size', 'Кегль, % ширины', 1.5, 12, 0.1],
    ['face', 'Гарнитура', 'select', [['evenmono', 'Even Mono'], ['times', 'Times New Roman']]],
    ['bg', 'Фон', 'color'],
    ['ink', 'Текст', 'color'],
    ['hodEase', 'Кривая хода', 'ease'],
    ['h', 'Из библиотеки'],
    ['vid', 'Тип сетки', 'segment', [
      ['kolonnaya', 'Колонная'], ['lesenka', 'Лесенка'], ['rezinka', 'Резинка']]],
    ['setka', '', 'toggle', ['Показать содержимое', 'Приглушить содержимое']],
    ['yakor', 'Якорь', 'anchor'],
    ['pole', 'Поле, px', 'koridor', 0, 300, 4],
    ['priemy', 'Ходы', 'nabor', [
      ['akcent', 'Акцент'], ['vybor', 'Выбор'], ['propusk', 'Пропуск'], ['obedinenie', 'Объединение']]],
    ['h', 'Закон и датчик'],
    ['sila', 'Сила, % кегля', 0, 100, 1],
    ['ostrota', 'Острота', 0.5, 5, 0.1],
    ['profil', 'Профиль эффекта', 'datchik', {
      fn: function (x) { return P.sila * Math.pow(x, P.ostrota); }, x: [0, 1], y: [0, 100],
    }],
    ['h', 'Отклик'],
    ['spring', 'Пружина', 'pruzhina'],
    ['h', 'Выбор с превью'],
    ['kompoziciya', 'Композиция', 'vybor',
      [['A', 'Колонки'], ['B', 'Лесенка'], ['C', 'Резинка']], {
      vysota: 62,
      risovat: function (ctx, w, h, z, akcent) {
        // схема сетки: превью рисуется, потому что картинки у композиции нет
        var m = 8, kol = 5, sh = (w - m * 2) / kol;
        ctx.fillStyle = 'rgba(255,255,255,.07)';
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = akcent;
        for (var i = 0; i < kol; i++) {
          var vys = z === 'A' ? h - m * 2
                  : z === 'B' ? (h - m * 2) * (0.3 + i * 0.17)
                              : (h - m * 2) * (i % 2 ? 0.45 : 0.95);
          ctx.fillRect(m + i * sh + 2, h - m - vys, sh - 4, vys);
        }
      },
    }],
    ['h', 'Ещё из библиотеки'],
    ['shrift', 'Гарнитура', 'garnitura'],
    ['zaval', 'Завал оси, °', 'ugol', 0, 45],
    ['', 'Поле, px', 'para', [['padT', 'сверху', 0, 300, 4], ['padB', 'снизу', 0, 300, 4]]],
    ['palette', 'Палитра', 'palitra', [
      ['night', 'Ночь', { bg: '#101014', ink: '#f0f0f2', acc: '#4d8dff' }],
      ['white', 'Чёрное на белом', { bg: '#ffffff', ink: '#111111', acc: '#1b2db3' }],
      ['blue', 'Синий на светлом', { bg: '#e7ecf6', ink: '#1b2db3', acc: '#1b2db3' }]]],
  ].concat(StendPanel.izObyavleniya([
    // этажность целиком из объявления: 'этажи' ставит инспектор, а пометка
    // k:'этаж' собирает величину органом наследования — закон + отступления
    ['h', 'Этажи и закон'],
    ['aktivnyi', 'Правим', 'этажи', { iz: [
      ['zagolovok', 'Заголовок'], ['spisok', 'Список'], ['snoska', 'Сноска']] }],
    ['etazhKegl', 'Кегль этажа', 'доля', { ot: 'кегль', k: 'этаж', ot0: 60, shag: 1 }],
    ['etazhVozduh', 'Воздух сверху', 'поле', { k: 'этаж', do: 80, shag: 1 }],
  ])).concat([
    ['h', 'Правки'],
    ['pravki', 'Шаг назад', 'otkat'],
  ]),
  nabory: {
    'все органы': null,
    'закон и датчик': ['Закон и датчик', 'Отклик'],
    'этажи': ['Этажи и закон'],
    'вид': ['Свои органы', 'Ещё из библиотеки'],
  },
  desc: {
    size: 'кегль набора долей ширины экрана — коридор, а не литерал',
    yakor: 'точка привязки одним органом вместо двух списков',
    vid: 'закон сетки: смена варианта перестраивает композицию',
    setka: 'подпись говорит действие, а не состояние',
    pole: 'две границы одной дорожкой — закон коридора',
    priemy: 'композиционные ходы включаются независимо',
    profil: 'форма закона видна, а не воображается',
    pravki: '⌘Z отменяет, ⇧⌘Z возвращает; одно перетаскивание — один шаг',
    spring: 'как элемент приходит в цель: период — время одного колебания, затухание — сколько отскоков (0 — качается долго, 1 — приходит без отскока); кривая и бегущая точка показывают это движение',
    kompoziciya: 'картинка сверху — примерка: наведи курсор на кнопку варианта, и она покажет его, НЕ выбирая; убрал курсор — снова показан выбранный; выбирает только клик по кнопке',
    zaval: 'угол показан углом: тяни по кругу от текущего положения, с Shift — по 5°; клик по числу — точный ввод, стрелки ±1, с Shift ±10',
    palette: 'профиль виден цветом, а не назван словом',
    aktivnyi: 'сначала выбираешь, что правишь, потом крутишь; сводка считает отступления',
    etazhKegl: 'закон один на все этажи; точка справа отмечает отступление и возвращает закон',
    etazhVozduh: 'то же наследование для вертикального ритма этажей',
  },
  onChange: prilozhit,
});
prilozhit();
</script>
</body>
</html>
