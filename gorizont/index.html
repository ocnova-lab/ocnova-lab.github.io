<!DOCTYPE html>
<!--
════════════════════════════════════════════════════════════════════════
СТЕНД «ГОРИЗОНТАЛЬНЫЙ ЛОНГРИД»
Статья про алгоритмические сетки разложена горизонтальной
последовательностью колонок. Кадр-источник: Figma «Основа — архитектура
экранов», 95:4. Материал — gorizont-data.js, картинки — gorizont-img/.

ЗАКОН

Несущий — 8. Сцепление.
  Смотрит: на соседа (где кончилась предыдущая колонка).
  Реагирует: ступеньками — шагом «колонка + межколонник».
  Ограничитель дрейфа (П7): любая ширина берётся целым пролётом
      span(N) = N·col + (N−1)·gut  →  340 / 710 / 1080 / 1450…
  поэтому после широкого блока цепочка возвращается ровно на шаг и никуда
  не уезжает. Кратность колонке — не украшение, а страж сцепления.

Картинка — пролёт из макета как потолок, высота экрана как решающее.
  Смотрит: на макет (сколько колонок ей там отведено) и на высоту экрана.
  Реагирует: пока картинка при своём пролёте влезает в высоту, стоит
  целым пролётом и кратность держится сама. Как только не влезает —
  ширина сходит с кратности и уменьшается, пока картинка не встанет в
  экран целой. Одиночная картинка не выпадает из экрана и не требует
  прокрутки: целостность картинки главнее кратности, ужимается носитель,
  а не то, на что смотрят.
  Ручка «Картинка выше экрана» даёт два других ответа: «на пролёт назад»
  (кратность держится, картинка целая, но мельче — это 2. Пересчёт на
  непривычной оси: не «сколько колонок влезет в ширину», а «какой пролёт
  влезет по высоте») и «прокрутка» (ширина как в макете, лишнее уходит в
  вертикальный ход колонки).
  Стопка из нескольких картинок остаётся окном с вертикальной прокруткой —
  но ширина у неё считается по ОДНОЙ картинке, чтобы каждая была видна
  целой, а прокрутка переносила от одной к другой, а не резала посередине.
  Сбоку от окна, которому есть куда крутиться, — датчик хода.
  В мобайле картинка идёт во всю ширину экрана и за него не вылезает.

Абзац — 5. Порции ◌ (КАНДИДАТ, стенд первый прецедент).
  Смотрит: на содержимое (сколько набралось текста) в текущем окне.
  Реагирует: ступеньками — каждая экранная высота текста добавляет ещё
  одну колонку (многоколонник CSS, ширина колонки та же).
  Единица порции — высота окна.

Титул — 3. Доли и Коридор.
  Смотрит: на окно.
  Реагирует: плавно. Колонка титула стоит между двумя буферами по 340,
  её ширина = окно − 2·(колонка + межколонник), поэтому тройка
  «буфер + титул + буфер» ровно заполняет экран, а титул всегда по центру.
  Кегль титула течёт в коридоре 34…60 от этой ширины.

Мобайл — 1. Перелом, единственный и качественный.
  Смотрит: на окно. Реагирует: щелчком — лента разворачивается в
  вертикаль. Перелома в @media нет, порог — ручка панели.

ПРИЁМЫ СО СКЛАДА («Лонгрид — алгоритмические приёмы»)
  15. Инерция догона — лента догоняет цель колеса с экспоненциальным
      отставанием; ручки «Колесо, %» (сила) и «Инерция, %» (динамика).
  19. Воздух одной природы — в мобайле вертикальный зазор между колонками
      равен фактическому межколоннику: вертикальный ритм выведен из
      горизонтального закона.
  20. Второй номинал — мобайл не уменьшенный десктоп: колонка резиновая,
      картинка во всю ширину и за экран не вылезает, буферы становятся
      пропусками трёх ступеней по тому, что стоит рядом (перед разделом /
      между группами / у картинки).

ЦВЕТ. Один на весь макет — серо-синий #878C97, выбран Сергеем пипеткой.
Им набран текст,
индексы, подписи, титул и им же прочерчены линии схем: схемы вставлены
разметкой и берут цвет от набора, а не носят свой. Разница веса идёт
толщиной штриха и кеглем, а не оттенком: второй плотности в макете нет,
индекс набран тем же цветом, что и текст, и на наведении меняет не цвет,
а подчёркивание. Волосяные линии датчиков хода выведены из того же цвета
подмешиванием к фону.

ЧИСЛА (П2). Объявленный модуль один — колонка. --u = col / 340; все кегли,
интерлиньяжи и отбивки макета множатся на него, поэтому ручка «Колонка»
тянет за собой весь набор и мера строки в знаках не плывёт. Кегль титула —
коридор. Пиксели остались в границах коридоров, в волосяных линиях датчиков
хода и в служебной геометрии панели.

ЗАМЕР (П3). Координаты колонок считаются из пролётов и снимаются один раз
за раскладку (массив stops) — в прокрутке геометрия не читается. Единственный
замер — высота набора в колонке: сколько порций займёт абзац, знает только
браузер, вычислить это до отрисовки нечем. Замер идёт раз на раскладку, не
в кадре.

ЖИВАЯ КОЛОНКА. Основной набор 14/20 хорош для ленты и тесноват для чтения.
Колонка, на которой остановился курсор, вырастает на пятую часть: растёт
весь набор разом через собственный масштаб колонки --k, поэтому мера строки
в знаках не меняется — меняется кегль, а не вёрстка. Если выросшему тексту
не хватает высоты, он забирает ещё одну колонку по тому же закону порций.
Лента расступается: соседи справа встают за выросшей колонкой по цепочке,
левый край читаемой колонки не двигается — место чтения не теряется.
Растёт только колонка с набором: картинка и так занимает максимум по высоте.
Дескриптор не растёт никогда — ни индекс над колонкой, ни строка автора,
ни подпись к картинке: служебный слой набора держит свой кегль, растёт то,
что читают. Колонка-подпись набрана дескриптором целиком, поэтому не растёт
вовсе. Колонка под курсором ищется по оси ленты, а не попаданием в саму
колонку: межколонник делится пополам между соседями, чтобы над лентой не
осталось мест, где курсор проваливается в пустоту.

ДВА СКРОЛЛА (закон 13. Рубеж ◌, смотрит на скролл, реагирует щелчком —
кандидат, стенд первый прецедент). Колонка с прокруткой забирает себе
колесо не по наведению, а по остановке: пока лента едет, такие колонки
пролетают мимо и колесо остаётся горизонтальным. Вертикаль просыпается,
когда лента стоит, пауза после последнего хода вбок выдержана и курсор
на этой колонке; первый же ход вбок снова её усыпляет. Момент, когда
колонка ожила, показывает датчик хода сбоку: его бегунок темнеет.
Переключение стало намерением читателя, а не случайностью пути курсора.

ДВИЖЕНИЕ (П5). Две динамики, обе с ручками:
  колесо → лента с экспоненциальным догоном («Колесо, %» + «Инерция, %»);
  клавиши, переход по адресу фрагмента и притяжение к колонке → проезд по
  кривой («Проезд, мс» + слот изинга «Кривая проезда» с редактором безье).
  У проезда есть начало и конец, поэтому кривая уместна; у догона их нет —
  там работает отставание.
Автономной анимации нет: лента стоит, пока её не двинут, — стоп-кадр ?stop=
не нужен, снимок берётся в любой момент.

ИНДЕКС. Индекс стоит над колонкой по центру — кроме колонок, открывающих
раздел: у них вторая часть индекса «00», и индекс уходит на левый флаг
колонки. Выключка индекса работает меткой начала: по ленте видно, где
раздел начинается, не читая текста.

АДРЕСА. Индекс колонки — адрес фрагмента: «01 – 05» → #01-05, картинки →
#img-07, подписи → #cap-07. Клик по индексу копирует ссылку. Любую ручку
панели можно задать в адресе: ?col=300&figFit=step&dbg=1. ?panel=1 открывает
панель, ?reset=1 сбрасывает сохранённые настройки.
════════════════════════════════════════════════════════════════════════
-->
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Горизонтальный лонгрид</title>
<link rel="stylesheet" href="/panel.css" />
<style>
  @font-face { font-family: "Even Mono"; font-weight: 400; font-style: normal;
    src: url("/fonts/EvenMono-Regular.woff2") format("woff2"),
         url("/fonts/EvenMono-Regular.woff") format("woff"); font-display: swap; }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; font-style: normal;
    src: url("/fonts/JetBrainsMono-Regular.woff2") format("woff2"); font-display: swap; }

  /* ── единицы макета ───────────────────────────────────────────────
     --col  базовая колонка (340)      --gut  межколонник (30)
     --pad  поле сверху и снизу (30)   --avail высота ленты
     Пролёт в N колонок = N·col + (N−1)·gut — считается в JS (span()). */
  :root {
    --col: 340px; --gut: 30px; --pad: 30px; --avail: 100vh;
    --ub: 1;             /* модуль набора = колонка / 340 (ставится в JS) */
    /* Цвет один на весь макет: набор, индексы, подписи, титул и линии схем.
       Разница веса идёт толщиной штриха и кеглем, а не оттенком.
       Волосяные линии датчиков выведены из него же — подмешаны к фону. */
    --ink: #878C97;      /* серо-синий — единственный цвет макета */
    --bg: #fff;
    --hair: color-mix(in srgb, var(--ink) 30%, var(--bg));
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Even Mono", ui-monospace, monospace;
    overflow: hidden; overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
  }

  /* ── лента ── */
  #strip {
    position: fixed; inset: 0;
    display: flex; align-items: flex-start; gap: var(--gut);
    padding: var(--pad) 0;
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none;
  }
  #strip::-webkit-scrollbar { display: none; }

  /* --k — собственный масштаб колонки: 1 в покое, больше — когда ожила.
     Через него множится модуль набора, поэтому растёт всё разом: кегли,
     интерлиньяжи, отбивки и ширина колонки многоколонника.
     CSS-перехода тут нет намеренно: от --k зависит сама раскладка, и пока
     переход едет, ширина колонки и её содержимое считаются от разных
     значений — между колонками открываются дыры. Масштаб и ширину пишет
     покадровый ход в JS, обе величины всегда из одного кадра. */
  .col {
    flex: 0 0 auto; height: var(--avail); width: var(--col);
    --k: 1;
    --u: calc(var(--ub) * var(--k));
  }
  /* колонки с текстом: не влез по высоте — перетекает в соседнюю */
  .col.flow { column-width: calc(var(--col) * var(--k));
              column-gap: calc(var(--gut) * var(--k)); column-fill: auto; }
  /* замерная поза: одна колонка, высота по содержимому */
  .col.flow.gauge { column-width: auto; height: auto; }

  /* ── набор ── */
  .idx {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    /* дескриптор — служебный слой: от --ub, а не от --u, поэтому рост
       живой колонки его не касается. Растёт то, что читают. */
    font-size: calc(11px * var(--ub)); line-height: calc(20px * var(--ub));
    letter-spacing: -0.01em; color: var(--ink); text-align: center;
    margin-bottom: calc(10px * var(--u)); white-space: pre;
  }
  .idx[data-id] { cursor: pointer; }
  /* индекс кликают ради ссылки — подсказка подчёркиванием, а не цветом:
     цвет в макете один, менять его на наведении нечем */
  .idx[data-id]:hover { text-decoration: underline dotted; text-underline-offset: 4px; }
  .idx.sub { color: var(--ink); margin-bottom: calc(18px * var(--u)); }
  .main { font-size: calc(14px * var(--u)); line-height: calc(20px * var(--u));
          letter-spacing: -0.01em; }
  .lead { font-size: calc(20px * var(--u)); line-height: calc(30px * var(--u));
          letter-spacing: -0.01em; }
  .cap  { font-family: "JetBrains Mono", ui-monospace, monospace;
          font-size: calc(11px * var(--ub)); line-height: calc(20px * var(--ub));
          letter-spacing: -0.01em; color: var(--ink); }
  .by   { font-family: "JetBrains Mono", ui-monospace, monospace;
          font-size: calc(11px * var(--ub)); line-height: calc(20px * var(--ub));
          letter-spacing: -0.01em; text-align: center; margin-top: calc(20px * var(--u)); }
  .thumb { display: block; width: calc(50px * var(--ub)); height: calc(50px * var(--ub));
           margin-top: calc(20px * var(--u)); }

  /* открывающая раздел колонка: индекс на левом флаге */
  .col.open > .idx { text-align: left; }
  .col.lead-col .idx, .col.head-col .idx { margin-bottom: calc(11px * var(--u)); }
  .col.cap-col .idx { margin-bottom: calc(10px * var(--u)); }

  /* ── титул ── */
  .col.title { text-align: center; }
  .col.title .idx { margin-bottom: calc(43px * var(--u)); }
  .col.title h1 {
    font-family: "Even Mono", ui-monospace, monospace; font-weight: 400;
    letter-spacing: -0.05em; line-height: 1.1667;
    font-size: var(--ttl, 60px); white-space: pre-line;
  }

  /* ── картинки ── */
  .col.fig .idx, .col.figs .idx { margin-bottom: calc(17px * var(--u)); }
  .col.fig img { display: block; width: 100%; height: auto; }
  .draw { display: block; width: 100%; aspect-ratio: var(--ar); }
  .draw svg { display: block; width: 100%; height: 100%; }
  .scroller .draw + .draw { margin-top: calc(54px * var(--u)); }
  /* окно колонки со своей вертикальной прокруткой */
  .win { position: relative; height: var(--room, auto); }
  .scroller { height: 100%; overflow-y: auto; overflow-x: hidden;
              scrollbar-width: none; overscroll-behavior: contain; }
  .scroller::-webkit-scrollbar { display: none; }
  /* Ход колонки: та же волосяная линия, что у ленты внизу, только вбок.
     Показывается сама, когда колонке есть куда крутиться.
     Координаты выведены: линия живёт в системе окна (.win) и стоит
     посередине межколонника справа от него — right = −gut/2, по высоте
     во всё окно. Бегунок внутри линии: высота = доля видимого от общего,
     верх = доля прокрученного — обе доли, не замеры. */
  /* система координат — окно .win; вбок на половину межколонника, по высоте во всё окно */
  .vrail { position: absolute; top: 0; bottom: 0; right: calc(var(--gut) / -2);
           width: 1px; background: var(--hair); display: none; }
  .vrail.on { display: block; }
  /* бегунок: высота = доля видимого от общего, верх = доля прокрученного (обе доли, не замеры) */
  .vrail b { position: absolute; left: 0; width: 100%; background: var(--hair);
             transition: background .18s; }
  /* колонка ожила: колесо теперь крутит её, а не ленту */
  .col.live .vrail b { background: var(--ink); }
  .scroller figure + figure, .scroller img + img { margin-top: calc(54px * var(--u)); }
  .scroller img { display: block; width: 100%; height: auto; }

  /* ── ход ленты ── */
  #rail { position: fixed; left: 0; right: 0; bottom: 0; height: 1px; background: var(--hair); }
  #rail i { display: block; height: 100%; width: 0; background: var(--ink); }
  #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
           font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px;
           color: #fff; background: #1a1a1a; padding: 6px 12px; border-radius: 20px;
           opacity: 0; pointer-events: none; transition: opacity .2s; }
  #toast.on { opacity: 1; }

  /* ── отладка ── */
  body.dbg .col { outline: 1px dashed rgba(39,73,176,.35); outline-offset: 0; }
  body.dbgbuf .col.buffer { background: #D9D9D9; height: 200px; }

  /* ── мобайл: те же колонки, только друг под другом ── */
  html.mob, body.mob { height: auto; overflow: visible; }   /* в мобайле крутится сам документ */
  body.mob #strip { position: static; display: block; overflow: visible;
                    height: auto; padding: 0 20px var(--pad); }
  body.mob .col { width: auto !important; height: auto !important;
                  column-width: auto !important; }
  /* межколонник, поставленный на попа: обычная отбивка между колонками */
  body.mob .col + .col { margin-top: var(--gut); }
  /* буфер сам и есть пропуск — его высота работает без надбавок */
  body.mob .col.buffer { height: var(--gap-h) !important; margin-top: 0 !important; }
  body.mob .col.buffer + .col { margin-top: 0 !important; }
  body.mob .win { height: auto !important; }
  body.mob .scroller { height: auto !important; overflow: visible; }
  body.mob .vrail { display: none !important; }
  body.mob .scroller figure + figure, body.mob .scroller img + img,
  body.mob .scroller .draw + .draw { margin-top: var(--gut); }
  body.mob #rail { display: none; }
</style>
</head>
<body>
<div id="strip" lang="en"></div>
<div id="rail"><i></i></div>
<div id="toast">ссылка скопирована</div>

<script src="/gorizont-data.js"></script>
<script src="/panel.js"></script>
<!-- органы панели из библиотеки /panel-lib (каталог: стенды.0снова.рф/panel-lib) -->
<script src="/panel-lib/segment.js"></script>
<script src="/panel-lib/toggle.js"></script>
<script src="/panel-lib/koridor.js"></script>
<script src="/panel-lib/para.js"></script>
<script src="/panel-lib/palitra.js"></script>
<script src="/panel-lib/otkat.js"></script>
<script src="/panel-lib/datchik.js"></script>
<script>
/* Закон стенда — в шапке файла (комментарий над <html>).
   Ниже — параметры, раскладка и ход. */

var DEFAULTS = {
  col: 340,        // базовая колонка
  gut: 30,         // межколонник
  pad: 30,         // поле сверху и снизу
  wheel: 100,      // ход колеса, %
  lag: 82,         // инерция, %
  snap: false,     // притяжение к краю колонки
  wake: 420,       // пауза, после которой колонка под курсором оживает, мс
  zoom: 120,       // насколько крупнее колонка в середине поля, % (100 — не растёт)
  reach: 0.8,      // ширина поля роста, в колонках от края колонки
  zoomEase: 'плавный',   // форма спада поля
  zoomBez: [0.65, 0, 0.35, 1],
  zoomLag: 55,     // инерция поля, % — насколько лениво ширина догоняет закон
  ride: 620,       // проезд к фрагменту и по клавишам, мс
  rideEase: 'плавный',
  rideBez: [0.65, 0, 0.35, 1],
  figFit: 'free',  // картинка выше экрана: free — ширина сходит с кратности; step — отступает целым пролётом; scroll — пролёт макета, лишнее в прокрутку
  gapBig: 120,     // мобайл: пропуск перед разделом
  gapMid: 72,      // мобайл: пропуск между группами
  gapSml: 40,      // мобайл: пропуск у картинки
  ttl: [34, 60],   // коридор кегля титула, px
  mob: 700,        // порог мобайла
  palette: 'osnova', // палитра пресет-списком
  bg: '#ffffff',
  ink: '#878c97',
  dbg: false,      // показать границы колонок
  dbgbuf: false    // показать буферы
};
var P = Object.assign({}, DEFAULTS);
try { Object.assign(P, JSON.parse(localStorage.getItem('gorizont-params') || '{}')); } catch (e) {}
// Параметры из адреса поверх сохранённых: ?col=300&figFit=step&dbg=1.
// Тип берём у исходного значения, а не угадываем по строке: иначе цвет
// «#0a0f1a» станет числом, а рукоятки безье — одной координатой.
new URLSearchParams(location.search).forEach(function (v, k) {
  if (!(k in DEFAULTS)) return;
  var d = DEFAULTS[k];
  P[k] = Array.isArray(d) ? v.split(',').map(Number)
       : typeof d === 'number' ? parseFloat(v)
       : v;
});

var DATA  = window.GORIZONT || [];
var strip = document.getElementById('strip');
var rail  = document.querySelector('#rail i');
var toast = document.getElementById('toast');
var root  = document.documentElement;
var mobile = false;

/* селекты панели возвращают строку — приводим переключатели к «да/нет» */
function flag(v) { return v !== 0 && v !== '0' && v !== false && v !== ''; }

/* ── пролёт ── */
function span(n) { return n * P.col + (n - 1) * P.gut; }
function spanFits(w) { return Math.max(1, Math.floor((w + P.gut) / (P.col + P.gut))); }

/* ── адрес фрагмента ── */
function anchorOf(d) {
  if (d.t === 'title') return 'title';
  if (d.t === 'fig' || d.t === 'figs') return 'img-' + d.n;
  if (d.t === 'cap') return 'cap-' + d.to;
  if (d.n) return d.n.replace(/\s*–\s*/, '-').replace(/\s+/g, '');   // «01 – 05» → 01-05
  return null;
}

/* ── ступень пропуска для буфера (мобайл) ── */
function gapLevel(i) {
  var prev = null, next = null, k;
  for (k = i - 1; k >= 0; k--) if (DATA[k].t !== 'buffer') { prev = DATA[k]; break; }
  for (k = i + 1; k < DATA.length; k++) if (DATA[k].t !== 'buffer') { next = DATA[k]; break; }
  if (!prev) return 'big';
  if (next && next.t === 'title') return 'big';
  if (next && next.n && /–\s*00$/.test(next.n)) return 'big';       // начало раздела
  var atFig = (next && (next.t === 'fig' || next.t === 'figs')) ||
              (prev && (prev.t === 'cap' || prev.t === 'fig' || prev.t === 'figs'));
  return atFig ? 'sml' : 'mid';
}

/* ── сборка колонок ── */
var cols = [];   // {el, d, i}
var wins = [];   // окна с прокруткой — им перерисовывать датчик хода

function el(tag, cls, txt) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
}
function idxLine(text, id) {
  var n = el('div', 'idx', text);
  if (id) { n.dataset.id = id; n.title = 'скопировать ссылку на фрагмент'; }
  return n;
}
/* Схема — векторная, её линии объявлены currentColor: вставляем разметкой,
   чтобы цвет пришёл от набора, а не был зашит в файл. Место под схему
   держит пропорция, снятая из данных, — лента не дёргается при загрузке. */
var drawn = {};
function draw(src, w, h) {
  var box = el('span', 'draw');
  box.style.setProperty('--ar', w + ' / ' + h);
  if (drawn[src] !== undefined) { box.innerHTML = drawn[src]; return box; }
  drawn[src] = null;
  fetch('/gorizont-img/' + src).then(function (r) { return r.text(); }).then(function (t) {
    drawn[src] = t;
    [].forEach.call(document.querySelectorAll('.draw[data-src="' + src + '"]'), function (n) {
      n.innerHTML = t;
    });
    relayout();
  });
  box.dataset.src = src;
  return box;
}
var reflow = 0;
function relayout() {
  if (reflow) return;
  reflow = requestAnimationFrame(function () { reflow = 0; layout(); measure(); });
}

function pic(src, alt, w, h) {
  return /\.svg$/.test(src) ? draw(src, w, h) : img(src, alt, w, h);
}

function img(src, alt, w, h) {
  var n = document.createElement('img');
  n.src = '/gorizont-img/' + src;
  n.alt = alt || '';
  // натуральные размеры проставлены заранее: место под картинку занято
  // до загрузки, лента не дёргается и ссылка на фрагмент попадает точно
  if (w) { n.width = w; n.height = h; }
  n.draggable = false;
  return n;
}

/* окно с прокруткой + датчик хода сбоку */
function win(sc) {
  var w = el('div', 'win'), r = el('i', 'vrail'), b = el('b');
  r.appendChild(b); w.appendChild(sc); w.appendChild(r);
  function draw() {
    var over = sc.scrollHeight - sc.clientHeight;
    r.classList.toggle('on', over > 2 && !mobile);
    if (over <= 2) return;
    var part = sc.clientHeight / sc.scrollHeight;
    b.style.height = (part * 100).toFixed(2) + '%';
    b.style.top = (sc.scrollTop / sc.scrollHeight * 100).toFixed(2) + '%';
  }
  sc.addEventListener('scroll', draw);
  w.draw = draw;
  wins.push(w);
  return w;
}

function build() {
  DATA.forEach(function (d, i) {
    var c, id = anchorOf(d);
    switch (d.t) {
      case 'buffer':
        c = el('div', 'col buffer');
        c.dataset.gap = gapLevel(i);
        // буферы по бокам титула — те самые, что держат его по центру экрана
        if ((DATA[i - 1] && DATA[i - 1].t === 'title') ||
            (DATA[i + 1] && DATA[i + 1].t === 'title')) c.classList.add('tbuf');
        break;

      case 'title':
        c = el('div', 'col title');
        c.appendChild(idxLine(d.date, id));
        c.appendChild(el('h1', null, d.text));
        break;

      case 'lead':
        c = el('div', 'col flow lead-col');
        c.appendChild(idxLine(d.n, id));
        c.appendChild(el('p', 'lead', d.text));
        c.appendChild(el('div', 'by', d.by));
        break;

      case 'head':
        c = el('div', 'col flow head-col');
        c.appendChild(idxLine(d.n, id));
        c.appendChild(el('p', 'lead', d.text));
        break;

      case 'cap':
        c = el('div', 'col flow cap-col');
        c.appendChild(idxLine(d.arrow, id));
        c.appendChild(el('p', 'cap', d.text));
        if (d.thumb) c.appendChild(Object.assign(img(d.thumb, '', 50, 50), { className: 'thumb' }));
        break;

      case 'fig':
        c = el('div', 'col fig');
        c.appendChild(idxLine(d.n, id));
        var one = el('div', 'scroller');
        one.appendChild(pic(d.src, 'илл. ' + d.n, d.w, d.h));
        c.appendChild(win(one));
        break;

      case 'figs':
        c = el('div', 'col figs');
        if (d.label === 'outside') c.appendChild(idxLine(d.n, id));
        var sc = el('div', 'scroller');
        d.items.forEach(function (it) {
          if (it.n) {
            var f = el('figure');
            f.appendChild(idxLine(it.n).cloneNode(false));
            f.lastChild.className = 'idx sub';
            f.lastChild.textContent = it.n;
            f.appendChild(pic(it.src, 'илл. ' + it.n, it.w, it.h));
            sc.appendChild(f);
          } else {
            sc.appendChild(pic(it.src, 'илл. ' + d.n, it.w, it.h));
          }
        });
        c.appendChild(win(sc));
        break;

      default:
        c = el('div', 'col flow');
        c.appendChild(idxLine(d.n, id));
        c.appendChild(el('p', 'main', d.text));
    }
    // вторая часть индекса «00» — колонка открывает раздел; её индекс
    // уходит на левый флаг: метка начала, а не рядовая нумерация
    if (d.n && /–\s*00$/.test(d.n)) c.classList.add('open');
    if (id) c.id = id;
    strip.appendChild(c);
    cols.push({
      el: c, d: d, i: i, r: 0, wNow: -1, kNow: -1, l: 0, rr: 0,
      // растёт только колонка с набором; подпись набрана дескриптором целиком
      grows: c.classList.contains('flow') && !c.classList.contains('cap-col')
    });
  });
}

/* ── раскладка ── */
function layout() {
  var vw = window.innerWidth, vh = window.innerHeight;
  mobile = vw < P.mob;
  document.body.classList.toggle('mob', mobile);
  root.classList.toggle('mob', mobile);
  document.body.classList.toggle('dbg', flag(P.dbg));
  document.body.classList.toggle('dbgbuf', flag(P.dbgbuf));
  var u = P.col / 340;                     // модуль набора: колонка макета
  root.style.setProperty('--ub', u.toFixed(4));
  root.style.setProperty('--col', P.col + 'px');
  root.style.setProperty('--gut', P.gut + 'px');
  root.style.setProperty('--pad', P.pad + 'px');
  ['bg', 'ink'].forEach(function (k) {
    root.style.setProperty('--' + k, P[k]);
  });

  if (mobile) return layoutMob(vw);

  var avail = Math.max(200, vh - 2 * P.pad);
  var lab = Math.round(37 * u);            // строка индекса 20 + отбивка 17, в модуле
  root.style.setProperty('--avail', avail + 'px');

  /* Титул и его буферы. Тройка «буфер + титул + буфер» обязана ровно
     заполнять экран — тогда титул всегда по центру. Пока титул шире
     колонки, буферы стоят колонкой, а слабину берёт титул; когда экран
     жмёт и титул упирается в колонку, слабину отдают буферы. Ужимается
     то, что пусто, а не то, что читают. */
  ctx = {
    u: u, avail: avail, lab: lab,
    titleW: Math.max(P.col, vw - 2 * (P.col + P.gut))
  };
  ctx.tbufW = Math.max(0, Math.round((vw - ctx.titleW - 2 * P.gut) / 2));

  cols.forEach(function (c) { if (c.el.classList.contains('flow')) gauge(c); });
  cols.forEach(place);
  polе();                                  // поле ставит фактические ширины
  wins.forEach(function (w) { w.draw(); });
  snapshot();
}

var ctx = null;

/* Одна колонка. Вынесено отдельно: когда колонка оживает под курсором,
   перекладывать всю ленту незачем — меняется она одна, остальные просто
   встают за ней по цепочке. */
function place(c) {
  if (!ctx) return;
  var d = c.d, e = c.el;
  c.wNow = -1; c.kNow = -1;
  e.style.setProperty('--k', 1);
  e.style.height = '';
  e.style.setProperty('--room', '');
  var stavit = function (w) { c.w1 = c.wz = Math.round(w); e.style.width = c.w1 + 'px'; };

  if (d.t === 'buffer') {
    stavit(e.classList.contains('tbuf') ? ctx.tbufW : P.col);
    return;
  }
  if (d.t === 'title') {
    stavit(ctx.titleW);
    // коридор кегля титула: границы — решение глаза, они же ручка-коридор
    e.style.setProperty('--ttl',
      Math.max(P.ttl[0] * ctx.u, Math.min(P.ttl[1] * ctx.u, ctx.titleW / 1531 * 60)).toFixed(1) + 'px');
    return;
  }
  if (d.t === 'fig') {
    var room = Math.max(60, ctx.avail - ctx.lab);
    stavit(figW(d.span, d.w, d.h, room));
    e.style.setProperty('--room', room + 'px');
    return;
  }
  if (d.t === 'figs') {
    // окно стопки — вся высота колонки, но ширина считается по ОДНОЙ
    // картинке: у стопки с номером на каждой её долю ещё режет строка номера
    var box = Math.max(60, ctx.avail - (d.label === 'outside' ? ctx.lab : 0));
    var it = d.items[0];
    var one = Math.max(60, box - (d.label === 'each' ? Math.round(38 * ctx.u) : 0));
    stavit(figW(d.span, it.w, it.h, one));
    e.style.setProperty('--room', box + 'px');
    return;
  }
  // Две меры текстовой колонки: в покое и в полном росте. Между ними её
  // ширину каждый кадр ставит поле — своей доли колонка не хранит.
  c.w1 = widthAt(spanFor(c, 1), 1);
  c.wz = c.grows ? widthAt(spanFor(c, kMax(c)), kMax(c)) : c.w1;
  e.style.width = c.w1 + 'px';
}

/* Координаты колонок не замеряются: поле копит их вперёд по цепочке и
   само кладёт в stops. Здесь остаётся только пересчёт хода и адреса. */
function snapshot() { measure(); }

/* Ширина картинки. Пролёт из макета — потолок, ниже него решает высота:
   картинка обязана помещаться в экран целиком, ради этого ей разрешено
   сойти с кратности («free»). «step» держит кратность и отступает целым
   пролётом — картинка целая, но мельче. «scroll» оставляет пролёт макета,
   а лишнее по высоте уходит в прокрутку колонки. */
function figW(sp, w, h, room) {
  var top = span(sp);
  if (P.figFit === 'scroll') return top;
  var fit = room * w / h;                 // ширина, при которой картинка влезает по высоте
  if (fit >= top) return top;
  return P.figFit === 'step' ? span(spanFits(fit)) : Math.max(60, Math.floor(fit));
}

/* абзац не влез по высоте — добираем пролёт, пока не влезет */
/* Сколько колонок займёт абзац. Раньше это решалось замером ширины прямо
   в момент раскладки — и ломалось, как только колонка росла: замер попадал
   в середину кривой роста, мерили одно состояние, показывали другое, и
   между колонками открывались дыры. Теперь замер один — высота набора в
   одну колонку при масштабе 1, снимается раз за перекладку. Дальше чистый
   счёт: набор при масштабе k выше ровно в k раз, значит порций нужно
   ceil(высота·k / высота экрана). Замер не участвует в кадре анимации. */
function gauge(c) {
  var e = c.el;
  e.classList.add('gauge');          // одна колонка, высота по содержимому
  e.style.setProperty('--k', 1);
  e.style.width = P.col + 'px';
  c.h1 = e.offsetHeight;
  // второй замер — в выросшем виде. Просто умножить первый на масштаб
  // нельзя: дескриптор внутри колонки не растёт, доля его высоты меняется.
  var z = kMax(c);
  if (z === 1) c.hz = c.h1;
  else {
    e.style.setProperty('--k', z);
    e.style.width = Math.round(P.col * z) + 'px';
    c.hz = e.offsetHeight;
    e.style.setProperty('--k', 1);
  }
  e.classList.remove('gauge');
}
function spanFor(c, k) {
  var h = (k === 1 ? c.h1 : c.hz) || 1;
  return Math.max(1, Math.min(8, Math.ceil(h / Math.max(1, ctx.avail))));
}
function widthAt(n, k) { return Math.round(n * P.col * k + (n - 1) * P.gut * k); }
/* ПОЛЕ РОСТА (закон 9. Силовое поле: смотрит на соседа, реагирует плавно).
   Разобрано с norgram.co (2017): там раскрытие колонки — не состояние,
   включаемое событием, а функция положения. Вся лента живёт одним числом
   «где мы», каждая колонка вырезает из него свою долю и пересчитывает из
   неё всё. Ноль классов состояния, ноль задержек: рост существует ровно
   столько, сколько идёт движение.

   Здесь то же самое, только число даёт не скролл, а курсор: у ленты есть
   линза — точка на оси, вокруг которой набор крупнее. Доля колонки —
   спад от расстояния до линзы по кривой из панели. Ширина колонки не
   хранится: каждый кадр она заново выводится из доли.

   Позиции копятся вперёд, как у norgram (xPos += ширина): доля колонки
   считается от её ЛЕВОГО края, а левый край зависит только от колонок
   до неё — поэтому обратной связи нет и поле не идёт вразнос. */
function kMax(c) { return c.grows ? P.zoom / 100 : 1; }

function lensX() {                      // линза в координатах ленты
  if (mobile || mx == null) return null;
  return mx + strip.scrollLeft;
}
function dolya(d, reach) {              // спад доли от расстояния
  if (d >= reach) return 0;
  return evalEase(P.zoomEase, P.zoomBez, 1 - d / reach);
}
function polе() {
  if (!ctx) return;
  var lens = lensX(), reach = Math.max(1, P.reach * (P.col + P.gut));
  var lag = 1 - P.zoomLag / 100, acc = 0, dvizh = false;
  var kz = P.zoom / 100 - 1;
  for (var i = 0; i < cols.length; i++) {
    var c = cols[i], e = c.el;
    var cel = 0;
    if (lens != null && c.grows) {
      // расстояние до колонки в её ПОКОЙНОЙ мере — от неё же и растём
      var d = lens < acc ? acc - lens : (lens > acc + c.w1 ? lens - acc - c.w1 : 0);
      cel = dolya(d, reach);
    }
    if (Math.abs(cel - c.r) > 0.0005) {
      c.r += (cel - c.r) * (lag <= 0 ? 1 : lag);
      if (Math.abs(cel - c.r) < 0.002) c.r = cel;
      dvizh = true;
    }
    var w = Math.round(c.w1 + (c.wz - c.w1) * c.r);
    if (w !== c.wNow) { e.style.width = w + 'px'; c.wNow = w; }
    var k = 1 + kz * c.r;
    if (Math.abs(k - c.kNow) > 0.002) { e.style.setProperty('--k', k.toFixed(4)); c.kNow = k; }
    c.l = acc; c.rr = acc + w;
    acc += w + P.gut;
  }
  stops = [];
  for (i = 0; i < cols.length; i++) if (cols[i].el.id)
    stops.push({ id: cols[i].el.id, l: cols[i].l, r: cols[i].rr });
  if (!dvizh && polеTiho !== true) { polеTiho = true; cols.forEach(function (c) { if (c.grows) guard(c); }); }
  if (dvizh) polеTiho = false;
  return dvizh;
}
var polеTiho = true;

/* Страховка на фрагментацию: строка не рвётся пополам, поэтому колонок
   изредка нужно на одну больше расчёта. Проверяем, когда рост доехал. */
function guard(c) {
  var e = c.el, k = 1 + (P.zoom / 100 - 1) * c.r;
  var n = spanFor(c, c.r > 0.5 ? kMax(c) : 1), g = 0;
  while (e.scrollWidth > e.clientWidth + 1 && n < 8 && g++ < 8) {
    n++; e.style.width = widthAt(n, k) + 'px'; c.wNow = -1;
  }
}

function layoutMob(vw) {
  root.style.setProperty('--avail', 'auto');
  wins.forEach(function (w) { w.draw(); });
  cols.forEach(function (c) {
    var d = c.d, e = c.el;
    e.style.width = '';
    if (d.t === 'buffer') {
      var h = ({ big: P.gapBig, mid: P.gapMid, sml: P.gapSml })[e.dataset.gap];
      e.style.height = h + 'px';
      e.style.setProperty('--gap-h', h + 'px');
      return;
    }
    e.style.height = '';
    e.style.setProperty('--room', '');
    if (d.t === 'title') {
      var w = vw - 40;
      var u = P.col / 340;
      e.style.setProperty('--ttl',
        Math.max(22 * u, Math.min(P.ttl[1] * u, w / 1531 * 60)).toFixed(1) + 'px');
    }
  });
}

/* ── ход ленты ───────────────────────────────────────────────────────
   Две динамики. Колесо ведёт ленту догоном: цель прыгает, лента идёт за
   ней с экспоненциальным отставанием (приём 15, у догона нет начала и
   конца — там работает отставание, кривая неуместна). Клавиши, переход
   по адресу фрагмента и притяжение к колонке — проезд: у него есть
   начало и конец, поэтому он едет по кривой из слота панели. */
var EASES = {
  'линейный': function (t) { return t; },
  'разгон': function (t) { return t * t * t; },
  'торможение': function (t) { return 1 - Math.pow(1 - t, 3); },
  'плавный': function (t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; },
  'квадрат': function (t) { return t * t; }
};
var BEZ_APPROX = {
  'линейный': [0.25, 0.25, 0.75, 0.75],
  'разгон': [0.32, 0, 0.67, 0],
  'торможение': [0.33, 1, 0.68, 1],
  'плавный': [0.65, 0, 0.35, 1],
  'квадрат': [0.45, 0, 0.75, 0.3]
};
function cubicBezierY(b, t) {
  var x1 = b[0], y1 = b[1], x2 = b[2], y2 = b[3], sT = t;
  for (var i = 0; i < 8; i++) {
    var x = 3 * (1 - sT) * (1 - sT) * sT * x1 + 3 * (1 - sT) * sT * sT * x2 + sT * sT * sT;
    var dx = 3 * (1 - sT) * (1 - sT) * x1 + 6 * (1 - sT) * sT * (x2 - x1) + 3 * sT * sT * (1 - x2);
    if (Math.abs(dx) < 1e-6) break;
    sT -= (x - t) / dx;
    if (sT < 0) sT = 0; if (sT > 1) sT = 1;
  }
  return 3 * (1 - sT) * (1 - sT) * sT * y1 + 3 * (1 - sT) * sT * sT * y2 + sT * sT * sT;
}
function evalEase(name, bez, t) {
  if (t <= 0) return 0;
  if (t >= 1) return 1;
  if (name === 'bezier') return cubicBezierY(bez, t);
  return (EASES[name] || EASES['плавный'])(t);
}

var cur = 0, tgt = 0, raf = 0, ride = null;
var lastPush = 0;          // когда ленту последний раз вели вбок
var mx = null, my = null;  // где стоит курсор
var liveCol = null;        // колонка под курсором, которая ожила

function tick() {
  if (ride) {
    var p = P.ride > 0 ? (performance.now() - ride.t0) / P.ride : 1;
    if (p >= 1) { cur = tgt = ride.to; ride = null; }
    else cur = ride.from + (ride.to - ride.from) * evalEase(P.rideEase, P.rideBez, p);
  } else {
    var k = 1 - P.lag / 100;
    cur += (tgt - cur) * (k <= 0 ? 1 : k);
    if (Math.abs(tgt - cur) < 0.5) cur = tgt;
  }
  strip.scrollLeft = cur;
  if (ride || cur !== tgt) { raf = requestAnimationFrame(tick); return; }
  raf = 0;
  if (flag(P.snap)) snap();
}
function run() { if (!raf) raf = requestAnimationFrame(tick); }
function maxScroll() { return Math.max(0, strip.scrollWidth - strip.clientWidth); }
function hold(x) { return Math.max(0, Math.min(maxScroll(), x)); }
function push(dx) { ride = null; lastPush = performance.now(); tgt = hold(tgt + dx); run(); }
function rideTo(x) { x = hold(x); lastPush = performance.now(); ride = { from: cur, to: x, t0: performance.now() }; tgt = x; run(); }

/* Пока лента едет, колонки с картинками пролетают мимо: колесо остаётся
   горизонтальным, даже если курсор пересёк такую колонку. Вертикаль в
   колонке просыпается только на остановке — лента стоит, пауза после
   последнего хода вбок больше «wake», курсор на этой колонке. Первый же
   ход вбок снова её усыпляет. Читателя не разворачивает посреди движения:
   переключение стало намерением, а не случайностью. */
function rested() {
  return !ride && cur === tgt && performance.now() - lastPush >= P.wake;
}
/* Колонку под курсором ищем попаданием точки, а не запоминаем по наведению:
   лента едет под неподвижным курсором, и запомненное окно тут же врёт. */
/* Колонка под курсором. Ищется не попаданием в саму колонку, а по оси
   ленты: между колонками лежит межколонник, над ним нет ни одной колонки,
   и курсор там проваливался в пустоту — колонка гасла на полпути к соседу.
   Межколонник делится пополам, каждая половина принадлежит своей колонке;
   пустых мест над лентой не остаётся, а сам межколонник не трогаем. */
function colAt() {
  if (mx == null || mobile) return null;
  var hit = document.elementFromPoint(mx, my);
  if (hit && hit.closest && (hit.closest('.st-panel') || hit.closest('.st-gear'))) return null;
  var x = mx + strip.scrollLeft, half = P.gut / 2;
  for (var i = 0; i < cols.length; i++) {
    if (x >= cols[i].l - half && x <= cols[i].rr + half) return cols[i].el;
  }
  return null;
}
function live(c) { return liveCol === c.el; }
function awake(sc) {
  return rested() && !!liveCol && liveCol.contains(sc);
}

strip.addEventListener('wheel', function (e) {
  if (mobile) return;
  if (e.target.closest && e.target.closest('.st-panel')) return;   // панель скроллится сама
  var sc = e.target.closest && e.target.closest('.scroller');
  if (sc && awake(sc) && Math.abs(e.deltaY) >= Math.abs(e.deltaX)) {
    var top = sc.scrollTop <= 0, bot = sc.scrollTop >= sc.scrollHeight - sc.clientHeight - 1;
    if ((e.deltaY < 0 && !top) || (e.deltaY > 0 && !bot)) return;  // вертикаль внутри колонки
  }
  e.preventDefault();
  var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  push(d * P.wheel / 100);
}, { passive: false });

document.addEventListener('pointermove', function (e) { mx = e.clientX; my = e.clientY; });
document.addEventListener('pointerleave', function () { mx = my = null; });

strip.addEventListener('scroll', function () {
  if (Math.abs(strip.scrollLeft - cur) > 2) { cur = tgt = strip.scrollLeft; }
  measure();
});

function snap() {
  var best = null, bd = 1e9;
  stops.forEach(function (st) {
    var d = Math.abs(st.l - cur);
    if (d < bd) { bd = d; best = st.l; }
  });
  if (best != null && bd > 1 && bd < P.col) rideTo(best);
}

window.addEventListener('keydown', function (e) {
  if (mobile || (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName))) return;
  var step = window.innerWidth * 0.9;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { rideTo(cur + step); e.preventDefault(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { rideTo(cur - step); e.preventDefault(); }
  else if (e.key === 'Home') { rideTo(0); e.preventDefault(); }
  else if (e.key === 'End') { rideTo(maxScroll()); e.preventDefault(); }
});

/* ── ход + адрес фрагмента ── */
var lastHash = '', stops = [];   // stops — координаты колонок, снятые при раскладке
function measure() {
  if (mobile) return;
  var m = maxScroll();
  rail.style.width = (m ? (strip.scrollLeft / m * 100) : 0).toFixed(2) + '%';
  var x = strip.scrollLeft + 1;
  for (var k = 0; k < stops.length; k++) {
    if (stops[k].r > x) {
      if (stops[k].id !== lastHash) {
        lastHash = stops[k].id;
        history.replaceState(null, '', '#' + stops[k].id);
      }
      return;
    }
  }
}

/* ── ссылка на фрагмент по клику в индекс ── */
strip.addEventListener('click', function (e) {
  var n = e.target.closest && e.target.closest('.idx[data-id]');
  if (!n) return;
  var url = location.origin + location.pathname + '#' + n.dataset.id;
  (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(show, function () {
    prompt('Ссылка на фрагмент:', url);
  });
  function show() { toast.classList.add('on'); setTimeout(function () { toast.classList.remove('on'); }, 1200); }
});

var startHash = location.hash.slice(1);   // адрес, с которым открыли страницу
function gotoHash(h, glide) {
  if (h == null) h = location.hash.slice(1);
  if (!h) return;
  var t = document.getElementById(h);
  if (!t) return;
  if (mobile) { t.scrollIntoView({ behavior: glide ? 'smooth' : 'auto' }); return; }
  if (glide) { rideTo(t.offsetLeft); return; }
  cur = tgt = hold(t.offsetLeft); strip.scrollLeft = cur; measure();
}
window.addEventListener('hashchange', function () { gotoHash(null, true); });

/* Держим живую колонку, пока курсор в её половине межколонника — тот же
   ограничитель дребезга, что и в colAt, только по живой геометрии. */
function inside(el, x) {
  var sx = x + strip.scrollLeft, half = P.gut / 2;
  for (var i = 0; i < cols.length; i++) if (cols[i].el === el)
    return sx >= cols[i].l - half && sx <= cols[i].rr + half;
  return false;
}

/* ── панель ── */
StendPanel.build({
  storageKey: 'gorizont-params',
  params: P,
  defaults: DEFAULTS,
  eases: EASES,
  evalEase: evalEase,
  bezApprox: BEZ_APPROX,
  defs: [
    ['h', 'Сетка'],
    ['col', 'Колонка, px', 200, 560, 5],
    ['gut', 'Межколонник, px', 0, 90, 1],
    ['pad', 'Поле сверху и снизу, px', 0, 120, 1],
    ['ttl', 'Кегль титула, px', 'koridor', 20, 90, 1],
    ['h', 'Картинка'],
    ['figFit', 'Выше экрана', 'segment', [
      ['free', 'уже'], ['step', 'пролёт'], ['scroll', 'ход']]],
    ['h', 'Поле роста'],
    ['zoom', 'В середине крупнее, %', 100, 180, 1],
    ['reach', 'Ширина поля, колонок', 0.2, 5, 0.1],
    ['zoomEase', 'Спад поля', 'ease'],
    ['zoomLag', 'Инерция поля, %', 0, 92, 1],
    ['', 'Профиль поля', 'datchik', {
      fn: function (x) { return 100 + (P.zoom - 100) * dolya(x * P.reach, P.reach); },
      x: [0, 1], vysota: 52
    }],
    ['h', 'Ход'],
    ['wheel', 'Колесо, %', 20, 300, 5],
    ['wake', 'Колесо колонке после паузы, мс', 0, 1500, 10],
    ['lag', 'Инерция, %', 0, 96, 1],
    ['ride', 'Проезд к фрагменту, мс', 0, 2000, 10],
    ['rideEase', 'Кривая проезда', 'ease'],
    ['snap', '', 'toggle', ['Притягивать к колонке', 'Не притягивать к колонке']],
    ['h', 'Цвет'],
    ['palette', 'Палитра', 'palitra', [
      ['osnova', 'Серо-синий на белом', { bg: '#ffffff', ink: '#878c97' }],
      ['chern', 'Синь-чёрный на белом', { bg: '#ffffff', ink: '#0a0f1a' }],
      ['noch', 'Ночь', { bg: '#0a0f1a', ink: '#c9cdd6' }]]],
    ['bg', 'Фон', 'color'],
    ['ink', 'Цвет макета', 'color'],
    ['h', 'Мобайл'],
    ['mob', 'Порог, px', 420, 1100, 10],
    ['', 'Пропуск, px', 'para', [
      ['gapBig', 'раздел', 0, 300, 4],
      ['gapMid', 'группа', 0, 300, 4],
      ['gapSml', 'картинка', 0, 300, 4]]],
    ['h', 'Разметка'],
    ['dbg', '', 'toggle', ['Показать границы колонок', 'Скрыть границы колонок']],
    ['dbgbuf', '', 'toggle', ['Показать буферы', 'Скрыть буферы']],
    ['', 'Правки', 'otkat']
  ],
  desc: {
    col: 'Базовая ширина колонки. Всё широкое считается пролётами: N·колонка + (N−1)·межколонник. Она же модуль набора — кегли и отбивки идут от неё.',
    gut: 'Расстояние между колонками. Входит в пролёт широких блоков, а его половина с каждой стороны отдана колонке под наведение.',
    ttl: 'Кегль титула течёт от ширины его колонки внутри этих границ. Обе — решение глаза, принятое заранее.',
    figFit: 'Что делать, когда картинка в высоту экрана не влезает. «Уже» — ширина сходит с шага колонки, зато картинка видна целиком. «Пролёт» — кратность держится, картинка целая, но мельче. «Ход» — ширина как в макете, лишнее уходит в вертикальную прокрутку колонки.',
    wake: 'Сколько лента должна простоять, чтобы колонка под курсором забрала себе колесо и крутилась по вертикали. Пока едем — колонки с картинками пролетают мимо. Роста это не касается: он идёт всегда.',
    zoom: 'Насколько крупнее набор в самой середине поля. Растёт весь набор разом, поэтому мера строки в знаках не меняется. Дескрипторы держат свой кегль. 100 — поле выключено.',
    reach: 'Докуда достаёт поле, считая от края колонки в ширинах колонки. Чем шире, тем больше соседей подрастает заодно и тем мягче переход.',
    zoomEase: 'Форма спада: как доля падает от середины поля к его краю. «Своя (безье)» открывает редактор.',
    zoomLag: 'Насколько лениво ширина догоняет закон. 0 — колонка стоит ровно там, где велит поле.',
    wheel: 'Сколько ленты проходит за один щелчок колеса.',
    lag: 'Чем больше, тем дольше лента догоняет колесо.',
    ride: 'Сколько едет лента, когда её зовут клавишей, адресом фрагмента или притяжением. 0 — сразу.',
    rideEase: 'Кривая этого проезда.',
    snap: 'После остановки лента подтягивается к ближайшему краю колонки.',
    palette: 'Цвет в макете один: им набран текст, индексы, подписи, титул и линии схем. Волосяные линии датчиков подмешаны к фону из него же.',
    mob: 'Уже этой ширины лента разворачивается в вертикаль.',
    dbg: 'Пунктир по границе каждой колонки — видно, как ложится пролёт.',
    dbgbuf: 'Заливка пустых колонок-буферов, как в макете.'
  }
});

/* панель меняет параметры молча — следим за ними и перекладываем */
var sig = '', lastLook = 0;
/* Колонка ожила: набор в ней крупнее, и она же забирает колесо, если ей
   есть куда крутиться. Ограничитель дребезга (П7): пока точка курсора
   внутри уже живой колонки, живой остаётся она — иначе выросшая колонка
   сдвигала бы соседей под неподвижным курсором и они бы перемигивались. */
function setLive(el) {
  if (el === liveCol) return;
  var was = liveCol;
  if (was) was.classList.remove('live');
  liveCol = el;
  if (liveCol) liveCol.classList.add('live');
}
(function watch() {
  var s = [P.col, P.gut, P.pad, P.mob, P.figFit, P.dbg, P.dbgbuf,
           P.gapBig, P.gapMid, P.gapSml,
           P.bg, P.ink, P.zoom, String(P.ttl)].join(',');   // reach/zoomEase/zoomLag поле читает само
  if (s !== sig) { sig = s; layout(); }
  polе();
  var now = performance.now();
  if (!rested()) { setLive(null); lastLook = 0; }
  else if (now - lastLook > 90) {
    lastLook = now;
    if (!(liveCol && mx != null && inside(liveCol, mx))) setLive(colAt());
  }
  requestAnimationFrame(watch);
})();

/* ── пуск ── */
build();
layout();
gotoHash(startHash);
measure();
var rz = 0;
window.addEventListener('resize', function () {
  if (rz) return;                       // тянут за угол окна — считаем раз в кадр
  rz = requestAnimationFrame(function () { rz = 0; layout(); measure(); });
});
window.addEventListener('load', function () { layout(); gotoHash(startHash); measure(); });
document.fonts && document.fonts.ready.then(function () { layout(); measure(); });
</script>
</body>
</html>
