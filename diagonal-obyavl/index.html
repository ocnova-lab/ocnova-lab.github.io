<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ─────────────────────────────────────────────────────────────────
     Диагональная полоса — лента набора едет по оси от угла к углу.

     Смотрит: на окно (длина и наклон оси считаются от его сторон),
     на курсор (кластер сот идёт догоном) и на протяжку (лента везётся
     драгом и колесом).
     Реагирует: плавно — ход ленты и догон сот идут кривыми-изингами;
     щелчком — смена варианта композиции и цветового профиля.
     Законы: коридор (кегль и кернинг текут между границами clamp),
     доля (шаг ряда и модуль строки берутся от стороны окна),
     догон (сота тянется за курсором с ограничителем связности).
     Приёмы: «вёрстка по осям» (текст на траектории), сотовое меню из
     стенда «Hi Five», курсор-прицел цветом профиля.

     Адрес: ?lang=ru|en — язык ленты, ?panel — панель раскрыта сразу,
     ?reset=1 — сброс сохранённых ручек.
     ───────────────────────────────────────────────────────────────── -->
<title>Диагональная полоса — стенд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&family=Roboto+Mono:ital,wght@1,100..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/panel.css">
<style>
  /* ────────────────────────────────────────────────────────────────
     Диагональная полоса текста — по референсу конверта
     General Purpose Records (дизайн Luke Brown).

     Устройство: строки горизонтальные, левый край каждой лежит
     на диагонали экрана — от левого верхнего угла к правому нижнему.
     Скролл везёт текст вдоль этой диагонали, текст зациклен.
     На второй оси — заголовки смысловых частей; каждый абзац
     предваряется меткой «(N)» на той же оси.
     ──────────────────────────────────────────────────────────────── */
  /* шрифты едут с самим сайтом — у всех зрителей та же гарнитура,
     что у Сергея локально (оси wght/wdth работают одинаково везде) */
  @font-face{
    font-family:'Pragmatica Next VF';
    src:url('/fonts/PragmaticaNextVF.woff') format('woff');
    font-weight:100 900;
    font-stretch:50% 100%;
    font-display:swap;
  }
  @font-face{
    font-family:'Even Mono';
    src:url('/fonts/EvenMono-Regular.woff') format('woff');
    font-weight:400;
    font-style:normal;
    font-display:swap;
  }
  *, *::before, *::after{ box-sizing:border-box; }
  html, body{ margin:0; height:100%; }
  body{
    background:#fff; color:#000;
    background-size:cover; background-position:center; background-repeat:no-repeat;
    overflow:hidden; overscroll-behavior:none; touch-action:none;
    /* Прагматика — если стоит на машине; иначе вариативный Roboto Flex */
    font-family:'Pragmatica Next VF','Roboto Flex','Helvetica Neue',Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    user-select:none; -webkit-user-select:none;
    /* курсор-прицел: полотно кликабельно целиком (клик раскрывает соты),
       поэтому курсор и есть подсказка. Рисунок плюса собирается в JS
       цветами профиля и приезжает переменной --cur; crosshair — запас
       до первого кадра и на случай, если data-URI курсор не принят */
    cursor:var(--cur, crosshair);
  }
  body.dragging{ cursor:grabbing; }
  /* --trk — живой кернинг: шкала от покоя к разгону и обратно;
     --trk0 — кернинг покоя (по нему же меряются переносы);
     строка растёт вправо от левого края */
  #band{ position:fixed; inset:0; z-index:1; letter-spacing:0.01em; --trk:0.01em; --trk0:0.01em; }
  .ln{
    position:absolute; left:0; top:0;
    width:var(--colw, 340px);
    text-align:left;
    white-space:nowrap;
    will-change:transform;
    /* высотный масштаб кегля крутится вокруг левого края — строка
       не сходит с оси и не гуляет по вертикали */
    transform-origin:0 50%;
    letter-spacing:var(--trk);
    color:var(--txc, #000);
  }
  /* ось номеров: капс; толщина и кернинг — ручки секции «Ось номеров»
     (--numw/--numtrk ставит relayout); в разгоне кернинга не участвует;
     у цифровых меток .ln.dig свой вес — правило ниже перебивает */
  .ln.num{ font-size:var(--numsz, 1em); letter-spacing:var(--numtrk, 0em); font-weight:var(--numw, 700); text-transform:uppercase; color:var(--numc, #000); }
  /* цифры — Even Mono (локальный у Сергея; у зрителей Roboto Mono):
     medium, италик, кегль на 3 меньше основного (--dg считает relayout);
     толщина гротеска на моно не давит */
  .ln.dig{
    font-family:'Even Mono', 'Roboto Mono', Georgia, monospace;
    font-weight:var(--digw, 500);
    font-style:italic;
    font-size:var(--dg, 1em);
    letter-spacing:var(--digtrk, 0em);
  }
  /* плашки: прямоугольники в строчных слотах; цвет ВСЕГДА оси номеров —
     и у тех, что сидят на текстовой оси (правило Сергея 2026-08-06) */
  .ln.rect{ width:150px; height:12px; background:currentColor; color:var(--numc, #000); }
  /* выделенные слова — свой цвет из панели («Цвет выделений») */
  .ln .hl{ color:var(--hlc, #fff); }
  /* кликабельная строка (контакт): подчёркивание и курсор */
  .ln.link{ text-decoration:underline; text-underline-offset:0.15em; cursor:pointer; }
  .meas{ letter-spacing:var(--trk0); } /* линейка меряет спокойный набор */
  /* невидимая строка-линейка: в ней меряются слова для переноса */
  .meas{ position:absolute; left:0; top:0; visibility:hidden; white-space:pre; }
  /* степпер числа вершин оси */
  /* Г6, Г9: счёт вершин — общий степпер ядра (.st-stepper), а не свои
     кнопки врозь. Здесь остаётся только место органа в строке. */
  .st-panel .ax-pts{ margin-left:auto; }

  /* цвет оси/фона — образец, открывающий системную палитру */
  .st-panel .ax-colors{ display:flex; justify-content:flex-end; }
  /* свотч рисует ядро (.st-svotch) — свои стили нативного инпута сняты */
  .st-panel .ax-colors select{ margin-right:8px; }
  /* градиент оси: полоса с двумя стопами, как в графических редакторах */
  .st-panel .ax-grad{ display:flex; gap:8px; align-items:center; margin:2px 0 10px; }
  /* цвет стопа — свотч ядра (.st-svotch), нативного инпута здесь больше нет */
  .st-panel .ax-grad .st-svotch{ flex:none; }
  .st-panel .ax-grad-strip{
    position:relative; flex:1; height:14px; border-radius:7px;
    box-shadow:inset 0 0 0 1px rgba(127,127,127,.35);
    cursor:pointer; touch-action:none;
  }
  .st-panel .ax-grad-strip .stop{
    position:absolute; top:50%; width:14px; height:14px; border-radius:50%;
    border:2.5px solid #fff; box-shadow:0 0 0 1.5px rgba(0,0,0,.45);
    transform:translate(-50%,-50%); cursor:ew-resize;
  }
  .st-panel .ax-grad-strip .stop.sel{
    box-shadow:0 0 0 2px var(--st-accent, #0A84FF);
  }
  .st-panel .ax-colors input[type=color]::-webkit-color-swatch{
    border:1.5px solid rgba(255,255,255,.5); border-radius:5px;
  }
  /* редактор оси: холст с пропорциями экрана, живёт в панели */
  .st-panel canvas.axis-ed{
    display:block; width:calc(100% - 24px); height:auto;
    aspect-ratio:600/380;
    margin:4px auto 12px; border-radius:8px;
    touch-action:none; cursor:crosshair;
  }
  /* кнопки угла — без теней; шестерёнка и язык по умолчанию белые
     с тёмно-серой графикой (слово Сергея 2026-08-07); у кнопок
     вариантов фон и буква инлайном — они этот белый перебивают */
  /* панель и кнопки угла — над сотовым меню */
  .st-panel{ z-index:50; }
  .st-tip{ z-index:51; }
  .st-gear{
    z-index:50;
    box-shadow:none;
    border:none;
    background:#ffffff;
  }
  .st-gear:hover{ background:#f2f2f2; }
  .st-gear svg{ stroke:#4a4a4a; }
  .st-gear svg circle{ fill:#ffffff; }
  /* кнопка языка — рядом с шестерёнкой, тот же круглый вид */
  .lang-btn{
    left:56px;
    color:#4a4a4a;
    font:600 11px/1 -apple-system,"Helvetica Neue",Arial,sans-serif;
    letter-spacing:.04em;
  }
  /* кнопка «Цвет» — третья в ряду: живой свотч текущего профиля
     (CSS-переменные --txc/--bgc с body); меню профилей падает вверх */
  .prof-btn{ left:100px; }
  .prof-btn .dot{
    width:14px; height:14px; border-radius:50%;
    background:var(--bgc, #ffffff);
    border:2px solid var(--txc, #141414);
    box-sizing:border-box;
  }
  .prof-menu{
    position:fixed; left:100px; bottom:56px; z-index:52;
    display:none; min-width:150px;
    background:#ffffff; border-radius:12px; padding:6px;
  }
  .prof-menu.open{ display:block; }
  .prof-item{
    display:flex; align-items:center; gap:10px;
    width:100%; padding:8px 10px; border:none; background:none;
    border-radius:8px; cursor:pointer; text-align:left;
    font:500 13px/1 -apple-system,"Helvetica Neue",Arial,sans-serif;
    color:#4a4a4a;
  }
  .prof-item:hover{ background:#f2f2f2; }
  .prof-item .sw{
    width:16px; height:16px; border-radius:50%;
    box-sizing:border-box; flex:none;
  }
  .prof-item.sel{ font-weight:700; }
  /* режим лепки: ось редактируется прямо на экране поверх живой ленты */
  #axisScreen{
    position:fixed; inset:0; z-index:40; width:100vw; height:100vh;
    cursor:crosshair; touch-action:none;
  }
  /* ── ВЕРХНИЙ РЯД ЭКРАННОЙ ЛЕПКИ (правка Сергея 04.09) ──────────────
     Инструмент и выход стоят рядом, одним рядом в правом верхнем углу.
     Прежде «гнуть» жила в левом нижнем — там же, где шестерня панели,
     язык и меню стенда, и капсула пряталась под ними. Ряд держит зазор 8
     и общую среднюю линию; «гнуть» — ЧИП ЯДРА (Г9), своей капсулы у неё
     больше нет. */
  .axis-verh{ position:fixed; top:16px; right:16px; z-index:41;
    display:flex; align-items:center; gap:8px; }
  .axis-done{
    padding:10px 18px; border:none; border-radius:999px;
    background:#ffffff; color:#4a4a4a; cursor:pointer;
    font:600 13px/1 -apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  .axis-done:hover{ background:#f2f2f2; }
  /* На экране чип стоит поверх макета, а не на карточке панели: своя
     подложка и размытие, чтобы читался на любой ленте. Высота остаётся
     чиповой — 22 по Г8. */
  .axis-verh .st-chip{ background:rgba(28,28,32,.86); border-color:transparent;
    box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  /* Кнопка внутри КАРТОЧКИ, а не в подвале панели: там у кнопок свой ритм
     (14 сверху, 2 снизу — они идут стопкой, и низ одной есть верх другой).
     Здесь такого ритма нет, и двойка снизу прижимала кнопку к кромке: 19 px
     сверху против 3 снизу (поймано Сергеем 03.09). Воздух вокруг неё —
     ровно 10, как воздух в начале кластера. */
  .st-panel .ax-screen{ margin-top:0; margin-bottom:10px; }
  /* ── КНОПКА «ГНУТЬ» ЖИВЁТ НА ХОЛСТЕ (правка Сергея 03.09) ──────────
     Инструмент стоит там, где работает рука, а не строкой выше: тянешься
     к линии — тянешься и к режиму. Левый нижний угол холста и тот же угол
     экрана в полноэкранной лепке: одно место в обоих окнах, привычка руки
     одна. Г9 (04.09): в панели это ЧИП ЯДРА (.st-chip), своей кнопки больше
     нет — от неё осталось только место на холсте: отступ от кромки 8, поле
     малого органа по Г8. На экране стиль чипа ядра не действует (он живёт
     под .st-panel), и капсула повторена своей: высота 34 — цель под руку
     вдали от панели. Это Г9-хвост ядра, не стенда. */
  /* Холст держит вертикаль кнопок панели — 14 по бокам, не 12 (П17:
     рифмовка). Воздух сверху и снизу один: 10. */
  .st-panel .axis-obl{ position:relative; margin:10px 14px; }
  /* Пропорция холста — полтора экрана в ширину при экране в высоту (ED_X0…ED_X1),
     как у прежнего буфера 600×380; сам буфер и dpr ставит ядро */
  .st-panel .axis-obl canvas.axis-ed{ display:block; width:100%; aspect-ratio:600/380; margin:0; }
  .st-panel .axis-obl .st-chip.axis-gnut{ position:absolute; left:8px; bottom:8px; z-index:2; }
  /* поле снимка настроек: видно глазами, что именно скопировано */
  /* ── ПОЛЕ СНИМКА (правки Сергея 03.09) ────────────────────────────
     По ширине КНОПОК, а не панели: оно стоит в их ряду и обязано держать
     ту же вертикаль — иначе ряд рвётся. Полоса прокрутки — только бегунок,
     без дорожки и без стрелок: дорожка белой лентой перебивала и текст, и
     кнопки, а стрелка внизу давала цель, за которой никто не тянется.
     Уголок тяги снят вместе с resize: высота поля — закон, а не настроение. */
  .st-panel .snap-obl{ position:relative; margin: 6px 14px 0; }
  .st-panel .snap-box{
    display:block; width:100%; height:120px;
    box-sizing:border-box; padding:6px 44px 6px 8px; border-radius:8px;
    border:1px solid rgba(255,255,255,.12); background:rgba(0,0,0,.35);
    color:#dcdcdc; font:400 10px/1.35 ui-monospace,Menlo,Consolas,monospace;
    resize:none;
    scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.35) transparent;
  }
  .st-panel .snap-box::-webkit-scrollbar{ width:8px; }
  .st-panel .snap-box::-webkit-scrollbar-track{ background:transparent; }
  .st-panel .snap-box::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.32); border-radius:4px;
    border:2px solid transparent; background-clip:content-box;
  }
  .st-panel .snap-box::-webkit-scrollbar-thumb:hover{ background:rgba(255,255,255,.5); background-clip:content-box; }
  /* стрелки полосы: цель, за которую никто не берётся */
  .st-panel .snap-box::-webkit-scrollbar-button{ display:none; height:0; width:0; }
  .st-panel .snap-box::-webkit-scrollbar-corner{ background:transparent; }
  /* закрыть — крестик в углу поля, цель 22 по Г8 */
  /* крестик левее полосы прокрутки: она идёт по самому краю поля,
     и на одной вертикали они спорили за место */
  .st-panel .snap-x{
    all:unset; box-sizing:border-box; position:absolute; top:6px; right:14px;
    width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center;
    border-radius:50%; cursor:pointer; color:rgba(255,255,255,.6);
    background:rgba(28,28,32,.9); box-shadow:inset 0 0 0 .5px rgba(255,255,255,.16);
    font:13px/1 -apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  .st-panel .snap-x:hover{ color:#fff; }
  .st-panel .snap-x:focus-visible{ outline:2px solid #0A84FF; outline-offset:2px; }
  /* ── сотовое меню вариантов (перенос стенда «Hi Five») ──
     клик в любой точке экрана раскрывает шесть гекс-ячеек — по ячейке
     на вариант композиции; сота НЕПРОЗРАЧНА, в цветах текущего профиля */
  .hex-cell{
    position:fixed; left:0; top:0; z-index:30; pointer-events:none;
    width:139px; height:161px;
  }
  .hex-cell.selected{ z-index:32; }
  /* сота: внешний гекс — обводка вторым цветом (цвет текста),
     внутренний гекс на 2px меньше — заливка цветом фона; тени нет */
  .hex-in{
    position:relative; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    font:600 15px/1 -apple-system,"Helvetica Neue",Arial,sans-serif;
    letter-spacing:.06em;
    background:var(--txc, #141414);
    color:var(--txc, #141414);
  }
  .hex-fill{ position:absolute; inset:2px; background:var(--bgc, #ffffff); }
  .hex-in > span{ position:relative; z-index:1; }
  /* ховер — вуаль цветом буквы, размер соты не меняется */
  .hex-in::after{
    content:''; position:absolute; inset:0;
    background:currentColor; opacity:0;
    transition:opacity .15s ease;
  }
  .hex-cell.hover .hex-in::after{ opacity:.12; }
  .hex-in .mark{
    position:absolute; left:50%; bottom:28%; width:5px; height:5px;
    margin-left:-2.5px; border-radius:50%; background:currentColor; opacity:0;
    z-index:1;
  }
  .hex-cell.selected .mark{ opacity:1; }
  /* сота логотипа: сама сота видна — сплошная заливка цветом фона,
     БЕЗ обводки (внешний гекс того же цвета, что и заливка), знак по
     центру цветом текста; ховера у неё нет */
  .hex-cell.logo .hex-in{ background:var(--bgc, #ffffff); color:var(--txc, #141414); }
  .hex-cell.logo .hex-fill{ background:var(--bgc, #ffffff); }
  .hex-cell.logo .hex-in::after,
  .hex-cell.logo.hover .hex-in::after{ opacity:0; }
  /* знак — поверх заливки: .hex-fill позиционирована абсолютно и,
     став непрозрачной, накрывала бы его */
  .hex-cell.logo svg{ position:relative; z-index:1; height:17.5%; width:auto; display:block; }
  /* активная сота — кнопка выхода: вместо буквы надпись «закрыть»,
     цвета ИНВЕРТИРОВАНЫ против остальных сот (заливка цветом текста,
     обводка и надпись — цветом фона) — выход отличим с одного взгляда */
  .hex-cell.close .hex-in{
    font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    background:var(--bgc, #ffffff); color:var(--bgc, #ffffff);
  }
  .hex-cell.close .hex-fill{ background:var(--txc, #141414); }
  .hex-cell.close .mark{ opacity:0; }
  /* кнопка «Меню» — четвёртая в ряду угловых кнопок, шаг ряда 44px
     (12 → 56 → 100 → 144); открывает сотовое меню вариантов, которое
     раньше открывалось цветным кружком */
  .menu-btn{ left:144px; }
  .menu-btn svg{ width:18px; height:18px; }
  .menu-btn.is-open svg{ opacity:.45; }
</style>
</head>
<body>
<div id="band"></div>

<script src="/panel.js"></script>
<script src="/panel-lib/uzly.js"></script>
<script src="/panel-lib/segment.js"></script>
<script src="/panel-lib/obyavlenie.js"></script>
<script>
(function () {
  'use strict';

  // ── текст: редакция Сергея 2026-08-05 (мастер — заметка «Диагональная
  //    полоса — текст менторской группы» в Хранилище). Смысловая часть =

  // ── кнопка «Снимок всех ручек»: снимает текущие параметры в
  // буфер, чтобы фиксировать их как умолчания и собирать пресеты.
  // С 2026-08-09 клик ВСЕГДА раскрывает поле со снимком и пишет в
  // подпись, ЧЕЙ это снимок (вариант и профиль) — буфер обмена может
  // молча не обновиться, и тогда в работу уходит чужая композиция ──
  (function buildCopyBtn() {
    var btn = document.createElement('button');
    btn.className = 'st-reset';
    btn.textContent = 'Снимок всех ручек';
    btn.title = 'Снимок ВСЕХ ручек стенда одним объектом — и в буфер, и в поле ниже (буфер может молча не обновиться, поле показывает правду). Отсюда собирают новый вариант или профиль целиком. Не путать с «Правки для кода»: там только уведённое от основы.';
    var box = document.createElement('textarea');
    box.className = 'snap-box';
    box.spellcheck = false;
    box.readOnly = true;          // снимок читают и копируют, а не правят
    /* ПОЛЕ ЗАКРЫВАЕТСЯ (правка Сергея 03.09): открыть было чем, а закрыть
       нечем — оно висело до перезагрузки. Три двери на одно дело: крестик,
       Escape и повторный клик по той же кнопке. */
    var obl = document.createElement('div');
    obl.className = 'snap-obl';
    obl.hidden = true;
    var zakryt = document.createElement('button');
    zakryt.type = 'button'; zakryt.className = 'snap-x';
    zakryt.textContent = '\u2715';
    zakryt.title = 'закрыть снимок (Esc)';
    zakryt.setAttribute('aria-label', 'закрыть снимок');
    function spryatat() { obl.hidden = true; btn.setAttribute('aria-expanded', 'false'); }
    zakryt.addEventListener('click', spryatat);
    box.addEventListener('keydown', function (e) { if (e.key === 'Escape') { spryatat(); btn.focus(); } });
    obl.appendChild(box); obl.appendChild(zakryt);
    btn.setAttribute('aria-expanded', 'false');
    function whose() {
      var vn = P.comp === 'own' ? 'своя' : 'вариант ' + String(P.comp).toUpperCase();
      var pf = 'свой';
      PROFILES.forEach(function (p) { if (p[0] === P.prof) pf = p[1]; });
      return vn + ' · ' + pf;
    }
    btn.addEventListener('click', function () {
      if (!obl.hidden) { spryatat(); return; }   // та же кнопка и закрывает
      var txt = JSON.stringify(P, null, 1);
      box.value = txt;
      obl.hidden = false;
      btn.setAttribute('aria-expanded', 'true');
      box.focus();
      box.select();
      var mark = function (ok) {
        btn.textContent = (ok ? 'Скопировано: ' : 'Выдели и скопируй: ') + whose();
        setTimeout(function () { btn.textContent = 'Снимок всех ручек'; }, 4000);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(function () { mark(true); }, function () { mark(false); });
      } else {
        mark(false);
      }
    });
    /* «Скачать настройки файлом» снята (Сергей 04.09). Она была страховкой
       на случай, когда буфер обмена молча не обновляется, — но с тех пор у
       кнопки снимка появилось ПОЛЕ с тем же текстом: правду видно глазами и
       можно выделить руками. Две двери в одно место, вторая лишняя. */
    // содержимое панели живёт в теле (.st-telo), а не в самой панели
    var host = pan.telo || pan.panel;
    var rst = host.querySelector('.st-reset');
    if (rst && rst.parentNode === host) {
      host.insertBefore(btn, rst);
      host.insertBefore(obl, rst);      // поле снимка — в обёртке с крестиком
    } else {
      host.appendChild(btn);
      host.appendChild(obl);
    }
  })();

  // ── кнопка языка: рядом с шестерёнкой, круглая, показывает целевой
  // язык (на русской ленте видно «EN» и наоборот); тема — с шестерёнки ──
  (function buildLangBtn() {
    var gear = document.querySelector('.st-gear');
    var b = document.createElement('button');
    b.className = 'st-gear lang-btn';
    function label() {
      b.textContent = lang === 'ru' ? 'EN' : 'RU';
      b.title = lang === 'ru' ? 'English version' : 'Русская версия';
    }
    label();
    b.addEventListener('click', function () {
      lang = lang === 'ru' ? 'en' : 'ru';
      TEXT = LANGS[lang];
      try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
      label();
    });
    document.body.appendChild(b);
    if (gear && window.MutationObserver) {
      var mirror = function () {
        b.classList.toggle('st-theme-nothing', gear.classList.contains('st-theme-nothing'));
      };
      new MutationObserver(mirror).observe(gear, { attributes: true, attributeFilter: ['class'] });
      mirror();
    }
  })();

  // ── кнопка «Цвет» — третья в ряду угловых кнопок (2026-08-09,
  // слово Сергея: профили из сот — в отдельное выпадающее меню):
  // круглая, с живым свотчем текущего профиля; клик раскрывает меню
  // четырёх цветовых профилей вверх от кнопки, выбор применяет
  // профиль штатным селектом «Профиль» (бесшовный кроссфейд); клик
  // мимо или Escape закрывают; на мобильных профилей нет ──
  var profMenuGuard = function () { return false; }; // читает клик-раскрытие сот
  if (!IS_MOBILE) (function buildProfBtn() {
    var gear = document.querySelector('.st-gear');
    var b = document.createElement('button');
    b.className = 'st-gear prof-btn';
    b.title = 'Цветовой профиль';
    var dot = document.createElement('span');
    dot.className = 'dot';
    b.appendChild(dot);
    var menu = document.createElement('div');
    menu.className = 'prof-menu';
    var rows = PROFILES.map(function (p) {
      var it = document.createElement('button');
      it.className = 'prof-item';
      var sw = document.createElement('span');
      sw.className = 'sw';
      sw.style.background = p[2].bgColor;
      sw.style.border = '2px solid ' + p[2].textColor;
      var t = document.createElement('span');
      t.textContent = p[1];
      it.appendChild(sw);
      it.appendChild(t);
      it.addEventListener('click', function () {
        if (P.prof !== p[0]) {
          var sel = pan.panel.querySelectorAll('select')[1]; // второй — «Профиль»
          if (sel) {
            sel.value = p[0];
            sel.dispatchEvent(new Event('input', { bubbles: true }));
          }
        }
        hide();
      });
      menu.appendChild(it);
      return { el: it, id: p[0] };
    });
    var open = false, closedNow = false;
    function mark() {
      rows.forEach(function (r) { r.el.classList.toggle('sel', r.id === P.prof); });
    }
    function show() { mark(); menu.classList.add('open'); open = true; }
    function hide() { menu.classList.remove('open'); open = false; }
    b.addEventListener('click', function () { if (open) hide(); else show(); });
    window.addEventListener('pointerdown', function (e) {
      closedNow = false;
      if (!open) return;
      if (e.target.closest && e.target.closest('.prof-menu, .prof-btn')) return;
      hide();
      closedNow = true;
    });
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && open) hide();
    });
    profMenuGuard = function () { return open || closedNow; };
    document.body.appendChild(b);
    document.body.appendChild(menu);
    if (gear && window.MutationObserver) {
      var mirror = function () {
        b.classList.toggle('st-theme-nothing', gear.classList.contains('st-theme-nothing'));
      };
      new MutationObserver(mirror).observe(gear, { attributes: true, attributeFilter: ['class'] });
      mirror();
    }
  })();

  var curKey = '';                       // без ручки: служебная геометрия
  function setPlusCursor(ink, bg) {
    var k = ink + '|' + bg;

        // капля дольше пузыря и льдинки — её серия вдвое реже, иначе каша
        else dropSeries(ctx, t0, bus, Math.max(1, Math.round(n / 2)), tone, soft);
        return;
      }
      var buf = iceGrain(ctx);
      var nyq = ctx.sampleRate / 2.2;
      var t = t0;
      for (var i = 0; i < n; i++) {
        // трещинка: щепоть шума через узкий резонанс — чем выше Q,
        // тем звонче лёд; частота гуляет по всей ледяной полосе
        var f = 1800 * Math.pow(2, Math.random() * 2.3) * tone;
        var src = ctx.createBufferSource();
        src.buffer = buf;
        src.playbackRate.value = 0.8 + Math.random() * 0.5;
        var bp = ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = Math.min(nyq, f);
        var q = (16 + Math.random() * 20) * (1 - soft * 0.25);
        bp.Q.value = q;
        var g = ctx.createGain();
        // первая трещина громче, дальше серия осыпается; множитель по
        // добротности возвращает громкость — узкая полоса режет энергию
        var a = (0.62 / (1 + 0.75 * i)) * (0.65 + Math.random() * 0.6) * (1 + q / 6);
        var atk = 0.0004 + soft * 0.0018;
        var dec = 0.008 + soft * 0.055 + Math.random() * 0.018;
        g.gain.setValueAtTime(0.0006, t);
        g.gain.linearRampToValueAtTime(a, t + atk);
        g.gain.exponentialRampToValueAtTime(0.0006, t + atk + dec);
        src.connect(bp).connect(g).connect(master);
        src.start(t);
        // пауза до следующей трещины: рваная, мягкость растягивает
        t += (0.004 + Math.random() * 0.028) * (0.7 + soft * 0.9);
      }
    }

    // механика Догона: дальняя сота перетягивается на новую клетку
    function hstep(cq, cr) {
      var order = hcells.map(function (_, i) { return i; })
        .sort(function (a, b) { return hdist(hcells[b], [cq, cr]) - hdist(hcells[a], [cq, cr]); });
      for (var oi = 0; oi < order.length; oi++) {
        var i = order[oi];
        var rest = hcells.filter(function (_, j) { return j !== i; });
        if (connected(rest.concat([[cq, cr]]))) { hcells[i] = [cq, cr]; return true; }
      }
      return false;
    }
    function growAround(cq, cr, focus) {
      var spots = [[cq, cr]];
      var taken = {};
      taken[hkey(cq, cr)] = true;
      while (spots.length < NCELL) {
        var best = null, bestScore = Infinity;
        spots.forEach(function (s) {
          HDIRS.forEach(function (d) {
            var nq = s[0] + d[0], nr = s[1] + d[1], k = hkey(nq, nr);
            if (taken[k]) return;
            var c = centerOf(nq, nr);
            var score = (onScr(nq, nr) ? 0 : 1e6) + Math.hypot(c.x - focus.x, c.y - focus.y);
            if (score < bestScore) { bestScore = score; best = [nq, nr]; }
          });
        });
        spots.push(best);
        taken[hkey(best[0], best[1])] = true;
      }
      return spots;
    }
    function relocate(cq, cr) {
      var focus = hcells.length ? centroidPx(hcells) : centerOf(cq, cr);
      var spots = growAround(cq, cr, focus);
      var free = hels.map(function (_, i) { return i; });
      var next = new Array(NCELL);
      spots.forEach(function (s) {
        var best = -1, bd = Infinity, bi = -1;
        free.forEach(function (i, fi) {
          var d = hcells[i] ? hdist(hcells[i], s) : i;
          if (d < bd) { bd = d; best = i; bi = fi; }
        });
        free.splice(bi, 1);
        next[best] = s;
      });
      hcells = next;
    }
    function hrender() {
      var sel = selIdx();
      hcells.forEach(function (c, i) {
        var p = centerOf(c[0], c[1]);
        place(hels[i].cell, p.x, p.y);
        if (i === LOGO_I) {
          hels[i].cell.className = 'hex-cell logo' + (i === hoverIdx ? ' hover' : '');
          return;
        }
        var want = i === sel ? closeWord() : LETTERS[i];
        if (hels[i].label.textContent !== want) hels[i].label.textContent = want;
        hels[i].cell.className = 'hex-cell' +
          (i === hoverIdx ? ' hover' : '') + (i === sel ? ' selected close' : '');
      });
    }

    // кнопка «Меню» в ряду угловых, следом за «Цветом» (2026-08-24):
    // цветной кружок убран, раскрытие переехало сюда. Соты встают не
    // под курсором, а над кнопкой — точка раскрытия читается заранее
    var menuBtn = document.createElement('button');
    menuBtn.className = 'st-gear menu-btn';
    menuBtn.title = 'Варианты композиции';
    menuBtn.innerHTML =
      '<svg viewBox="0 0 18 18" fill="none" stroke="#4a4a4a" stroke-width="1.6" stroke-linecap="round">' +
      '<line x1="3" y1="5" x2="15" y2="5"/><line x1="3" y1="9" x2="15" y2="9"/>' +
      '<line x1="3" y1="13" x2="15" y2="13"/></svg>';
    document.body.appendChild(menuBtn);

    function openMenu() {
      syncHexGeom();
      hexMode = 'menu';
      menuBtn.classList.add('is-open');
      var seed = targetCell(lastX, lastY);
      lastKey = hkey(seed[0], seed[1]);
      relocate(seed[0], seed[1]);
      // активный вариант встаёт под курсор
      var sel = selIdx(), e = -1;
      hcells.forEach(function (c, i) { if (c[0] === seed[0] && c[1] === seed[1]) e = i; });
      if (e >= 0 && e !== sel) {
        var t = hcells[e]; hcells[e] = hcells[sel]; hcells[sel] = t;
      }
      hoverIdx = sel;
      hels.forEach(function (el) { el.cell.style.display = ''; });
      hrender();
      hcells.forEach(function (_, i) { popNode(hels[i].inn); hclick(i * 0.02); });
    }
    function closeMenu(x, y) {
      hexMode = 'dot';
      hcells.forEach(function (c, i) { ghost(c, x, y, i); });
      hels.forEach(function (el) { el.cell.style.display = 'none'; });
      menuBtn.classList.remove('is-open');
      popNode(menuBtn);
      hclick(0.05);
    }

    // ряд угловых кнопок объявлен в CSS: край 12, шаг 44, сторона 36;
    // меню — четвёртая кнопка, поэтому центр считается, а не замеряется
    var BTN_EDGE = 12, BTN_STEP = 44, BTN_SIDE = 36, BTN_I = 3;
    menuBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      lastX = BTN_EDGE + BTN_STEP * BTN_I + BTN_SIDE / 2;
      lastY = window.innerHeight - BTN_EDGE - BTN_SIDE / 2;
      if (hexMode === 'menu') { closeMenu(lastX, lastY); return; }
      openMenu();
    });
    window.addEventListener('pointermove', function (e) {
      lastX = e.clientX; lastY = e.clientY;
      if (hexMode !== 'menu') return;
      var tc = targetCell(e.clientX, e.clientY);
      var k = hkey(tc[0], tc[1]);
      if (k === lastKey) return;
      lastKey = k;
      var before = hcells.map(function (c) { return [c[0], c[1]]; });
      var idx = -1;
      hcells.forEach(function (c, i) { if (c[0] === tc[0] && c[1] === tc[1]) idx = i; });
      if (idx >= 0) {
        // по открытым сотам курсор ходит свободно — «закрыть» стоит
        // (вторая редакция правила близости 2026-08-09); погоня
        // включается только при уходе по пустым клеткам
        hoverIdx = idx;
      } else {
        // пустая клетка: если «закрыть» отстала, под курсор тянется
        // именно она (вместо дальней соты), связность бережём
        var done = false, sc = selIdx();
        var adjacent = hcells.some(function (c) { return hdist(c, tc) === 1; });
        if (adjacent && hdist(hcells[sc], tc) > 1) {
          var rest = hcells.filter(function (_, j) { return j !== sc; });
          if (connected(rest.concat([[tc[0], tc[1]]]))) {
            hcells[sc] = [tc[0], tc[1]];
            done = true;
          }
        }
        if (!done && (!adjacent || !hstep(tc[0], tc[1]))) relocate(tc[0], tc[1]);
        hoverIdx = -1;
        hcells.forEach(function (c, i) { if (c[0] === tc[0] && c[1] === tc[1]) hoverIdx = i; });
        // после хода кластера курсор в пустоте не целится ни в кого —
        // если соседство всё же потерялось, «закрыть» встаёт свапом
        // прямо под курсор
        if (hoverIdx >= 0 && hdist(hcells[sc], tc) > 1) {
          var t = hcells[hoverIdx]; hcells[hoverIdx] = hcells[sc]; hcells[sc] = t;
          hoverIdx = sc;
        }
      }
      hrender();
      var moved = 0;
      hcells.forEach(function (c, i) {
        if (hkey(c[0], c[1]) !== hkey(before[i][0], before[i][1])) {
          ghost(before[i], e.clientX, e.clientY, i);
          popNode(hels[i].inn);
          hclick(moved * 0.015);
          moved++;
        }
      });
    });
    window.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('.st-panel, .st-gear, .prof-menu')) return;
      if (hexMode === 'menu') {
        // знак — не вариант: клик по нему просто закрывает меню
        if (hoverIdx >= 0 && hoverIdx !== LOGO_I && VARIANTS[hoverIdx][0] !== P.comp) {
          var sel = pan.panel.querySelector('select'); // первый — «Вариант»
          if (sel) {
            sel.value = VARIANTS[hoverIdx][0];
            sel.dispatchEvent(new Event('input', { bubbles: true }));
          }
        }
        closeMenu(e.clientX, e.clientY);
        return;
      }
      // режим точки: меню раскрывается кликом В ЛЮБОЙ ТОЧКЕ экрана —
      // кроме потянутой ленты, ссылки, клика, закрывшего панель или
      // выпадающее меню профилей
      if (panelWasOpen) return;
      if (profMenuGuard()) return;
      if (axisEditOn()) return; // режим лепки — соты спят
      if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;
      if (e.target.closest && e.target.closest('.ln.link')) return;
      lastX = e.clientX; lastY = e.clientY;
      openMenu();
    });
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && hexMode === 'menu') closeMenu(lastX, lastY);
    });
    window.addEventListener('resize', function () {
      if (hexMode === 'menu' && hcells.some(function (c) { return !onScr(c[0], c[1]); })) {
        var c = centroidPx(hcells);
        var t = targetCell(c.x, c.y);
        relocate(t[0], t[1]);
        hoverIdx = -1;
        hrender();
      }
    });
  })();

  // ── интерполяция многостопного градиента ──
  function gradRgbAt(stops, t) { // stops: [[позиция, [r,g,b]], ...]
    if (t <= stops[0][0]) return stops[0][1];
    var last = stops[stops.length - 1];
    if (t >= last[0]) return last[1];
    for (var gi = 1; gi < stops.length; gi++) {
      if (t <= stops[gi][0]) {
        var a = stops[gi - 1], b = stops[gi];
        var u = (t - a[0]) / Math.max(0.0001, b[0] - a[0]);
        return [
          Math.round(a[1][0] + (b[1][0] - a[1][0]) * u),
          Math.round(a[1][1] + (b[1][1] - a[1][1]) * u),
          Math.round(a[1][2] + (b[1][2] - a[1][2]) * u),
        ];
      }
    }
    return last[1];
  }
  function gradHexAt(stops, t) { // стопы с hex-цветами → hex в точке t
    var c = gradRgbAt(stops.map(function (s) { return [s[0], hexRgb(s[1])]; }), t);
    return '#' + c.map(function (v) {
      return ('0' + v.toString(16)).slice(-2);
    }).join('');
  }
  function stopsOf(base) { // стопы оси с разобранными цветами (для кадра)
    var st = P[base + 'Stops'];
    if (!Array.isArray(st) || st.length < 2) {
      st = [
        [P[base + 'Pos1'] || 0, P[base + 'Color']],
        [P[base + 'Pos2'] == null ? 1 : P[base + 'Pos2'], P[base + 'Color2'] || P[base + 'Color']],
      ];
    }
    return st.map(function (s) { return [s[0], hexRgb(s[1])]; });
  }

  /* ── цвет каждой оси и фона — СВОЙ пикер, а не системное окно ──
     Нативный input[type=color] поднимал палитру macOS поверх стенда:
     чужая раскладка вместо своей, и цвет не подобрать по макету. Ядро
     сняло это ходом 32 у своих ручек; здесь цвет рисовался в обход
     библиотеки и системное окно осталось (правка 03.09). Пикер тот же,
     что у панели: квадрат насыщенность×яркость, полоса тона, пипетка,
     поле HEX. Значение живёт в P, читается и пишется колбэками. */
  function buildColorRow(title, labelText, key) {
    var row = document.createElement('div'); row.className = 'row';
    var lab = document.createElement('label'); lab.textContent = labelText;
    var box = document.createElement('div'); box.className = 'ax-colors';
    var pk = StendPanel.piker({
      znachenie: function () { return P[key]; },
      postavit: function (hex) { P[key] = hex; pan.save(); },
    });
    box.appendChild(pk.svotch);
    function refresh() { pk.obnovit(); }
    row.appendChild(lab); row.appendChild(box);
    var hs = pan.panel.querySelectorAll('h4');
    for (var i2 = 0; i2 < hs.length; i2++) {
      if (hs[i2].textContent === title) {
        var karta = hs[i2].nextElementSibling;
        karta.appendChild(row); karta.appendChild(pk.pole);
        break;
      }
    }
    return refresh;
  }
  // ── заливка оси по-фигмовски: селект «Заливка/Градиент»; в градиенте
  // полоса с 2–5 СТОПАМИ: клик по стопу выбирает его (цвет — инпутом
  // справа), тяга двигает, двойной клик по пустому месту полосы рождает
  // стоп, двойной клик по стопу убирает; крайние стопы зеркалятся в
  // старую пару ключей Color/Color2+Pos1/Pos2 — на ней живут варианты,
  // сплошная заливка и кольцо ──
  function buildFillControl(title, base) {
    var cKey = base + 'Color', c2Key = base + 'Color2';
    var gKey = base + 'Grad', p1Key = base + 'Pos1', p2Key = base + 'Pos2';
    var sKey = base + 'Stops';
    var card = null;
    var hs = pan.panel.querySelectorAll('h4');
    for (var i3 = 0; i3 < hs.length; i3++) {
      if (hs[i3].textContent === title) { card = hs[i3].nextElementSibling; break; }
    }
    var row = document.createElement('div'); row.className = 'row';
    var lab = document.createElement('label'); lab.textContent = 'Цвет';
    lab.title = 'Заливка — один цвет. Градиент — полоса со стопами (2–5): клик по стопу выбирает, инпут справа красит выбранный, двойной клик по полосе добавляет стоп, двойной клик по стопу убирает.';
    var box = document.createElement('div'); box.className = 'ax-colors';
    var sel = document.createElement('select');
    [['solid', 'Заливка'], ['grad', 'Градиент']].forEach(function (o) {
      var op = document.createElement('option');
      op.value = o[0]; op.textContent = o[1];
      sel.appendChild(op);
    });
    /* Свой пикер вместо системного окна — и у сплошной заливки, и у
       выбранного стопа градиента (правка 03.09). */
    var pkSolid = StendPanel.piker({
      znachenie: function () { return P[cKey] || '#000000'; },
      postavit: function (hex) { var st = cloneStops(); st[0][1] = hex; syncPair(); pan.save(); },
    });
    var inpSolid = pkSolid.svotch;
    box.appendChild(sel); box.appendChild(inpSolid);
    row.appendChild(lab); row.appendChild(box);
    if (card) { card.appendChild(row); card.appendChild(pkSolid.pole); }

    var gw = document.createElement('div'); gw.className = 'ax-grad';
    var strip = document.createElement('div'); strip.className = 'ax-grad-strip';
    var pkStop = StendPanel.piker({
      znachenie: function () { var st = stops(); return (st[selStop] && st[selStop][1]) || '#000000'; },
      postavit: function (hex) { var st = cloneStops(); if (st[selStop]) st[selStop][1] = hex; syncPair(); pan.save(); },
    });
    var inpStop = pkStop.svotch;
    gw.appendChild(strip); gw.appendChild(inpStop);
    if (card) { card.appendChild(gw); card.appendChild(pkStop.pole); }


    var selStop = 0;
    /* ЧТЕНИЕ НЕ МЕНЯЕТ СОСТОЯНИЕ (правка 03.09). Стопы собираются из пары
       Color/Color2 профиля — и прежде эта сборка ЗАПИСЫВАЛАСЬ в P при
       первом же показе панели. Рука цвета не трогала, а отчёт правок
       показывал textStops и numStops уведёнными: человек читал их как свою
       работу. Теперь сборка только возвращается; в P стопы попадают,
       когда их правда правят (cloneStops). */
    function stops() { // канон — массив [позиция, цвет]; собирается из пары
      if (Array.isArray(P[sKey]) && P[sKey].length >= 2) return P[sKey];
      return [
        [P[p1Key] || 0, P[cKey]],
        [P[p2Key] == null ? 1 : P[p2Key], P[c2Key] || P[cKey]],
      ];
    }
    function cloneStops() { // правки — только по копии: литералы вариантов
      P[sKey] = stops().map(function (s) { return [s[0], s[1]]; }); // не мутируем
      return P[sKey];
    }
    function syncPair() {
      var st = stops();
      P[cKey] = st[0][1]; P[p1Key] = st[0][0];
      P[c2Key] = st[st.length - 1][1]; P[p2Key] = st[st.length - 1][0];
    }
    var handles = [];
    function rebuildHandles() {
      handles.forEach(function (h) { strip.removeChild(h); });
      handles = [];
      stops().forEach(function (s, si) {
        var h = document.createElement('div');
        h.className = 'stop' + (si === selStop ? ' sel' : '');
        strip.appendChild(h);
        handles.push(h);
      });
    }
    function idxAt(fx) {
      var st = stops(), best = 0, bd = 2;
      st.forEach(function (s, si) {
        var d = Math.abs(fx - s[0]);
        if (d < bd) { bd = d; best = si; }
      });
      return best;
    }
    function fxOf(e) {
      var r = strip.getBoundingClientRect();
      return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    }
    var dragIdx = -1;
    strip.addEventListener('pointerdown', function (e) {
      dragIdx = idxAt(fxOf(e));
      selStop = dragIdx;
      strip.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    strip.addEventListener('pointermove', function (e) {
      if (dragIdx < 0) return;
      var st = cloneStops();
      var fx = Math.round(fxOf(e) * 100) / 100;
      var lo = dragIdx > 0 ? st[dragIdx - 1][0] + 0.02 : 0;
      var hi = dragIdx < st.length - 1 ? st[dragIdx + 1][0] - 0.02 : 1;
      st[dragIdx][0] = Math.max(lo, Math.min(hi, fx));
      syncPair(); pan.save();
    });
    function endStopDrag() { dragIdx = -1; }
    strip.addEventListener('pointerup', endStopDrag);
    strip.addEventListener('pointercancel', endStopDrag);
    strip.addEventListener('dblclick', function (e) {
      var fx = Math.round(fxOf(e) * 100) / 100;
      var st = cloneStops();
      var near = idxAt(fx);
      if (Math.abs(st[near][0] - fx) < 0.05) {
        if (st.length > 2) { st.splice(near, 1); selStop = 0; } // минимум два
      } else if (st.length < 5) {
        var at = 0;
        while (at < st.length && st[at][0] < fx) at++;
        st.splice(at, 0, [fx, gradHexAt(st, fx)]); // цвет — из точки полосы
        selStop = at;
      }
      syncPair(); pan.save();
      rebuildHandles();
    });
    sel.addEventListener('input', function () {
      P[gKey] = sel.value === 'grad';
      pan.save();
    });
    function refresh() {
      var grad = !!P[gKey];
      var want = grad ? 'grad' : 'solid';
      if (document.activeElement !== sel && sel.value !== want) sel.value = want;
      inpSolid.style.display = grad ? 'none' : '';
      pkSolid.pole.hidden = pkSolid.pole.hidden || grad;   // в градиенте сплошного пикера нет
      if (grad) pkSolid.pole.hidden = true;
      gw.style.display = grad ? '' : 'none';
      if (!grad) { pkStop.pole.hidden = true; }
      pkSolid.obnovit();
      if (!grad) return;
      var st = stops();
      if (selStop >= st.length) selStop = 0;
      if (handles.length !== st.length) rebuildHandles();
      var parts = st.map(function (s) { return s[1] + ' ' + (s[0] * 100) + '%'; });
      strip.style.background = 'linear-gradient(to right, ' + parts.join(', ') + ')';
      st.forEach(function (s, si) {
        var h = handles[si];
        h.style.left = (s[0] * 100) + '%';
        h.style.background = s[1];
        h.classList.toggle('sel', si === selStop);
      });
      pkStop.obnovit();
    }
    refresh();
    return refresh;
  }

  var colorRefresh = [
    buildColorRow('Полоса', 'Фон', 'bgColor'),
    buildColorRow('Полоса', 'Цвет выделений', 'hlColor'),
    buildFillControl('Текстовая ось', 'text'),
    buildFillControl('Ось номеров', 'num'),
  ];

  // ── редакторы осей: вершин от 2 до 12; вершины таскаются, двойной
  // клик по линии рождает вершину, ✕ и минус убирают, степпер «Точки»
  // меняет число с сохранением формы; руки — у ядра uzly.js (ниже) ──
  var ED_X0 = -0.25, ED_X1 = 1.25; // холст шире экрана — точки ходят за кромку
  var ED_MAX = 12;
  function hKeyOf(k) { return k === 'textPts' ? 'textH' : k === 'rectPts' ? 'rectH' : 'numH'; }

  /* ── ПОЛОВИНКИ УСИКА В ЯВНОМ ВИДЕ ──────────────────────────────────
     Хранение у вершины экономное: 0 — без усиков, null — по закону
     соседей, пара — симметрично, четвёрка — врозь. Всякий раз разбирать
     эти четыре случая на месте — плодить ошибки, поэтому здесь они один
     раз разложены на «исходящую» и «входящую». */
  function polovinki(axKey, j) {
    var H = handlesOf(axKey)[j];
    if (H === 0) return { out: [0, 0], vh: [0, 0] };
    if (H && H.length > 2) return { out: [H[0], H[1]], vh: [H[2], H[3]] };
    if (H) return { out: [H[0], H[1]], vh: [H[0], H[1]] };
    /* Усик по закону соседей: НАКЛОН один (по хорде соседей точки), а ДЛИНА
       у половин разная — каждая берёт свой сегмент. Прежде обе половины
       брали длину правого, и входящая врала на всякой оси с неравными
       участками: формы вариантов C и E разошлись на 0.035 доли, поймано
       сверкой до/после (03.09). Здесь повторён счёт segCtrl, а не autoHandle:
       autoHandle рисует усик, segCtrl строит кривую — правда у второго. */
    var k = P[axKey], n = k.length;
    var p0 = k[Math.max(0, j - 1)], p2 = k[Math.min(n - 1, j + 1)];
    var m = (p2[1] - p0[1]) / Math.max(1e-6, p2[0] - p0[0]);
    var hOut = j < n - 1 ? (k[j + 1][0] - k[j][0]) / 3 : 0;
    var hVh = j > 0 ? (k[j][0] - k[j - 1][0]) / 3 : 0;
    return { out: [hOut, m * hOut], vh: [hVh, m * hVh] };
  }

  /* Параметр u внутри сегмента по высоте t — тот же ньютон, что решает
     t(u) в axisXf: параметризация не равномерна, и делить на глазок нельзя. */
  function uVSegmente(axKey, i, t) {
    var k = P[axKey], cc = segCtrl(axKey, i);
    var t0 = k[i][0], t1 = k[i + 1][0], c1t = cc[0][0], c2t = cc[1][0];
    var u = t1 > t0 ? (t - t0) / (t1 - t0) : 0;
    for (var it = 0; it < 8; it++) {
      var mu = 1 - u;
      var tu = mu * mu * mu * t0 + 3 * mu * mu * u * c1t + 3 * mu * u * u * c2t + u * u * u * t1;
      var dtu = 3 * mu * mu * (c1t - t0) + 6 * mu * u * (c2t - c1t) + 3 * u * u * (t1 - c2t);
      if (Math.abs(dtu) < 1e-6) break;
      u -= (tu - t) / dtu;
      if (u < 0) u = 0; if (u > 1) u = 1;
    }
    return u;
  }

  /* Прямой ли сегмент: обе опорные точки лежат на хорде. Порог в долях —
     около полутора пикселей на панельном холсте. */
  function segmentPryamoy(axKey, i) {
    var k = P[axKey], cc = segCtrl(axKey, i);
    var a = [k[i][0], k[i][1]], b = [k[i + 1][0], k[i + 1][1]];
    var dt = b[0] - a[0], dx = b[1] - a[1];
    var len2 = dt * dt + dx * dx;
    function otklon(c) {
      if (len2 < 1e-12) return Math.hypot(c[0] - a[0], c[1] - a[1]);
      var q = ((c[0] - a[0]) * dt + (c[1] - a[1]) * dx) / len2;
      return Math.hypot(c[0] - (a[0] + dt * q), c[1] - (a[1] + dx * q));
    }
    return otklon(cc[0]) < 0.004 && otklon(cc[1]) < 0.004;
  }
  /* ── РЕЖИМ ВЕРШИНЫ (Сергей 03.09) ──────────────────────────────────
     Три состояния, как в векторных редакторах, и все три названы:
       'net'   — без усиков: кривая входит прямой, угол острый;
       'oba'   — усики симметрично относительно точки (одна прямая, одна длина);
       'vroz'  — усики независимы друг от друга (излом).
     В хранении: 0 — без усиков, [dt, dx] или null — симметрично
     (null значит «по закону соседей»), четвёрка — врозь. */
  var REZHIMY = [['net', 'без усиков'], ['oba', 'симметрично'], ['vroz', 'врозь']];
  /* РЕЖИМ «ГНУТЬ» — ОДИН НА ВСЕ ОКНА. Это привычка руки, а не свойство
     холста: включил в панели, перешёл в лепку на экране — рука делает то
     же самое. Держать состояние у каждого редактора значило бы включать
     режим заново при каждом переходе (правка 03.09). */
  var GNEM = false;
  function rezhimVershiny(axKey, j) {
    var h = handlesOf(axKey)[j];
    if (h === 0) return 'net';
    if (h && h.length > 2) return 'vroz';
    return 'oba';
  }
  function postavitRezhim(axKey, j, rezhim) {
    var H = handlesOf(axKey).map(function (v) { return v && v.slice ? v.slice() : v; });
    var bylo = H[j];
    if (rezhim === 'net') {
      H[j] = 0;
    } else if (rezhim === 'oba') {
      /* СИММЕТРИЧНО — ПЕРЕСТРОИТЬ ПО ЗАКОНУ СОСЕДЕЙ (Сергей 04.09): из «без
         усиков» и из «врозь» линия скругляется, усики встают на одну прямую
         по хорде соседей. Раньше из четвёрки бралась исходящая половина, и
         после нулевых усов угол так и оставался углом. Пара — не трогаем. */
      H[j] = (bylo && bylo.length === 2) ? bylo : null;
    } else {
      /* ВРОЗЬ — УГОЛ, ИЗ КОТОРОГО ТЯНУТ ПО ОДНОЙ ПОЛОВИНЕ (Сергей 04.09).
         Усики есть, но нулевые, как у точки без усиков: форма не
         скругляется сама, а ядро показывает плечи на отлёте (Г10) — есть
         за что взяться и вытянуть каждую половину отдельно. Так и из
         симметрии: «врозь» приводит линию к углу с усами. Раньше половины
         брались из симметрии или закона соседей, и линия округлялась
         без просьбы. Уже врозь — не трогаем. */
      H[j] = (bylo && bylo.length > 2) ? bylo : [0, 0, 0, 0];
    }
    P[hKeyOf(axKey)] = H;
  }
  var axisEditOn = function () { return false; }; // читают драг ленты и соты
  var enterScreenEd = function () {};             // назначает экранный модуль ниже

  /* ── РЕДАКТОР ОСИ НА ЯДРЕ «УЗЛЫ ПОД РУКОЙ» (04.09, фаза 3 хвоста 1) ────
     Руки — у ядра panel-lib/uzly.js: жесты, попадание, оснастка (цель 22,
     отлёт плеча 22, крестик за отлётом на свой диаметр), инструмент «гнуть»,
     порог хода 3 px, клавиши. Здесь остался ПРЕДМЕТ оси: как хранятся усики,
     откуда берутся плечи, как ходят точки, что значит клик. Одна модель
     питает два холста — панельный и экранный, — разница в области и в том,
     что рисует предмет. Прежде редактор держал свои руки на пятистах
     строках (ходы 39–50); сводятся руки, не предметы (Г10).

     КООРДИНАТЫ ДЛЯ ЯДРА. Ядро знает доли ОБЛАСТИ. Область оси — рамка
     экрана: x — доля ширины экрана, y — высота t. Точка оси [t, x] отдаётся
     как {x: pt[1], y: pt[0]}. Панельный холст шире экрана (ED_X0…ED_X1):
     область стоит внутри него, за кромкой видно то, что ушло; экранный
     режим — область во всё окно, dpr ставит ядро.

     СОГЛАШЕНИЕ ПЛЕЧ — своё, противоположное траектории. Усик у вершины:
     0 — без усиков, null — по закону соседей, [outT, outX] — симметрично,
     [outT, outX, inT, inX] — врозь; обе половины хранятся «вниз по потоку»,
     входящее плечо есть УЗЕЛ МИНУС КОНТРОЛЬНАЯ. Ядро при разрезе отдаёт
     контрольные ТОЧКИ, знак считает модель здесь (ход 60).

     ЗАЖИМЫ — у модели: кромочные точки ходят только по x, внутренние по
     высоте не сходятся с соседями ближе ZAZOR, точек не больше ED_MAX;
     всё пишется с квантом хранения оси — полпроцента. */
  var ZAZOR = 0.02;                                          // соседние точки — не ближе по высоте
  function okr200(v) { return Math.round(v * 200) / 200; }  // квант хранения оси: полпроцента
  function okr4(v) { return Math.round(v * 10000) / 10000; } // квант разреза: форма не шелохнётся
  function clonePts(axKey) { return P[axKey].map(function (p) { return p.slice(); }); }
  /* НОЛЬ «БЕЗ УСИКОВ» ЛОЖЕН, И КОПИЯ ОБЯЗАНА ЕГО СОХРАНИТЬ (находка 04.09).
     Прежняя копия писала `v ? v.slice() : null` и обращала ноль в null —
     «по закону соседей»: любая вставка точки или тяга усика на оси без
     усиков сгибала чужие точки. Вариант A, «+» на текстовой оси:
     [0,0,0,0] → [null,0,null,null,null], линия уехала на 0.05 экрана. */
  function cloneH(axKey) { return handlesOf(axKey).map(function (v) { return v && v.slice ? v.slice() : v; }); }

  /* Кубические сегменты оси для ядра: концы — вершины, контрольные — из
     segCtrl (там же зажим опорных t внутрь участка: x(t) остаётся
     однозначной). Это та же кривая, что считает axisXf, — одна правда. */
  function segmentyOsi(axKey) {
    var k = P[axKey], out = [];
    for (var i = 0; i < k.length - 1; i++) {
      var cc = segCtrl(axKey, i);
      out.push({ a: { x: k[i][1], y: k[i][0] }, b: { x: k[i + 1][1], y: k[i + 1][0] },
                 c1: { x: cc[0][1], y: cc[0][0] }, c2: { x: cc[1][1], y: cc[1][0] }, ia: i, ib: i + 1 });
    }
    return out;
  }

  /* ── ТОЧКА САДИТСЯ НА ЛИНИЮ И НЕ МЕНЯЕТ ЕЁ ФОРМУ (Г10, правило Сергея 03.09) ──
     Садится ПО ВЫСОТЕ t — у оси свой ньютон (uVSegmente), сегмент и параметр
     от ядра не нужны. ПРЯМОЙ участок → точка без усиков: чистый угол есть
     состояние, к которому проще прибавлять. ИЗОГНУТЫЙ → разрез по де
     Кастельжо (геометрия ядра), точка получает независимые усики: «один
     отвечает за один фрагмент, другой — за другой»; у соседей меняется
     только половина, смотрящая в разрез. Возвращает индекс новой точки. */
  function vstavitPoVysote(axKey, t) {
    var k = P[axKey];
    if (k.length >= ED_MAX) return null;
    var at = k.length - 1;
    for (var j = 1; j < k.length; j++) if (k[j][0] > t) { at = j; break; }
    var i = at - 1, pts = clonePts(axKey), H = cloneH(axKey);
    if (segmentPryamoy(axKey, i)) {
      H.splice(at, 0, 0);
      /* x — с квантом разреза, не хранения: полпроцента уводили точку с
         прямой на 0.0025 экрана (находка 04.09, до неё скрытая нулями) */
      pts.splice(at, 0, [t, okr4(axisXf(axKey, 0, t))]);     // на самой линии, а не под курсором
    } else {
      var g = segmentyOsi(axKey)[i], rz = StendPanel.uzly.razrezat(g, uVSegmente(axKey, i, t));
      var A = g.a, B = g.b, N = rz.tochka, pa = polovinki(axKey, i), pb = polovinki(axKey, at);
      // знак — здесь: исходящее — контрольная минус узел, входящее — узел минус контрольная
      H[i]  = [okr4(rz.levyy.c1.y - A.y), okr4(rz.levyy.c1.x - A.x), okr4(pa.vh[0]), okr4(pa.vh[1])];
      H[at] = [okr4(pb.out[0]), okr4(pb.out[1]), okr4(B.y - rz.pravyy.c2.y), okr4(B.x - rz.pravyy.c2.x)];
      H.splice(at, 0, [okr4(rz.pravyy.c1.y - N.y), okr4(rz.pravyy.c1.x - N.x),
                       okr4(N.y - rz.levyy.c2.y),  okr4(N.x - rz.levyy.c2.x)]);
      pts.splice(at, 0, [okr4(N.y), okr4(N.x)]);
    }
    P[axKey] = pts; P[hKeyOf(axKey)] = H;
    return at;
  }

  /* ── МОДЕЛЬ ОСИ ДЛЯ ЯДРА ──────────────────────────────────────────────
     cfg читается при каждом обращении — экранный редактор подменяет в нём
     ось. cfg: axKey — ключ оси; x0, x1 — границы хода по x (панель
     ED_X0…ED_X1, экран 0…1); oblast() — рамка экрана в px холста; others() —
     соседние оси серым; fon(g, px, py, W, H) — что под линией; halo —
     белая подложка под кривой, чтобы читалась на ленте её же цвета. */
  function modelOsi(cfg) {
    function ax() { return cfg.axKey; }
    function k() { return P[ax()]; }
    function zapisatH(H) { P[hKeyOf(ax())] = H; }
    function axPath(g, key, px, py) {
      g.beginPath();
      for (var s = 0; s <= 100; s++) {
        var t = s / 100, x = px(axisXf(key, 0, t)), y = py(t);
        if (s) g.lineTo(x, y); else g.moveTo(x, y);
      }
      g.stroke();
    }
    return {
      oblast: cfg.oblast,
      uzly: function () { return k().map(function (p) { return { x: p[1], y: p[0] }; }); },
      segmenty: function () { return segmentyOsi(ax()); },
      /* Плечи — из половинок усика, той же правды, по которой строится
         кривая (ход 47: autoHandle рисовал, segCtrl строил — теперь одно).
         У кромочных по одному: первой некуда входить, последней — выходить.
         «Без усиков» отдаёт плечи нулевой длины — ядро покажет их на отлёте
         вдоль хорды к соседу (Г10): есть за что взяться. Ромбик залит у
         усика, поставленного рукой; полый — выведен законом соседей. */
      plechi: function (i) {
        var p = k()[i], n = k().length, h = polovinki(ax(), i);
        return { ho: i < n - 1 ? { x: p[1] + h.out[1], y: p[0] + h.out[0] } : null,
                 hi: i > 0     ? { x: p[1] - h.vh[1],  y: p[0] - h.vh[0] }  : null,
                 ruchnoy: handlesOf(ax())[i] != null };
      },
      vid: function (i) { return rezhimVershiny(ax(), i) === 'net' ? 'ugol' : 'gladkiy'; },
      // кромочные прибиты к t=0 и t=1 и не убираются: без них ось не дойдёт до края
      mozhno: function (i) { var n = k().length; return { dvigat: true, ubrat: i > 0 && i < n - 1 && n > 2 }; },
      risovat: function (g, px, py, W, H) {
        cfg.fon(g, px, py, W, H);
        g.strokeStyle = cfg.otherStroke; g.lineWidth = 2;           // соседние оси — серым, для контекста
        cfg.others().forEach(function (o) { axPath(g, o, px, py); });
        if (cfg.halo) { g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 5; axPath(g, ax(), px, py); }
        /* ЛИНИЯ, КОТОРУЮ ПРАВЯТ, — КРАСНАЯ (правка Сергея 03.09): холст
           правки — инструмент, а не превью; цвет оси — свойство ленты, и
           чёрная ось на тёмном холсте пропадала. Красный из алфавита темы. */
        g.strokeStyle = '#FF453A'; g.lineWidth = 3; axPath(g, ax(), px, py);
      },
      dvinut: function (i, x, y) {
        var pts = clonePts(ax()), last = pts.length - 1;
        pts[i][1] = Math.max(cfg.x0, Math.min(cfg.x1, okr200(x)));
        if (i > 0 && i < last) {                                    // кромочные ходят только по горизонтали
          var t = Math.max(0, Math.min(1, okr200(y)));
          pts[i][0] = Math.max(pts[i - 1][0] + ZAZOR, Math.min(pts[i + 1][0] - ZAZOR, t));
        }
        P[ax()] = pts;
      },
      /* Тяга ромбика пишет свою половину «вниз по потоку»: исходящую —
         курсор минус вершина, входящую — вершина минус курсор. Симметричный
         усик зеркалит вторую половину сам (пара в хранении и есть симметрия);
         врозь — или Alt — двигает только свою; у точки без усиков вторая
         половина остаётся нулевой. */
      tyanutPlecho: function (i, kakoe, x, y, alt) {
        var p = k()[i], H = cloneH(ax()), bylo = H[i], znak = kakoe === 'ho' ? 1 : -1;
        var polovina = [okr200((y - p[0]) * znak), okr200((x - p[1]) * znak)];
        if (!alt && !(bylo && bylo.length > 2)) {
          H[i] = polovina;
        } else {
          var h = polovinki(ax(), i);
          var four = bylo && bylo.length > 2 ? bylo.slice()
                   : bylo === 0 ? [0, 0, 0, 0] : [h.out[0], h.out[1], h.vh[0], h.vh[1]];
          if (kakoe === 'ho') { four[0] = polovina[0]; four[1] = polovina[1]; }
          else { four[2] = polovina[0]; four[3] = polovina[1]; }
          H[i] = four;
        }
        zapisatH(H);
      },
      /* «ГНУТЬ» ЗА УЧАСТОК — ПО ПРИНЦИПУ ФИГМЫ (Г10; правка Сергея 04.09).
         Точка захвата ЗАКРЕПЛЯЕТСЯ при нажатии: ядро отдаёт параметр
         ближайшего места на линии, и дальше именно эта точка кривой идёт за
         курсором — вбок и по высоте. Поправка раскладывается на усики
         обеих вершин по весам Бернштейна в точке захвата, от текущей формы
         на каждом ходе руки. Прежде параметр брался заново по высоте
         курсора: вертикальный ход руки не гнул линию, а переносил захват
         вдоль неё, изгиб держался «за горизонт», а у несимметричной дуги
         первый ход давал прыжок — захват по высоте не совпадал с местом
         на линии. Единственный предел — ось есть функция высоты: усики по
         высоте не выходят за участок. Точке-углу гнутьё ДАЁТ усик — но
         только с той стороны, куда гнут: вторая половина остаётся
         нулевой, и соседний участок не шелохнётся. Разорванные усики
         держат нетронутую половину. */
      nachatGnut: function (seg, t) { return { seg: seg, u: t }; },
      gnut: function (sn, x, y) {
        var key = ax(), kk = k(), s = sn.seg;
        var t0 = kk[s][0], t1 = kk[s + 1][0], v0 = kk[s][1], v1 = kk[s + 1][1], dlina = t1 - t0;
        var tp = Math.max(t0 + ZAZOR / 2, Math.min(t1 - ZAZOR / 2, y));
        var xp = Math.max(cfg.x0, Math.min(cfg.x1, x));
        var u = sn.u, mu = 1 - u;
        var w1 = 3 * mu * mu * u, w2 = 3 * mu * u * u, den = w1 * w1 + w2 * w2;
        if (den < 1e-4) return;                                   // хват у самой вершины — гнуть нечем
        var cc = segCtrl(key, s);
        var bt = mu * mu * mu * t0 + 3 * mu * mu * u * cc[0][0] + 3 * mu * u * u * cc[1][0] + u * u * u * t1;
        var bx = mu * mu * mu * v0 + 3 * mu * mu * u * cc[0][1] + 3 * mu * u * u * cc[1][1] + u * u * u * v1;
        var dT = tp - bt, dX = xp - bx;
        var c1 = [cc[0][0] + dT * w1 / den, cc[0][1] + dX * w1 / den];
        var c2 = [cc[1][0] + dT * w2 / den, cc[1][1] + dX * w2 / den];
        var H = cloneH(key), hA = H[s], hB = H[s + 1];

        zapisatH(H);
      },
      // двойной клик по линии: точка по высоте, не на самой кромке
      vstavit: function (seg, t, p) {

      },
      ubrat: function (i) {

      },
      /* При «гнуть» точка не ездит: рука либо вытягивает из неё симметричные

         (без хода: точка становится углом). Двигают точки вне режима —
         там у жеста нет второго смысла. */

      },
      klikUzla: function (i) { postavitRezhim(ax(), i, 'net'); },
      izmenilos: function () { pan.save(); }
    };
  }

  /* РЕЖИМ «ГНУТЬ» — ОДИН НА ВСЕ ОКНА (правка 03.09): привычка руки, не

  // ── полоса: пул строк-элементов, позиции считаются каждый кадр ──
  var band = document.getElementById('band');

  // фразы TEXT — атомы набора: узкая строка несёт одну фразу, широкая
  // склеивает несколько целиком, перенос всегда по авторской границе;
  // фраза шире строки переносится по словам. канвас не видит осей
  // вариативного шрифта, поэтому всё меряется невидимой строкой прямо

  var measEl = document.createElement('div');
  measEl.className = 'meas';
  band.appendChild(measEl);
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function wrapText() {
    var wWidth = Object.create(null);
    TEXT.forEach(function (sec) {
      sec.paras.forEach(function (para) {
        para.forEach(function (ph) {
          wWidth[ph] = 0;
          ph.split(' ').forEach(function (w) { wWidth[w] = 0; });
        });
      });
    });
    var keys = Object.keys(wWidth);
    measEl.innerHTML = keys.map(function (k) {
      return '<span>' + esc(k) + '</span>';
    }).join('') + '<span> </span>';
    var spans = measEl.children;
    for (var i = 0; i < keys.length; i++) {
      wWidth[keys[i]] = spans[i].getBoundingClientRect().width;
    }
    var space = spans[keys.length].getBoundingClientRect().width;

    var lines = [];
    var cur = '', curW = 0;
    function put(piece) {
      var w = wWidth[piece];
      if (cur && curW + space + w > P.width) { lines.push({ t: cur, num: false }); cur = ''; curW = 0; }
      if (cur) { cur += ' ' + piece; curW += space + w; }
      else { cur = piece; curW = w; }
    }
    function flush() { if (cur) { lines.push({ t: cur, num: false }); cur = ''; curW = 0; } }
    // вертикальный ритм кластеров плашек — числа Фибоначчи
    var FIB = [1, 1, 2, 3, 5];
    TEXT.forEach(function (sec, si) {
      flush();
      // кластеры оси номеров: перед «Ритмом», перед «Миссией»
      // и перед «Стоимостью» — две пустые, шесть плашек
      // по Фибоначчи, две пустые
      if (si === 3 || si === 6 || si === 12) {
        for (var nb = 0; nb < 2; nb++) lines.push({ t: '', num: false });
        for (var nc = 0; nc < 6; nc++) {
          lines.push({ t: '', num: true, rect: true });
          if (nc < 5) for (var np = 0; np < FIB[nc]; np++) lines.push({ t: '', num: false });
        }
        for (var na = 0; na < 2; na++) lines.push({ t: '', num: false });
      }
      // воздух перед параграфом: регулируемая пачка пустых строк
      // (у первой секции его нет, после кластеров — кластер уже отделил)
      if (si > 0 && si !== 3 && si !== 6 && si !== 12) for (var pg = 0; pg < P.parGap; pg++) lines.push({ t: '', num: false });
      // заголовок смысловой части встаёт на ось номеров
      lines.push({ t: sec.h, num: true });
      sec.paras.forEach(function (para, pi) {
        flush();
        // каждый абзац предваряется меткой «(N)» на оси номеров
        lines.push({ t: '(' + (pi + 1) + ')', num: true, dig: true });
        para.forEach(function (ph) {
          if (wWidth[ph] <= P.width) { put(ph); return; }
          flush(); // фраза шире строки: живёт отдельно, набирается по словам
          ph.split(' ').forEach(put);
          flush();
        });
        flush();
      });
    });
    // финал: кластер текстовой оси после текста — ритм Фибоначчи
    // (1, 1, 2, 3, 5 пустых строк), растяжимый ручкой «Плашки текста:
    // высота»: пробелы растут пропорционально, кратность сохраняется;
    // на максимуме блок высотой с экран; плашки сидят в строчных
    // слотах — сопряжение осей не ломается
    var tScale = 1;
    if (P.textRectH > 0 && L > 0) {
      var maxLines = Math.max(29, Math.floor(H / L)); // экран в строках
      var targetLines = 29 + (maxLines - 29) * P.textRectH; // база — 29 строк
      tScale = Math.max(1, (targetLines - 17) / 12);  // 17 строк вне пробелов
    }

    // (слово Сергея 2026-08-07, добирали дважды: +4, потом +3)
    for (var rb = 0; rb < 9; rb++) lines.push({ t: '', num: false });
    for (var rc = 0; rc < 6; rc++) {
      lines.push({ t: '', num: false, rect: true });
      if (rc < 5) {
        var gN = Math.max(1, Math.round(FIB[rc] * tScale));
        for (var gp = 0; gp < gN; gp++) lines.push({ t: '', num: false });
      }
    }
    for (var rg = 0; rg < 2; rg++) lines.push({ t: '', num: false });
    for (var g = 0; g < P.gap; g++) lines.push({ t: '', num: false });
    // строка с телеграм-контактом кликабельна
    lines.forEach(function (l) {
      if (l.t.indexOf('@Alla_V_Nastas') !== -1) l.href = 'https://t.me/Alla_V_Nastas';
    });
    return lines;
  }

  var lines = [];
  var sig = '';
  var W = 0, H = 0, L = 20;
  // аналоговая погоня: все входы двигают цель, лента непрерывно догоняет
  var scroll = 0, target = 0, touched = false; // touched — зритель начал листать

  function relayout() {
    W = window.innerWidth; H = window.innerHeight;
    // шрифты пропорциональны ширине экрана: на опорной ширине кегли
    // точные, на более узких окнах равномерно меньше; крупнее не растут
    var fs = Math.min(1, W / P.fontRef);
    L = P.kegl * fs * P.leading;
    band.style.fontSize = (P.kegl * fs) + 'px';
    band.style.setProperty('--dg', (P.digSize * fs) + 'px'); // кегль цифровых меток
    band.style.setProperty('--numw', P.numWght);        // толщина оси номеров
    band.style.setProperty('--numtrk', P.numTrack + 'em'); // и её кернинг
    // кегль заголовков оси номеров: 0 — наследует основной кегль ленты
    band.style.setProperty('--numsz', ((+P.numSize > 0 ? +P.numSize : P.kegl) * fs) + 'px');
    band.style.setProperty('--digw', P.digWght);           // толщина цифр
    band.style.setProperty('--digtrk', P.digTrack + 'em'); // и их кернинг
    band.style.lineHeight = L + 'px';
    // оси вариативного шрифта через высокоуровневые свойства:
    // работают с любым шрифтом и тихо гаснут на невариативном фолбэке
    band.style.fontWeight = P.wght;
    band.style.fontStretch = P.wdth + '%';
    band.style.setProperty('--colw', P.width + 'px');
    band.style.setProperty('--trk0', P.trackFrom + 'em'); // кернинг покоя
    lines = wrapText(); // мерить — после установки шрифта
    // старт ленты (слово Сергея 2026-08-06): лонгрид открывается модулем
    // плашек текстовой оси — первая плашка кластера упирается в верхнюю
    // кромку экрана, ниже стык и первый заголовок
    // якорь живой: держит кластер у кромки при каждой перевёрстке
    // (доезд вебшрифта, резайз), пока зритель не начал листать
    if (!touched) {
      var k0 = -1;
      for (var li = 0; li < lines.length; li++) {
        if (lines[li].rect && !lines[li].num) { k0 = li; break; }
      }
      scroll = target = k0 >= 0 ? k0 * L - 7.5 : -H / 2;
    }
  }

  var trackNow = P.trackFrom, trackSet = -1, colSet = '';
  var gradCols = null; // разобранные цвета осей для градиента
  function hexRgb(h) {
    h = (h || '#000000').replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
  }
  var flingV = 0, lastFrameT = 0; // выкат броска: скорость цели, px/мс

  // доля толщины плашки по высоте экрана: единица у нижней кромки,
  // к верхней сходит на нет шагами Фибоначчи (1, 1, 2, 3, 5 — тот же
  // ритм, что в кластерах): внизу худеет еле-еле, у верха обрывается
  var THIN_FIB = [1, 1, 2, 3, 5], THIN_CUM = [0, 1, 2, 4, 7];
  function rectThinF(tA) {
    var u = (1 - tA) * 5;
    var i = Math.min(4, Math.floor(u));
    return 1 - (THIN_CUM[i] + THIN_FIB[i] * (u - i)) / 12;
  }

  // ── бесшовный переход между вариантами: сущности одни, меняются
  // параметры — старая композиция снимается в слепок (оси таблицами,
  // цвета в RGB, правила плашек числами) и тает в новую долей k ──
  var TRANS = null;
  function lutAt(lut, t) {
    var f = Math.max(0, Math.min(1, t)) * (lut.length - 1);
    var i = Math.floor(f);
    return i >= lut.length - 1 ? lut[lut.length - 1]
                               : lut[i] + (lut[i + 1] - lut[i]) * (f - i);
  }
  function axisLut(axKey, sharp) {
    var lut = [];
    for (var i = 0; i <= 64; i++) lut.push(axisXf(axKey, sharp, i / 64));
    return lut;
  }
  function mix3(a, b, k) {
    return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * k) + ',' +
      Math.round(a[1] + (b[1] - a[1]) * k) + ',' +
      Math.round(a[2] + (b[2] - a[2]) * k) + ')';
  }
  function bl(name) { // числовое правило с учётом перехода
    return TRANS ? TRANS.from[name] + (+P[name] - TRANS.from[name]) * TRANS.k : +P[name];
  }
  // доля НАБРАННОГО текста строки на переходе: у каждой строки своя
  // очередь (детерминированный разброс по её номеру — иначе дрожало бы
  // каждый кадр), набор занимает долю хода compTypeDur
  function typeVis(k, kL) {
    if (!TRANS) return 1;
    var dur = Math.max(0.05, +P.compTypeDur || 0.35);
    var jit = Math.max(0, Math.min(1, +P.compTypeJit));
    // хеш номера строки: ровный разброс без Math.random в кадре
    var h = Math.abs(Math.sin(k * 12.9898) * 43758.5453);
    var start = (h - Math.floor(h)) * jit * (1 - dur);
    var u = (kL - start) / dur;
    return u <= 0 ? 0 : u >= 1 ? 1 : u;
  }
  function transK(tA) { // доля перехода для строки: ритм-волна по высоте
    if (!TRANS || !TRANS.wave) return TRANS ? TRANS.k : 1;
    var s = TRANS.waveDn ? tA : 1 - tA;
    var p = (TRANS.p - s * TRANS.wave) / (1 - TRANS.wave);
    return evalEase(P.compEase, P.compBez, Math.max(0, Math.min(1, p)));
  }
  function snapshotVariantState() { // звать ДО применения нового пака
    if (!(+P.compFade)) { TRANS = null; return; }
    TRANS = {
      k: 0, p: 0, wave: 0, t0: performance.now(), dur: +P.compFade,
      from: {
        textLut: axisLut('textPts', P.textSharp),
        numLut: axisLut('numPts', P.numSharp),
        rectLut: +P.rectAxisOwn ? axisLut('rectPts', P.rectSharp)
                                : axisLut('textPts', P.textSharp),
        tS: stopsOf('text'), nS: stopsOf('num'),
        textGrad: !!P.textGrad, numGrad: !!P.numGrad,
        bg: hexRgb(P.bgColor), tx: hexRgb(P.textColor),
        nu: hexRgb(P.numColor), hl: hexRgb(P.hlColor),
        rectStretch: +P.rectStretch,
        textRectStretch: +P.textRectStretch,
        textRectLeft: +P.textRectLeft,
      },
    };
  }

  function frame() {
    var s = [P.kegl, P.digSize, P.fontRef, P.wght, P.wdth, P.width, P.leading, P.gap,
             P.parGap, P.textRectH, P.trackFrom, P.numSize, P.numWght, P.numTrack,
             P.digWght, P.digTrack, lang,
             window.innerWidth, window.innerHeight].join('|');
    if (s !== sig) { sig = s; relayout(); }

    // выкат броска: после свайпа цель едет со скоростью пальца
    // и затухает как в нативном скролле (~325 мс) — аналогово, без рывка
    var nowF = performance.now();
    var dtF = lastFrameT ? Math.min(50, nowF - lastFrameT) : 16;
    lastFrameT = nowF;
    if (TRANS) { // ход перехода: темп задаёт изинг из панели, ритм —
      // волна по высоте (transK); по финишу — чистовые цвета
      var tkr = (nowF - TRANS.t0) / Math.max(1, TRANS.dur);
      if (tkr >= 1) { TRANS = null; colSet = ''; }
      else {
        TRANS.p = Math.max(0, tkr);
        TRANS.k = evalEase(P.compEase, P.compBez, TRANS.p);
        TRANS.wave = Math.min(0.9, Math.abs(+P.compWave || 0));
        TRANS.waveDn = (+P.compWave || 0) > 0;
      }
    }
    if (flingV) {
      target += flingV * dtF;
      flingV *= Math.exp(-dtF / 325);
      if (Math.abs(flingV) < 0.002) flingV = 0;
    }

    scroll += (target - scroll) * P.smooth;

    // шкала кернинга: датчик — недоезд ленты до цели; разгон везёт
    // межбуквие от «покоя» к «разгону», остановка возвращает обратно
    var gapDist = Math.abs(target - scroll);
    var sat = Math.min(1, gapDist / Math.max(1, P.trackDist));
    var goal = P.trackFrom + (P.trackTo - P.trackFrom) * sat;
    // атака — движение от покоя к разгону, возврат — обратно к покою
    var trkRes = Math.abs(goal - P.trackFrom) >= Math.abs(trackNow - P.trackFrom)
      ? P.trackRes : (P.trackRel || P.trackRes);
    trackNow += (goal - trackNow) * trkRes;
    if (Math.abs(trackNow - trackSet) > 0.0002) {
      trackSet = trackNow;
      band.style.setProperty('--trk', trackNow + 'em');
    }

    var N = lines.length;
    var kMin = Math.floor((scroll - 1.5 * L) / L);
    var kMax = Math.ceil((scroll + H + 1.5 * L) / L);
    var need = kMax - kMin + 1;
    while (pool.length < need) {
      var el = document.createElement('div');
      el.className = 'ln';
      band.appendChild(el);
      pool.push(el);
    }
    for (var i = 0; i < pool.length; i++) {
      var elI = pool[i];
      if (i >= need) { if (elI.style.display !== 'none') elI.style.display = 'none'; continue; }
      if (elI.style.display) elI.style.display = '';
      var k = kMin + i;
      var y = k * L - scroll;          // центр строки по вертикали
      var x;                           // левый край строки — на своей оси
      var m = ((k % N) + N) % N;       // зацикливание текста
      var it = lines[m];
      // каждая ось рисуется своим редактором-экраном; по вертикали обе
      // в общем потоке строк, поэтому движение всегда согласовано
      var tA = Math.max(0, Math.min(1, y / H));
      // плашки текстового кластера могут ехать по своей оси (rectPts) —
      // включается селектом «Ось плашек» в панели
      var ownRect = !!it.rect && !it.num && +P.rectAxisOwn;
      x = axisXf(ownRect ? 'rectPts' : it.num ? 'numPts' : 'textPts',
                 ownRect ? P.rectSharp : it.num ? P.numSharp : P.textSharp, tA) * W;
      var kL = 1; // доля перехода этой строки — с ритмом-волной
      if (TRANS) { // морф: старая траектория оси тает в новую
        var luOld = (it.rect && !it.num) ? TRANS.from.rectLut
                  : it.num ? TRANS.from.numLut : TRANS.from.textLut;
        kL = transK(tA);
        x = lutAt(luOld, tA) * W * (1 - kL) + x * kL;
      }
      if (elI.classList.contains('num') !== it.num) elI.classList.toggle('num', it.num);
      var dig = !!it.dig;
      if (elI.classList.contains('dig') !== dig) elI.classList.toggle('dig', dig);
      var isRect = !!it.rect;
      if (elI.classList.contains('rect') !== isRect) elI.classList.toggle('rect', isRect);
      // градиент оси: строка красится по своей экранной высоте —
      // цвет верха у верхней кромки, цвет низа у нижней
      if (gradCols) {

        // и в градиенте, на какой бы оси плашка ни сидела
        var asNum = it.num || isRect;
        if (TRANS) { // переход: цвет строки миксуется старый→новый
          var ncl = (asNum ? gradCols.nGrad : gradCols.tGrad)
            ? gradRgbAt(asNum ? gradCols.nS : gradCols.tS, tA)
            : (asNum ? gradCols.nS : gradCols.tS)[0][1];
          var ocl = (asNum ? TRANS.from.numGrad : TRANS.from.textGrad)
            ? gradRgbAt(asNum ? TRANS.from.nS : TRANS.from.tS, tA)
            : (asNum ? TRANS.from.nS : TRANS.from.tS)[0][1];
          elI.style.color = mix3(ocl, ncl, kL);
        } else {
          var gOn = asNum ? gradCols.nGrad : gradCols.tGrad;
          if (gOn) {
            var gc = gradRgbAt(asNum ? gradCols.nS : gradCols.tS, tA);
            elI.style.color = 'rgb(' + gc[0] + ',' + gc[1] + ',' + gc[2] + ')';
          } else if (elI.style.color) {

          }
