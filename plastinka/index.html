  @font-face { font-family: "Editorial New"; font-weight: 400; font-style: normal;

  @font-face { font-family: "Editorial New"; font-weight: 700; font-style: normal;

  @font-face { font-family: "Even Mono"; font-weight: 400; font-style: normal;
    src: url("/fonts/EvenMono-Regular.woff2") format("woff2"); font-display: swap; }

    src: url("/fonts/JetBrainsMono-Regular.woff2") format("woff2"); font-display: swap; }

     900; ширина 50…150, наклон −16…0 — правятся осями на кольце. */
  @font-face { font-family: "ABC Gravity"; font-weight: 100 900; font-stretch: 50% 150%; font-style: normal;
    src: url("/fonts/gravity-nabor.woff2") format("woff2"),   /* лёгкий набор: латиница, кириллица, цифры */
         url("/fonts/ABCGravityCyrillicVariable-Trial.ttf") format("truetype"); font-display: swap; }
  @font-face { font-family: "Pragmatica Next VF"; font-weight: 100 900; font-style: normal;

  /* сцена во весь экран: координаты внутри считает стенд от размеров окна */
  svg#scene { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: block;
    user-select: none; -webkit-user-select: none; }
  svg#scene .sektor { fill: transparent; cursor: pointer; pointer-events: all; }
  svg#scene text { pointer-events: none; }
  svg#scene #setka circle { fill: none; pointer-events: none; }
  svg#scene #krest { pointer-events: none; }

<script>window.STEND_PANEL_VSEGDA = true; /* панель и на витрине: над стендом работают на опубликованном адресе (слово Сергея 02.10) */</script>

<script>
'use strict';
/* ─────────────────────────────────────────────────────────────
   Пластинка — страница альбома как сторона винила.
   Внешнее кольцо — номера треков стороны, под каждым номером
   отметка времени, с которой трек начинается на стороне; вглубь
   от активного номера четыре концентрических строки: название
   трека, группа, длительность, авторы. Сингл дописывается в кольцо
   авторов через точку: есть сингл — строка длиннее, нет — в кольце
   только авторы. Название альбома стоит в кольце группы, на
   противоположной стороне круга; группа и альбом на смене трека неподвижны.

   Смотрит: на окно (высота задаёт диаметр круга, ширина — предел,
            дальше которого круг не растёт) и на содержимое
            (длительность трека задаёт его долю окружности).
   Реагирует: плавно на окно; на руку — по одному треку за жест.
   Законы: 3 Доли и Коридор (диаметр = min(доля высоты, доля ширины);
           у каждого кольца свой диаметр в долях высоты, кегли — доли
           диаметра круга; упёрся круг в ширину — кольца сжимаются с ним);
           6 Содержимое (сектор трека = его длительность / длительность
           стороны; ручка «Пропорция» ведёт от равных секторов к этим);
           14 Защёлка ◌ — кандидат: колесо меняет трек щелчком, один
           жест — один трек (импульсный дискретный скролл из галереи M7).
   Приём: «Вёрстка по осям» — роли одного текста (номер / трек /
          группа / длительность) разнесены по своим осям; оси здесь —
          концентрические окружности, сшитые общим лучом номера; выключка
          строк относительно луча — ручкой, по умолчанию по центру.
   Гарнитура: Helvetica Bold — по прямому слову задачи, в алфавите
          свода её нет.

   Смена текста — перебором знаков (приём из каталога и галереи M7). Это
   второе действие поверх перемещения: у перебора своё время, кривая, пауза
   до начала и свой веер по кольцам.

   Звук: сухой щелчок на каждой смене трека — синтез из галереи M7.
   В центре круга — плюсик из двух линий.

   Параметры адреса: ?stop=мс — стоп-кадр перехода с первого трека на
   ?trek=N (без stop — просто открыть на треке N); ?storona=B;
   ?reset=1; ?theme=nothing
   ───────────────────────────────────────────────────────────── */

/* Материал: Nirvana — Nevermind, первое издание на виниле (DGC, 1991).
   Двенадцать треков, по шесть на сторону; скрытый Endless, Nameless
   был только на компакт-диске. Трек: название, длительность в секундах,
   авторы, сингл (дата выхода или пусто). Авторы и даты — по статье
   «Nevermind» английской Википедии, сверено 2026-10-02. */
var ALBOM = {
  gruppa: 'Nirvana',
  imya: 'Nevermind',
  storony: {
    A: [
      ['Smells Like Teen Spirit', 301, 'Cobain, Grohl, Novoselic', 'Single, September 10, 1991'],
      ['In Bloom', 254, 'Cobain', 'Single, November 30, 1992'],
      ['Come as You Are', 219, 'Cobain', 'Single, February 18, 1992'],
      ['Breed', 183, 'Cobain', ''],
      ['Lithium', 257, 'Cobain', 'Single, July 13, 1992'],
      ['Polly', 177, 'Cobain', '']
    ],
    B: [
      ['Territorial Pissings', 142, 'Cobain, Powers', ''],
      ['Drain You', 223, 'Cobain', ''],
      ['Lounge Act', 156, 'Cobain', ''],
      ['Stay Away', 212, 'Cobain', ''],
      ['On a Plain', 196, 'Cobain', ''],
      ['Something in the Way', 232, 'Cobain', '']
    ]
  }
};

/* Авторы в данных записаны фамилиями. Когда автор у трека один, в кольце он
   пишется полностью, именем и фамилией; когда их несколько — фамилиями. */
var IMENA = { Cobain: 'Kurt Cobain', Grohl: 'Dave Grohl', Novoselic: 'Krist Novoselic', Powers: 'Chet Powers' };
function avtoryTekst(spisok) {
  return spisok.indexOf(',') < 0 && IMENA[spisok] ? IMENA[spisok] : spisok;
}

var DEFAULTS = {
  v: 6,                // без ручки — застава раскладки: 6 — синяя цветовая схема; 5 — линии плюсика 1 px; 4 — в центре плюсик вдвое меньше; 3 — группа набрана ABC Gravity Wide по макету; 2 — выровнены отбивки колец (02.10)
  storona: 'A',        // без ручки: переворот пластинки — отдельный переход, следующий заход
  diam: 90,            // диаметр круга, % высоты окна
  diamW: 92,           // предел диаметра, % ширины окна
  cx: 50, cy: 50,      // центр круга, % ширины и высоты окна
  nachalo: 0,          // угол, с которого начинается сторона: 0 — верх
  krestRazmer: 2,      // плюсик в центре круга: длина линии, % диаметра; 0 — его нет
  krestLiniya: 1,      // толщина линий плюсика, px
  krestUgol: 0,        // поворот: 0 — плюс, 45 — косой крестик
  prop: 100,           // 0 — равные секторы, 100 — по длительности
  garnitura: 'Helvetica',
  tolshchina: 700,
  treking: 0,          // доли кегля
  vykl: 'center',      // выключка строк на кольцах относительно луча номера
  /* У каждого кольца свой диаметр (внешний край строки, % высоты окна), свой
     кегль, своя гарнитура ('obshchaya' — как общая) и свой регистр. Диаметр
     кольца номеров — это «Диаметр» круга. Цепочка «интерлиньяж + отбивки»
     заменена диаметрами по просьбе 2026-10-02: кольца ставятся независимо. */
  kNum: 4, gNum: 'obshchaya', trNum: 0,   // tr* — свой трекинг кольца: добавка к общему, доли кегля
  dVremya: 83.1, kVremya: 1.6, gVremya: 'obshchaya', trVremya: 0, uVremya: 0, plVremya: 20,   // отметка начала трека на дуге
  dTrek: 75.6, kTrek: 4, gTrek: 'obshchaya', trTrek: 0, regTrek: 'kak', uTrek: 0,
  dGruppa: 66.6, kGruppa: 4, gGruppa: 'obshchaya', trGruppa: 0, regGruppa: 'kak', uGruppa: 0,
  wdthGruppa: 150, slntGruppa: 0,   // оси вариативной гарнитуры группы: ширина и наклон
  gruppaStoit: true,   // название группы на смене трека не едет
  dDlit: 57.6, kDlit: 4, gDlit: 'obshchaya', trDlit: 0, uDlit: 0, plDlit: 20,   // plDlit — плотность цвета строки: доля чернил поверх фона
  dAvtory: 49.4, kAvtory: 2.4, gAvtory: 'obshchaya', trAvtory: 0, regAvtory: 'kak', uAvtory: 0, plAvtory: 20,
  kAlbom: 4, gAlbom: 'obshchaya', trAlbom: -0.025, regAlbom: 'cap', uAlbom: 180, albomChitaetsya: true,   // альбом в кольце группы: напротив её названия, читается внизу круга
  hod: 'kolca',        // что едет при смене трека: кольца к номеру или диск под иглу
  vremya: 700, hodEase: 'плавный', hodBez: [0.65, 0, 0.35, 1],
  volna: 90,           // отставание каждого следующего кольца, мс
  vrPauza: 20,         // отметки времени трогаются после номеров через столько мс
  nomPruzhVkl: true,   // номера и отметки времени приходят на место пружиной, с отскоком
  nomPruzh: [1000, 0.55],   // [период мс, затухание]: меньше затухание — сильнее отскок
  gashenie: 100,       // насколько гаснет строка, пока меняется текст (когда перебор выключен)
  perebor: true,       // перебор знаков: строка пересобирается буква за буквой
  pereborMs: 1800, pereborEase: 'линейный', pereborBez: [0.25, 0.25, 0.75, 0.75],   // своё время и кривая перебора
  pereborPauza: 0,     // через сколько после смены трека перебор начинается, мс
  pereborVolna: 180,   // веер перебора: пауза между кольцами, мс
  pereborFront: 42,    // фронт перебора, % длины строки
  pereborTick: 70,     // перещёлк знака, мс — период, не движение
  pereborVse: false,   // перебирать ли знаки, которые в старом и новом тексте совпали
  // Звук — щелчок на смене трека, значения и синтез перенесены из галереи M7
  zvuk: true,           // глаз секции: щелчок при смене трека
  gromkostTon: 4,       // громкость тона, %
  gromkostShum: 0,      // громкость шума-контакта, %
  zatuhanie: 2,         // затухание тона, мс
  dlinaShuma: 7,        // длина шума, мс
  glushenie: 100,       // глушение на скорости, мс
  zvukEase: 'торможение', zvukBez: [0.33, 1, 0.68, 1],
  /* СКРОЛЛ — смена трека колесом. Механика перенесена из галереи M7 (а туда —
     из каталога) целиком, вместе со значениями: один жест — один трек.
     Прежние «порог», «разрыв» и «новый взмах» ушли вместе со старой механикой
     по слову Сергея 02.10: она давала проскоки. */
  porogZhesta: 30,      // сколько скролла в px нужно на шаг; события во время занятости не копятся
  zhestPauza: 180,      // отсечка инерции: после шага события считаются тем же жестом, пока разрыв короче, мс; 0 — выключена
  vsplesk: 25,          // всплеск: после спада дельта снова поднялась до такой доли ПИКА жеста — рука тронула трекпад заново
  vspleskPodryad: 3,    // и поднималась столько событий подряд: рука разгоняется, шум скачет одиночно
  zanyatoMs: 320,       // после шага колесо занято столько мс: не считается и не копится
  dolgayaPauza: 600,    // тишина дольше этой, мс, — новый жест без условий; 0 — выключено, как в галерее
  setka: false, setkaCvet: '#e5352b',   // сетка колец: границы полос и базовые линии
  palette: 'white', bg: '#ffffff', ink: '#111111', dim: '#c9c9c9'
};
/* ПРИНЯТАЯ РАСКЛАДКА (02.10): настройки Сергея после выравнивания колец. Порядок
   от края к центру: номера, трек, авторы и сингл, длительность, группа, время
   начала. Это исходное состояние стенда и то, к чему возвращает сброс панели. */
Object.assign(DEFAULTS, {
  prop: 0, garnitura: 'Helvetica Now Display', tolshchina: 600, dVremya: 43.7,
  gVremya: 'JetBrains Mono', dTrek: 77.8, trTrek: -0.035, dGruppa: 55.9, gGruppa: 'ABC Gravity', trGruppa: -0.07,
  regGruppa: 'up', dDlit: 63.2, dAvtory: 70.5, kAvtory: 4, gAvtory: 'Helvetica Now Display',
  trAvtory: -0.035, regAvtory: 'cap', hod: 'disk', volna: 180
});
/* ПРАВКА УМОЛЧАНИЙ (02.10, выгрузка панели): четырнадцать ручек, уведённых Сергеем
   от прежней основы, стали основой. Название группы вернулось в Helvetica Now
   Display с прописной; отметки времени вынесены наружу, под номера. */
Object.assign(DEFAULTS, {
  diam: 96, cx: 70, treking: 0.025, dVremya: 83.05, kVremya: 1.3,
  gGruppa: 'Helvetica Now Display', trGruppa: -0.045, regGruppa: 'cap',
  nomPruzh: [670, 0.71], pereborEase: 'плавный', pereborBez: [0.65, 0, 0.35, 1],
  pereborVolna: 0, pereborFront: 23
});
/* ПРАВКА УМОЛЧАНИЙ (02.10, вторая выгрузка панели): цвет. Активное — синий, пассивное — его светлый тон. */
Object.assign(DEFAULTS, { ink: '#2642e1', dim: '#d4d9f9' });
/* ПРАВКА УМОЛЧАНИЙ (02.10, третья выгрузка панели): цветовая схема — синий фон,
   светлый набор; активное и пассивное одного цвета, различие держит плотность. */
Object.assign(DEFAULTS, { palette: 'blue', bg: '#2742e2', ink: '#e0deff', dim: '#e0deff' });
var P = Object.assign({}, DEFAULTS);
var SOHR = {};
try { SOHR = JSON.parse(localStorage.getItem('plastinka-params') || '{}') || {}; Object.assign(P, SOHR); } catch (e) {}

/* Рост знака в долях кегля: по нему верх строки ложится на окружность своего
   кольца. Это метрика шрифта, а не замер раскладки; снимается раз на
   гарнитуру и насыщенность. */
var kanva = document.createElement('canvas').getContext('2d');
var rostKesh = {};
function imyaGarn(g) { return String(!g || g === 'obshchaya' ? P.garnitura : g).replace(/"/g, ''); }
function semya(g) { return '"' + imyaGarn(g) + '", Arial, sans-serif'; }
function rost(g) {
  var klyuch = imyaGarn(g) + '/' + P.tolshchina;
  if (!(klyuch in rostKesh)) {
    kanva.font = P.tolshchina + ' 200px ' + semya(g);
    var m = kanva.measureText('H0123456789');
    rostKesh[klyuch] = m.actualBoundingBoxAscent > 0 ? m.actualBoundingBoxAscent / 200 : 0.72;
  }
  return rostKesh[klyuch];
}

/* ПЕРЕНОС СТАРЫХ НАСТРОЕК. До 2026-10-02 кольца стояли цепочкой: полоса =
   кегль × интерлиньяж, плюс отбивки. Сохранённое в таком виде пересчитывается
   в диаметры один раз, чтобы настроенная раскладка осталась на месте. */
(function () {
  if (!Object.keys(SOHR).length || 'dTrek' in SOHR) return;
  function g(k, d) { return k in SOHR ? +SOHR[k] : d; }
  function vProcenty(r) { return Math.max(20, Math.round(2 * r * P.diam * 10) / 10); }   // радиус в долях диаметра круга → % высоты
  var rz = rost(), rNum = 0.5 - rz * P.kNum / 100, lead = g('lead', 125), niz = 0;
  var otb = [0, g('otbGruppa', 0), g('otbDlit', 0), g('otbAvtory', 0)];
  [['dTrek', P.kTrek], ['dGruppa', P.kGruppa], ['dDlit', P.kDlit], ['dAvtory', P.kAvtory]].forEach(function (x, i) {
    var k = x[1] / 100, h = k * lead / 100, vozduh = (h - rz * k) / 2, verh, baza;
    if (i === 0) { baza = rNum - k * g('leadNum', 200) / 100; verh = baza + rz * k + vozduh; }
    else { verh = niz - k * otb[i] / 100; baza = verh - vozduh - rz * k; }
    niz = verh - h;
    P[x[0]] = vProcenty(baza + rz * k);
  });
  var kV = P.kVremya / 100;
  P.dVremya = vProcenty(rNum - kV * g('leadVremya', 130) / 100 + rz * kV);
  try { localStorage.setItem('plastinka-params', JSON.stringify(P)); } catch (e) {}
})();

/* ВЫРАВНИВАНИЕ КОЛЕЦ (02.10, один раз на сохранённое). Порядок колец берётся
   как настроен: номера снаружи, внутри группа строк, глубже всех — время
   начала. Внутри группы зазор между низом строки и верхом следующей делается
   одинаковым — средним из того, что стояло. Отбивка группы от номеров и от
   времени начала делается одинаковой — средней из двух. Сумма зазоров при
   этом та же: номера и время начала остаются на своих местах. */
(function () {
  if ((SOHR.v || 1) >= 2 || !Object.keys(SOHR).length) { P.v = DEFAULTS.v; return; }
  function kv(k) { return k * P.diam / 100; }                 // кегль из % диаметра круга в % высоты окна
  var bazaNum = P.diam / 2 - rost(P.gNum) * kv(P.kNum);        // низ цифр номеров, радиус в % высоты

/* ── сцена ── */
var NS = 'http://www.w3.org/2000/svg';
var TAU = Math.PI * 2;
var svg = document.getElementById('scene');
var sloyNomera = document.getElementById('sloy-nomera');
var albomEl = document.getElementById('albom'), albomTp = albomEl.querySelector('textPath'), albomG = document.getElementById('k-albom');
var KOLCA = ['trek', 'gruppa', 'dlit', 'avtory'].map(function (k) {
  var g = document.getElementById('k-' + k);
  return { g: g, text: g.querySelector('text'), tp: g.querySelector('textPath'), os: document.getElementById('os-' + k) };
});

var TREKI = ALBOM.storony[P.storona] || ALBOM.storony.A;
var N = TREKI.length;
function dlitTekst(s) { return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
/* Регистр строки: как в данных, прописными, строчными, с прописной в каждом слове. */
function registr(t, r) {
  if (r === 'up') return t.toUpperCase();
  if (r === 'lo') return t.toLowerCase();
  if (r === 'cap') return t.toLowerCase().replace(/(^|[^a-zа-яё0-9'’])([a-zа-яё])/g, function (m, a, b) { return a + b.toUpperCase(); });
  return t;
}
function tekstKoltsa(k, i) {   // k: 1 трек, 2 группа, 3 длительность, 4 авторы и сингл
  if (k === 1) return registr(TREKI[i][0], P.regTrek);
  if (k === 2) return registr(ALBOM.gruppa, P.regGruppa);
  if (k === 3) return dlitTekst(TREKI[i][1]);
  return registr(avtoryTekst(TREKI[i][2]) + (TREKI[i][3] ? ' \u00b7 ' + TREKI[i][3] : ''), P.regAvtory);   // сингл — только если был
}
var KV = KOLCA.length + 1;  // доля кольца отметок времени
var M = KOLCA.length + 2;   // долей перехода: диск, кольца строк, кольцо времени

var NOMERA = TREKI.map(function (t, i) {
  var g = document.createElementNS(NS, 'g');
  var sektor = document.createElementNS(NS, 'path'); sektor.setAttribute('class', 'sektor');
  var text = document.createElementNS(NS, 'text');
  /* Номер едет по кольцу, но вокруг себя не вращается: цифра всегда
     горизонтальна и ставится серединой в точку кольца. Отметка времени —
     наоборот, лежит на дуге и поворачивается вместе с кольцом: она в
     поворотной группе рядом с зоной нажатия, серединой на луче номера. */
  text.setAttribute('text-anchor', 'middle');
  text.textContent = String(i + 1);
  g.appendChild(sektor); sloyNomera.appendChild(g); sloyNomera.appendChild(text);
  // отметка начала: сумма длительностей треков до этого
  var vremya = document.createElementNS(NS, 'text');
  vremya.setAttribute('text-anchor', 'middle');
  var tv = document.createElementNS(NS, 'textPath');
  atr(tv, { href: '#os-vremya', startOffset: '50%' });   // середина оси в два оборота — луч
  tv.textContent = dlitTekst(TREKI.slice(0, i).reduce(function (s, x) { return s + x[1]; }, 0));
  vremya.appendChild(tv); g.appendChild(vremya);
  sektor.addEventListener('click', function () { perehod(i); });
  return { g: g, sektor: sektor, text: text, vremya: vremya };
});

/* геометрия: всё выводится из окна и ручек, замеров раскладки нет */
var G = { cx: 0, cy: 0, R: 0, ugly: [], doli: [] };

// точка на круге: угол 0 — верх, дальше по часовой
function tochka(r, grad) {
  var a = grad * Math.PI / 180;
  return (G.cx + r * Math.sin(a)).toFixed(2) + ' ' + (G.cy - r * Math.cos(a)).toFixed(2);
}
// ось строки: окружность по часовой от верха, два оборота — длинная строка не рвётся на стыке
function os(r, protiv) {   // protiv — против часовой: строка на ней стоит верхом к центру
  var verh = tochka(r, 0), niz = tochka(r, 180), d = 'M' + verh, f = protiv ? 0 : 1;
  for (var i = 0; i < 2; i++) d += 'A' + r + ' ' + r + ' 0 1 ' + f + ' ' + niz + 'A' + r + ' ' + r + ' 0 1 ' + f + ' ' + verh;
  return d;
}
// зона нажатия: кольцевой сектор от луча номера на размах его трека
function sektorPut(rVn, rNar, razmah) {
  var bolsh = razmah > 180 ? 1 : 0;
  return 'M' + tochka(rNar, 0) + 'A' + rNar + ' ' + rNar + ' 0 ' + bolsh + ' 1 ' + tochka(rNar, razmah) +
    'L' + tochka(rVn, razmah) + 'A' + rVn + ' ' + rVn + ' 0 ' + bolsh + ' 0 ' + tochka(rVn, 0) + 'Z';
}

function atr(el, o) { for (var k in o) el.setAttribute(k, o[k]); }

function geometriya() {
  var w = window.innerWidth, h = window.innerHeight;
  var D = Math.min(h * P.diam / 100, w * P.diamW / 100);   // коридор: высота ведёт, ширина ограничивает
  G.R = D / 2; G.cx = w * P.cx / 100; G.cy = h * P.cy / 100;

  // секторы: смесь равных долей и долей по длительности
  var vsego = TREKI.reduce(function (s, t) { return s + t[1]; }, 0), p = P.prop / 100, nakop = 0;
  G.ugly = []; G.doli = [];
  TREKI.forEach(function (t) {
    var d = (1 - p) / N + p * t[1] / vsego;
    G.ugly.push(nakop * 360); G.doli.push(d * 360); nakop += d;
  });

  /* КОЛЬЦА СТАВЯТСЯ НЕЗАВИСИМО. У каждого свой диаметр в долях высоты окна —
     это внешний край строки, верх знаков; базовая линия лежит глубже на рост
     знака. Когда круг упёрся в ширину окна, все кольца сжимаются в ту же меру,
     что и он. Кегль 0 — кольца нет. */
  var mashtab = P.diam > 0 ? D / (h * P.diam / 100) : 1;
  function krayKoltsa(d) { return Math.max(1, h * d / 100 * mashtab / 2); }

  var kNum = D * P.kNum / 100, kV = D * P.kVremya / 100;
  var rNum = Math.max(1, G.R - rost(P.gNum) * kNum);        // верх цифр на окружности круга
  G.rC = Math.max(1, G.R - rost(P.gNum) * kNum / 2);        // середина цифры на кольце
  G.dyNum = rost(P.gNum) * kNum / 2;                        // от середины цифры до её базовой линии
  var krayV = krayKoltsa(P.dVremya), bazaV = Math.max(1, krayV - rost(P.gVremya) * kV);
  document.getElementById('os-vremya').setAttribute('d', os(bazaV));

  var treki = [P.trTrek, P.trGruppa, P.trDlit, P.trAvtory];   // свой трекинг — добавка к общему
  var osi = [[P.dTrek, P.kTrek, P.gTrek], [P.dGruppa, P.kGruppa, P.gGruppa],
             [P.dDlit, P.kDlit, P.gDlit], [P.dAvtory, P.kAvtory, P.gAvtory]].map(function (x, i) {
    var k = D * x[1] / 100, kray = krayKoltsa(x[0]);
    return { kray: kray, baza: Math.max(1, kray - rost(x[2]) * k), k: k, g: x[2], tr: P.treking + treki[i] };
  });

  osi.forEach(function (x, i) {
    KOLCA[i].os.setAttribute('d', os(x.baza));
    atr(KOLCA[i].text, { 'font-family': semya(x.g), 'font-weight': P.tolshchina, 'font-size': x.k.toFixed(2),
      visibility: x.k > 0 ? 'visible' : 'hidden' });
    KOLCA[i].text.style.letterSpacing = (x.tr * x.k).toFixed(2) + 'px';
    // оси вариативной гарнитуры — пока только у кольца группы
    KOLCA[i].text.style.fontVariationSettings = i === 1 ? '"wdth" ' + P.wdthGruppa + ', "slnt" ' + P.slntGruppa : 'normal';
    // ось в два оборота, строка привязана к её середине — лучу на втором обороте:
    // при выключке по центру и вправо левой части строки есть куда лечь
    KOLCA[i].text.setAttribute('text-anchor', { left: 'start', center: 'middle', right: 'end' }[P.vykl] || 'middle');
    KOLCA[i].tp.setAttribute('startOffset', '50%');
  });
  // зона нажатия номера: полоса вокруг кольца номеров, чуть шире цифры в обе стороны
  var rVn = Math.max(1, rNum - kNum * 0.6), rNar = G.R + kNum * 0.5;
  NOMERA.forEach(function (n, i) {
    n.sektor.setAttribute('d', sektorPut(rVn, rNar, G.doli[i]));
    atr(n.text, { 'font-family': semya(P.gNum), 'font-weight': P.tolshchina, 'font-size': kNum.toFixed(2) });
    n.text.style.letterSpacing = ((P.treking + P.trNum) * kNum).toFixed(2) + 'px';
    atr(n.vremya, { 'font-family': semya(P.gVremya), 'font-weight': P.tolshchina, 'font-size': kV.toFixed(2),
      visibility: kV > 0 ? 'visible' : 'hidden' });
    n.vremya.style.letterSpacing = ((P.treking + P.trVremya) * kV).toFixed(2) + 'px';
  });
  /* Альбом — в кольце группы: его верхний край лежит на окружности кольца,
     набор у него свой (гарнитура, трекинг, регистр, кегль). Развёрнутый «читается
     внизу» идёт против часовой, верхом к центру: базовая линия тогда ложится
     на внешний край кольца, и строка занимает ту же полосу. */
  var av = osi[1], kA = D * P.kAlbom / 100;   // кольцо группы
  document.getElementById('os-albom').setAttribute('d',
    P.albomChitaetsya ? os(av.kray, true) : os(Math.max(1, av.kray - rost(P.gAlbom) * kA)));
  atr(albomEl, { 'font-family': semya(P.gAlbom), 'font-weight': P.tolshchina, 'font-size': kA.toFixed(2),
    visibility: kA > 0 ? 'visible' : 'hidden' });
  albomEl.style.letterSpacing = ((P.treking + P.trAlbom) * kA).toFixed(2) + 'px';
  albomTp.textContent = registr(ALBOM.imya, P.regAlbom);
  document.body.style.background = P.bg;

  // крестик в центре: две линии через центр круга, длина — доля диаметра
  var pol = D * P.krestRazmer / 200, linii = document.querySelectorAll('#krest line');
  /* Прямой плюс ставится на сетку пикселей экрана: край тонкой линии ложится на
     границу пикселя, и линия в 1 px выходит чёткой, а не размытой на два. Сдвиг
     от точного центра — меньше половины пикселя. Косому крестику это не нужно. */
  var kx = G.cx, ky = G.cy;
  if (P.krestUgol % 90 === 0) {
    var dpr = window.devicePixelRatio || 1, tl = P.krestLiniya;
    kx = Math.round((G.cx - tl / 2) * dpr) / dpr + tl / 2;
    ky = Math.round((G.cy - tl / 2) * dpr) / dpr + tl / 2;
  }
  for (var li = 0; li < 2; li++) {
    var ak = (P.krestUgol + li * 90) * Math.PI / 180, dx = pol * Math.sin(ak), dy = -pol * Math.cos(ak);
    atr(linii[li], { x1: (kx - dx).toFixed(2), y1: (ky - dy).toFixed(2), x2: (kx + dx).toFixed(2), y2: (ky + dy).toFixed(2),
      stroke: P.ink, 'stroke-width': P.krestLiniya, visibility: pol > 0 && P.krestLiniya > 0 ? 'visible' : 'hidden' });
  }

  // сетка: у каждого кольца внешний край сплошной линией и базовая линия пунктиром
  var setka = document.getElementById('setka');
  setka.textContent = '';
  if (P.setka) {
    var krugi = [[G.R, 0], [rNum, 1]];
    if (kV > 0) krugi.push([krayV, 0], [bazaV, 1]);
    osi.forEach(function (x) { if (x.k > 0) krugi.push([x.kray, 0], [x.baza, 1]); });
    krugi.forEach(function (kr) {
      var c = document.createElementNS(NS, 'circle');
      atr(c, { cx: G.cx.toFixed(2), cy: G.cy.toFixed(2), r: kr[0].toFixed(2), stroke: P.setkaCvet,
        'stroke-width': 1, 'stroke-opacity': kr[1] ? 0.55 : 1 });   // волосяная линия // без ручки
      if (kr[1]) c.setAttribute('stroke-dasharray', '2 4');           // базовая линия — пунктиром // без ручки
      setka.appendChild(c);
    });
  }
}

/* ── смена трека ──
   Шесть долей на одном переходе: диск с номерами (0), четыре кольца строк
   (1–4) и кольцо отметок времени (5). У каждой свой
   угол «где активный трек»; кольца трогаются с паузой друг за другом. Новый
   переход стартует от того угла, где доля стоит сейчас, — разворот посреди
   хода без скачка. Углы копятся без приведения к 0…360: путь всегда кратчайший. */
var aktiv = 0;
function ryad(v) { var a = []; for (var k = 0; k < M; k++) a.push(v); return a; }
var ugol = ryad(0), ot = ryad(0), cel = 0, t0 = -1e9;
var pokazan = ryad(0);                // какой трек сейчас набран в кольце
var alfa = ryad(1);                   // гашение строки на подмене текста
var dolya = ryad(1);                  // доля хода каждого кольца (перемещение)
var dolyaP = ryad(1);                 // доля перебора каждого кольца — своя, от хода не зависит
var byl = ryad(''), vidno = ryad(''); // перебор: с какой строки кольцо уходит и что набрано сейчас
var teplo = TREKI.map(function (t, i) { return i === 0 ? 1 : 0; });   // активность номера
var chasy = 0;                        // время сцены, мс

/* ВЕЕР. Кольца трогаются по очереди от внешнего к внутреннему — по тому, как
   они стоят на круге, а не по номеру в списке: очередь берётся из диаметров.
   Когда едет диск, в веере номера и строки; когда едут кольца, номера стоят,
   и веер идёт по строкам. Отметки времени в очереди не стоят: они идут
   следом за номерами со своей короткой паузой, где бы ни лежало их кольцо. Кольцо с кеглем 0
   в очереди не стоит. */
function pauzy() {
  var disk = P.hod === 'disk';
  var ryady = [[1, P.dTrek, P.kTrek], [3, P.dDlit, P.kDlit], [4, P.dAvtory, P.kAvtory]];
